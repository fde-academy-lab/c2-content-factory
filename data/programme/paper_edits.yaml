# Edits laid on top of the Saturday item bank in the tracker, until the tracker carries them.
#
# The bank (docs/curriculum/source.xlsx, 'Saturday papers' tab) is the source of every item. An
# edit here replaces one or more option texts of one item when the paper is rendered, and never
# changes the stem or which options are correct. An `order` edit relabels the options: order[i] is
# the tracker's letter of the option printed at position i, and the key's letters move with them.
# Most edits exist because the item broke the house distractor rule that the key is never the
# unique longest option, which a room learns to exploit by the third paper, and the replacement
# makes a distractor a sharper near-miss at the key's length; others replace an option no reader
# would take, so the set tests something; an order edit moves a key off a letter every
# more-than-one key shared, so ticking that letter stops scoring. Each edit's why says which.
#
# To accept an edit, copy its option text into the tracker's Item cell and sync: the sync then
# reports the edit as folded and it can be deleted here. To accept an order edit, print the options
# in the tracker in that order and give it the key the paper prints; from_key, the tracker's key the
# order was written against, is how the sync then knows the edit is folded rather than laid twice. To reject one, delete it and sync, and the
# paper goes back to the bank's wording (and fails the distractor audit on that item).
#
# status: proposed (awaiting the Programme Head) or accepted (agreed, not yet in the tracker).

