# Programme facts that can still move, each with its status and where it came from.
#
# Edit this file, or one of the three workbooks, and then run one command:
#
#     python3 scripts/sync_programme.py
#
# The sync re-exports the workbooks, checks them against each other and against this file,
# rewrites every generated page and every <!-- sync:NAME --> block, and rebuilds the calendar the
# board reads. On GitHub the programme-sync workflow runs the same command for you.
#
# Status words, and what an artifact may do with a fact that carries them:
#   locked     decided and recorded; any artifact may state it.
#   stated     the Programme Head's stated plan; any artifact may state it as the plan.
#   tentative  assumed for planning until a named party confirms; a STUDENT file states it only
#              with the word "tentative" beside it, or leaves it out.
#   confirmed  the named party has confirmed it (faculty sessions); state it plainly.
#   proposed   put to a decision-maker and awaiting a lock; TRAINER and INTERNAL files may state
#              it marked "proposed"; a STUDENT file never states it.
#   open       undecided; no artifact states a value.
#   superseded replaced by a later version; kept so the history reads.
#
# Roles only in this file. Never a person's name, because the repository is public.

