decisions:
  # What is still open, what it blocks, and who closes it. Roles only.
  - id: evaluation-lock
    status: open
    closes: the AOC
    text: The lock on the evaluation scheme, including the parked gateway of 80 percent attendance and quiz completion before mocks and the capstone.
    blocks: every rubric, the assessment calendar, and any artifact that would state a mark or a weight
  - id: w16-proposal-marks
    status: open
    closes: the Programme Head and the AOC
    text: Whether the Week 16 solution proposal carries marks, since the scheme has no line for it; the tabs call it assessed.
    blocks: the Week 16 Wednesday pack's assessment wording
  - id: recut-2026-09-21
    status: open
    closes: the Programme Head
    text: The re-cut that followed the re-date, which stays open to reversal.
    blocks: nothing yet, since the tracker already carries it; a reversal would reshape Weeks 1, 3, 4, 6, 7 and 8
  - id: exam-days
    status: open
    closes: the Programme Head
    text: The length and the paper of each major exam, and the day of ME1 and ME2.
    blocks: any artifact that would name an exam day or slot
  - id: faculty-blocks
    status: open
    closes: IIT Gandhinagar and the Programme Head
    text: How a day absorbs an IITGN block, and the faculty names and dates from IIT Gandhinagar.
    blocks: the timing lines of 30 day packs in Weeks 2, 4, 5, 7, 8, 10 and 11
  - id: client-zero-v2-3
    status: open
    closes: the Programme Head
    text: The lock on client zero v2.3.
    blocks: the Week 1 Friday lab dataset and every pack from Week 10 on
  - id: build-owners
    status: open
    closes: the Programme Head
    text: Mock and GD owners for Builds 2 to 5, and the expert's dates for Build 4 around Christmas.
    blocks: the build-week trainer sheets from Week 6 on
  - id: build-sequencing
    status: open
    closes: the Programme Head
    text: Whether all five builds move to the sequencing discussed on 15 September, with GDs from day two, mocks in the same window and presentations by one assessor.
    blocks: the build-week trainer sheets
  - id: papers-to-build
    status: open
    closes: the content team
    text: The Saturday papers for Weeks 10, 11, 13 and 14, the items for the Week 4 Tuesday, the Week 0 papers and the baseline card.
    blocks: the Week 0 packs, which run from 28 September
  - id: senate-reconciliation
    status: open
    closes: the Programme Head and the academic office
    text: Reconciling the senate grading buckets and passing rules, including 90 percent attendance, with the 1000-mark pool.
    blocks: any threshold in any artifact
  - id: codechef
    status: open
    closes: the Programme Head
    text: Whether daily coding practice on CodeChef is adopted; the 20-Week Plan names it and the handover calls it undecided.
    blocks: any artifact that would name the practice platform
  - id: restricted-holidays
    status: open
    closes: the institute calendar
    text: Whether campus closes on New Year's Day (Week 13 Friday) and on Makar Sankranti (Week 15 Thursday).
    blocks: the Week 13 Friday and Build 5 Thursday plans

conflicts:
  # Places where two sources disagree, and the working rule this repository follows until one is fixed.
  - id: evaluation-versions
    sources: [tracker, handover]
    text: The tracker's Structure tab (21 September) prints mini projects 150, mocks 200, GDs 200 and capstone 150; the handover says the scheme proposed to the AOC on 25 September is mini projects 200, mocks 150, GDs 150 and capstone 200.
    working_rule: The 25 September proposal is current, marked proposed; no STUDENT file states either version.
  - id: groups
    sources: [tracker, handover]
    text: The handover plans 35 students in nine build-week groups, while the tracker's build-week anatomy asks for five sub-problems with three groups each, which is fifteen groups.
    working_rule: Build-week packs seed five sub-problems and leave the group-to-problem allocation to the trainer sheet until the Programme Head settles the count.
  - id: week0-schedule
    sources: [tracker, journey]
    text: The Week 0 tab (21 September) and the student Week 0 sheet (27 September) give different running orders. The tab runs four diagnostic papers of 60, 45, 30 and 30 minutes on Tuesday and puts the project talks on Saturday beside an industry leader session; the student sheet runs one paper of about two hours on Tuesday, moves the introductions to Wednesday afternoon, and gives Saturday to a session with a working forward deployed engineer.
    working_rule: The student sheet is later and is what learners have been told, so Week 0 packs follow it and cite the tracker row for content only.
  - id: journey-tokenization
    sources: [tracker, journey]
    text: The student journey lists tokenization under Week 8, while the re-cut moved it to the Week 7 Friday.
    working_rule: Packs follow the tracker; the journey needs its Week 7 and Week 8 rows corrected before it is republished.
  - id: journey-holidays
    sources: [tracker, journey]
    text: The student journey lists holidays up to Week 9 only, so Christmas Day in Week 12 and Republic Day in Week 17 do not appear on it.
    working_rule: Packs follow the tracker; the journey adds them when it is next published.
  - id: journey-capstone
    sources: [tracker, journey]
    text: The journey's capstone rows describe an older sprint plan, with deployment in Week 18, while the tracker's capstone tab puts the proposal and walking skeleton at gate 1, the measured core at gate 2 and deployment at gate 3.
    working_rule: Packs follow the tracker's capstone tab.
  - id: fde-block-hours
    sources: [tracker, handover]
    text: The 20-Week Plan sizes the Week 16 forward deployed block at roughly 27 hours; the handover says about 30.
    working_rule: Packs size Week 16 from the tracker rows, which are day by day.
