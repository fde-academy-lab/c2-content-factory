conflicts:
  # Places where two sources disagree, and the working rule this repository follows until one is fixed.
  - id: evaluation-versions
    sources: [tracker, handover]
    text: The tracker's Structure tab (21 September) prints mini projects 150, mocks 200, GDs 200 and capstone 150; the handover says the scheme proposed to the AOC on 25 September is mini projects 200, mocks 150, GDs 150 and capstone 200.
    working_rule: The 25 September version is locked as of 28 September 2026 and may be stated anywhere; the Structure tab's table is superseded until the tracker's next version carries the locked scheme.
  - id: groups
    sources: [tracker, handover]
    text: The handover plans 35 students in nine build-week groups, while the tracker's build-week anatomy asks for five sub-problems with three groups each, which is fifteen groups.
    working_rule: Build-week packs seed five sub-problems and leave the group-to-problem allocation to the trainer sheet until the Programme Head settles the count.
  - id: week0-schedule
    sources: [tracker, journey]
    text: The Week 0 tab (21 September) and the student Week 0 sheet (27 September) give different running orders. The tab runs four diagnostic papers of 60, 45, 30 and 30 minutes on Tuesday and puts the project talks on Saturday beside an industry leader session; the student sheet runs one paper of about two hours on Tuesday, moves the introductions to Wednesday afternoon, and gives Saturday to a session with a working forward deployed engineer. On 28 September 2026 the requester's own diagnostic replaced both papers, as one Google Form of forty questions in about 90 minutes.
    working_rule: Week 0 packs follow the student sheet for the running order and the requester's diagnostic for Tuesday, and cite the tracker row for content only.
  - id: anand-title
    sources: [tracker, docs/07_Client_Zero.md]
    text: The tracker's Week 1 and Week 2 rows call Anand Iyer the CFO, while client zero v2.2's stakeholder table calls him the finance controller of Kalpa Retail.
    working_rule: The requester settled it on 30 September 2026 in favour of finance controller (decision anand-finance-controller), so every pack and paper says finance controller and the tracker's rows are superseded on the title until its next version carries it.
  - id: journey-tokenization
    sources: [tracker, journey]
    text: The student journey lists tokenization under Week 8, while the re-cut moved it to the Week 7 Friday.
    working_rule: Packs follow the tracker; the journey needs its Week 7 and Week 8 rows corrected before it is republished.
  - id: journey-holidays
    sources: [tracker, journey]
    text: The student journey lists holidays up to Week 9 only, so Christmas Day in Week 12 and Republic Day in Week 17 do not appear on it.
    working_rule: Packs follow the tracker; the journey adds them when it is next published.
  - id: journey-capstone
    sources: [tracker, journey]
    text: The journey's capstone rows describe an older sprint plan, with deployment in Week 18, while the tracker's capstone tab puts the proposal and walking skeleton at gate 1, the measured core at gate 2 and deployment at gate 3.
    working_rule: Packs follow the tracker's capstone tab.
  - id: fde-block-hours
    sources: [tracker, handover]
    text: The 20-Week Plan sizes the Week 16 forward deployed block at roughly 27 hours; the handover says about 30.
    working_rule: Packs size Week 16 from the tracker rows, which are day by day.
  - id: exercise-channel
    sources: [docs/03_Day_Pack_Spec.md of 13 September, handover]
    text: The day pack spec of 13 September says GitHub Discussions is not used; the handover of 27 September says exercises are posted on GitHub Discussions, which is also what the Cohort 1 learnings and the method retrospective describe.
    working_rule: The handover is later, so exercises are written to be pasted into GitHub Discussions verbatim, with no trainer text inside them.
  - id: weekly-metrics
    sources: [docs/01_Programme_Facts_C2.md of 13 September, handover]
    text: The facts file of 13 September named a Weekly Academic Score and a Weekly Performance Score over Weeks 2 to 21; the handover of 27 September describes six signals, one tracker and one score sheet, and neither metric.
    working_rule: No artifact names either metric until the Programme Head confirms it survives the re-date.
  - id: eligibility-thresholds
    sources: [docs/01_Programme_Facts_C2.md of 13 September, handover]
    text: The facts file of 13 September set placement gates of CGPA above 7.0 and attendance above 95 percent; the senate proposal, as the handover reports it, passes on CGPA 7, a Placement Index of 7, twelve projects and 90 percent attendance.
    working_rule: The 90 percent attendance minimum over the programme is locked and may be stated anywhere; no artifact quotes a CGPA, Placement Index or project-count requirement until the senate reconciliation closes.
