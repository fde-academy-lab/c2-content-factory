name: Publish the wiki

# The wiki's source lives in wiki/ so that a wiki change is a reviewed pull request.
# This workflow copies that folder into the repository's wiki on every merge to main.
# The wiki must already exist: create one page in the GitHub wiki UI once, and after
# that this workflow owns every page. Edits made in the wiki UI are overwritten.

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Clone the wiki
        id: clone
        run: |
          set -euo pipefail
          if git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki-repo 2>clone.log; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not clone the wiki. Create the first page once in the GitHub wiki UI, then re-run this workflow."
            cat clone.log
          fi

      - name: Copy the pages across
        if: steps.clone.outputs.ok == 'true'
        run: |
          set -euo pipefail
          rsync -a --delete --exclude '.git' wiki/ wiki-repo/

      - name: Commit and push
        if: steps.clone.outputs.ok == 'true'
        working-directory: wiki-repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches wiki/. Nothing to publish."
            exit 0
          fi
          git commit -m "Publish the wiki from ${GITHUB_SHA:0:7}"
          git push
