<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The decomposition, and the cut you choose</title>
<style>
  :root{--ink:#1C1C1A;--muted:#5F6360;--accent:#2B4A7D;--tint:#E4ECF7;--bg:#F7F7F5;
        --line:#C9C9C2;--pass:#1F6F4A;--fail:#8A3D3D;
        --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
  .wrap{max-width:1080px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:0 0 10px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 2px}
  input[type=range]{width:100%}
  table{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}
  th,td{text-align:left;padding:5px 8px 5px 0;border-bottom:1px solid var(--line)}
  th{color:var(--accent)}
  td.num{font-family:var(--mono)}
  .out{font:14px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;
       padding:10px;margin-top:10px}
  .big{font-size:24px;font-weight:700}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button.act{font:inherit;padding:7px 12px;border:1px solid var(--accent);background:#fff;
             color:var(--accent);border-radius:6px;cursor:pointer}
  button.act[aria-pressed="true"]{background:var(--accent);color:#fff}
  .good{color:var(--pass);font-weight:700}
  .bad{color:var(--fail);font-weight:700}
  .log{margin-top:14px;font:13px var(--mono);color:var(--muted);border-top:1px solid var(--line);
       padding-top:8px}
  .thin{color:var(--fail)}
</style>
</head>
<body>
<div class="wrap">
  <h1>The decomposition, and the cut you choose</h1>
  <p class="sub">Revenue is three factors multiplied. Move them and watch whether the arithmetic still closes.</p>

  <div class="grid">
    <div class="card">
      <h2>Move a factor</h2>
      <label for="f0">Customers, Q2 against Q1 <span id="v0"></span></label>
      <input type="range" id="f0" min="-40" max="40" value="0">
      <label for="f1">Orders per customer <span id="v1"></span></label>
      <input type="range" id="f1" min="-60" max="40" value="-25">
      <label for="f2">Revenue per order <span id="v2"></span></label>
      <input type="range" id="f2" min="-40" max="60" value="18">
      <div class="out">
        <div>revenue change</div>
        <div class="big" id="rev"></div>
        <div id="close"></div>
      </div>
      <div class="row">
        <button class="act" id="actual" type="button">The actual quarter</button>
        <button class="act" id="onlyfreq" type="button">Frequency alone</button>
      </div>
      <div class="out" id="story"></div>
    </div>

    <div class="card">
      <h2>Cut the same fall</h2>
      <div class="row">
        <button class="act" id="bySeg" type="button" aria-pressed="true">By segment</button>
        <button class="act" id="byChan" type="button">By channel</button>
        <button class="act" id="byCity" type="button">By city</button>
      </div>
      <table id="cut"></table>
      <div class="out" id="cutnote"></div>
    </div>
  </div>

  <div class="log" id="log">Nothing changed yet.</div>
</div>

<script>
(function(){
  "use strict";
  var CUTS = {
    seg: {label:"segment", rows:[
      ["Retail-Core", 1.12, 1.06, 34], ["Retail-Plus", 2.32, 1.18, 22],
      ["Business", 1.82, 1.55, 11], ["Student", 2.50, 3.50, 2]],
      note:"Retail-Plus carries almost all of it. Student rose, on two customers."},
    chan:{label:"channel", rows:[
      ["app", 1.00, 1.00, 27], ["store", 1.09, 1.00, 29], ["web", 1.33, 1.03, 29]],
      note:"Web carries it. The same Retail-Plus members sit inside that web number."},
    city:{label:"city", rows:[
      ["Bengaluru", 1.00, 1.00, 5], ["Chennai", 1.00, 1.00, 22], ["Delhi", 1.00, 1.00, 6],
      ["Hyderabad", 1.79, 1.00, 6], ["Mumbai", 1.00, 1.04, 23], ["Pune", 1.17, 1.00, 23]],
      note:"Hyderabad moved 44 percent on six customers. The size of a move says nothing about how much of it is noise."}
  };
  var cut = "seg", count = 0;

  function note(msg){ count += 1;
    document.getElementById("log").textContent = "change " + count + ": " + msg; }
  function p(i){ return Number(document.getElementById("f" + i).value); }

  function draw(){
    for (var i = 0; i < 3; i++){
      document.getElementById("v" + i).textContent =
        (p(i) >= 0 ? "+" : "") + p(i) + " percent";
    }
    var prod = (1 + p(0)/100) * (1 + p(1)/100) * (1 + p(2)/100);
    var change = 100 * (prod - 1);
    document.getElementById("rev").textContent =
      (change >= 0 ? "+" : "") + change.toFixed(1) + " percent";
    document.getElementById("rev").className = "big " + (change < 0 ? "bad" : "good");
    document.getElementById("close").textContent =
      (1 + p(0)/100).toFixed(3) + " x " + (1 + p(1)/100).toFixed(3) + " x " +
      (1 + p(2)/100).toFixed(3) + " = " + prod.toFixed(3);
    var s = document.getElementById("story");
    s.textContent = "";
    var line = document.createElement("div");
    if (p(2) > 0 && p(1) < 0){
      line.textContent = "Revenue per order is rising while frequency falls, so the headline " +
        "understates the frequency problem. Reported alone, the fall looks " +
        Math.abs(change).toFixed(1) + " percent rather than " + Math.abs(p(1)) + ".";
    } else if (p(1) < 0){
      line.textContent = "Frequency alone. The headline and the problem are the same size.";
    } else {
      line.textContent = "Nothing is hiding anything here. Move frequency down to see the effect.";
    }
    s.appendChild(line);
  }

  function table(){
    var d = CUTS[cut], t = document.getElementById("cut");
    t.textContent = "";
    var head = document.createElement("tr");
    [d.label, "Q1", "Q2", "change", "customers"].forEach(function(h){
      var th = document.createElement("th"); th.textContent = h; head.appendChild(th); });
    t.appendChild(head);
    d.rows.forEach(function(r){
      var tr = document.createElement("tr");
      var ch = 100 * (r[2] / r[1] - 1);
      [r[0], r[1].toFixed(2), r[2].toFixed(2),
       (ch >= 0 ? "+" : "") + ch.toFixed(1) + "%", r[3]].forEach(function(v, i){
        var td = document.createElement("td");
        td.textContent = v;
        if (i) td.className = "num";
        if (i === 4 && r[3] < 10) td.className = "num thin";
        tr.appendChild(td);
      });
      t.appendChild(tr);
    });
    document.getElementById("cutnote").textContent = d.note;
    ["bySeg","byChan","byCity"].forEach(function(id, i){
      document.getElementById(id).setAttribute("aria-pressed",
        String(cut === ["seg","chan","city"][i]));
    });
  }

  for (var i = 0; i < 3; i++){
    (function(j){
      document.getElementById("f" + j).addEventListener("input", function(){
        draw(); note("moved factor " + (j + 1) + " to " + p(j) + " percent");
      });
    })(i);
  }
  document.getElementById("actual").addEventListener("click", function(){
    document.getElementById("f0").value = 0;
    document.getElementById("f1").value = -25;
    document.getElementById("f2").value = 18;
    draw(); note("restored the actual quarter");
  });
  document.getElementById("onlyfreq").addEventListener("click", function(){
    document.getElementById("f0").value = 0;
    document.getElementById("f1").value = -25;
    document.getElementById("f2").value = 0;
    draw(); note("held order value flat, so nothing hides the fall");
  });
  ["bySeg","byChan","byCity"].forEach(function(id, i){
    document.getElementById(id).addEventListener("click", function(){
      cut = ["seg","chan","city"][i]; table();
      note("cut the fall by " + CUTS[cut].label);
    });
  });

  draw(); table();
})();
</script>
</body>
</html>
