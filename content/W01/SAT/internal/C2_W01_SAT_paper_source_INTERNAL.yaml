  - id: text-compare
    type: True or false
    label: Judge the comparison
    level: Medium
    min: 2.5
    tag: "[SV]"
    roles: BA, DS
    day: Mon
    key: d
    anchor: Everything read from a CSV is a string; what breaks and where do you convert?
    text: |-
      Every amount csv.DictReader reads arrives as text, as the amount "4500" on Monday's order KR-01008 did. Statement: in Python 3, the comparison '4500' < '30000' evaluates to True. True or false, and why?
      (a) True, because Python compares the numbers that the two strings of digits spell.
      (b) True, because a string with fewer characters sorts before a longer one.
      (c) False, because Python 3 refuses to order two strings made of digits.
      (d) False, because text compares character by character, and '4' follows '3'.
    why: >-
      False. Two strings compare character by character from the left, and "4" sorts after "3", so
      '4500' comes after '30000' and the comparison is False. Nothing raises an error, so a sort, a max
      or a filter on unconverted amounts ranks a Rs 4,500 order above a Rs 30,000 one without a word.
      The fix is the week's: convert each amount once, at the read, and log what fails.
    wrong:
      a: >-
        Reads the text as the numbers it spells. Strings compare character by character, so the first
        characters, 4 and 3, decide it.
      b: >-
        Length never enters a string comparison until one string runs out; '9' sorts after '10000' too.
      c: >-
        Python 3 raises an error only when text meets a number; two strings compare, silently.
    answer: >-
      Everything from a CSV is text until I convert it, and text sorts as text, so '4500' ranks above
      '30000'; I convert once at the read and log every value that fails.

  - id: evidence-copy
    type: True or false
    label: Judge the auditor's copy
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, FDE
    day: Wed
    key: c
    anchor: An auditor asks why you dropped 14 rows; walk them through it.
    exhibit:
      caption: Two rows of the export as the reader hands them over, and the analyst's cell.
      code:
        lang: python
        text: |
          rows = [{"order_id": "KR-02063", "amount": "twelve"},
                  {"order_id": "KR-02064", "amount": "3150"}]
          as_arrived = rows.copy()        # the export as it came, for the auditor
          for r in rows:
              r["amount"] = int(r["amount"]) if r["amount"].isdigit() else 0
          rows.append({"order_id": "KR-02065", "amount": 2400})
    text: |-
      The auditor wants every row as the export gave it, so before the pass converts the amounts in place the analyst keeps a copy; a later line appends an order to rows. Statement: after the cell runs, as_arrived still holds the export as it came, two rows with "twelve" in the first. True or false, and why?
      (a) True: it is a new list, so it keeps two rows and the text "twelve".
      (b) True: copying a list copies the dictionaries in it, so "twelve" survives there.
      (c) False: it keeps two rows, but they share dictionaries, so the first reads 0.
      (d) False: it is the same list as rows, so it holds three rows and a 0.
    why: >-
      rows.copy() makes a new list, so the append to rows leaves as_arrived at two rows; but its two
      slots point at the same two dictionaries, a shallow copy, and the pass rewrites each dictionary's
      amount in place. as_arrived now shows 0 where the export said "twelve": the auditor's evidence
      was rewritten by the step it was meant to check, and the coercion to zero is Wednesday's round 1
      trap besides. Keeping the export as it came needs copies of the dictionaries, [dict(r) for r in
      rows], or better, the file itself.
    wrong:
      a: >-
        Right about the list, wrong about what it holds: the copy is new, and its dictionaries are the
        ones the pass changes.
      b: >-
        The misconception the item tests: a list copy copies references, never the dictionaries they
        point to.
      d: >-
        Right verdict, wrong reason: rows.copy() builds a new list, so the appended order never reaches
        as_arrived.
    answer: >-
      A list copy is shallow, so the dictionaries inside it are shared and a pass that edits them in
      place edits the evidence; I keep the raw rows untouched, as copies of each dictionary or as the
      file itself, and write every change to the decisions log.

  - id: reject-loop
    type: More than one correct
    label: Choose every fix
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Wed
    key: b, d
    anchor: "Input 200, clean 183, rejected 14: does it reconcile, and what is the missing number?"
    exhibit:
      caption: Five invented rows laid out as the export's are, and a pass meant to set aside every unreadable amount.
      code:
        lang: python
        text: |
          rows = [("KR-09051", "2400"), ("KR-09052", "twelve"), ("KR-09053", "n/a"),
                  ("KR-09054", "1850"), ("KR-09055", "3100")]
          rejects = []
          for row in rows:
              if not row[1].isdigit():
                  rows.remove(row)
                  rejects.append(row)
          print(len(rows), "+", len(rejects), "=", len(rows) + len(rejects))
    text: |-
      The pass prints 4 + 1 = 5, so its rows reconcile, yet order KR-09053 is still among the clean rows. Which rewrites set aside every unreadable row and keep every readable one? Mark every correct option.
      (a) Loop over rows as now, but call rejects.append(row) before rows.remove(row).
      (b) Loop over a copy, for row in list(rows):, and remove each bad row from rows.
      (c) Loop over rows as now, and add continue straight after the rows.remove(row).
      (d) Build two new lists: kept from rows with digit amounts, rejects from the rest.
      (e) Loop over rows as now, and set a bad row's amount to "0" instead of removing it.
    why: >-
      Removing an item from the list a for loop is walking shifts every later item one place left, so
      the loop steps over the row after each removal: KR-09053 follows KR-09052 and is never tested. The
      counts still close, 4 + 1 = 5, because whatever is left counts as clean, which is Wednesday's
      lesson that rows can reconcile by construction. Walking a copy, (b), or building new lists, (d),
      tests every row once.
    wrong:
      a: >-
        Swaps two lines and keeps the removal inside the loop, so the skip happens exactly as before.
      c: >-
        continue only ends the current turn of the loop; the skipped row was lost when the list
        shifted.
      e: >-
        Stops the skip by coercing the unreadable amount to zero, Wednesday's round 1 trap: the order
        stays clean at Rs 0, and the log never hears of it.
    answer: >-
      I never remove from the list I am looping over; I build the clean list and the rejects list as
      two new lists, and I check that every input row landed in exactly one of them, reason attached.

