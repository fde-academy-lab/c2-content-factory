    key: Q1 Rs 4,680 and Q2 Rs 7,410.
    anchor: How do you find duplicates, and what makes two records the same?
    exhibit:
      caption: >-
        Seven rows of orders.csv, in the order the file holds them. The five columns not shown match
        within each order_id.
      table:
        head: [Row, order_id, customer_id, order_date, amount, quarter]
        rows:
          - ["1", KR-02006, C-2015, "2026-06-17", "2,890", Q1]
          - ["2", KR-02063, C-3003, "2026-05-14", twelve, Q1]
          - ["3", KR-02150, C-3013, "2026-08-01", "3,700", Q2]
          - ["4", KR-02151, C-3014, "2026-09-25", "3,710", Q2]
          - ["5", KR-02006, C-2015, "2026-06-17", "2,890", Q1]
          - ["6", KR-02063, C-3003, "2026-05-14", "1,790", Q1]
          - ["7", KR-02151, C-3014, "2026-08-02", "3,710", Q2]
    text: |-
      Anand's books hold each order once. How much revenue do these seven rows hold for each quarter once Wednesday's rules for duplicates have run? Give Q1 and Q2 in rupees.
    why: >-
      Under the identity rule one order_id is one order, so each of the three pairs keeps one row.
      KR-02006 is an exact repeat. KR-02151 was sent again with a new date, which a check on whole rows
      misses, and both copies carry Rs 3,710. KR-02063's first copy reads "twelve", and Wednesday's rule
      keeps the copy that validates, Rs 1,790, since keeping the first would throw away the order's
      value while the rows still reconcile. Q1 is 2,890 plus 1,790, Rs 4,680, and Q2 is 3,700 plus
      3,710, Rs 7,410.
    wrong:
      "Q1 Rs 4,680 and Q2 Rs 11,120": >-
        A check on whole rows: it removes the exact repeat of KR-02006 and keeps both copies of
        KR-02151.
      "Q1 Rs 2,890 and Q2 Rs 7,410": >-
        Keeps the first copy of KR-02063, which will not convert, and sets aside the one that carries
        the value: the rows reconcile and Q1 is Rs 1,790 short.
      "Q1 Rs 7,570 and Q2 Rs 11,120": >-
        No duplicate rule at all: every readable row summed.
      "Q2 Rs 3,700": >-
        Sends both copies of KR-02151 to the log, which loses a real order.
    answer: >-
      I write down what makes two rows one order, the order_id at Kalpa, and which copy stays when they
      differ, the one that validates, then recompute each quarter from the rows the rule keeps; a
      whole-row check misses every re-sent row, and keeping the first copy can lose an order's value
      while the counts still close.

