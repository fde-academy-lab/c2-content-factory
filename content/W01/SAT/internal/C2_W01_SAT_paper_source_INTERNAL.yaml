  - id: plus-real
    type: One correct option
    label: Answer the first question
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Thu
    key: c
    anchor: What does p = 0.03 mean, and not mean?
    text: |-
      Meera sent her question about Retail-Plus after Q2's figures had shown the fall. The team's line for calling a fall more than chance is a p-value under 5 in 100. Which line answers her?
      (a) Real: 145 of 5,000 flips reach a fall that large, a share of 0.029, under the line of 5 in 100; Rs 24,420 a quarter across the tier.
      (b) Borderline: 145 of 5,000 flips reach the fall, and 286 a move that large either way; Rs 1,110 a quarter across the tier.
      (c) Borderline: 145 of 5,000 flips reach the fall, and 286 a move that large either way; Rs 24,420 a quarter across the tier.
      (d) Real: 145 of 5,000 flips reach a fall that large, a share of 0.029, under the line of 5 in 100; Rs 1,110 a quarter across the tier.
    why: >-
      A p-value counts the flips at least as extreme as the real gap, and a count in one direction
      stands alone only when the question fixed that direction before the figures were seen. Meera
      asked after the fall was in the figures, so the line reports both counts: 145 of 5,000 flips
      reach a fall of Rs 1,110 or more, a share of 0.029, and 286, the two end bars together, reach a
      move that large either way, 0.057. One share sits under the team's 5 in 100 and the other over
      it, so the fall is borderline; had the direction been fixed before Q2 closed, 0.029 would carry
      the reading alone. The gap is per member, so across the tier it is Rs 1,110 for each of 22
      members, Rs 24,420 a quarter, 0.19 percent of Kalpa's Q2 delivered revenue of Rs 1,28,64,680,
      which makes the fall modest as well as borderline, Thursday's verdict on the same flips.
    wrong:
      a: >-
        This option reads the count in one direction, 0.029, as a verdict, where Meera asked after the
        fall was seen, so both counts go in the line and together they read as borderline.
      b: >-
        It reports both counts and then writes the per-member gap, Rs 1,110, as the tier's fall, where
        22 members make it Rs 24,420.
      d: >-
        It reads the one-direction count as a verdict and writes the per-member gap as the tier's
        fall.
    answer: >-
      The fall is borderline, 145 of 5,000 flips one way and 286 either way, since Meera asked after
      she had seen it, and it is modest, Rs 24,420 a quarter across 22 members; when the direction is
      chosen after the data has come in, I report both counts.

  - id: wald-kalpa
    type: True or false
    label: Judge the fairer figure
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Thu
    key: a
    anchor: How do you handle missing data?
    text: |-
      Kavya lays two versions of Retail-Plus delivered spend side by side. Per member, over all 22 members: Rs 3,279 in Q1 and Rs 2,169 in Q2. Per buyer, over the 20 members with a delivered order in Q1 and the 16 in Q2: Rs 3,607 and Rs 2,982. Statement: the per-buyer figure is the fairer read, since a member who bought nothing has no spend to average. True or false, and why?
      (a) False: per buyer it falls a sixth and per member a third; 6 members had nothing delivered in Q2, against 2 in Q1, and leave the base.
      (b) True: per buyer it falls a third, the same share as per member, so the choice of base changes nothing Meera hears.
      (c) True: per buyer it falls a sixth, which is the fall among the members who still buy, the ones Meera can reach.
      (d) False: per buyer it falls a third and per member a sixth; 6 members had nothing delivered in Q2, against 2 in Q1, and leave the base.
    why: >-
      Per member the fall is Rs 1,110, 33.9 percent of Q1's Rs 3,279, about a third; per buyer it is
      Rs 625, 17.3 percent of Rs 3,607, about a sixth. The bases move under the figure: 2 members had
      nothing delivered in Q1 and 6 had nothing delivered in Q2, so the per-buyer figure drops the
      members who stopped buying from the quarter in which they stopped. Meera's question is
      whether the tier is spending less, and the tier includes the members who went quiet: counting
      only buyers hides half the fall. It is the reasoning Abraham Wald applied to the aircraft that
      came back in the Second World War, whose missing hits were on the aircraft that did not (Mangel
      and Samaniego, Journal of the American Statistical Association, 1984).
    wrong:
      b: >-
        The two bases differ: 33.9 percent per member against 17.3 percent per buyer.
      c: >-
        A sixth is the fall among the members who still buy, and the base that measures it drops the
        members who stopped buying, who are the finding.
      d: >-
        The reason holds and the two falls are swapped: per member it is 33.9 percent, per buyer
        17.3.
    answer: >-
      Before I average I ask who is missing from the denominator; per member all 22 count, so the
      members who stopped buying show up as the fall they are, where the per-buyer figure hides half of
      it.

  - id: shuffle-sign
    type: One correct option
    label: Predict the output and the call
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Thu
    key: d
    anchor: What does p = 0.03 mean, and not mean?
    exhibit:
      caption: Ten invented cards, the label shuffle, and the analyst's rerun.
      code:
        lang: python
        text: |
          import random
          from statistics import mean

          def shuffle_gaps(q1, q2, times, seed):       # the label shuffle
              random.seed(seed)
              pool = q1 + q2
              gaps = []
              for _ in range(times):
                  random.shuffle(pool)
                  gaps.append(mean(pool[:len(q1)]) - mean(pool[len(q1):]))
              return gaps

          q1 = [3600, 4100, 3200, 4300, 3000]          # five customers, Q1
          q2 = [3300, 2000, 2900, 2600, 2500]          # five other customers, Q2
          real_gap = mean(q2) - mean(q1)               # the fall, Q2 against Q1
          gaps = shuffle_gaps(q1, q2, 1000, seed=2026)
          p = sum(1 for g in gaps if g >= real_gap) / len(gaps)
          print(round(real_gap), p)
    text: |-
      The web team asks whether buyers spent less after the website changed at the start of Q2. Ten invented cards hold the spend of five customers who bought in Q1 and five different customers who bought in Q2, so the test shuffles the quarter labels: shuffle_gaps pools the ten figures, deals five to each quarter at random and records the gap. The first run wrote the gap as Q1 less Q2, Rs 980: 13 of 1,000 shuffles reached it and 29 made a gap that large either way, so the note called the fall real. An analyst reruns the cell with the gap written as Q2 less Q1, the way a fall is usually shown. What does the cell print, and what should the note say about the fall now?
      (a) -980 0.013; the note still calls the fall real.
      (b) -980 0.992; the note should now call the fall chance.
      (c) -980 0.013; the note should now call the fall borderline.
      (d) -980 0.992; the note still calls the fall real.
    why: >-
      The real gap is now -980, a fall, while each shuffled gap is still pile one less pile two, spread
      evenly on both sides of zero. The count asks how many shuffles are at least -980, which is nearly
      all of them, 992 of 1,000. A p of 0.992 reads as chance making this fall 99 times in 100, but it
      counted the wrong side: in the direction of the fall, 13 of 1,000 shuffles reach a gap this large,
      and 29 counting either way, both under 5 in 100, so the note still calls the fall real. The
      comparison has to run in the direction of the claim: count gaps at or below -980 with the gap
      written this way round, or write the real gap the way the shuffles are written. The customers
      differ between the quarters, so shuffling the labels across whole customers is the fair test
      here, where the same members in both quarters would have their own two quarters flipped.
    wrong:
      a: >-
        This is the first run's share, from a count of gaps at least +980; written as Q2 less Q1 the
        gap is -980, and the same >= now counts nearly every shuffle.
      b: >-
        This option takes the printed 0.992 at face value, but the count ran on the wrong side of the
        gap, so it says nothing about the fall.
      c: >-
        It keeps the first run's share and calls the fall borderline, where 13 of 1,000 one way and 29
        either way both sit under 5 in 100.
    answer: >-
      A p-value counts the chance-only worlds at least as extreme as the real gap in the direction of
      the claim, so I write the real gap and the shuffled gaps the same way round; a p near 1 on a gap
      that looked large is the tell that a sign flipped, and the call waits for the recount.

  - id: student-line
    type: One correct option
    label: Write the Student line
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Thu
    key: b
    anchor: 42 percent on 12 orders against 31 percent on 400; which do you trust?
    exhibit:
      caption: >-
        5,000 worlds in which a coin toss sends each of Student's 12 orders to Q1 or to Q2, as if the
        quarter made no difference, counted by how many of the 12 landed in Q2.
      table:
        head: [Q2 orders out of 12, Worlds]
        rows:
          - [4 or fewer, "918"]
          - ["5", "964"]
          - ["6", "1,133"]
          - ["7", "1,034"]
          - ["8", "595"]
          - [9 or more, "356"]
    text: |-
      Student went from 5 orders in Q1 to 7 in Q2, the 40 percent rise Meera asked about, and all 12 orders came from 2 customers. Which line goes into the one-page note?
      (a) Up 40 percent on 12 orders from 2 customers, a rise chance makes in 951 of 5,000 worlds: chance explains it, so Student comes out of the budget talk altogether.
      (b) Up 40 percent on 12 orders from 2 customers, a rise chance makes in 1,985 of 5,000 worlds: too few customers to tell, so no budget moves until more customers buy.
      (c) Up 40 percent on 12 orders from 2 customers, a rise chance makes in 1,985 of 5,000 worlds: chance explains it, so Student comes out of the budget talk altogether.
      (d) Up 40 percent on 12 orders from 2 customers, a rise chance makes in 951 of 5,000 worlds: too few customers to tell, so no budget moves until more customers buy.
    why: >-
      A rise of 40 percent or more means 7 or more of the 12 orders in Q2, since 7 against 5 is a rise
      of 40 percent: 1,034 plus 595 plus 356 is 1,985 of 5,000 worlds, a share of 0.397, so chance
      alone makes a rise this size about 2 times in 5. A share that large means the data cannot tell a
      real rise from luck, and it leaves the rise unproven in both directions, so the line moves no
      budget and names what would settle it. Thursday's rule calls a rate on fewer than thirty
      customers a lead, and 2 customers stand behind all 12 orders: one customer's habits could make
      the whole rise, so more orders from the same two would settle nothing.
    wrong:
      a: >-
        This option counts only the worlds with 8 or more Q2 orders, a rise of more than 40 percent,
        and then treats chance as the whole explanation.
      c: >-
        The count is right and the reading is not: a share of 0.397 says chance could have made the
        rise, which is a reason to wait for more customers, and it cannot show that chance did make it.
      d: >-
        The call is right, and the count leaves out the worlds with 7 Q2 orders, which are the 40
        percent rise itself.
    answer: >-
      Student's rise is 7 orders against 5 from 2 customers, and a coin toss makes a rise that size in
      1,985 of 5,000 worlds, so the line holds the budget and waits for more customers, with the count
      of customers beside the rate.

  - id: diwali-test
    type: One correct option
    label: Design the Diwali test
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS, FDE
    day: Thu
    key: c
    anchor: Revenue rose after a discount; did the campaign work, and what would you need to know?
    text: |-
      Meera agrees to run the Diwali offer as a test: Marketing will hold back about one customer in five from whichever group it picks, keeping them out of the offer so that they can be compared with the rest. Which plan lets the next note say whether the discount itself changed what customers spent?
      (a) Hold back a random fifth of each segment, and compare the two groups' total revenue over the Diwali weeks.
      (b) Offer it to all of Retail-Plus, hold back a random fifth of Retail-Core, and compare spend per customer over the Diwali weeks.
      (c) Hold back a random fifth of each segment, and compare spend per customer in the two groups over the Diwali weeks.
      (d) Offer it to all of Retail-Plus, hold back a random fifth of Retail-Core, and compare total revenue over the Diwali weeks.
    why: >-
      The groups must differ only by the offer and by chance, which a random hold-back inside every
      segment gives: the same season, the same mix, and customers who did not choose themselves. The
      measure must carry its denominator as well: the offer group is about four times the hold-back,
      so its total revenue is about four times larger whatever the discount does, and only spend per
      customer compares the two. The plan is Thursday's hold-back of one in five inside each segment,
      measured with Tuesday's rule that a rate names its base.
    wrong:
      a: >-
        This plan holds back the right groups and compares totals, where four customers in five will
        outspend one in five whatever the offer does.
      b: >-
        Offering it to all of Retail-Plus sets members against Retail-Core customers, two segments that
        differ before any offer, since members spend more in any month.
      d: >-
        Here the two groups differ by segment before any offer, and their totals come from groups of
        very different sizes.
    answer: >-
      To learn what the discount does, I hold back a random slice inside each segment, agree the measure
      per customer and the window before it runs, and compare the two slices; anything else compares
      groups that were already different.

