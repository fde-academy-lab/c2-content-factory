notes:
  50:
    label: Size the revenue tree
    level: Medium
    min: 2.5
    why: >-
      Revenue is customers times orders per customer times items per order times price per item, less
      discounts: 50,000 times 2 times 3 times Rs 400 is Rs 12,00,00,000, Rs 12 crore, and Rs 1 crore of
      discounts leaves Rs 11 crore.
    wrong:
      "Rs 12 crore": >-
        This stops before the discounts, which come off the product of the four branches.
      "Rs 3 crore": >-
        Leaving out items per order drops one of the four branches that multiply.
      "Rs 1.1 crore": >-
        A zero is lost between rupees and crore, since Rs 12,00,00,000 is Rs 12 crore.
    answer: >-
      Revenue is the four branches multiplied, less discounts: Rs 12 crore before discounts and Rs 11
      crore after, and I say which of the two I am quoting.
  20:
    label: Pick the first rung
    min: 1.5
    why: >-
      The first rung is confirming that the drop is real: that each quarter's figure is complete and
      free of pipeline errors, before any two figures are compared.
    wrong:
      b: >-
        Decomposing a drop that may not exist wastes the next four rungs.
      c: >-
        A hypothesis comes last, once the drop is confirmed, compared, decomposed and isolated; stated
        first, it steers the analysis toward an answer chosen in advance.
      d: >-
        Isolating a segment comes after the tree says which branch moved.
    answer: >-
      First I confirm the drop is real, then compare like with like, decompose, isolate and only then
      hypothesise.
  35:
    label: Check four p-value statements
    level: Medium
    min: 2.5
    why: >-
      The p-value assumes chance alone, is small when the gap would be rare under chance, and is silent on
      size. It is not the probability that the hypothesis is true; reading it that way is the same
      mistake as calling p = 0.03 a 3 percent chance of being wrong.
    wrong:
      c: >-
        The p-value is computed on the assumption that chance alone is at work, so it cannot give the
        probability that the hypothesis is true.
    answer: >-
      The p-value assumes chance alone and says how rare my gap would be there; it is not the chance I am
      right, and it says nothing about size.
  51:
    label: Order the ladder
    why: >-
      Check each quarter's figure on its own, then set the two checked figures side by side on the same
      weeks and definitions, decompose, isolate, and only then hypothesise; each rung rests on the one
      before it.
    wrong:
      "e, b, d, a, c": >-
        This order decomposes before either figure is checked.
      "d, b, e, a, c": >-
        It sets the two quarters side by side before either figure is known to be complete.
    answer: >-
      I check each figure, set the two side by side on like terms, decompose, isolate and only then
      hypothesise, and the rung most people skip is the second.
  52:
    label: Order the cleaning pass
    why: >-
      The pass profiles each field, decides each defect with a reason, reconciles, and only then
      recomputes and sends, because Anand compares every figure with his books and will not act on one
      whose rows or rupees do not match them.
    wrong:
      "b, d, c, a": >-
        This order recomputes and sends before reconciling, so the figure may rest on missing rows.
      "d, b, a, c": >-
        Deciding fixes before profiling turns every decision into a guess.
    answer: >-
      I profile, decide, reconcile and only then recompute, because the reconciliation comes before any
      number leaves.

stretch:
  - text: |
      On Tuesday's export, revenue per order rose 18 percent from Q1 to Q2 while orders per customer fell. Meera asks whether the rise is good news. Answer in three sentences she could repeat.
    answer: >-
      "About 69 percent of it is a change in who ordered: Retail-Plus's small orders fell from 51 rows
      to 26 while Business's lakh-sized orders fell only from 20 to 17, so the average order grew while
      no segment's revenue per order rose anywhere near 18 percent. Most of the rest is Business, whose
      revenue per order rose 5.0 percent, and that is the part worth watching. The rise is no sign that
      customers pay more, and I would show revenue per order by segment beside it."
  - text: |
      Kavya's test of the Retail-Plus fall flips each member's own two quarters. A label shuffle would pool all 44 figures and deal them out to the two quarters at random. Why is the flip the fairer test for these 22 members? Answer in two sentences.
    answer: >-
      "The same 22 members spent in both quarters, so flipping each member's own pair compares every
      member with themselves, and chance only decides which of their two quarters came first. Pooling
      all 44 figures would also count the gaps between members as chance, which overstates chance where
      heavy buyers stay heavy and can hide a real fall, although on these 22 a member's Q1 barely
      predicts their Q2, a correlation of 0.04, so the two tests land close."
  - text: |
      You have two hours and a raw export, and Meera wants the Q1 figure at the end of them. What do you do first, what do you skip, and what do you refuse to skip?
    answer: >-
      First, profile the fields and check the window and the identity rule, because those decide whether
      any number can be trusted. Skip polish: charts, formatting and every exploration beyond the question
      asked. Refuse to skip the reconciliation, rows and rupees, because a figure that does not reconcile
      is one Finance will overturn, and it is the step rooms drop under time pressure.
  - text: |
      The head of customer support asks for one number for the support agent's weekly review. Which number do you give, and what goes beside it so that it cannot mislead?
    answer: >-
      The share of conversations the agent resolved without a person, with its denominator (how many
      conversations, over which week) and the share handed to a person beside it, since a rate without
      its base cannot be checked. Beside it go the median cost per conversation and the count of runs
      stopped by the cap on model calls, so a cheaper week that simply refused more customers shows up as
      what it is.
