      (a) 7 orders against 5, from 2 customers; chance alone does this in 951 of 5,000 worlds. Hold, and re-read at 30 orders.
      (b) 7 orders against 5, from 2 customers; chance alone does this in 1,985 of 5,000 worlds. Hold, and re-read at 30 orders.
      (c) 7 orders against 5, from 2 customers; chance alone does this in 1,985 of 5,000 worlds, so the rise is noise.
      (d) 7 orders against 5, from 2 customers; chance alone does this in 1,034 of 5,000 worlds. Hold, and re-read at 30 orders.
    why: >-
      A rise of 40 percent or more means 7 or more of the 12 orders in Q2, since 7 against 5 is exactly
      40 percent: 1,034 plus 595 plus 356 is 1,985 of 5,000 worlds, a share of 0.397, so chance alone
      makes a rise this size about 2 times in 5 and the data cannot tell a real rise from luck. The line
      carries the count with the rate, the evidence, and an action with its trigger, Kavya's floor of 30
      orders. With 2 customers behind all 12 orders, one customer's habits could make the whole rise.
      Fund nothing yet, and drop nothing either.
    wrong:
