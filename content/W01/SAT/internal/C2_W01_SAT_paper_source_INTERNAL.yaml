      Give the change in revenue from Q1 to Q2 that belongs in Meera's note on Monday, as a percentage to one decimal place.
    why: >-
      The tile set 11 weeks of Q2 against 13 of Q1, which the closed quarters fix. Q1 as exported still
      held Rs 20,00,000 of copied rows,
      so reconciled Q1 is Rs 2,10,00,000 less Rs 20,00,000, Rs 1,90,00,000, the figure in Anand's books.
      The change is (1,87,00,000 less 1,90,00,000) over 1,90,00,000, a fall of 1.6 percent measured from
