  - id: debt-weights
    type: Scenario set
    label: Predict the output
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Tue
    key: a
    anchor: Why is a rate without a denominator meaningless?
    exhibit:
      caption: The two averages, computed on the seven countries in the table.
      code:
        lang: python
        text: |
          above_90 = {"Greece": (19, 2.9), "Ireland": (7, 2.4), "Italy": (10, 1.0),
                      "Japan": (11, 0.7), "New Zealand": (1, -7.6),
                      "United Kingdom": (19, 2.4), "United States": (4, -2.0)}
          years = sum(n for n, g in above_90.values())
          by_country = sum(g for n, g in above_90.values()) / len(above_90)
          by_year = sum(n * g for n, g in above_90.values()) / years
          print(years, f"{by_country:.2f}", f"{by_year:.2f}")
    text: |-
      SET 5. SITUATION: In 2010 the economists Carmen Reinhart and Kenneth Rogoff reported that advanced economies whose public debt was above 90 percent of GDP (gross domestic product, the value of everything an economy produces in a year) grew at -0.1 percent a year on average. In 2013 Thomas Herndon, Michael Ash and Robert Pollin rebuilt the figure from the authors' working spreadsheet. The table gives the seven countries that entered the above-90 average, with the years each spent above 90 percent and its average growth in those years.
      What does the cell print, and what explains the gap between its two averages?
      (a) 71 -0.03 1.68: in the first, one New Zealand year weighs as much as nineteen British years.
      (b) 71 1.68 -0.03: weighting by years lets New Zealand's one bad year dominate the second figure.
      (c) 71 -0.03 -0.03: no weighting can move an average of the same seven country figures at all.
      (d) 7 -0.03 1.68: years holds the count of countries, and the weights come from the years instead.
    why: >-
      The first figure averages the seven country averages, so New Zealand's single year at -7.6 percent
      weighs as much as the United Kingdom's nineteen years at 2.4: -0.2 over 7 countries is -0.03. The
      second weights each country by its years, 119.6 over 71 country-years, which is 1.68. Herndon, Ash
      and Pollin (2013, Tables 2 and 3) report the same two figures, 0.0 and 1.7, for these seven
      countries, and -0.1 once a transcription of New Zealand's growth as -7.9 is included; Reinhart and
      Rogoff defended weighting each country equally, to keep one country's unusual episode from
      dominating. What survives either view is the week's point: an average of averages carries its
      weights silently, and here the choice moves the answer by 1.7 points.
    wrong:
      b: >-
        Swaps the two. Equal weight for each country is what lets one year count as much as nineteen.
      c: >-
        The weights are the whole difference: the same seven averages give -0.03 counted once each and
        1.68 counted once for each year.
      d: >-
        years adds up the years, 71; seven is the number of keys in the dictionary.
    answer: >-
      An average of averages gives every group the same vote whatever its size, so I say which weighting
      I used and show the other beside it; here that moves the answer from about zero to 1.7 percent.

  - id: debt-rows
    type: Scenario set
    label: Choose the check
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS
    day: Wed
    key: a
    anchor: "Input 200, clean 183, rejected 14: does it reconcile, and what is the missing number?"
    text: |-
      SET 5, continued.
      The working spreadsheet held 20 countries, but the formula for each average covered rows 30 to 44 where it should have covered rows 30 to 49, which left out Australia, Austria, Belgium, Canada and Denmark; the authors accepted the error when it was found. Which check, run before publication, would have caught it?
      (a) Count the countries inside each average, and set that count against the sheet's 20.
      (b) Recompute each average as a median, which a few missing rows cannot move very far.
      (c) Plot growth against debt for every country, and look for a point that breaks the pattern.
      (d) Round every average to one decimal place, so that small slips in the sheet cannot show.
    why: >-
      It is Wednesday's reconciliation applied to a formula: count what went in against what should have
      gone in. Twenty countries in the sheet against fifteen in the average is a gap nobody misses once
      it is counted, and none of the other checks looks at the rows at all (Herndon, Ash and Pollin,
      2013, note 5; Reinhart and Rogoff acknowledged the error in April 2013).
    wrong:
      b: >-
        A median of the wrong rows still summarises the wrong rows; nothing in the statistic shows which
        rows were in it.
      c: >-
        A missing country leaves no point on the chart to break any pattern, so the plot looks as clean
        as the sheet.
      d: >-
        Rounding hides small slips and never reveals a missing row.
    answer: >-
      Before any average leaves me I count the rows it covers against the rows it should cover, the same
      input-equals-output check as a cleaning run, because a formula can drop five countries without an
      error.

  - id: orbiter-units
    type: One correct option
    label: Choose the first move
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, FDE
    day: Wed
    key: c
    anchor: Finance and your dashboard disagree; what do you do?
    text: |-
      NASA's Mars Climate Orbiter was lost on 23 September 1999 as it reached Mars. One team's ground software wrote the thrusters' impulse in pound-force seconds, while the interface specification, and the navigation software that read the file, used newton-seconds, so every firing's effect was understated by a factor of 4.45. For months before arrival, navigation solutions from Doppler data alone kept placing the spacecraft closer to Mars than the other solutions did; the concern was raised informally and never resolved (NASA Mishap Investigation Board, 1999). In this week's terms, what should have happened when the two estimates disagreed?
      (a) Average the two navigation estimates, since each one carries an error of its own.
      (b) Trust the combined estimate, since it drew on more of the tracking data.
      (c) Treat the disagreement as the finding, and trace its cause before the next burn.
      (d) Widen the tolerance, since small differences build up over a nine-month cruise.
    why: >-
      Two methods that should agree and do not are a reconciliation waiting to be done, the same move as
      Wednesday's two Q1 figures: neither is right by rank until the gap is explained. Here the gap led
      to the units, a value read across a boundary without its unit, which is why Wednesday converts on
      purpose, once, and names the unit. The board's report says the discrepancies were reported only
      informally and not resolved, and it names inadequate communication between project elements among
      the contributing causes.
    wrong:
      a: >-
        Averaging a right figure with a wrong one gives a third figure that is wrong, Anand's objection to
        averaging the dashboard with the books.
      b: >-
        Trusting the estimate with more data, when that data carried the mismodelled thrust, is the
        dashboard trusted over the books because it refreshes daily.
      d: >-
        Widening the tolerance turns an unexplained difference into an accepted one; after the loss the
        board estimated the orbit's lowest point at 57 km against a planned 226 km.
    answer: >-
      When two figures that should agree do not, the disagreement is the finding: I trace it before
      anyone acts on either, and I check units at every hand-off between teams, because a value can
      parse perfectly and still be in the wrong unit.

  - id: flu-fit
    type: More than one correct
    label: Choose every reason
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Thu
    key: b, e
    anchor: Revenue rose after a discount; did the campaign work, and what would you need to know?
    text: |-
      Google Flu Trends estimated flu activity in the United States from how often people searched for certain terms. Its builders tested 50 million search terms for those whose weekly volume best fit 1,152 data points of the CDC's figures (the Centers for Disease Control and Prevention, which counts doctor visits for flu-like illness), and weeded out terms such as high school basketball that fit well and had nothing to do with flu (Lazer and colleagues, Science, 2014). Why could basketball searches fit the flu figures? Mark every correct option.
      (a) Basketball games spread flu, since crowds gather indoors through the winter.
      (b) Winter drives both basketball searches and flu visits, so each rises with the season.
      (c) The CDC's figures carried errors that the basketball searches happened to match.
      (d) Search volume measures illness directly, so any term searched in winter measures flu.
      (e) Among 50 million candidate terms, some will fit 1,152 points by chance alone.
    why: >-
      Two things let an unrelated term fit. The season drives both basketball and flu, so the term tracks
      the calendar, a shared cause of the kind Thursday called a confounder; the authors call the first
      version of the model "part flu detector, part winter detector". And with 50 million candidates
      tried against 1,152 points, some will fit by chance alone, the arithmetic of Thursday's twenty
      invented segments, one of which came back small with nothing going on. The model also missed the
      2009 H1N1 pandemic, which did not follow the winter, and from August 2011 it ran high in 100 of
      108 weeks.
    wrong:
      a: >-
        Invents a causal path the data never tested; the paper calls such terms unrelated to the flu.
      c: >-
        The CDC's surveillance figures were the target the model was built to predict, and the paper
        reports the model's errors against them.
      d: >-
        Search volume measures searching, which is why the model drifted when search behaviour changed.
    answer: >-
      A proxy that fits on the season can be a winter detector, and a fit found among millions of tries
      can be chance, so I test a correlation on data it was not chosen on, and against a simple baseline,
      before I trust it.

  - id: bing-alert
    type: One correct option
    label: Answer the alert
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Thu
    key: b
    anchor: How do you know whether a change in a metric is significant?
    text: |-
      In 2012 an idea for changing how Bing displayed the headlines of its search ads had waited more than six months for a slot, until an engineer ran it as an A/B test, a controlled experiment that shows a change to a random share of users and compares them with the rest. Within hours the new version was producing abnormally high revenue, and a "too good to be true" alert fired (Kohavi and Thomke, Harvard Business Review, 2017). You are the analyst on call. What do you do first?
      (a) Ship the change to every user now, since each hour of delay costs revenue.
      (b) Treat the alert as a likely bug, and check the logging and the group split.
      (c) Stop the test and discard it, since a lift that large is almost always a bug.
      (d) Leave the test running for a quarter, until the lift settles near normal results.
    why: >-
      The ladder's first rung applies to good news too: confirm the change is real before acting on it.
      Such alerts usually signal a bug, the article says, so the first checks are the plumbing: revenue
      logged the same way in both groups, users split as planned, nothing broken in either version. In
      Bing's case the checks passed, and the analysis showed revenue up 12 percent, more than 100 million
      US dollars a year in the United States alone, without hurting key user-experience metrics: the
      best revenue idea in Bing's history.
    wrong:
      a: >-
        Acts on a number nobody has confirmed; if the lift were a logging bug, every user would get the
        bug.
      c: >-
        The reflex that kills the best ideas: the checks are cheap, and here they would have shown the
        lift was real.
      d: >-
        A quarter's wait checks nothing that a look at the logging and the split would not check within
        the hour.
    answer: >-
      A result that looks too good gets the same first rung as a drop that looks too bad: I confirm the
      logging and the split before I believe it, then size the lift and check the guardrail metrics
      before anyone ships it.

  - id: wald-buyers
    type: True or false
    label: Judge the fairer figure
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Thu
    key: c
    anchor: How do you handle missing data?
    text: |-
      In the Second World War, Abraham Wald of the Statistical Research Group at Columbia University estimated how vulnerable aircraft were from the hits on the aircraft that came back and the share that did not: a hit a returning aircraft carries is a hit an aircraft can survive (Mangel and Samaniego, Journal of the American Statistical Association, 1984). Kavya lays two versions of the Retail-Plus figure side by side. Per member, over all 22 members: Rs 3,279 in Q1 and Rs 2,169 in Q2. Per buyer, over the 20 members who bought in Q1 and the 16 who bought in Q2: Rs 3,607 and Rs 2,982. Statement: the per-buyer figure is the fairer read, since a member who bought nothing has no spend to average. True or false, and why?
      (a) True, because averaging in members who spent nothing drags the figure down unfairly.
      (b) True, because the question is what buyers spend, and members who did not buy are not buyers.
      (c) False, because members who stopped buying drop out of it, and the fall shrinks by half.
      (d) False, because two different denominators make the two quarters impossible to compare.
    why: >-
      Members who stopped buying are the aircraft that did not come back: counting only buyers leaves
      them out of exactly the quarter in which they stopped. Per member the fall is Rs 1,110, about a
      third of Q1's figure; per buyer it is Rs 625, about a sixth, because six members bought nothing in
      Q2 against two in Q1. Meera's question is whether the tier is spending less, and the tier includes
      the members who went quiet.
    wrong:
      a: >-
        Treats a real zero as noise. A member who stopped buying is the finding, as the aircraft that
        did not return carried the answer.
      b: >-
        Changes the question to fit the data. The head of Retail-Plus asked about his members, all 22
        of them.
      d: >-
        Right that the per-buyer denominators differ, wrong about what follows: per member uses 22 in
        both quarters and compares cleanly, and the per-buyer version is the one whose base moves.
    answer: >-
      Before I average I ask who is missing from the denominator; per member all 22 count, so the
      members who stopped buying show up as the fall they are, where the per-buyer figure hides half of
      it.

  # ---------------------------------------------------------------- Part 5, an AI agent's code and log
  - id: tool-print
    type: One correct option
    label: Predict what the model reads
    level: Hard
    min: 4
    tag: "[F]"
    roles: DS, FDE
    day: Tue
    key: b
    anchor: Why does a function that prints instead of returning break a pipeline?
    exhibit:
      caption: The agent's order-status tool, as first written. Illustrative.
      code:
        lang: python
        text: |
          ORDER_STATUS = {"SW-1041": "delivered", "SW-1042": "out for delivery"}

          def get_order_status(order_id):
              status = ORDER_STATUS.get(order_id, "not found")
              print(f"{order_id}: {status}")

          result = get_order_status("SW-1042")
          tool_message = {"role": "tool", "content": str(result)}   # sent to the model
    text: |-
      The agent sends the model whatever the tool function returns, as the tool's result. A customer asks about order SW-1042, which is out for delivery. What does the model read as the tool's result?
      (a) 'out for delivery', so the reply tells the customer the order is on its way.
      (b) 'None', so the model has no status to report and may say it cannot find it.
      (c) 'SW-1042: out for delivery', the line the tool printed on the agent's console.
      (d) Nothing at all, since str(None) raises an error and the agent retries the call.
    why: >-
      The function prints the status and has no return statement, so it hands back None, str(None) is
      the text 'None', and that is the tool result the model reads. The status appears only on the
      console, where neither the customer nor the model sees it. Nothing raises an error, the
      conversation goes on, and the share of conversations resolved falls with no trace in any error
      log: Tuesday's print-against-return trap, one layer further from anyone who would notice.
    wrong:
      a: >-
        What the author meant, and what return status delivers. Printing shows a value; only return
        hands it back.
      c: >-
        The printed line goes to the console. The caller receives the return value, which is None.
      d: >-
        str(None) is the four-letter text 'None', and no error is raised, which is why the fault is
        silent.
    answer: >-
      A tool must return its result, because the agent passes on the return value and never the console;
      I test each tool on what it returns, and I log the tool result the model actually received.

  - id: agent-history
    type: One correct option
    label: Choose the fix
    level: Medium
    min: 2.5
    tag: "[SV]"
    roles: DS, FDE
    day: Tue
    key: a
    anchor: "A list against a dictionary: when do you reach for each?"
    exhibit:
      caption: The agent's loop, as first written. Illustrative.
      code:
        lang: python
        text: |
          def run_agent(message, history=[]):
              history.append({"role": "user", "content": message})
              reply = call_model(history)            # sends every message in history
              history.append({"role": "assistant", "content": reply})
              return reply

          run_agent("Where is order SW-1042?")        # customer A
          run_agent("Please cancel order SW-2210")    # customer B
    text: |-
      The agent keeps a conversation's messages in a list and sends the whole list to the model on every call. A minute after customer A asks about order SW-1042, customer B, on the same server, asks to cancel order SW-2210, and B's model call carries A's messages too, which leaks A's order to B and bills B for A's tokens. Which change fixes it?
      (a) Default history to None, and create a new list inside when it is None.
      (b) Move history out to one module-level list that every call appends to.
      (c) Keep the default list, and trim it to its last 20 messages on each call.
      (d) Keep the default list, and clear it only when a call raises an error.
    why: >-
      A default value is built once, when Python defines the function, so every call that uses the default
      appends to the same list: customer B's call sends A's question and the model's reply to A before
      B's own message, and the list grows with every conversation the server handles, so the token bill
      grows with it. history=None, with a new list made inside when it is None, gives each conversation
      its own list.
    wrong:
      b: >-
        A module-level list is the same shared list, written in plain sight.
      c: >-
        Trimming caps the leak and keeps it: the last 20 messages can still belong to other customers.
      d: >-
        Errors are not what fills the list; every successful call does.
    answer: >-
      A mutable default is created once and shared by every call, so I default to None and build the list
      inside; in an agent, a conversation's state belongs to that conversation, kept under its id, never
      to the function.

  - id: agent-cost
    type: One correct option
    label: Choose the dashboard number
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS, FDE
    day: Mon
    key: d
    anchor: Mean or median for order value, and why?
    exhibit:
      caption: >-
        Cost per conversation in one shift, illustrative. C-01 to C-06 made 3 to 5 model calls each;
        C-07 looped and made 90.
      mermaid: |
        xychart-beta
          title "Cost per conversation, one shift"
          x-axis "Conversation" [C-01, C-02, C-03, C-04, C-05, C-06, C-07]
          y-axis "Rupees" 0 --> 45
          bar [1.4, 1.8, 1.2, 2.1, 1.6, 1.5, 42.0]
    text: |-
      In C-07 the model kept calling the same tool until a timeout stopped it. The head of support wants one number on the dashboard that shows the typical conversation's cost drifting, and a control that stops the next C-07. Which pair?
      (a) The mean, Rs 7.37, which rises whenever any one conversation misbehaves.
      (b) The median, Rs 1.60, and C-07 deleted from the log as a failed run.
      (c) The mean without C-07, Rs 1.60, since a looping run is an error to ignore.
      (d) The median, Rs 1.60, with a cap on the model calls per conversation.
    why: >-
      One looping conversation is 81 percent of the shift's Rs 51.60, so the mean, Rs 7.37, is four and
      a half times what a typical conversation costs and swings with every loop; the median, Rs 1.60,
      moves only when typical conversations get dearer. C-07 is a real cost and stays in the log and the
      bill, and what stops the next one is a control on the run itself, a cap on model calls per
      conversation, which is Monday's refusal to let one bulk order speak for every order, in an agent.
    wrong:
      a: >-
        Right for the bill and wrong for "typical": the mean moves with the one conversation that looped.
      b: >-
        Deleting C-07 removes a real cost from the bill Finance will pay; the median needs no deletion to
        ignore it.
      c: >-
        Reaches the right number the wrong way, by dropping a real run, and does nothing to stop the next
        loop.
    answer: >-
      The typical cost is the median and the bill is the sum with every run in it; a looping run is
      stopped by a cap on model calls per conversation, never by deleting it from the log.

  - id: sql-where
    type: Fill in the blank
    bank: sql-clauses
    label: Fill blank 1
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: WHERE
    anchor: What is the difference between WHERE and HAVING?
    exhibit:
      caption: >-
        The support head asks which tools failed at least 30 times this week. The analyst's query
        against the call log, with two numbered blanks.
      code:
        lang: sql
        text: |
          SELECT tool, COUNT(*) AS failed_calls
          FROM calls
          __(1)__ status = 'error'
          GROUP BY tool
          __(2)__ COUNT(*) >= 30;
    text: |-
      Blank (1), which keeps only the failed calls before any grouping, is ____.
    why: >-
      A filter on single rows runs before grouping, and that is WHERE: it keeps the failed calls so that
      GROUP BY counts only them.
    wrong:
      "HAVING": >-
        HAVING filters groups after GROUP BY; on a plain column such as status it fails, since status is
        not grouped.
      "ON": >-
        ON belongs to a join, and this query joins nothing.
    answer: >-
      WHERE filters rows before grouping and cannot see an aggregate; HAVING filters groups after
      grouping and can.

  - id: sql-having
    type: Fill in the blank
    bank: sql-clauses
    label: Fill blank 2
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS
    day: Thu
    key: HAVING
    anchor: 42 percent on 12 orders against 31 percent on 400; which do you trust?
    text: |-
      Blank (2), which keeps only the tools with at least 30 failed calls, Kavya's floor for reading a count, is ____.
    why: >-
      COUNT(*) exists only once the rows are grouped, so the test on it is a HAVING, which runs after GROUP
      BY; it applies Kavya's 30-observation floor to each tool.
    wrong:
      "WHERE": >-
        WHERE runs before grouping and cannot see COUNT(*); Postgres refuses an aggregate in WHERE.
      "LIMIT": >-
        LIMIT cuts the result to a number of rows, whichever rows come first, whatever each tool's count.
    answer: >-
      A test on an aggregate goes in HAVING, after the rows are grouped, and a count under 30 is a count I
      do not read as a rate.

  - id: sql-count
    type: Match the following
    bank: sql-results
    label: Match the count
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: "6"
    anchor: How do you handle missing data?
    exhibit:
      caption: >-
        Eight calls from the log, illustrative. latency_ms is empty, NULL, when a call timed out; tool is
        NULL when the model replied without calling one.
      table:
        head: [call_id, conversation_id, tool, status, latency_ms]
        rows:
          - ["1", CV-1, order_status, ok, "800"]
          - ["2", CV-1, order_status, ok, "1200"]
          - ["3", CV-2, refund, error, "600"]
          - ["4", CV-3, order_status, timeout, "NULL"]
          - ["5", CV-3, refund, ok, "1000"]
          - ["6", CV-4, "NULL", ok, "400"]
          - ["7", CV-5, handover, timeout, "NULL"]
          - ["8", CV-6, order_status, ok, "800"]
    text: |-
      SELECT COUNT(latency_ms) FROM calls;
    why: >-
      COUNT of a column counts the values in it, and the two timed-out calls have none, so it returns 6;
      COUNT(*) would return 8. A dashboard that labels this "calls" undercounts exactly the calls that
      went worst.
    wrong:
      "8": >-
        COUNT(*) counts rows; COUNT(latency_ms) counts values, and two of them are NULL.
    answer: >-
      COUNT(*) counts rows and COUNT(column) counts values, so a NULL-heavy column undercounts quietly; I
      say which one a dashboard shows.

  - id: sql-avg
    type: Match the following
    bank: sql-results
    label: Match the average
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: "800"
    anchor: How do you handle missing data?
    text: |-
      SELECT AVG(latency_ms) FROM calls;
    why: >-
      AVG skips NULL, so it averages the six calls that finished, 4,800 over 6, which is 800. The two
      timeouts, the slowest calls of all, are left out, and the dashboard's latency looks better than any
      customer's wait. Reading NULL as zero gives 600, which is wrong too, since a timeout did not take
      no time.
    wrong:
      "600": >-
        Reads NULL as zero, 4,800 over 8; AVG leaves NULL rows out of both the sum and the count.
    answer: >-
      AVG averages the values present, so the calls that never finished vanish from it; I report the
      timeouts beside the average, never inside it.

  - id: sql-rate
    type: Match the following
    bank: sql-results
    label: Match the rate
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Tue
    key: "0"
    anchor: Why is a rate without a denominator meaningless?
    text: |-
      SELECT COUNT(*) FILTER (WHERE status <> 'ok') / COUNT(*) FROM calls;
    why: >-
      Both counts are integers, and Postgres divides an integer by an integer as integers, so 3 over 8
      returns 0 and the dashboard shows a failure rate of 0 percent. Multiplying by 1.0 first, or casting
      one side, returns 0.375.
    wrong:
      "0.375": >-
        The true share, which needs a decimal division; an integer over an integer drops the fraction.
    answer: >-
      Postgres divides integers as integers, so every rate gets a 1.0 or a cast before the division, and I
      check a rate of exactly 0 against its counts.

