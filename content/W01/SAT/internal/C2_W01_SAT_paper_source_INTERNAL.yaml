  - id: sale-mix
    type: Scenario set
    label: Size the offer's effect
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS, FDE
    day: Thu
    key: A fall of Rs 12,500.
    anchor: Revenue rose after a discount; did the campaign work, and what would you need to know?
    text: |-
      SET 6. SITUATION: Last month the company's marketing team sent a 20 percent weekend offer to 500 customers, 250 members and 250 regular customers, and not to the other 1,000, of whom 400 were members and 600 regular. That month the 500 spent Rs 1,025 each and the 1,000 spent Rs 960 each, a lift of 6.8 percent, which is the marketing lead's case for sending the offer again at the festival. The chart and its table split the same customers by tier.
      On these figures, how much more or less did the 500 customers who got the offer spend last month than the same customers would have spent without it? Give it in rupees.
    why: >-
      Inside each tier the offer group spent less: members Rs 1,470 against Rs 1,500, Rs 30 less each,
      and regular customers Rs 580 against Rs 600, Rs 20 less each. The 500 were 250 of each, so they
      spent 250 times 30 plus 250 times 20, Rs 12,500, less than the same customers would have without
      the offer, with each tier's customers who did not get it standing in for them. The blend says
      the opposite, Rs 65 more each or Rs 32,500 in all, because half the offer group were members
      against four in ten of the rest, and members spend more in any month: the lift was the mix of who
      received the offer.
    wrong:
      "A rise of Rs 32,500": >-
        The blend as it came, Rs 65 more each, with half the offer group members against four in ten of
        the rest.
      "A fall of Rs 12,000": >-
        Sets the offer group at the other group's mix, four members in ten, where the 500 were half
        members.
      "A fall of Rs 7,500": >-
        Members alone, 250 of them at Rs 30 less each.
      "A fall of Rs 5,000": >-
        Regular customers alone, 250 of them at Rs 20 less each.
    answer: >-
      A total can rise while every tier falls when the mix shifts, so I set each customer against
      customers of the same tier before I credit an offer; here the 500 spent Rs 12,500 less than they
      would have.

  - id: sale-advice
    type: Scenario set
    label: Advise on the festival
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS, FDE
    day: Thu
    key: b
    anchor: Revenue rose after a discount; did the campaign work, and what would you need to know?
    text: |-
      SET 6, continued.
      The marketing lead wants to send the offer again at the festival, at 25 percent off, to the same kind of list. What do you advise?
      (a) Send it again at 25 percent off; orders need to rise by a quarter to hold revenue.
      (b) Do not send it as it ran; orders need to rise by a third to hold revenue at 25 percent off.
      (c) Send it again at 25 percent off; orders need to rise by a third to hold revenue.
      (d) Do not send it as it ran; orders need to rise by a quarter to hold revenue at 25 percent off.
    why: >-
      Inside both tiers the offer group spent less, so last month's lift was who received the offer, and
      nothing in the table shows the offer adding spend. A deeper cut asks more: at 25 percent off every
      order brings in 0.75 of its price, so orders must rise by 1 over 0.75, a third, just to hold
      revenue, where a 20 percent cut needed a quarter. The honest advice is not to repeat it as it ran,
      and to test it on a random hold-back inside each tier first.
    wrong:
      a: >-
        Credits the blend the tier split contradicts, with the break-even of a 20 percent cut.
      c: >-
        Right break-even, wrong call: the blend's lift was the mix, and a deeper cut only raises the bar.
      d: >-
        Right call, wrong arithmetic: a quarter is the break-even for 20 percent off, and 25 percent needs
        1 over 0.75, a third.
    answer: >-
      I would not repeat it as it ran: spend fell inside both tiers, so the lift was the mix, and at 25
      percent off orders must rise by a third just to hold revenue; I would test it on a random
      hold-back inside each tier first.

  - id: tool-print
    type: One correct option
    label: Predict what the model and the dashboard read
    level: Hard
    min: 4
    tag: "[F]"
    roles: DS, FDE
    day: Tue
    key: c
    anchor: Why does a function that prints instead of returning break a pipeline?
    exhibit:
      caption: One conversation, and the agent's order-status tool as first written. Illustrative.
      mermaid: |
        flowchart LR
          C["Customer asks<br/>about an order"] --> M1["Model call 1<br/>billed"]
          M1 --> T["Tool runs<br/>get_order_status"]
          T --> M2["Model call 2<br/>billed"]
          M2 --> R["Reply to<br/>the customer"]
      code:
        lang: python
        text: |
          ORDER_STATUS = {"1041": "delivered", "1042": "out for delivery"}

          def get_order_status(order_id):
              if order_id in ORDER_STATUS:
                  return ORDER_STATUS[order_id]
              print(f"order {order_id}: not found")

          results = [str(get_order_status(o)) for o in ["1042", "1099", "1041"]]
          found = sum(1 for r in results if r)         # the dashboard's lookups found
    text: |-
      The agent sends the model whatever the tool returns, as text, and the support head's dashboard counts a lookup as found when that text is not empty. Three customers ask about orders 1042, 1099, a mistyped number, and 1041. What does the model read as the tool's result for 1099, and what does found hold?
      (a) 'None', and found holds 2 of the 3 lookups.
      (b) 'order 1099: not found', and found holds 2 of the 3 lookups.
      (c) 'None', and found holds 3 of the 3 lookups.
      (d) 'order 1099: not found', and found holds 3 of the 3 lookups.
    why: >-
      For a known order the function returns the status. For 1099 it prints a line to the console and
      runs off its end, so it hands back None, and str(None) is the four-letter text 'None': the model
      reads 'None' and may tell the customer it cannot find anything, or guess. The dashboard's test is
      whether the text is empty, and 'None' is not, so found holds 3 and the page shows every lookup
      found where one failed. Nothing raises an error at any step. The fix is to return the "not found"
      message the function now only prints, and to count a lookup as found on what it returned, never
      on whether some text came back: Tuesday's print-against-return trap, one layer further from
      anyone who would notice.
    wrong:
      a: >-
        Right text, wrong count: 'None' is a non-empty string, so it passes the test that None itself
        would fail.
      b: >-
        The printed line goes to the console; the caller receives the return value, and a non-empty
        message would count as found too.
      d: >-
        Right count for the wrong reason: the model never sees the printed line, only the returned
        None turned into text.
    answer: >-
      A tool must return its result, because the agent passes on the return value and never the console;
      I test each tool on what it returns, the unknown cases included, and I count success on what came
      back, since the text 'None' passes any test for an empty string.

  - id: agent-history
    type: One correct option
    label: Count the messages and choose the fix
    level: Hard
    min: 4
    tag: "[SV]"
    roles: DS, FDE
    day: Tue
    key: a
    anchor: "A list against a dictionary: when do you reach for each?"
    exhibit:
      caption: The agent's loop as first written, and three customers on one server. Illustrative.
      code:
        lang: python
        text: |
          def run_agent(message, history=[]):
              history.append({"role": "user", "content": message})
              reply = call_model(history)            # sends every message in history
              history.append({"role": "assistant", "content": reply})
              return reply

          run_agent("Where is order 1042?")          # customer A
          run_agent("Please cancel order 2210")      # customer B
          run_agent("Is my refund done?")            # customer C
    text: |-
      Customers often write more than once, and the server answers several conversations at the same time. Here customers A, B and C have each sent a first message, in that order. How many messages does C's model call send, and which change gives every conversation its own messages across all its turns?
      (a) 5; keep each conversation's messages under its conversation id, and pass that list in.
      (b) 3; keep the default list, and clear it at the end of every call so the next customer starts empty.
      (c) 5; keep the default list, and clear it at the end of every call so the next customer starts empty.
      (d) 3; keep each conversation's messages under its conversation id, and pass that list in.
    why: >-
      A default value is built once, when Python defines the function, so every call that uses it
      appends to the same list. A's call sends 1 message and appends the reply; B's sends 3; C's
      appends its question and sends 5, two of them A's and two B's. Clearing the shared list after each
      call fails twice over: two conversations answered at the same time still share it mid-call, and a
      customer's second message arrives to an empty list that has forgotten the first. Each
      conversation's messages belong under its own id, passed in as its history on every turn.
    wrong:
      b: >-
        Counts the three questions and forgets the two replies, and the fix breaks both concurrent
        conversations and second messages.
      c: >-
        Right count, wrong fix: a list cleared after each call is still shared while calls overlap, and
        it forgets each customer's earlier turns.
      d: >-
        Right fix, wrong count: each call appends the reply as well as the question, so C's call sends 5.
    answer: >-
      A mutable default is created once and shared by every call, so I never keep state in one; in an
      agent, a conversation's messages belong to that conversation, kept under its id and passed in on
      every turn.

