  - id: wald-kalpa
    type: True or false
    label: Judge the fairer figure
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Thu
    key: a
    anchor: How do you handle missing data?
    text: |-
      Kavya lays two versions of the Retail-Plus figure side by side. Per member, over all 22 members: Rs 3,279 in Q1 and Rs 2,169 in Q2. Per buyer, over the 20 members with a delivered order in Q1 and the 16 in Q2: Rs 3,607 and Rs 2,982. Statement: the per-buyer figure is the fairer read, since a member who bought nothing has no spend to average. True or false, and why?
      (a) False: per buyer it falls a sixth and per member a third; 6 members had nothing delivered in Q2, against 2 in Q1, and leave the base.
      (b) True: per buyer it falls a third, the same share as per member, so the choice of base changes nothing Meera hears.
      (c) True: per buyer it falls a sixth, which is the fall among the members who still buy, the ones Meera can reach.
      (d) False: per buyer it falls a third and per member a sixth; 6 members had nothing delivered in Q2, against 2 in Q1, and leave the base.
    why: >-
      Per member the fall is Rs 1,110, 33.9 percent of Q1's Rs 3,279, about a third; per buyer it is
      Rs 625, 17.3 percent of Rs 3,607, about a sixth. The bases move under the figure: 2 members had
      nothing delivered in Q1 and 6 had nothing delivered in Q2, so the per-buyer figure drops the
      members who stopped buying from exactly the quarter in which they stopped. Meera's question is
      whether the tier is spending less, and the tier includes the members who went quiet: counting
      only buyers hides half the fall. It is the reasoning Abraham Wald applied to the aircraft that
      came back in the Second World War, whose missing hits were on the aircraft that did not (Mangel
      and Samaniego, Journal of the American Statistical Association, 1984).
    wrong:
      b: >-
        The two bases differ: 33.9 percent per member against 17.3 percent per buyer.
      c: >-
        Right fall, wrong question: the members who stopped buying are the finding, and the per-buyer
        base drops them.
      d: >-
        Right reason with the two falls swapped: per member it is 33.9 percent, per buyer 17.3.
    answer: >-
      Before I average I ask who is missing from the denominator; per member all 22 count, so the
      members who stopped buying show up as the fall they are, where the per-buyer figure hides half of
      it.

  - id: shuffle-sign
    type: One correct option
    label: Predict the output and the call
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Thu
    key: d
    anchor: What does p = 0.03 mean, and not mean?
    exhibit:
      caption: Thursday's ten cards, the class's shuffle_gaps, and the analyst's rerun.
      code:
        lang: python
        text: |
          def shuffle_gaps(q1, q2, times, seed):       # as in class
              random.seed(seed)
              pool = q1 + q2
              gaps = []
              for _ in range(times):
                  random.shuffle(pool)
                  gaps.append(mean(pool[:len(q1)]) - mean(pool[len(q1):]))
              return gaps

          q1 = [3400, 2900, 4100, 2500, 3800]
          q2 = [2200, 3100, 1900, 2700, 2400]
          real_gap = mean(q2) - mean(q1)               # the fall, Q2 against Q1
          gaps = shuffle_gaps(q1, q2, 1000, seed=2026)
          p = sum(1 for g in gaps if g >= real_gap) / len(gaps)
          print(round(real_gap), p)
    text: |-
      Thursday's ten cards held five members' Q1 spend and five other members' Q2 spend, and in class 21 of 1,000 shuffles reached the real gap of Rs 880, under Kavya's 0.05. An analyst reruns the test with the gap written as Q2 less Q1, the way a fall is usually shown. What does the cell print, and what should the note to Meera say about the fall?
      (a) -880 0.021; the note still calls the fall real.
      (b) -880 0.981; the note should now call the fall the wobble.
      (c) -880 0.021; the note should now call the fall the wobble.
      (d) -880 0.981; the note still calls the fall real.
    why: >-
      The real gap is now -880, a fall, while each shuffled gap is still pile one less pile two, spread
      evenly on both sides of zero. The count asks how many shuffles are at least -880, which is nearly
      all of them, 981 of 1,000. A p of 0.981 reads as chance making this fall 98 times in 100, but it
      counted the wrong side: in the direction of the fall, chance reaches a gap this large about 2 times
      in 100, as the class found, so the note still calls the fall real. The comparison has to run in
      the direction of the claim: count gaps at or below -880 with the gap written this way round, or
      write the real gap the way the shuffles are written.
    wrong:
      a: >-
        The class's number, from a count of gaps at least +880. Written as Q2 less Q1, the gap is -880,
        and the same >= now counts nearly every shuffle.
      b: >-
        Right output, misled call: 0.981 counts the shuffles on the wrong side of the gap, so it says
        nothing about the fall.
      c: >-
        Keeps the class's count and then calls the fall the wobble, which a p of 0.021 under 0.05 does
        not allow.
    answer: >-
      A p-value counts the chance-only worlds at least as extreme as the real gap in the direction of
      the claim, so I write the real gap and the shuffled gaps the same way round; a p near 1 on a gap
      that looked large is the tell that a sign flipped, and the call waits for the recount.

