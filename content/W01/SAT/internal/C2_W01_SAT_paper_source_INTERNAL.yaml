banks:
  sql-clauses:
    style: words
    instruction: >-
      Write the letter of the SQL word that completes each numbered blank in the query above. Each is
      used once at most, and some are not used.
    options: ["ON", "HAVING", "LIMIT", "WHERE", "ORDER BY", "DISTINCT"]
  sql-results:
    style: match
    instruction: >-
      Write the letter of the value each query returns on the eight calls in the exhibit above. Each
