notes:
  1:
    why: >-
      The revenue tree multiplies four branches: customers, orders per customer, items per order and
      price per item, and takes discounts off the product.
    wrong:
      "revenue": >-
        Circular: revenue per item is what is being built, and the leaf the tree needs is the price
        a customer pays for one item.
      "cost": >-
        Cost belongs to the profit tree. Revenue is what customers pay, before anything is spent.
    answer: >-
      Revenue is customers times orders per customer times items per order times price per item,
      less discounts, and I name which leaf moved before I name a cause.
  2:
    why: >-
      A per-customer rate divides by distinct customers. Dividing by rows, where a row is an order,
      gives 1.00 whatever happened.
    wrong:
      "orders": >-
        Orders over orders is always 1, which reads as "nobody comes back" on any export.
      "rows": >-
        A row is an order in Kalpa's export, so this is the same error as orders over orders.
    answer: >-
      Orders per customer is orders over distinct customers, and I count the distinct customers
      before I divide, because rows counted as customers always return 1.00.
  3:
    why: >-
      A Python function with no return statement hands back None; print only writes to the screen.
    wrong:
      "0": >-
        Python has no numeric default. The caller gets None, and the next arithmetic line fails or,
        worse, a segment silently drops out of the comparison.
      "the total": >-
        What print shows on screen is not what the caller receives. Printing and returning are two
        different acts.
    answer: >-
      A function that prints hands back None, so the pipeline's next step gets nothing; a helper
      returns its value and the caller decides what to print.
  4:
    why: >-
      csv.DictReader reads every field as text, so an amount of 4500 arrives as the string '4500'
      until it is converted.
    wrong:
      "int": >-
        The reader does not guess types. Nothing becomes a number until a line of code converts it.
      "float": >-
        The same assumption as int. The conversion is the analyst's job, done once at the read.
    answer: >-
      Everything from a CSV is a string, so I convert each field once, at the read, and send any
      value that fails to the rejects log with its reason.
  5:
    why: >-
      Every input row ends up in exactly one place: the clean file or the rejects log. Input equals
      clean plus rejected, or rows have vanished.
    wrong:
      "duplicate": >-
        Duplicates are one kind of rejected row. The identity must cover every row removed, for any
        reason.
      "missing": >-
        Missing values are a defect that gets a decision, drop, default or flag; they are not the
        third term of the count.
    answer: >-
      A run reconciles when input rows equal clean rows plus rejected rows, and then I check the
      rupees the same way, because counts can close while money does not.
  6:
    why: >-
      The p-value counts the chance-only worlds, the shuffles, that produce a gap at least as large
      or extreme as the one seen.
    wrong:
      "small": >-
        Inverts the tail. The p-value asks how often chance reaches or beats the observed gap.
      "likely": >-
        Turns a share of shuffles into a statement about the hypothesis, which the p-value never
        makes.
    answer: >-
      The p-value is the share of chance-only worlds that show a gap at least as large as mine; it
      measures how surprising the gap is under chance, and nothing more.
  7:
    why: >-
      The note runs claim, evidence, caveat, action. The caveat names what would change the claim,
      which is what lets a stakeholder trust the action.
    wrong:
      "method": >-
        The method sits inside the evidence. A stakeholder needs to know what the finding does not
        cover before being told what to do.
      "recommendation": >-
        That is the action under another name, so the note would lose its caveat.
    answer: >-
      Claim, evidence, caveat, action: the caveat names the condition that would change my claim,
      and it is what keeps me credible when someone pushes.
  8:
    why: >-
      A confounder drives both the treatment and the outcome. Frequent buyers were likelier to get
      the discount and likelier to buy, so the discount's effect is tangled with theirs.
    wrong:
      "outlier": >-
        An outlier is one extreme value. A confounder is a factor sitting behind both who got the
        discount and who bought.
      "bias": >-
        True in spirit but too wide. The item names the specific mechanism, a factor driving both
        sides, and that has a name.
    answer: >-
      Buying frequency is a confounder, because it drives both who got the discount and who bought,
      so I compare like with like inside it before I credit the discount.
  9:
    why: >-
      False. The p-value is computed assuming chance alone and says how rare the gap would be in
      that world; it is not the probability that the finding is wrong.
    wrong:
      "True": >-
        The commonest misreading in the week. It turns "rare under chance" into "3 percent likely to
        be wrong", which the arithmetic never computed.
    answer: >-
      p = 0.03 means a gap this large turns up in about 3 percent of chance-only worlds; it is not a
      3 percent chance I am wrong, and not a 97 percent chance I am right.
  10:
    why: >-
      True. One huge order moves the sum, and so the mean, while the middle value barely shifts.
    wrong:
      "False": >-
        Assumes the median responds like the mean. The median only moves by one position when an
        extreme value arrives.
    answer: >-
      With a skewed order value I report the median as the typical order and the mean beside it,
      because the mean times the order count is revenue.
  11:
    why: >-
      False. In Python 3, comparing a string with an integer raises a TypeError, so the expression
      never evaluates to True or False at all.
    wrong:
      "True": >-
        Assumes Python compares the text as a number. Python 3 refuses to order a str against an
        int, and the fix is converting at the read.
    answer: >-
      Values from a CSV are strings, and Python 3 refuses to compare a string with a number, so I
      convert once at the read and log what fails.
  12:
    why: >-
      True. A difference can be real, clearly beyond chance, and too small to pay for acting on it.
    wrong:
      "False": >-
        Treats significance as importance. Significance says the gap is unlikely under chance; the
        size of the gap and the cost of acting decide whether it matters.
    answer: >-
      Real and worth acting on are two different questions: the shuffle answers the first, and the
      size of the gap against the cost of acting answers the second.
  13:
    why: >-
      True. Each duplicate row carries an amount, so removing it takes that amount out of the
      quarter's revenue.
    wrong:
      "False": >-
        Treats duplicates as harmless copies. A copy of an order is counted twice in revenue until it
        is removed.
    answer: >-
      Duplicates inflate revenue, so removing them changes the quarter's total, and I reconcile
      rupees before and after to show by how much.
  14:
    why: >-
      False. On 12 orders a single order moves the rate by more than 8 points; on 400 it moves it by
      a quarter of a point.
    wrong:
      "True": >-
        Treats a rate as self-sufficient. A rate without its denominator hides how much one order
        can swing it.
    answer: >-
      A rate on 12 orders swings 8 points per order, so I report it with its count and treat it as a
      question to collect more data on, never a finding.
  15:
    why: >-
      False. After is not because of: the season, the customer mix or who received the discount can
      all produce the rise.
    wrong:
      "True": >-
        Reads sequence as cause. Without a like-for-like group that did not get the discount, the
        rise has no comparison.
    answer: >-
      Revenue rising after a discount shows order in time and nothing more; I need a comparable group
      without the discount, in the same window, before I credit it.
  16:
    why: >-
      True. When the mix shifts toward a richer segment, the total can rise while every segment
      inside it falls.
    wrong:
      "False": >-
        Assumes the total is a simple sum of rising parts. The weights move too, and a mix shift can
        reverse the direction.
    answer: >-
      A total can rise while every segment falls, when the mix shifts, so I always split by segment
      before I trust an aggregate.
  17:
    why: >-
      With the customer count flat, customers cannot explain a revenue fall, so that branch is ruled
      out first.
    wrong:
      a: >-
        Orders per customer is exactly the branch that could have moved; ruling it out skips the
        likeliest suspect.
      b: >-
        Items per order has not been measured yet, so nothing rules it out.
      d: >-
        Discounts are a live suspect until the discount field is checked, and a missing discount is
        not zero.
    answer: >-
      I rule out the branch the data says held, customers, and decompose what is left before I name
      any cause.
  18:
    why: >-
      Acquisition spend buys new customers, so it is a bet on the customer branch.
    wrong:
      b: >-
        Frequency is moved by retention and engagement work, not by acquisition.
      c: >-
        Basket size is moved by range, bundles and merchandising.
      d: >-
        Price is a pricing decision, not a marketing acquisition budget.
    answer: >-
      Rs 12 crore for acquisition is a bet on the customer branch, so before agreeing I check
      whether that branch is the one that is short.
  19:
    why: >-
      A mean seven times the median is the signature of a few very large orders pulling the sum up.
    wrong:
      a: >-
        If most orders sat near Rs 9,800 the median would sit there too.
      b: >-
        Blames the arithmetic before reading the shape. The gap is what a skewed order value looks
        like.
      c: >-
        Half the orders sit above the median, Rs 1,400, not above the mean.
    answer: >-
      A mean far above the median means a few large orders pull it up, so I report the median as
      typical and say which orders drive the mean.
  20:
    why: >-
      The first rung is confirming the drop is real: the same definitions, a complete export, and
      not a pipeline artefact.
    wrong:
      b: >-
        Decomposing a drop that may not exist wastes the next four rungs.
      c: >-
        A hypothesis before the facts is the answer interviewers mark down.
      d: >-
        Isolating a segment comes after the tree says which branch moved.
    answer: >-
      First I confirm the drop is real, then compare like with like, decompose, isolate and only
      then hypothesise.
  21:
    why: >-
      Unequal windows make totals unfair; revenue per week, or both quarters cut to the same weeks,
      compares like with like.
    wrong:
      a: >-
        Two missing weeks alone leave Q2 about 15 percent short, whatever the business did.
      b: >-
        An estimate reported as actual is a fabricated figure, even when the average behind it is fair.
      c: >-
        Months carry the same gap: Q2 is two weeks short, so one of its months is short too, and a
        month-against-month comparison carries the unequal window into every line of it.
    answer: >-
      Before comparing quarters I match the windows, weeks, definitions and segments, and then
      compare revenue per week.
  22:
    why: >-
      A function without a return statement hands back None, whatever it printed.
    wrong:
      a: >-
        Python has no numeric default for a missing return.
      b: >-
        Print writes to the screen; it does not return anything to the caller.
      d: >-
        Python allows the assignment and stores None, which is why the bug is silent.
    answer: >-
      A helper that prints hands back None, so the caller silently loses the value; helpers return,
      and the caller prints.
  23:
    why: >-
      The honest repair logs the row with its reason and continues, so the rejects log explains every
      row that left.
    wrong:
      a: >-
        Coercing to zero makes the file look clean while the rupees quietly disappear.
      b: >-
        Editing the source destroys the evidence and the audit trail.
      c: >-
        float('twelve') fails just as int('twelve') does.
    answer: >-
      I catch the failure, write the row and the reason to the rejects log, and continue, so an
      auditor can see every row I removed.
  24:
    why: >-
      Whether two rows are the same order is decided by the identity rule written for an order.
    wrong:
      a: >-
        The file's size says nothing about whether two rows are one order.
      c: >-
        The format is a transport; identity is a business rule.
      d: >-
        Amounts matter to revenue, not to whether two rows are the same order.
    answer: >-
      I write down what makes two records one order, usually the order_id, and apply that rule, not
      a whole-record match.
  25:
    why: >-
      183 plus 14 is 197, so 3 rows are unaccounted for, and the run cannot be trusted until they are
      found.
    wrong:
      b: >-
        Invents a cause for the 14 and ignores the 3 that are missing.
      c: >-
        Reconciliation is an equality, input equals clean plus rejected, not a comparison of two
        sizes.
      d: >-
        Guesses where the 3 went without evidence.
    answer: >-
      200 in, 183 clean and 14 rejected leaves 3 missing, so nothing is reported until I find the
      step that removed them without logging.
  26:
    why: >-
      Shuffles already reach 6 points, so chance makes gaps like 5 easily; the real gap is not
      surprising.
    wrong:
      a: >-
        Shuffled labels break the link, but chance still produces gaps; zero was never the
        expectation.
      b: >-
        Beating most of ten shuffles is not rare; the question is how often chance reaches the gap.
      d: >-
        Shuffling until the answer looks good is fishing, which is how false findings get reported.
    answer: >-
      When the shuffles regularly reach my gap, chance explains it, so I report it as not yet shown
      and say what data would settle it.
  27:
    why: >-
      A rate on 12 orders swings more than 8 points on one order, so the 40 percent is a question,
      not a finding.
    wrong:
      a: >-
        Moves budget on a rate that one order could reverse.
      c: >-
        Dropping the segment throws away a lead that more data could confirm.
      d: >-
        A large rate on a tiny count is exactly the one to distrust.
    answer: >-
      I report the count with the rate: 40 percent on 12 orders is worth watching and collecting
      more on, and not yet worth budget.
  28:
    why: >-
      Profile the export and reconcile counts and revenue against Finance, whose books are the
      reference for money.
    wrong:
      a: >-
        Averaging two figures, one of which is wrong, produces a third wrong figure.
      b: >-
        Assumes the live system is right when the export may carry duplicates.
      c: >-
        Freshness is not correctness.
    answer: >-
      I profile the export for duplicates and windows, then reconcile counts and rupees against
      Finance line by line, and I never adjust my figure until it agrees.
  29:
    why: >-
      Held equal, a 10 percent lift in any multiplicative branch lifts revenue 10 percent, so the
      choice turns on cost.
    wrong:
      a: >-
        New customers add the same 10 percent as any other branch; "new money" is not more money.
      b: >-
        Existing buyers are cheaper to reach, which is a cost argument, not a revenue one.
      d: >-
        A price rise is still a 10 percent lift, and it may cut volume.
    answer: >-
      On a multiplicative tree every branch lifted 10 percent adds the same revenue, so I choose by
      what each lift costs and what the data says has moved.
  30:
    why: >-
      A rate is defined by its numerator, its denominator and the window it covers.
    wrong:
      c: >-
        A previous value is a comparison, made once the rate is defined. The definition is the
        numerator, the denominator and the window, and two rates compare only when all three match.
    answer: >-
      A rate is meaningless until its numerator, denominator and window are named, because each of
      them can change the number.
  31:
    why: >-
      Unequal windows, duplicates in the earlier quarter and a changed segment definition can each
      fake a drop.
    wrong:
      d: >-
        Reporting the median beside the mean is honest practice and cannot fake a drop.
    answer: >-
      Before calling a drop real I check the windows, duplicates and definitions, since each can
      produce a drop that is not there.
  32:
    why: >-
      Drop, default and flag are all valid when the reason is written down.
    wrong:
      d: >-
        Typing a value into the source file fabricates data and destroys the audit trail.
    answer: >-
      For each missing value I drop, fill a stated default or flag, and I write the reason, so the
      decision can be audited and reversed.
  33:
    why: >-
      A profile reports, per field, what is present, what converts to the expected type and how many
      distinct values there are.
    wrong:
      d: >-
        Filling a gap is a decision, taken after the profile with a written reason. The profile only
        reports what is there: present, convertible and distinct.
    answer: >-
      Before cleaning I profile each field for present, convertible and distinct values, because the
      profile tells me what to fix and in what order.
  34:
    why: >-
      A fair test needs a like-for-like control, the same window and a comparable mix of segments.
    wrong:
      d: >-
        A deeper discount changes the treatment; it does not make the test fair.
    answer: >-
      To know whether the discount worked I need a like-for-like group without it, in the same
      window and with the same mix, ideally chosen at random.
  35:
    why: >-
      The p-value assumes chance alone, is small when the gap would be rare under chance, and is
      silent on size.
    wrong:
      c: >-
        The probability that the hypothesis is true is exactly what the p-value does not compute.
    answer: >-
      The p-value assumes chance alone and says how rare my gap would be there; it is not the
      chance I am right, and it says nothing about size.
  36:
    why: >-
      2,160 orders over 1,000 customers is 2.16.
    wrong:
      a: >-
        Revenue per order, Rs 2,000, read as orders per customer: the right figure on the wrong
        branch.
      c: >-
        Q1's figure, 2,400 over 1,000.
      d: >-
        Divides customers by orders, which turns the rate upside down.
    answer: >-
      Orders per customer is orders over distinct customers: 2,160 over 1,000 is 2.16, down from
      2.40.
  37:
    why: >-
      Customers held at 1,000 and revenue per order held at Rs 2,000, so only orders per customer
      moved.
    wrong:
      a: >-
        Customers are 1,000 in both quarters.
      c: >-
        Rs 48.0 lakh over 2,400 and Rs 43.2 lakh over 2,160 are both Rs 2,000.
      d: >-
        Only one branch moved.
    answer: >-
      Decomposing, customers held and revenue per order held, so frequency is the branch that fell.
  38:
    why: >-
      True. Revenue per order is Rs 2,000 in both quarters, so the fall in orders explains the whole
      drop.
    wrong:
      "False": >-
        Assumes a revenue drop must involve basket value; the decomposition says it does not.
    answer: >-
      The whole drop is frequency, because revenue per order is flat, and that is the branch I take
      to Meera.
  39:
    why: >-
      Customers are flat and frequency fell 10 percent, so the data does not support acquisition as
      the fix.
    wrong:
      b: >-
        The customer count did not fall.
      c: >-
        Two quarters are enough to decompose one change.
      d: >-
        Revenue per order did not fall.
    answer: >-
      Customers are flat and frequency fell 10 percent, so I would put the money into the branch
      that moved and ask Marketing what acquisition would cost per rupee of revenue.
  40:
    why: >-
      214 less 14 duplicates less 3 rejects is 197.
    wrong:
      "200": >-
        Removes the 14 and forgets the 3 rejects.
      "211": >-
        Removes the 3 and forgets that duplicates leave the file too.
    answer: >-
      214 in, 14 duplicates and 3 rejects out, 197 clean, and the log explains every one of the 17.
  41:
    why: >-
      Every removed row is logged, duplicates included: 14 plus 3 is 17.
    wrong:
      "3": >-
        Logs only the rows that failed a rule and forgets the duplicates, which is how three rows go
        missing.
      "14": >-
        Logs the duplicates and forgets the rejects.
    answer: >-
      The rejects log holds every removed row, 17 here, so input equals clean plus rejected.
  42:
    why: >-
      Removing Q1's duplicates lowers Q1, so the gap to Q2 shrinks.
    wrong:
      a: >-
        Lowering the earlier quarter can only narrow the fall.
      b: >-
        Duplicates in one quarter do not cancel against anything.
      d: >-
        Whether it becomes a rise depends on the amounts, so "in every case" is false.
    answer: >-
      Duplicates inflate the earlier quarter, so removing them shrinks the drop, and I recompute the
      tree before anyone reads the old figure.
  43:
    why: >-
      A total that rises while every segment falls is a reversal driven by a shift in the mix.
    wrong:
      b: >-
        The numbers are consistent; the reversal is real arithmetic.
      c: >-
        Seasonality does not explain a fall inside every segment.
      d: >-
        The pattern is visible; its size is not the question.
    answer: >-
      A total rising while every segment falls is a mix effect, so I split by segment before I credit
      the campaign.
  44:
    why: >-
      True. Frequency drives both who received the discount and how much they bought.
    wrong:
      "False": >-
        Treats frequency as a side detail when it sits behind both the treatment and the outcome.
    answer: >-
      Frequency confounds the effect, since frequent buyers both got the discount and bought more,
      so I compare within frequency bands.
  45:
    why: >-
      No segment improved and the lift is a mix effect, so repeating the design repeats a campaign
      that did not work.
    wrong:
      a: >-
        Credits the aggregate that the segment split just contradicted.
      b: >-
        More of an ineffective treatment is not a fix.
      c: >-
        The campaign can be evaluated, and here the evaluation says no.
    answer: >-
      I would not repeat it as designed: every segment fell and the lift is a mix effect, so the
      Diwali version should hold out a random control inside each segment.
  46:
    why: >-
      Revenue is price times quantity, so the factors multiply: 1.10 times 0.85 is 0.935, a fall of
      6.5 percent.
    wrong:
      "5 percent fall": >-
        Adds the percentages, 10 minus 15, instead of multiplying the factors.
      "10 percent rise": >-
        Counts the extra quantity and forgets that every unit now sells for 15 percent less.
    answer: >-
      Multiply the factors, 1.10 times 0.85 is 0.935, so revenue falls 6.5 percent and the discount
      loses money unless volume rises more.
  47:
    why: >-
      The middle of five sorted values is Rs 1,400; the sum Rs 485,400 over 5 is Rs 97,080.
    wrong:
      "median Rs 2,000": >-
        Takes the fourth value, or sorts carelessly.
      "mean Rs 1,350": >-
        Drops the large order before averaging, which removes a real sale.
    answer: >-
      The median is Rs 1,400 and the mean Rs 97,080, so I report the median as typical and name the
      one order that drives the mean.
  48:
    why: >-
      (1.9 less 2.1) over 2.1 is a fall of 9.5 percent, measured from the starting quarter.
    wrong:
      "10.5 percent": >-
        Divides by Q2 instead of Q1.
      "0.2 percent": >-
        Reports the crore difference as a percentage.
    answer: >-
      The change is measured from the starting value: 0.2 over 2.1 is a fall of 9.5 percent.
  49:
    why: >-
      140 of 5,000 shuffles reached the gap, so p is 0.028.
    wrong:
      "0.972": >-
        Counts the shuffles that did not reach the gap.
      "2.8": >-
        Writes the percentage where the proportion was asked.
    answer: >-
      140 of 5,000 shuffles is 0.028, so a gap this large turns up in under 3 percent of chance-only
      worlds.
  50:
    why: >-
      50,000 times 2 times 3 times Rs 400 is Rs 12 crore, and Rs 1 crore of discounts leaves Rs 11
      crore.
    wrong:
      "Rs 12 crore": >-
        Forgets the discounts.
      "Rs 1.1 crore": >-
        Slips a factor of ten in the crore conversion.
    answer: >-
      The tree multiplies out to Rs 12 crore, and less Rs 1 crore of discounts it is Rs 11 crore.
  51:
    why: >-
      Confirm the drop is real, compare like with like, decompose, isolate, then hypothesise.
    wrong:
      "e, b, d, a, c": >-
        Decomposes before confirming the drop is real.
      "b, e, a, d, c": >-
        Skips like with like until after isolating, so unequal windows contaminate the decomposition.
    answer: >-
      Real, like with like, decompose, isolate, hypothesise: most people skip the second rung.
  52:
    why: >-
      Profile, decide each defect with a reason, reconcile, then recompute.
    wrong:
      "b, d, c, a": >-
        Recomputes before reconciling, so the new tree may rest on missing rows.
      "d, b, a, c": >-
        Decides fixes before profiling, so the decisions are guesses.
    answer: >-
      Profile, decide, reconcile, recompute: the reconciliation comes before any number leaves.

stretch:
  - text: |
      Marketing concedes that frequency fell but says acquisition is still the cheaper way to add Rs 1 crore of revenue. What would you need to see before agreeing, and how would you say it to Meera in three sentences?
    answer: >-
      I would need the cost of adding Rs 1 crore through each branch: acquisition cost per new
      customer times the customers needed, against the cost of the retention or frequency lever
      that brings back the same revenue, both over the same window and at the same margin. To
      Meera: "Frequency is the branch that moved, so it is where the leak is. Acquisition may still
      be cheaper per rupee, and here is the cost comparison that would show it. Until we have that,
      I would fund a small, measured test of each rather than Rs 12 crore on one."
  - text: |
      A shuffle test on the gap between two segments returns p = 0.03. Meera asks, "So we are 97 percent sure?" Answer in two sentences she can repeat to the board.
    answer: >-
      "No: it means that if there were no real difference, a gap this large would show up by chance
      only about 3 times in 100. It tells us the gap is unlikely to be luck, not how likely we are
      to be right, and not whether the gap is big enough to act on."
  - text: |
      An auditor asks you to walk through the rows your cleaning run removed. Describe the four things you show them, in order.
    answer: >-
      First, the identity rule and the profile that decided what counted as a defect. Second, the
      rejects log, one row per removed record with its reason. Third, the reconciliation on rows
      and on rupees: input equals clean plus rejected in both. Fourth, the tree recomputed on the
      clean data beside the old figure, so the auditor sees what the removals changed and by how
      much.
  - text: |
      You have two hours and a raw export, and Meera wants the Q1 figure by lunch. What do you do first, what do you skip, and what do you refuse to skip?
    answer: >-
      First, profile the fields and check the window and the identity rule, because those decide
      whether any number is honest. Skip polish: charts, formatting and every exploration beyond the
      question asked. Refuse to skip the reconciliation, rows and rupees, because a figure that
      does not reconcile is one Finance will overturn, and that is the step rooms drop under time
      pressure.
