notes:
  50:
    label: Size the revenue tree
    level: Medium
    min: 2.5
    why: >-
      Revenue is customers times orders per customer times items per order times price per item, less
      discounts: 50,000 times 2 times 3 times Rs 400 is Rs 12,00,00,000, Rs 12 crore, and Rs 1 crore of
      discounts leaves Rs 11 crore.
    wrong:
      "Rs 12 crore": >-
        Stops before the discounts, which come off the product of the four branches.
      "Rs 3 crore": >-
        Leaves out items per order, one of the four branches that multiply.
      "Rs 1.1 crore": >-
        Loses a zero between rupees and crore: Rs 12,00,00,000 is Rs 12 crore.
    answer: >-
      Revenue is the four branches multiplied, less discounts: Rs 12 crore before discounts and Rs 11
      crore after, and I say which of the two I am quoting.
  20:
    label: Pick the first rung
    min: 1.5
    why: >-
      The first rung is confirming that the drop is real: that each quarter's figure is complete and
      free of pipeline errors, before any two figures are compared.
    wrong:
      b: >-
        Decomposing a drop that may not exist wastes the next four rungs.
      c: >-
        A hypothesis before the facts is the answer interviewers mark down.
      d: >-
        Isolating a segment comes after the tree says which branch moved.
    answer: >-
      First I confirm the drop is real, then compare like with like, decompose, isolate and only then
      hypothesise.
  35:
    label: Check four p-value statements
    level: Medium
    min: 2.5
    why: >-
      The p-value assumes chance alone, is small when the gap would be rare under chance, and is silent on
      size. It is never the probability that the hypothesis is true, which is the same misreading as a
      3 percent chance of being wrong.
    wrong:
      c: >-
        The probability that the hypothesis is true is exactly what the p-value does not compute.
    answer: >-
      The p-value assumes chance alone and says how rare my gap would be there; it is not the chance I am
      right, and it says nothing about size.
  51:
    label: Order the ladder
    why: >-
      Check each quarter's figure on its own, then set the two checked figures side by side on the same
      weeks and definitions, decompose, isolate, and only then hypothesise; each rung rests on the one
      before it.
    wrong:
      "e, b, d, a, c": >-
        Decomposes before either figure is checked.
      "d, b, e, a, c": >-
        Sets the two quarters side by side before either figure is known to be complete.
    answer: >-
      Checked, like with like, decompose, isolate, hypothesise: most people skip the second rung.
  52:
    label: Order the cleaning pass
    why: >-
      Profile, decide each defect with a reason, reconcile, then recompute and send: a figure that
      leaves before its rows and rupees tie out is one Finance can overturn.
    wrong:
      "b, d, c, a": >-
        Recomputes and sends before reconciling, so the figure may rest on missing rows.
      "d, b, a, c": >-
        Decides fixes before profiling, so the decisions are guesses.
    answer: >-
      Profile, decide, reconcile, recompute: the reconciliation comes before any number leaves.

stretch:
  - text: |
      Revenue per order rose 18 percent between Tuesday's two quarters while orders per customer fell. Meera asks whether the rise is good news. Answer in three sentences she could repeat.
    answer: >-
      "Mostly it is a change in who ordered: Retail-Plus's small orders fell from 51 rows to 26 while
      Business orders, which carry nearly all the revenue, fell only from 20 to 17, so the average order
      grew without anyone paying more. Inside Business, revenue per order rose about 5 percent, which is
      the part worth watching. It is not good news in itself, and I would show revenue per order by
      segment beside it."
  - text: |
      Kavya's test of the Retail-Plus fall swaps each member's own two quarters, where the class's shuffle pooled all the figures and dealt them out again. Why is that the fairer test here? Answer in two sentences.
    answer: >-
      "The same 22 members spent in both quarters, so each member is their own comparison and the only
      question chance can answer is which of their two quarters came first. Pooling all 44 figures would
      set big spenders against small ones at random and add a spread that has nothing to do with the
      fall, which would make a real fall harder to see."
  - text: |
      You have two hours and a raw export, and Meera wants the Q1 figure at the end of them. What do you do first, what do you skip, and what do you refuse to skip?
    answer: >-
      First, profile the fields and check the window and the identity rule, because those decide whether
      any number is honest. Skip polish: charts, formatting and every exploration beyond the question
      asked. Refuse to skip the reconciliation, rows and rupees, because a figure that does not reconcile
      is one Finance will overturn, and it is the step rooms drop under time pressure.
  - text: |
      The head of customer support asks for one number for the support agent's weekly review. Which number do you give, and what goes beside it so that it cannot mislead?
    answer: >-
      The share of conversations the agent resolved without a person, with its denominator (how many
      conversations, over which week) and the share handed to a person beside it, since a rate without
      its base cannot be checked. Beside it go the median cost per conversation and the count of runs
      stopped by the cap on model calls, so a cheaper week that simply refused more customers shows up as
      what it is.
