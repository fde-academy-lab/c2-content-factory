        cannot tell, which is a reason to wait.
      d: >-
        Counts only the worlds with exactly 7, which leaves out the larger rises.
    answer: >-
      Student's rise is 7 orders against 5 from 2 customers, and a coin toss makes a rise that size in
      1,985 of 5,000 worlds, so the honest line is hold and re-read at 30 orders, with the count beside
