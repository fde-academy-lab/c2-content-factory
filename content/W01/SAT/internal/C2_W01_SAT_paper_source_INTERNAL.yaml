# Week 1 Saturday paper: the week's source file, laid on the tracker's bank by
# scripts/build_saturday_paper.py. Block style throughout, since a comma inside an inline mapping
# splits a reason in two without any error.
#
# The bank sets what is tested and this file sets the bar: every bank item prints in a part, is
# folded into a deeper printed item that tests its concept, or moves to the stretch page. Parts 1 to
# 3 continue the week's Kalpa cases; part 4 sets the week's traps in public cases, each checked
# against its source on 30 September 2026; part 5 sets them in an offer and an AI support agent at a
# food-delivery company that is wholly illustrative. A hard item takes three dependent steps on an
# exhibit, such as compute, compare and decide.

parts:
  - title: Where the revenue went
    shows: whether you can read revenue from orders and say what would change a budget call
    intro: >-
      Kalpa Retail sells through its app, its website and its stores. Its revenue is a tree of
      branches multiplied together: customers, orders per customer (how often each customer buys),
      items per order and price per item, less the discounts given; revenue per order, the average
      order value, is items per order times price per item, before discounts. Most orders run between
      Rs 800 and Rs 3,000, while Business orders, from corporate buyers, are few and large: in
      Tuesday's Q1 export, 20 Business rows carried Rs 2.08 crore of the Rs 2.10 crore booked.
      Retail-Plus is Kalpa's paid-membership tier, customers who pay to be members. Marketing wants
      Rs 12 crore to acquire new customers, and Meera Raghavan, the CEO, will not sign until the data
      answers her: "Is acquisition even the branch that is short?"
    exhibits:
      - caption: Kalpa's revenue tree. The branches multiply, and the discounts come off the product.
        mermaid: |
          flowchart LR
            R["Revenue"] --> C["Customers<br/>distinct buyers"]
            R --> F["Orders per customer<br/>orders over customers"]
            R --> I["Items per order<br/>items over orders"]
            R --> P["Price per item<br/>rupees over items"]
            R --> D["Less discounts<br/>rupees given back"]
    items: [47, "new:sales-net", "new:first-order", "new:quarter-counter", 20, "new:budget-flip", 51]
  - title: Which Q1 figure is right
    shows: whether you read an export as an auditor will and close its rows and its rupees
    intro: >-
      Kalpa's dashboard reads an ERP export, a copy of the orders taken out of the company's order
      system, while Finance's books, which Anand Iyer signs, record the revenue Kalpa reports. Anand
      replied to all on Tuesday's finding: "Your dashboard says Q1 was Rs 2.1 crore. Our books say
      1.9." The ERP team adds that Wednesday's export, orders.csv, was stitched from two extracts
      during the Q1 migration, and it holds 201 rows against the 200 in Tuesday's file. A
      reconciliation proves which figure is right: every row of the export ends in the clean file or
      in the rejects log with its reason, so input rows equal clean rows plus rejected rows, and the
      clean rupees tie to the books.
    exhibits:
      - caption: Where the two Q1 figures come from.
        mermaid: |
          flowchart LR
            E1["Extract 1"] --> CSV["orders.csv<br/>201 rows"]
            E2["Extract 2<br/>Q1 migration"] --> CSV
            CSV --> D["Dashboard<br/>Q1 Rs 2.1 crore"]
            B["Finance's books<br/>Q1 Rs 1.9 crore"]
            D -.-|"Rs 20 lakh apart"| B
    items: ["new:reader-header", "new:text-compare", "new:evidence-copy", "new:reject-loop",
            "new:dup-rule", "new:monday-number", "new:plus-clean", 52]
  - title: Real, or the wobble
    shows: whether you can say what a shuffle, a count and a fair test let you tell Meera
    intro: >-
      Meera has set the growth review for Monday and sent three questions. "One: Retail-Plus is
      down, smaller than first reported. Real, or the wobble we see every quarter? Two: Student is up
      40 percent; should I move budget there? Three: Marketing says the monsoon sale lifted revenue 6
      percent and wants to repeat it at Diwali." Her constraint: "One page, two minutes. If the
      honest answer is 'we do not know yet', say so and tell me what would tell us."
    exhibits:
      - caption: >-
          Kavya's test of the Retail-Plus fall. Each of 5,000 shuffles keeps every member's two
          quarters together and tosses a coin for each of the 22 members: heads swaps that member's
          Q1 and Q2 spend. The gap is the members' average Q1 spend less their average Q2 spend,
          rounded to the rupee, so a fall is a positive gap; the real gap is Rs 1,110.
        mermaid: |
          xychart-beta
            title "Retail-Plus: 5,000 shuffled gaps"
            x-axis "Gap per member, Rs" ["-1,110 or less", "-1,109 to -555", "-554 to -1", "0 to 554", "555 to 1,109", "1,110 or more"]
            y-axis "Shuffles" 0 --> 1800
            bar [141, 766, 1526, 1683, 739, 145]
        table:
          head: ["Gap per member, Rs", "Shuffles"]
          rows:
            - ["-1,110 or less", "141"]
            - ["-1,109 to -555", "766"]
            - ["-554 to -1", "1,526"]
            - ["0 to 554", "1,683"]
            - ["555 to 1,109", "739"]
            - ["1,110 or more", "145"]
    items: ["new:plus-real", 35, "new:shuffle-sign", "new:student-line", "new:diwali-test"]
  - title: The same traps, in public
    shows: whether you spot the week's traps in public cases and name the check for each
    intro: >-
      Interviewers at strong AI and data teams like to test a method on a case the candidate has not
      seen. Every case in this part is on the public record, with its source named beside it, and
      every number an item needs is on the page. Read each one the way Kavya Nair reads a draft: what
      the number is, what it was computed on, and which check would have caught it.
    items: ["new:debt-weights", "new:debt-rows", "new:wald-buyers", "new:orbiter-units", "new:flu-fit",
            "new:bing-alert"]
  - title: An offer, an agent and its logs
    shows: whether you can judge an offer's lift and read an agent's code, log and bill
    intro: >-
      Suppose you join the data and AI team of a food-delivery company. The company, its customers,
      its agent, its logs and every number in this part are illustrative. Members pay a monthly fee
      for the company's membership, and everyone else is a regular customer. The support team runs an
      AI agent: for each customer conversation a large language model reads the message, may ask for
      a tool (an order's status, a refund within a limit, a hand-off to a person) and writes the
      reply. Every model call is billed and writes one row to a log table. The head of customer
      support owns two numbers: the cost per conversation, and the share of conversations the agent
      resolves without a person.
    items: ["new:sale-mix", "new:sale-advice", "new:tool-print", "new:agent-history", "new:agent-cost",
            "new:sql-failing", "new:sql-count", "new:sql-avg", "new:sql-rate"]

