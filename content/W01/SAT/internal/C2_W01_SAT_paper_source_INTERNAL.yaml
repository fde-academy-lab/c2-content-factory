  - id: plus-clean
    type: Scenario set
    label: Recompute the finding
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: a
    anchor: Why is a rate without a denominator meaningless?
    text: |-
      SET 4, continued.
      The chart and its table are Tuesday's count of Retail-Plus orders by month, as exported; Q1 is April to June and Q2 is July to September. Tuesday's file held 114 order rows in Q1 and 86 in Q2, and Retail-Plus had the same 22 members in both quarters. Of the 14 copied Q1 rows, 11 were Retail-Plus orders placed in May. On the reconciled file, what happened to Retail-Plus orders per member, and how much of the company's fall in orders does Retail-Plus carry?
      (a) Orders per member fall 35.0 percent, and Retail-Plus carries all 14 of the company's 14 lost orders.
      (b) Orders per member fall 49.0 percent, and Retail-Plus carries all 14 of the company's 14 lost orders.
      (c) Orders per member fall 35.0 percent, and Retail-Plus carries 25 of the company's 28 lost orders.
      (d) Orders per member fall 49.0 percent, and Retail-Plus carries 25 of the company's 28 lost orders.
    why: >-
      As exported, Retail-Plus placed 14 + 24 + 13 = 51 orders in Q1 and 9 + 9 + 8 = 26 in Q2, the
      49.0 percent fall Tuesday reported. May's 24 stands out against 14 and 13 either side, and the
      reconciliation explains it: 11 of those rows were copies. On the reconciled file Q1 holds 40
      Retail-Plus orders, 1.82 a member, against 1.18, a fall of 35.0 percent. The company's orders
      fall from 100, once the 14 copies are out, to 86, a fall of 14, and Retail-Plus falls from 40 to
      26, also 14: the tier carries the whole fall, and the other three segments net to nothing. The
      finding survives smaller, and it points harder at Retail-Plus than Tuesday's did.
    wrong:
      b: >-
        Sets the export's Retail-Plus fall, May's copies still in, beside the reconciled company.
      c: >-
        Reconciles Retail-Plus and leaves the company's copies in: Tuesday's 114 held 14 of them.
      d: >-
        The export as it came on both counts: 51 Retail-Plus orders and 114 in all still hold the
        copies.
    answer: >-
      Tuesday's 49 percent rested on 11 copied May rows; on the reconciled file Retail-Plus orders per
      member fall 35.0 percent, and the tier's 14 lost orders are the company's whole fall, so the
      note reports the smaller rate and the sharper finding together.

