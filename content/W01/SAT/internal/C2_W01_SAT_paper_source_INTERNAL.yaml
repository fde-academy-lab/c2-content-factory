  - id: shuffle-sign
    type: One correct option
    label: Predict the output
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Thu
    key: c
    anchor: What does p = 0.03 mean, and not mean?
    exhibit:
      caption: Thursday's ten cards, the class's shuffle_gaps, and the analyst's rerun.
      code:
        lang: python
        text: |
          def shuffle_gaps(q1, q2, times, seed):       # as in class
              random.seed(seed)
              pool = q1 + q2
              gaps = []
              for _ in range(times):
                  random.shuffle(pool)
                  gaps.append(mean(pool[:len(q1)]) - mean(pool[len(q1):]))
              return gaps

          q1 = [3400, 2900, 4100, 2500, 3800]
          q2 = [2200, 3100, 1900, 2700, 2400]
          real_gap = mean(q2) - mean(q1)               # the fall, Q2 against Q1
          gaps = shuffle_gaps(q1, q2, 1000, seed=2026)
          p = sum(1 for g in gaps if g >= real_gap) / len(gaps)
          print(round(real_gap), p)
    text: |-
      Thursday's ten cards held five Q1 member totals and five Q2 totals, and in class 21 of 1,000 shuffles reached the real gap of Rs 880. An analyst reruns the test with the gap written as Q2 less Q1, the way a fall is usually shown. What does the cell print?
      (a) -880 0.021
      (b) 880 0.021
      (c) -880 0.981
      (d) -880 0.042
    why: >-
      The real gap is now -880, a fall, while each shuffled gap is still pile one less pile two, spread
      evenly on both sides of zero. The count asks how many shuffles are at least -880, which is nearly
      all of them, 981 of 1,000. A p of 0.981 reads as chance making this fall 98 times in 100 and would
      tell Meera the fall is the wobble, when chance reaches a fall this large about 2 times in 100. The
      comparison has to run in the direction of the claim: count gaps at or below -880 with the gap
      written this way round, or write the real gap the way the shuffles are written.
    wrong:
      a: >-
        The class's number, from a count of gaps at least +880. Written as Q2 less Q1, the gap is -880,
        and the same >= now counts nearly every shuffle.
      b: >-
        Keeps the class's sign. mean(q2) less mean(q1) is 2,460 less 3,340, which is -880.
      d: >-
        About twice the class's share, as a count of falls and rises together would give. The code counts
        one side only, and the wrong one.
    answer: >-
      A p-value counts the chance-only worlds at least as extreme as the real gap in the direction of
      the claim, so I write the real gap and the shuffled gaps the same way round; a p near 1 on a gap
      that looked large is the tell that a sign flipped.

  - id: student-line
    type: One correct option
    label: Write the Student line
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Thu
    key: b
    anchor: 42 percent on 12 users against 31 percent on 1,200; which do you trust?
    text: |-
      Student rose from 5 orders in Q1 to 7 in Q2, the 40 percent Meera asked about, on 12 orders from 2 customers. When each of those 12 orders is dealt to Q1 or Q2 by the toss of a coin, a rise of 40 percent or more turns up in 0.397 of 5,000 such worlds. Kavya's rule is no rate on fewer than 30 orders. Which line goes into the one-page note?
      (a) Student is our fastest-growing segment, up 40 percent; move acquisition budget to it now.
      (b) Up 40 percent on 12 orders, a rise chance makes 2 times in 5; hold, re-read at 30 orders.
      (c) Student's 0.397 is far above 0.05, which proves the rise is noise; close the Student offer.
      (d) Student's 12 orders are too few to say anything, so leave Student out of the note entirely.
    why: >-
      A rise of 40 percent on 12 orders turns up by coin toss in about 2 worlds of 5, so the data cannot
      tell a real rise from luck, and Kavya's floor of 30 orders is far off. The line carries the note's
      four parts: the claim with its count, the evidence from the coin tosses, the caveat that makes it
      provisional and the action with its trigger. Fund nothing yet, and drop nothing either.
    wrong:
      a: >-
        The headline rate without its count. One order moves a 12-order rate by more than 8 points.
      c: >-
        Turns "chance explains it easily" into "chance proves it false". A large share says the data
        cannot tell, which is a reason to wait.
      d: >-
        Right that 12 orders cannot carry a rate, wrong to hide it: Meera asked, and the note owes her
        "not yet" with what would change it.
    answer: >-
      Student's 40 percent rests on 12 orders, and coin tosses make a rise that size about 2 times in 5,
      so the honest line is hold and re-read at 30 orders, with the count beside the rate.

  - id: diwali-test
    type: Scenario set
    label: Design the Diwali test
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS, FDE
    day: Thu
    key: c
    anchor: Revenue rose after a discount; did the campaign work, and what would you need to know?
    text: |-
      SET 3, continued.
      Meera agrees to run the Diwali offer as a test. Which design lets the next note say whether the discount itself changes what customers spend?
      (a) Offer it to every customer, and compare this Diwali with last year's Diwali.
      (b) Offer it to Retail-Plus, and compare its members with Retail-Core customers.
      (c) Hold back a random share in each segment, and compare within the segment.
      (d) Let customers opt in on the app, and compare the ones who opt in with the rest.
    why: >-
      Only a random hold-out inside each segment gives two groups alike in everything but the offer:
      the same season, the same mix, and customers who did not choose themselves. Each of the other
      designs compares groups that differ in something besides the discount, a year, a segment or the
      kind of customer who opts in and may have bought anyway.
    wrong:
      a: >-
        Compares two seasons, and everything else that changed in a year, along with the discount.
      b: >-
        Repeats the monsoon mistake: Retail-Plus members spend more in any month, so the two groups
        differ before any offer.
      d: >-
        Customers who opt in were keener to buy already, the confounder Thursday named.
    answer: >-
      To learn what the discount does, I hold back a random slice inside each segment, agree the measure
      and the window before it runs, and compare the two slices; anything else compares groups that
      were already different.

