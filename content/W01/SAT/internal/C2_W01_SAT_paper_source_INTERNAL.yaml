# The Word paper's first page: "What this paper is for", and the Rules table's Company row.
purpose: >-
  This week Meera Raghavan asked whether the Rs 12 crore Marketing wants for acquisition goes to the
  branch of revenue that is actually short, Anand Iyer disputed the Q1 figure the ERP export put on
  the dashboard, and Meera now has to decide what the growth review hears about Retail-Plus, Student
  and the monsoon sale. This paper puts those decisions in front of you again, cold, and then the
  same traps in public cases and in a delivery company's offer and AI agent, where interviewers will
  test them. The room's scores in each part, set beside the ratings you give in step one, decide
  where Monday's revision starts. A wrong answer tells Monday more than a blank one, so answer every
  item.
company: >-
  Parts 1 to 3 are set inside Kalpa Retail, where you work as a trainee engineer in the data and AI
  team of its Global Capability Centre: Meera Raghavan is its CEO, Anand Iyer its finance controller
  and Kavya Nair a senior analyst in its data team, and Marketing and Finance appear by function. Part
  4 draws on public cases, each with its source named beside it, and Part 5 imagines a food-delivery
  company, its offer and its support agent, all illustrative. Every number an item needs is on the
  page.

additions:
  # ---------------------------------------------------------------- Part 1, Kalpa, Monday and Tuesday
  - id: sales-net
    type: One correct option
    label: Predict the output and the call
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Mon
    key: c
    anchor: A business says 'grow revenue 15 percent'; how do you turn that into questions data can answer?
    exhibit:
      caption: >-
        Monday's 29 consumer orders, every order outside the Business segment, by channel and
        status, and the analyst's cell. The int() is there because one amount arrived as the text
        "4500".
      table:
        head: [Channel, Delivered, Returned, Cancelled]
        rows:
          - [app, "10 orders, Rs 18,600", none, none]
          - [web, "5 orders, Rs 12,320", "5 orders, Rs 14,970", none]
          - [store, "5 orders, Rs 9,870", none, "4 orders, Rs 9,050"]
      code:
        lang: python
        text: |
          sales = {"app": 0, "web": 0, "store": 0}
          for o in CONSUMER_ORDERS:                 # the 29 orders in the table
              if o["status"] == "delivered" or "returned":
                  sales[o["channel"]] += int(o["amount"])
          print(sales)
    text: |-
      Every Kalpa order carries a status: delivered (it reached the customer), returned (it came back for a refund) or cancelled (it never left the shelf). Meera will fund one of two asks next quarter, the app team's new checkout or the store team's refit. Her rule is to back the channel whose orders brought in more on Monday, counting every order that was not cancelled. The analyst wrote this cell to settle it. What does it print, and which channel does her rule back?
      (a) {'app': 18600, 'web': 27290, 'store': 18920}; her rule backs the store.
      (b) {'app': 18600, 'web': 27290, 'store': 9870}; her rule backs the app.
      (c) {'app': 18600, 'web': 27290, 'store': 18920}; her rule backs the app.
      (d) {'app': 18600, 'web': 27290, 'store': 9870}; her rule backs the store.
    why: >-
      The test reads as (o["status"] == "delivered") or "returned", and a non-empty string counts as
      true, so every order passes, the cancelled ones included. The store's four cancelled orders,
      Rs 9,050, lift it to Rs 18,920, just above the app's Rs 18,600, and web's figure is right only
      because web had no cancellations. Meera's rule counts the orders that were not cancelled, which
      the table gives: the app's Rs 18,600 against the store's Rs 9,870, so her rule backs the app by
      almost two to one. Taken as printed, the cell would have funded the channel that lost four of
      its nine consumer orders to cancellation: Monday's round 1 trap, reached through a line that
      sounds right read aloud.
    wrong:
      a: >-
        Right output, misled call: the printed Rs 18,920 carries the store's four cancelled orders,
        which Meera's rule leaves out.
      b: >-
        The right call from the table, with the output the analyst meant. The line never compares the
        status with "returned", so every order passes.
      d: >-
        Reads the cell as the analyst meant it and then misapplies the rule: Rs 9,870 is below the
        app's Rs 18,600.
    answer: >-
      An or joins two conditions, never two values, so I write status in ("delivered", "returned");
      and before a figure settles a budget I check it against the counts by status, because here the
      cell would have funded the channel with four cancellations in nine.

  - id: first-order
    type: Applied maths
    label: Price the typical first order
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Mon
    key: Rs 2,060.
    anchor: Mean or median for order value, and why?
    exhibit:
      caption: >-
        Monday's 30 orders by status: 21 delivered, 5 returned and 4 cancelled, each status's
        amounts sorted from the smallest, in rupees.
      table:
        head: [Status, Places, Amounts]
        rows:
          - [delivered, 1 to 7, "400, 860, 940, 1,120, 1,190, 1,440, 1,520"]
          - [delivered, 8 to 14, "1,650, 1,890, 2,020, 2,060, 2,090, 2,110, 2,300"]
          - [delivered, 15 to 21, "2,500, 2,520, 2,780, 2,800, 4,100, 4,500, 4,80,000"]
          - [returned, 1 to 5, "1,240, 2,880, 2,930, 3,830, 4,090"]
          - [cancelled, 1 to 4, "1,450, 2,430, 2,430, 2,740"]
    text: |-
      Marketing's payback model asks how long a typical new customer takes to repay what it cost to win them. The model covers every new customer, business buyers included, and it takes cancellations and returns off at their own rates. For the value of a typical first order it uses Rs 18,160, the mean of Monday's 30 orders. What figure should it use? Give it in rupees.
    why: >-
      Three decisions stand between Rs 18,160 and the answer. The model takes cancellations and
      returns off at their own rates, so the figure it needs is what an order is worth once it
      stands, and the 21 delivered orders are the population; counting the others again, at their
      amounts or at zero, would charge them twice. A typical first order needs the median, since the
      Rs 4,80,000 Business order is 92 percent of the delivered Rs 5,20,790 and lifts their mean to
      Rs 24,800, twelve times a typical order. The model covers business buyers, so that order stays
      in. The median of 21 sorted values is the 11th, Rs 2,060.
    wrong:
      "Rs 18,160": >-
        The mean of all 30, which carries cancelled and refunded orders and sits eight times above a
        typical order because of one sale.
      "Rs 24,800": >-
        The right orders and the wrong statistic: one Business order lifts the delivered mean to twelve
        times the typical order.
      "Rs 2,205": >-
        The median of all 30, which counts orders Kalpa was never paid for or refunded.
      "Rs 2,100": >-
        The median of the 26 orders delivered or returned, which counts refunded orders as standing
        when the model's return rate already takes them off.
      "Rs 1,480": >-
        The median of all 30 with cancelled and returned orders at zero; the model's own rates take
        those off, so they would come off twice.
      "Rs 2,040": >-
        The median once the Business order is deleted, which removes a real sale from a model that
        covers business buyers.
      "Rs 2,090": >-
        The 12th value, one place past the middle of 21.
    answer: >-
      For a typical first order I use the median of the orders that stand, Rs 2,060 on Monday's file,
      and I keep the Rs 4,80,000 order in with a flag, since the model covers business buyers; the
      mean stays for totals, never for the typical order.

  - id: quarter-counter
    type: One correct option
    label: Predict the headline
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Tue
    key: d
    anchor: Sales dropped 15 percent last month; how would you investigate?
    exhibit:
      caption: Tuesday's export, 200 rows, by segment and quarter, and the analyst's cell.
      table:
        head: [Segment, Q1 rows, Q2 rows]
        rows:
          - [Student, "5", "7"]
          - [Retail-Plus, "51", "26"]
          - [Business, "20", "17"]
          - [Retail-Core, "38", "36"]
          - [all, "114", "86"]
      code:
        lang: python
        text: |
          SEGMENTS = ["Student", "Retail-Plus", "Business", "Retail-Core"]
          orders_in = {}
          for q in ["Q1", "Q2"]:
              for seg in SEGMENTS:
                  n = 0
                  for o in ORDERS:
                      if o["quarter"] == q and o["segment"] == seg:
                          n += 1
              orders_in[q] = n
          change = (orders_in["Q2"] / orders_in["Q1"] - 1) * 100
          print(orders_in, f"{change:+.1f}%")
    text: |-
      For Meera's first slide an analyst wants the orders in each quarter of Tuesday's export, and writes this cell. What does it print?
      (a) {'Q1': 114, 'Q2': 86} -24.6%
      (b) {'Q1': 5, 'Q2': 7} +40.0%
      (c) {'Q1': 114, 'Q2': 200} +75.4%
      (d) {'Q1': 38, 'Q2': 36} -5.3%
    why: >-
      The counter n = 0 sits inside the segment loop, so it restarts for every segment, and
      orders_in[q] = n runs once per quarter, after that loop, when n holds only the last segment's
      count. Retail-Core is last, so the slide reads 38 orders then 36, a fall of 5.3 percent, where
      the company's rows fell from 114 to 86, 24.6 percent. Nothing raises an error. Tuesday's first
      rung is the check that catches it: the quarter counts must add back to the 200 rows in the
      file, and 38 plus 36 is 74.
    wrong:
      a: >-
        What the analyst meant. The total needs the counter set once per quarter, before the segment
        loop, or the segment counts kept and summed.
      b: >-
        Reads the first segment's count as the one that sticks. The counter restarts for each segment,
        so the last one, Retail-Core, is what remains.
      c: >-
        The opposite bug: a counter set once, before both loops, would carry Q1's 114 into Q2. Here
        it restarts for every segment.
    answer: >-
      A counter belongs at the level of the thing it counts, so a quarter's total is set once per
      quarter; and before a number reaches a slide I check that the parts add back to the file,
      because 38 and 36 from a 200-row export is the tell.

  - id: budget-flip
    type: One correct option
    label: Find what flips the call
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, FDE
    day: Tue
    key: c
    anchor: Marketing insists the answer is acquisition and your data says frequency; how do you make the case in the room?
    exhibit:
      caption: Marketing's estimates for the next quarter, for each customer.
      table:
        head: [Route, Cost for each customer, Revenue in the next quarter]
        rows:
          - [A new customer won, "Rs 1,200", "Rs 2,400"]
          - [A member brought back to Q1's buying, "Rs 600", "Rs 1,500"]
    text: |-
      Tuesday's decomposition found the customer count flat at 69 in both quarters and orders per customer down from 1.65 to 1.25, so the note proposes bringing Retail-Plus members, who now buy less often, back to buying as often as they did in Q1 before any spend on acquisition. Marketing answers with its own estimates, in the table. Kavya compares the two routes on the revenue each brings in the next quarter for every rupee spent. Which one of these changes, on its own, would make acquisition the better use of the next rupee?
      (a) A new customer's spend in the next quarter rises to Rs 2,800.
      (b) Winning a new customer costs Rs 1,000 through a cheaper channel.
      (c) Bringing a member back costs Rs 800 once the easiest are won.
      (d) A member brought back spends only Rs 1,300 in the next quarter.
    why: >-
      On Marketing's estimates a new customer returns 2,400 over 1,200, Rs 2.00 in the quarter for each
      rupee, and a member brought back returns 1,500 over 600, Rs 2.50, so bringing members back leads.
      Only a dearer route back flips it: at Rs 800 a member returns 1,500 over 800, Rs 1.88, below
      acquisition's Rs 2.00. The tree says a 10 percent lift in any branch adds the same revenue, so
      the choice between branches is this cost comparison, and on these estimates it turns once
      bringing a member back costs more than Rs 750.
    wrong:
      a: >-
        Raises acquisition to 2,800 over 1,200, Rs 2.33 a rupee, still short of the Rs 2.50 a member
        brought back returns.
      b: >-
        Raises acquisition to 2,400 over 1,000, Rs 2.40 a rupee, close and still short of Rs 2.50.
      d: >-
        Cuts the member's return to 1,300 over 600, Rs 2.17 a rupee, still ahead of acquisition's
        Rs 2.00.
    answer: >-
      Frequency is the branch that moved, so bringing members back leads until a rupee there returns
      less than a rupee on acquisition; on these estimates that happens only when it costs more than
      Rs 750 a member, and I would put that number to Marketing.

