      table:
        head: [Q2 orders out of 12, Worlds]
        rows:
          - [4 or fewer, "918"]
          - ["5", "964"]
          - ["6", "1,133"]
          - ["7", "1,034"]
          - ["8", "595"]
          - [9 or more, "356"]
    text: |-
      Student went from 5 orders in Q1 to 7 in Q2, the 40 percent rise Meera asked about, and all 12 orders came from 2 customers. Which line goes into the one-page note?
      (a) Up 40 percent on 12 orders from 2 customers, a rise chance makes in 951 of 5,000 worlds: noise, so Student comes out of the budget talk altogether.
      (b) Up 40 percent on 12 orders from 2 customers, a rise chance makes in 1,985 of 5,000 worlds: a lead, so no budget moves until more customers buy.
      (c) Up 40 percent on 12 orders from 2 customers, a rise chance makes in 1,985 of 5,000 worlds: noise, so Student comes out of the budget talk altogether.
      (d) Up 40 percent on 12 orders from 2 customers, a rise chance makes in 951 of 5,000 worlds: a lead, so no budget moves until more customers buy.
    why: >-
      A rise of 40 percent or more means 7 or more of the 12 orders in Q2, since 7 against 5 is exactly
      40 percent: 1,034 plus 595 plus 356 is 1,985 of 5,000 worlds, a share of 0.397, so chance alone
      makes a rise this size about 2 times in 5. That says the data cannot tell a real rise from luck,
      which is different from showing there is none, so the line moves no budget and names what would
      settle it. Thursday's rule counts observations, and with 2 customers behind all 12 orders the
      observations that matter are the customers: one customer's habits could make the whole rise, so
      more orders from the same two would settle nothing.
    wrong:
      a: >-
        Counts only the worlds with 8 or more Q2 orders, a rise of more than 40 percent, and reads a
        large share as proof that nothing happened.
      c: >-
        Right count, wrong reading: a large share says the data cannot tell, which is a reason to wait,
        never proof that the rise is noise.
      d: >-
        Right call, wrong count: 951 leaves out the worlds with exactly 7, the 40 percent itself.
    answer: >-
      Student's rise is 7 orders against 5 from 2 customers, and a coin toss makes a rise that size in
      1,985 of 5,000 worlds, so the honest line holds the budget, keeps Student as a lead and waits for
      more customers, with the count beside the rate.

  - id: diwali-test
    type: One correct option
    label: Design the Diwali test
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS, FDE
    day: Thu
    key: c
    anchor: Revenue rose after a discount; did the campaign work, and what would you need to know?
    text: |-
      Meera agrees to run the Diwali offer as a test, and Marketing will hold back about one customer in ten from whichever group it picks. Which plan lets the next note say whether the discount itself changed what customers spent?
      (a) Hold back a random tenth of each segment, and compare the two groups' total revenue over the Diwali weeks.
      (b) Offer it to all of Retail-Plus, hold back a random tenth of Retail-Core, and compare spend per customer over the Diwali weeks.
      (c) Hold back a random tenth of each segment, and compare spend per customer in the two groups over the Diwali weeks.
      (d) Offer it to all of Retail-Plus, hold back a random tenth of Retail-Core, and compare total revenue over the Diwali weeks.
    why: >-
      Two things have to hold at once. The groups must differ only by the offer and by chance, which a
      random hold-back inside every segment gives: the same season, the same mix, and customers who did
      not choose themselves. And the measure must carry its denominator: the offer group is about nine
      times the hold-back, so its total revenue is about nine times larger whatever the discount does,
      and only spend per customer compares the two. Thursday's fix for the monsoon sale and Tuesday's
      rule on rates meet in one plan.
    wrong:
      a: >-
        The right groups and the wrong measure: nine customers in ten will outspend one in ten in total
        whatever the offer does.
      b: >-
        The right measure on the wrong groups: Retail-Plus against Retail-Core differs before any offer,
        since members spend more in any month.
      d: >-
        Wrong twice: two segments compared, and totals from groups of very different sizes.
    answer: >-
      To learn what the discount does, I hold back a random slice inside each segment, agree the measure
      per customer and the window before it runs, and compare the two slices; anything else compares
      groups that were already different.

