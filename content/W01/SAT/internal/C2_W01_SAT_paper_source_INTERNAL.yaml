      (c) Rs 1.60 is the typical cost, and the cap would have saved Rs 27.60.
      (d) Rs 7.26 is the typical cost, and the cap would have saved Rs 27.60.
    why: >-
      Typical means the median. Sorted, the seven costs are 1.20, 1.20, 1.20, 1.60, 1.60, 2.00 and 42.00,
      so the typical cost is the fourth, Rs 1.60; the mean, Rs 7.26, is four and a half times a typical
      conversation and swings with every loop. The cap rests on the same choice: the typical
      conversation makes 4 calls, the median of 3, 3, 3, 4, 4, 5 and 105, so the cap is 8. Capped, C-07
      would still have paid for 8 calls, Rs 3.20, so the cap saves Rs 42.00 less Rs 3.20, Rs 38.80. Set
      from the mean, 18.1 calls, the cap would sit at 36 and save only Rs 27.60, a limit the loop itself
      had inflated. C-07 is a real cost and stays in the log.
    wrong:
      a: >-
        Right saving, wrong typical: the mean moves with the one conversation that looped.
      c: >-
        Right typical cost, then a cap set from the mean, 18.1 calls, which the loop itself inflated.
      d: >-
        The mean twice over: a typical cost and a cap that both carry C-07's 105 calls.
    answer: >-
      The typical cost is the median, Rs 1.60, with every run left in the log; a cap on model calls set
      from the median, 8, stops the next loop, and here it would have saved Rs 38.80 of the shift's
      Rs 50.80.

  - id: sql-failing
    type: One correct option
    label: Predict the query's rows
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: a
    anchor: What is the difference between WHERE and HAVING?
    exhibit:
      caption: >-
        The support head asks which tools failed at least 30 times in the week of 21 to 27 September;
        a call failed when its status is anything but ok, and called_on is a date, with no time of
        day. The log's calls by tool, status and week, and the analyst's query. Illustrative.
      table:
        head: [tool, status, 21 to 27 Sep, 14 to 20 Sep]
        rows:
          - [order_status, ok, "410", "388"]
          - [order_status, error, "12", "9"]
          - [order_status, timeout, "22", "6"]
          - [refund, ok, "96", "90"]
          - [refund, error, "35", "40"]
          - [refund, timeout, "3", "2"]
          - [handover, ok, "48", "51"]
          - [handover, error, "9", "11"]
          - [handover, timeout, "18", "25"]
      code:
        lang: sql
        text: |
          SELECT tool, COUNT(*) AS failed_calls
          FROM calls
          WHERE status <> 'ok'
            AND called_on BETWEEN '2026-09-21' AND '2026-09-27'
          GROUP BY tool
          HAVING COUNT(*) >= 30;
    text: |-
      What does the query return?
      (a) Two rows, order_status 34 and refund 38.
      (b) One row, refund 35, and nothing for order_status.
      (c) Three rows, order_status 49, refund 80 and handover 63.
      (d) Three rows, order_status 34, refund 38 and handover 27.
    why: >-
      WHERE keeps single rows before grouping: calls whose status is not ok, errors and timeouts alike,
      in the week of 21 to 27 September. GROUP BY then counts them per tool, 12 plus 22 is 34 for
      order_status, 35 plus 3 is 38 for refund and 9 plus 18 is 27 for handover, and HAVING, which runs
      on the groups, keeps the tools at 30 or more. Handover's 27 falls under the support head's floor,
      and the earlier week's rows never enter.
    wrong:
      b: >-
        Counts only status 'error', so the timeouts, the calls that failed worst, drop out of the
        failures.
      c: >-
        Drops the date filter, so the earlier week's calls join this week's.
      d: >-
        Stops before HAVING, which is what removes the tool under 30.
    answer: >-
      WHERE filters rows before grouping and HAVING filters groups after it, so the failure rule and the
      week go in WHERE and the floor of 30 goes in HAVING; I check a query's failure definition against
      the dashboard's before I trust its count.

  - id: sql-count
    type: Match the following
    bank: sql-results
    label: Match the count
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: "6"
    anchor: How do you handle missing data?
    exhibit:
      caption: >-
        Eight calls from the same log, illustrative. latency_ms is empty, NULL, when a call timed out;
        tool is NULL when the model replied without calling one.
      table:
        head: [call_id, conversation_id, tool, status, latency_ms]
        rows:
          - ["1", CV-1, order_status, ok, "800"]
          - ["2", CV-1, order_status, ok, "1200"]
          - ["3", CV-2, refund, error, "600"]
          - ["4", CV-3, order_status, timeout, "NULL"]
          - ["5", CV-3, refund, ok, "1000"]
          - ["6", CV-4, "NULL", ok, "400"]
          - ["7", CV-5, handover, timeout, "NULL"]
          - ["8", CV-6, order_status, ok, "800"]
    text: |-
      SELECT COUNT(latency_ms) FROM calls;
    why: >-
      COUNT of a column counts the values in it, and the two timed-out calls have none, so it returns 6;
      COUNT(*) would return 8. A dashboard that labels this "calls" undercounts exactly the calls that
      went worst.
    wrong:
      "8": >-
        COUNT(*) counts rows; COUNT(latency_ms) counts values, and two of them are NULL.
    answer: >-
      COUNT(*) counts rows and COUNT(column) counts values, so a NULL-heavy column undercounts quietly; I
      say which one a dashboard shows.

  - id: sql-avg
    type: Match the following
    bank: sql-results
    label: Match the average
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: "800"
    anchor: How do you handle missing data?
    text: |-
      SELECT AVG(latency_ms) FROM calls;
    why: >-
      AVG skips NULL, so it averages the six calls that finished, 4,800 over 6, which is 800. The two
      timeouts, the slowest calls of all, are left out, and the dashboard's latency looks better than any
      customer's wait. Reading NULL as zero gives 600, which is wrong too, since a timeout did not take
      no time.
    wrong:
      "600": >-
        Reads NULL as zero, 4,800 over 8; AVG leaves NULL rows out of both the sum and the count.
    answer: >-
      AVG averages the values present, so the calls that never finished vanish from it; I report the
      timeouts beside the average, never inside it.

  - id: sql-rate
    type: Match the following
    bank: sql-results
    label: Match the rate
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Tue
    key: "0"
    anchor: Why is a rate without a denominator meaningless?
    text: |-
      SELECT COUNT(*) FILTER (WHERE status <> 'ok') / COUNT(*) FROM calls;
    why: >-
      Both counts are integers, and PostgreSQL divides an integer by an integer as integers, so 3 over 8
      returns 0 and the dashboard shows a failure rate of 0 percent. Multiplying by 1.0 first, or casting
      one side, returns 0.375.
    wrong:
      "0.375": >-
        The true share, which needs a decimal division; an integer over an integer drops the fraction.
    answer: >-
      PostgreSQL divides integers as integers, so every rate gets a 1.0 or a cast before the division,
      and I check a rate of exactly 0 against its counts.

