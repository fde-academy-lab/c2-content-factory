# Week 1 Saturday paper: the week's source file, laid on the tracker's bank by
# scripts/build_saturday_paper.py. Block style throughout, since a comma inside an inline mapping
# splits a reason in two without any error.

# The printed order. Bank items by number, the additions by id; every bank item is printed in a
# part or moved to the stretch page, and a scenario set stays whole.
parts:
  - title: The week's rules, cold
    shows: whether the week's definitions and rules are there without a notebook open
    intro: >-
      "Say it to me the way you will say it to her, because I will push the way Marketing will."
      Kavya Nair, the senior analyst, starts with the week's rules, one line each, before any note
      goes to Meera.
    items: [6, 8, 9, 10, 12, 13, 14, 15, 16]
  - title: Where did the revenue go
    shows: whether you can break a revenue fall into its branches and choose the one to open first
    intro: >-
      "Are we losing customers, or are the ones we have buying less?" Meera Raghavan, the CEO, asks
      it with Q2 revenue below Q1 and Marketing asking her for Rs 12 crore to acquire new customers.
    items: [17, 18, 20, 21, 29, 30, 31, 36, 37, 38, 39, 51]
  - title: Rows you can trust
    shows: whether you clean a file with a reason for every change and reconcile it in rows and in rupees
    intro: >-
      "Your dashboard says Q1 was Rs 2.1 crore. Our books say 1.9." Anand Iyer, the finance
      controller, wrote that back to all on Tuesday's finding, and the ERP export behind the
      dashboard is the file on your desk.
    items: [23, 24, 25, 28, 32, 33, 40, 41, 42, 52]
  - title: Read the code, read the data
    shows: whether you catch a wrong number in a line of Python or an export before it reaches a decision
    intro: >-
      "You gave me a number and told me what it counts." Kavya Nair, the senior analyst, now wants
      the code and the export behind each number read line by line, before any of it reaches Meera.
    items: [11, "new:whole-record-dedupe", "new:rows-not-rupees", "new:rows-as-customers",
            "new:average-of-averages", "new:broken-slide", "new:blank-discount", 22,
            "new:helper-summary", "new:first-copy"]
  - title: Chance and a fair test
    shows: whether you can say what a p-value means, when a gap is worth acting on and what a fair test of a cause needs
    intro: >-
      "Real, or the wobble we see every quarter? Should I move budget to Student? Did the discount
      work?" Meera Raghavan, the CEO, wants all three answered before Monday's growth review.
    items: [26, 27, 34, 35, 43, 44, 45]
  - title: The numbers
    shows: whether you can do the week's arithmetic by hand and show the working
    intro: >-
      "Before anything goes to Meera, rebuild the week from a raw export with no assistant and no
      notes." Kavya Nair, the senior analyst, wants the working as well as the answer, on the lines
      under each item.
    items: [19, 46, 47, 48, 49, 50]

