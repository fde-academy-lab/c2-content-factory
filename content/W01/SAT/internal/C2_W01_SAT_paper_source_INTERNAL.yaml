  - id: debt-weights
    type: Scenario set
    label: Predict the output and the weight
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Tue
    key: d
    anchor: Why is a rate without a denominator meaningless?
    exhibit:
      caption: The two averages, computed on the seven countries as the table gives them.
      code:
        lang: python
        text: |
          above_90 = {"Greece": (19, 2.9), "Ireland": (7, 2.4), "Italy": (10, 1.0),
                      "Japan": (11, 0.7), "New Zealand": (1, -7.9),
                      "United Kingdom": (19, 2.4), "United States": (4, -2.0)}
          years = sum(n for n, g in above_90.values())
          by_country = sum(g for n, g in above_90.values()) / len(above_90)
          by_year = sum(n * g for n, g in above_90.values()) / years
          print(years, f"{by_country:.2f}", f"{by_year:.2f}")
    text: |-
      SET 5. SITUATION: In 2010 the economists Carmen Reinhart and Kenneth Rogoff published the average growth of advanced economies in the years their public debt stood above 90 percent of GDP (gross domestic product, the value of everything an economy produces in a year). In 2013 Thomas Herndon, Michael Ash and Robert Pollin rebuilt the figure from the authors' working spreadsheet. The table gives the seven countries in that average as the spreadsheet carried them. It counted one year for New Zealand, 1951, and carried its growth at -7.9 percent where the country's own sheet said -7.6; it left out New Zealand's four earlier years above 90 percent, 1946 to 1949.
      What does the cell print, and how much of the first printed average's weight rests on New Zealand's single year?
      (a) 71 -0.07 1.68; New Zealand's single year carries a seventy-first of that weight.
      (b) 71 1.68 -0.07; New Zealand's single year carries a seventh of that weight.
      (c) 71 1.68 -0.07; New Zealand's single year carries a seventy-first of that weight.
      (d) 71 -0.07 1.68; New Zealand's single year carries a seventh of that weight.
    why: >-
      The first average treats the seven country figures alike, so New Zealand's one counted year at
      -7.9 carries a seventh of the weight, as much as the United Kingdom's nineteen years at 2.4: -0.5
      over 7 is -0.07, which rounds to the -0.1 Reinhart and Rogoff published. The second weights each
      country by its counted years, 119.3 over 71 country-years, which is 1.68, and there New Zealand's
      year carries a seventy-first. Herndon, Ash and Pollin (PERI Working Paper 322, April 2013, Table
      3) give -0.1 for the spreadsheet as it stood and 1.7 once each of the same years counts; Reinhart
      and Rogoff defended equal weights, to keep one country's unusual episode from dominating. Either
      way the week's point stands: an average of averages carries its weights silently, and here the
      choice moves the answer by 1.7 points.
    wrong:
      a: >-
        Right output, wrong weight: a seventy-first is New Zealand's share of the second average, which
        counts years.
      b: >-
        Swaps the two averages; the first printed is the one by country, where one year carries a
        seventh.
      c: >-
        Swaps the two averages and the weights: the first printed average is by country.
    answer: >-
      An average of averages gives every group the same vote whatever its size, so I say which weighting
      I used and show the other beside it; here that moves the answer from about zero to 1.7 percent.

  - id: debt-rows
    type: Scenario set
    label: Choose the check
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS
    day: Wed
    key: d
    anchor: "Input 200, clean 183, rejected 14: does it reconcile, and what is the missing number?"
    text: |-
      SET 5, continued.
      The working spreadsheet held its 20 countries in rows 30 to 49, but the formula for each average covered rows 30 to 44, which left out Australia, Austria, Belgium, Canada and Denmark; the authors accepted the error when it was found. Which check, run before publication, would have caught it?
      (a) Count the countries inside each band's average, and check that every band holds all 20.
      (b) Plot growth against debt for every country, and look for a point that breaks the pattern.
      (c) Recompute each band's average with the same formula on a fresh copy of the sheet.
      (d) Check the rows each average's formula spans against the 20 country rows in the sheet.
    why: >-
      It is Wednesday's reconciliation applied to a formula: set what went in against what should have
      gone in. Twenty country rows in the sheet against a formula spanning fifteen is a gap nobody misses
      once it is checked. Counting the countries inside each average would flag every band, since no
      band held all 20: only ten countries ever sat above 90 percent. None of the other checks looks at
      the rows at all (Herndon, Ash and Pollin, PERI Working Paper 322, April 2013, note 5; Reinhart and
      Rogoff acknowledged the error in April 2013).
    wrong:
      a: >-
        A band holds only the countries whose debt sat in it, and only ten ever sat above 90 percent, so
        this check fails on every band, right or wrong.
      b: >-
        A missing country leaves no point on the chart to break any pattern, so the plot looks as clean
        as the sheet.
      c: >-
        The same formula on a copy spans the same fifteen rows and returns the same figure, so the rerun
        agrees with the error.
    answer: >-
      Before any average leaves me I check the rows it covers against the rows it should cover, the same
      input-equals-output check as a cleaning run, because a formula can drop five countries without an
      error.

  - id: orbiter-units
    type: One correct option
    label: Choose the first move
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, FDE
    day: Wed
    key: b
    anchor: Finance and your dashboard disagree; what do you do?
    text: |-
      NASA's Mars Climate Orbiter was lost on 23 September 1999 as it reached Mars. One team's ground software wrote the thrusters' impulse in pound-force seconds, while the interface specification, and the navigation software that read the file, used newton-seconds, so every firing's effect was understated by a factor of 4.45. Through the spring and summer of 1999, engineers raised concerns about differences between navigation solutions, but only informally. As the spacecraft approached Mars, solutions from Doppler data alone consistently placed it closer to the planet than the other solutions did, and the differences were not resolved (NASA Mishap Investigation Board, 1999). In this week's terms, what should have happened when the solutions disagreed?
      (a) Adopt the solution built on the most tracking data, since more data averages out the noise.
      (b) Treat the disagreement as the finding, and trace its cause before the next manoeuvre.
      (c) Average the solutions, and carry their spread forward as the uncertainty of the approach.
      (d) Plan the approach on the solution farthest from the planet, since it leaves the widest margin.
    why: >-
      Two methods that should agree and do not are a reconciliation waiting to be done, the same move as
      Wednesday's two Q1 figures: neither is right by rank until the gap is explained. Here the gap led
      to the units, a value read across a boundary without its unit, which is why Wednesday converts on
      purpose, once, and names the unit. The board's report says the discrepancies were reported only
      informally and not resolved, and it names inadequate communication between project elements among
      the contributing causes.
    wrong:
      a: >-
        More data carrying the same mismodelled thrust is more of the same error, the dashboard trusted
        over the books because it refreshes daily.
      c: >-
        Averaging a right figure with a wrong one gives a third figure that is wrong, Anand's objection to
        averaging the dashboard with the books.
      d: >-
        The solution that looked safest misled: the craft was lower than planned, as the Doppler-only
        solutions suggested, and the board put its lowest point at 57 km against a planned 226 km.
    answer: >-
      When two figures that should agree do not, the disagreement is the finding: I trace it before
      anyone acts on either, and I check units at every hand-off between teams, because a value can
      parse perfectly and still be in the wrong unit.

  - id: flu-fit
    type: More than one correct
    label: Choose both reasons
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS
    day: Thu
    key: b, e
    anchor: Revenue rose after a discount; did the campaign work, and what would you need to know?
    text: |-
      Google Flu Trends estimated flu activity in the United States from how often people searched for certain terms. Its builders tested 50 million search terms for those whose weekly volume best fit 1,152 data points of the CDC's figures (the Centers for Disease Control and Prevention, which counts doctor visits for flu-like illness), and weeded out terms such as high school basketball that fit well and had nothing to do with flu (Lazer and colleagues, Science, 2014). The paper gives two reasons such a term can fit. Which two does it give? Mark every correct option.
      (a) Basketball games spread flu, since crowds gather indoors through the winter.
      (b) Winter drives both basketball searches and flu visits, so each rises with the season.
      (c) The CDC's figures carried errors that the basketball searches happened to match.
      (d) Search volume measures illness directly, so any term searched in winter measures flu.
      (e) Among 50 million candidate terms, some will fit 1,152 points by chance alone.
    why: >-
      Two things let an unrelated term fit. The season drives both basketball and flu, so the term tracks
      the calendar, a shared cause of the kind Thursday called a confounder; the authors call the first
      version of the model "part flu detector, part winter detector". And with 50 million candidates
      tried against 1,152 points, some will fit by chance alone, the arithmetic of Thursday's twenty
      invented segments, one of which came back small with nothing going on. The model also missed the
      2009 H1N1 pandemic, which did not follow the winter, and from August 2011 it ran high in 100 of
      108 weeks.
    wrong:
      a: >-
        Invents a causal path the data never tested; the paper calls such terms unrelated to the flu.
      c: >-
        The CDC's surveillance figures were the target the model was built to predict, and the paper
        reports the model's errors against them.
      d: >-
        Search volume measures searching, which is why the model drifted when search behaviour changed.
    answer: >-
      A proxy that fits on the season can be a winter detector, and a fit found among millions of tries
      can be chance, so I test a correlation on data it was not chosen on, and against a simple baseline,
      before I trust it.

  - id: bing-alert
    type: One correct option
    label: Answer the alert
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Thu
    key: b
    anchor: How do you know whether a change in a metric is significant?
    text: |-
      In 2012 an idea for changing how Bing displayed the headlines of its search ads had waited more than six months for a slot, until an engineer ran it as an A/B test, a controlled experiment that shows a change to a random share of users and compares them with the rest. Within hours the new version was producing abnormally high revenue, and a "too good to be true" alert fired (Kohavi and Thomke, Harvard Business Review, 2017). You are the analyst on call. What do you do first?
      (a) Ship the change to every user now, since each hour of delay costs revenue.
      (b) Treat the alert as a likely bug, and check the logging and the group split.
      (c) Stop the test and discard it, since a lift that large is almost always a bug.
      (d) Leave the test running for a quarter, until the lift settles near normal results.
    why: >-
      The ladder's first rung applies to good news too: confirm the change is real before acting on it.
      Such alerts usually signal a bug, the article says, so the first checks are the plumbing: revenue
      logged the same way in both groups, users split as planned, nothing broken in either version. In
      Bing's case the alert was no bug: the checks passed, and the analysis showed revenue up 12
      percent, more than 100 million US dollars a year in the United States alone, without hurting key
      user-experience metrics, the best revenue idea in Bing's history.
    wrong:
      a: >-
        Acts on a number nobody has confirmed; if the lift were a logging bug, every user would get the
        bug.
      c: >-
        The reflex that kills the best ideas: the checks are cheap, and here they showed the lift was
        real.
      d: >-
        A quarter's wait checks nothing that a look at the logging and the split would not check within
        the hour.
    answer: >-
      A result that looks too good gets the same first rung as a drop that looks too bad: I confirm the
      logging and the split before I believe it, then size the lift and check the guardrail metrics
      before anyone ships it.

