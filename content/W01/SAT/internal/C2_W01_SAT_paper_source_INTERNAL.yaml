  - id: reader-header
    type: One correct option
    label: Predict the output and the check
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Wed
    key: c
    anchor: Everything read from a CSV is a string; what breaks and where do you convert?
    exhibit:
      caption: A new analyst's read of the export.
      code:
        lang: python
        text: |
          import csv
          with open("orders.csv") as f:
              reader = csv.DictReader(f)
              next(reader)                  # skip the header line
              rows = list(reader)
          print(len(rows), rows[0]["order_id"])
    text: |-
      orders.csv opens on a line that names its columns, and 201 order rows follow it, the first two KR-02001 and KR-02002. The analyst's cleaning pass, the step that sorts every row it is given into clean or rejected, then runs on rows and reports its input as clean rows plus rejected rows. What does the cell print, and which check tells Anand whether every order in the file reached the pass?
      (a) 201 KR-02001; a count of the file's own rows against the pass's input tells him, where the pass's report cannot.
      (b) 200 KR-02002; the pass's own report tells him, since its input must equal clean plus rejected.
      (c) 200 KR-02002; a count of the file's own rows against the pass's input tells him, where the pass's report cannot.
      (d) 201 KR-02001; the pass's own report tells him, since its input must equal clean plus rejected.
    why: >-
      csv.DictReader reads the header line itself, to name the fields, so the first next() hands back
      the first order, KR-02001, and the comment is wrong about what it skips. The list holds the other
      200 rows and starts at KR-02002. The pass counts what it was given, so its report closes on 200
      whatever happens, and the order lost at the read sits in neither the clean file nor the log.
      A count taken from the file, 201 rows, set against the 200 the pass received shows the loss.
    wrong:
      a: >-
        This is what the analyst meant; the reader has already used the header line before next()
        runs, so the call takes a real order with it.
      b: >-
        The output is right, and the pass's report cannot see the loss: a pass accounts only for the
        rows it receives, so a row lost at the read leaves its report closed.
      d: >-
        The call drops the first order, so the cell cannot print 201, and the pass's report closes on
        whatever it was given.
    answer: >-
      A DictReader has already used the header line, so an extra next() silently drops the first order;
      I count the file's rows before I clean anything and set that count against the pass's input,
      because the pass's own report starts from what it received and closes even when the read has
      lost a row.

  - id: text-compare
    type: True or false
    label: Judge the comparison
    level: Medium
    min: 2.5
    tag: "[SV]"
    roles: BA, DS
    day: Mon
    key: d
    anchor: Everything read from a CSV is a string; what breaks and where do you convert?
    text: |-
      Every amount csv.DictReader reads arrives as text, as the amount "4500" on order KR-01008 in the first sample did. Statement: in Python 3, the comparison '4500' < '30000' evaluates to True. True or false, and why?
      (a) True, because Python compares the numbers that the two strings of digits spell.
      (b) True, because a string with fewer characters sorts before a longer one.
      (c) False, because Python 3 refuses to order two strings made of digits.
      (d) False, because text compares character by character, and '4' follows '3'.
    why: >-
      False. Two strings compare character by character from the left, and "4" sorts after "3", so
      '4500' comes after '30000' and the comparison is False. Python raises no error on it, so a sort,
      a max or a filter on unconverted amounts ranks a Rs 4,500 order above a Rs 30,000 one without a
      word. The fix is the week's: convert each amount once, at the read, and log what fails.
    wrong:
      a: >-
        This option reads the text as the numbers it spells, where strings compare character by
        character, so the first characters, 4 and 3, decide it.
      b: >-
        Length never enters a string comparison until one string runs out; '9' sorts after '10000' too.
      c: >-
        Python 3 raises an error only when text is compared with a number, and it compares two strings
        without complaint.
    answer: >-
      Everything from a CSV is text until I convert it, and text sorts as text, so '4500' ranks above
      '30000'; I convert once at the read and log every value that fails.

  - id: evidence-copy
    type: One correct option
    label: Predict the output and the check
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, FDE
    day: Wed
    key: a
    anchor: An auditor asks why you dropped 14 rows; walk them through it.
    exhibit:
      caption: Two rows of the export as the reader hands them over, and the analyst's cell.
      code:
        lang: python
        text: |
          rows = [{"order_id": "KR-02063", "amount": "twelve"},
                  {"order_id": "KR-02064", "amount": "3150"}]
          as_arrived = rows.copy()        # the export as it came, for the auditor
          for r in rows:
              r["amount"] = int(r["amount"]) if r["amount"].isdigit() else 0
          rejects = [a["order_id"] for a in as_arrived if not str(a["amount"]).isdigit()]
          print(len(rows), "+", len(rejects), "=", len(as_arrived), rejects)
    text: |-
      Finance's auditor wants every amount the export sent that was not a number. So before the pass converts the amounts in place, the analyst keeps the export as it came, and afterwards lists the amounts in that copy that are not digits. Anand's books hold both orders at their true values. What does the cell print, and which check would show Anand that the value of order KR-02063 was lost?
      (a) 2 + 0 = 2 []; a rupee total against Anand's books would show it.
      (b) 2 + 1 = 2 ['KR-02063']; a row count against Anand's books would show it.
      (c) 2 + 0 = 2 []; a row count against Anand's books would show it.
      (d) 2 + 1 = 2 ['KR-02063']; a rupee total against Anand's books would show it.
    why: >-
      rows.copy() makes a new list whose two slots point at the same two dictionaries, a shallow copy,
      and the pass rewrites each dictionary's amount in place. By the time the rejects line reads
      as_arrived, KR-02063's amount is the integer 0, whose text is a digit, so the list comes back
      empty and the line prints 2 + 0 = 2 []. The pass has turned an unreadable amount into a Rs 0
      sale, Wednesday's chapter 4 trap, and the shallow copy has erased the evidence the check was
      meant to read, so the rows reconcile by construction. A row count against Anand's books matches
      as well, two orders against two, since the pass kept both orders and changed only an amount. A
      rupee total shows the loss: the clean rows hold Rs 3,150 where Anand's books hold Rs 4,940 for
      the two orders. With copies of the dictionaries, [dict(r) for r in rows], or the file itself, the
      line would print 2 + 1 = 2 and fail on sight.
    wrong:
      b: >-
        This is the line the analyst meant to get, where the shared dictionaries leave the rejects list
        empty, and a row count against the books reads two orders against two.
      c: >-
        The printed line is right, and a row count against the books reads two orders against two,
        since the pass kept both orders and changed only an amount.
      d: >-
        The rupee total is the right check, and the line is the one copies of the dictionaries would
        print; here the copy shares them, so the rejects line reads 0 and finds nothing.
    answer: >-
      A list copy is shallow, so a pass that edits the dictionaries in place edits the evidence too,
      and a check run on that evidence can only agree with the pass; I keep the raw rows as the file
      or as copies of each dictionary, and I reconcile rupees against the books as well as rows.

  - id: reject-loop
    type: More than one correct
    label: Choose every fix
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Wed
    key: b, d
    anchor: "Input 200, clean 183, rejected 14: does it reconcile, and what is the missing number?"
    exhibit:
      caption: Five invented rows laid out as the export's are, and a pass meant to set aside every unreadable amount.
      code:
        lang: python
        text: |
          rows = [("KR-09051", "2400"), ("KR-09052", "twelve"), ("KR-09053", "n/a"),
                  ("KR-09054", "1850"), ("KR-09055", "3100")]
          rejects = []
          for row in rows:
              if not row[1].isdigit():
                  rows.remove(row)
                  rejects.append(row)
          print(len(rows), "+", len(rejects), "=", len(rows) + len(rejects))
    text: |-
      The pass prints 4 + 1 = 5, so its rows reconcile: every row it was given is counted once, as kept or as rejected. Which rewrites set aside every unreadable row and keep every readable one? Mark every correct option.
      (a) Loop over rows as now, but call rejects.append(row) before rows.remove(row).
      (b) Loop over a copy, for row in list(rows):, removing each bad row from rows and adding it to rejects.
      (c) Loop over rows as now, and add continue straight after the call to rows.remove(row).
      (d) Build two new lists: kept from the rows with digit amounts, rejects from the rest.
      (e) Loop over rows as now, and set a bad row's amount to "0" instead of removing it from rows.
    why: >-
      Removing an item from the list a for loop is walking shifts every later item one place left, so
      the loop steps over the row after each removal: KR-09053 follows KR-09052, is never tested, and
      stays among the clean rows. The counts still close, 4 + 1 = 5, because the pass counts whatever
      is left as clean, and a count built that way agrees with its input whatever the pass got wrong.
      Walking a copy, (b), or building new lists, (d), tests every row once.
    wrong:
      a: >-
        Swapping the two lines keeps the removal inside the loop, so the skip happens as before.
      c: >-
        A continue after the removal only ends that turn of the loop, and it also skips
        rejects.append(row), so the pass prints 4 + 0 = 4 with KR-09053 still among the clean rows.
      e: >-
        Setting an amount inside these tuples raises a TypeError, since a tuple cannot be changed, and a
        row rebuilt with "0" keeps the order clean at Rs 0, Wednesday's chapter 4 trap, with nothing in
        the log.
    answer: >-
      I never remove from the list I am looping over; I build the clean list and the rejects list as
      two new lists, and I check that every input row landed in exactly one of them, with a reason
      beside each reject.

  - id: dup-rule
    type: Applied maths
    label: Count each order once
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Wed
    key: Q1 Rs 4,680 and Q2 Rs 7,410.
    anchor: How do you find duplicates, and what makes two records the same?
    exhibit:
      caption: >-
        Seven rows of orders.csv, in the order the file holds them. The five columns not shown match
        within each order_id.
      table:
        head: [Row, order_id, customer_id, order_date, amount, quarter]
        rows:
          - ["1", KR-02006, C-2015, "2026-06-17", "2,890", Q1]
          - ["2", KR-02063, C-3003, "2026-05-14", twelve, Q1]
          - ["3", KR-02150, C-3013, "2026-08-01", "3,700", Q2]
          - ["4", KR-02151, C-3014, "2026-09-25", "3,710", Q2]
          - ["5", KR-02006, C-2015, "2026-06-17", "2,890", Q1]
          - ["6", KR-02063, C-3003, "2026-05-14", "1,790", Q1]
          - ["7", KR-02151, C-3014, "2026-08-02", "3,710", Q2]
    text: |-
      Kalpa's order system gives each order one order_id, and Anand's books hold each order once, at the amount it was booked for. Where two copies of an order differ, the team keeps the copy whose amount reads as a number, and otherwise the first. How much revenue do these seven rows hold for each quarter once each order is counted once? Give Q1 and Q2 in rupees.
    why: >-
      Kalpa's system gives each order one order_id, so one order_id is one order and each of the three
      pairs keeps one row. KR-02006 is an exact repeat. KR-02151 was sent again with a new date, which a
      check on whole rows misses, and both copies carry Rs 3,710. KR-02063's first copy reads "twelve",
      so the team's rule keeps the copy whose amount reads as a number, Rs 1,790, which is Wednesday's
      rule; keeping the first would throw away the order's value while the rows still reconcile. Q1
      is 2,890 plus 1,790, Rs 4,680, and Q2 is 3,700 plus 3,710, Rs 7,410.
    wrong:
      "Q1 Rs 4,680 and Q2 Rs 11,120": >-
        A check on whole rows removes the exact repeat of KR-02006 and keeps both copies of KR-02151.
      "Q1 Rs 2,890 and Q2 Rs 7,410": >-
        Keeping the first copy of KR-02063, which will not convert, sets aside the one that carries the
        value, so the rows reconcile and Q1 is Rs 1,790 short.
      "Q1 Rs 7,570 and Q2 Rs 11,120": >-
        This total sums every readable row, with no rule for duplicates at all.
      "Q2 Rs 3,700": >-
        Sending both copies of KR-02151 to the log loses a real order.
    answer: >-
      I write down what makes two rows one order, the order_id at Kalpa, and which copy stays when they
      differ, the one that validates, then recompute each quarter from the rows the rule keeps; a
      whole-row check misses every re-sent row, and keeping the first copy can lose an order's value
      while the counts still close.

  - id: monday-number
