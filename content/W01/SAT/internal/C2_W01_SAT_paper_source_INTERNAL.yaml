# Week 1 Saturday paper: the week's source file, laid on the tracker's bank by
# scripts/build_saturday_paper.py. Block style throughout, since a comma inside an inline mapping
# splits a reason in two without any error.
#
# The bank sets what is tested and this file sets the bar: every bank item prints in a part, or is
# folded into a deeper printed item that tests its concept. Parts 1 to 3 continue the week's Kalpa
# cases; part 4 sets the week's traps in public cases, each checked against its source on 30
# September 2026; part 5 sets them in an offer and an AI support agent at a food-delivery company
# that is wholly illustrative. A hard item makes the reader combine two ideas on an exhibit, such as
# an idiom and the business call it changes, or a computation and the comparison that sets a call,
# or take several dependent steps that nothing else on the paper takes for them.

parts:
  - title: "Where did Kalpa's revenue go between the first quarter and the second?"
    shows: whether you can read revenue from orders and say what would change a budget call
    intro: >-
      Kalpa Retail sells through its app, its website and its stores to four segments of customers:
      Retail-Core, Student, Business (its corporate buyers) and Retail-Plus, a membership tier whose
      members pay a fee to belong. Revenue here means booked value, which retail calls GMV (gross
      merchandise value): every order at the price charged, before cancellations and returns come
      out. Q1 is April to June and Q2 is July to September, and revenue fell from Q1 to Q2.
      Marketing wants Rs 12 crore to win new customers. Meera needs to know which branch of the
      revenue tree below fell before she signs, since Rs 12 crore spent on a branch that held is
      wasted: "Is acquisition even the branch that is short?" When a sales figure drops, the
      team works through the sales-drop investigation ladder, five checks called rungs that are always
      climbed in the same order.
    exhibits:
      - caption: Kalpa's revenue tree, in which each branch is one of the numbers that make up revenue.
        mermaid: |
          flowchart TB
            R["Revenue"] --> C["Customers<br/>distinct buyers"]
            R --> F["Orders per customer<br/>orders over customers"]
            R --> I["Items per order<br/>items over orders"]
            R --> P["Price per item<br/>rupees before discounts<br/>over items"]
            R --> D["Less discounts<br/>rupees given back"]
    items: [50, "new:sales-net", "new:first-order", "new:quarter-counter", 20, "new:budget-flip", 51]
  - title: "Did Kalpa book Rs 2.1 crore in the first quarter, or Rs 1.9 crore?"
    shows: whether you can check an export the way an auditor would, row by row and rupee by rupee
    intro: >-
      Kalpa's dashboard reads an ERP export: a copy of the orders taken out of the enterprise resource
      planning system that Finance books orders in. Anand signs Finance's books, and both his figure
      and the dashboard's count booked value. Anand replied to all
      on Tuesday's finding: "Your dashboard says Q1 was Rs 2.1 crore. Our books say 1.9. Until your
      numbers match ours, Finance will not act on a drop measured from an ERP export." Meera needs the
      right Q1 as well, since the fall she asked about is measured from it. The ERP team adds that
      Wednesday's export, orders.csv, was stitched together from two extracts and holds 201 rows.
      Profiling a field means counting how many of its values are present, missing and malformed. A
      value that fails a check is a defect, and each defect is dropped, set to a default value or
      flagged for a person to decide.
    exhibits:
      - caption: Where the two Q1 figures come from.
        mermaid: |
          flowchart LR
            E1["Extract 1"] --> CSV["orders.csv<br/>201 rows"]
            E2["Extract 2"] --> CSV
            CSV --> D["Dashboard<br/>Q1 Rs 2.1 crore"]
            B["Finance's books<br/>Q1 Rs 1.9 crore"]
            D -.-|"Rs 20 lakh apart"| B
    items: ["new:reader-header", "new:text-compare", "new:evidence-copy", "new:reject-loop",
            "new:dup-rule", 52, "new:monday-number", "new:plus-clean"]
  - title: "Is the Retail-Plus fall more than chance, and what should Meera's note say?"
    shows: whether you can say what a chance test, a count and a fair comparison let you tell Meera
    intro: >-
      Meera has set the growth review for Monday and sent the team three questions: whether the
      Retail-Plus fall is real or the wobble she sees every quarter, whether to move budget to
      Student, which is up 40 percent, and whether the monsoon sale worked, since Marketing says it
      lifted revenue 6 percent and wants to run it again at Diwali. She wants the answers on "one
      page, two minutes", and the page decides three spends at the review: a retention offer for
      Retail-Plus, budget for Student and a second run of the sale.
    exhibits:
      - caption: >-
          Kavya's test of the Retail-Plus fall, on each member's delivered spend: the rupees of the
          member's delivered orders in the quarter. If the quarter made no difference to what a
          member spent, each member's two figures could have come in either order, so each of 5,000
          flips tosses a coin for each of the 22 members, and heads swaps that member's Q1 and Q2
          spend. The gap is the members' average Q1 spend less their average Q2 spend, rounded to the
          rupee, so a fall is a positive gap; the real gap is Rs 1,110. The test's p-value is the share
          of flips whose gap is at least as extreme as the real one.
        mermaid: |
          xychart-beta
            title "Retail-Plus: 5,000 flipped gaps"
            x-axis "Gap per member, Rs" ["-1,110 or less", "-1,109 to -555", "-554 to -1", "0 to 554", "555 to 1,109", "1,110 or more"]
            y-axis "Flips" 0 --> 1800
            bar [141, 766, 1526, 1683, 739, 145]
        table:
          head: ["Gap per member, Rs", "Flips"]
          rows:
            - ["-1,110 or less", "141"]
            - ["-1,109 to -555", "766"]
            - ["-554 to -1", "1,526"]
            - ["0 to 554", "1,683"]
            - ["555 to 1,109", "739"]
            - ["1,110 or more", "145"]
    items: ["new:plus-real", "new:wald-kalpa", 35, "new:shuffle-sign", "new:student-line",
            "new:diwali-test"]
  - title: "What should a team check before it acts on a surprising number, in four public cases?"
    shows: whether you can spot the week's mistakes in public cases and say what to check first in each
    intro: >-
      Kavya runs a reading group for the team's trainees on Friday afternoons, one public case a week
      in which a surprising number misled capable people or nearly did. She opens every session with
      the same line: "Before a number of yours reaches Meera or Anand, tell me which check it has
      passed." In each of the four cases below, a team had a number in hand and a decision riding on
      it: whether to publish a finding about debt, how to steer a spacecraft, which search terms to
      trust as a flu signal, and whether to ship a change to search ads.
    items: ["new:debt-weights", "new:debt-rows", "new:orbiter-units", "new:flu-fit", "new:bing-alert"]
  - title: "Did a delivery company's offer raise spending, and are its AI agent's numbers right?"
    shows: whether you can judge an offer's lift and read an agent's code, log and bill
    intro: >-
      Suppose you join the data and AI team of a food-delivery company. The company, its customers,
      its agent, its logs and every number in this part are illustrative. Members pay a monthly fee
      for the company's membership, and everyone else is a regular customer. The support team runs an
      AI agent: for each customer conversation a large language model reads the message, may ask for
      a tool (an order's status, a refund within a limit, a hand-off to a person) and writes the
      reply. Every model call is billed and writes one row to a log table. The head of customer
      support owns two numbers, the cost per conversation and the share of conversations the agent
      resolves without a person, and sets the agent's budget and limits by them: "I sign the agent's
      budget on these two numbers, so I need to know they are right." The marketing lead needs to know
      what an offer did before sending it again.
    items: ["new:sale-mix", "new:sale-advice", "new:tool-print", "new:agent-history", "new:agent-cost",
            "new:sql-failing", "new:sql-count", "new:sql-avg", "new:sql-rate"]

