                      "United Kingdom": (19, 2.4), "United States": (4, -2.0)}
          years = sum(n for n, g in above_90.values())
          by_country = sum(g for n, g in above_90.values()) / len(above_90)
          by_year = sum(n * g for n, g in above_90.values()) / years
          print(years, f"{by_country:.2f}", f"{by_year:.2f}")
    text: |-
      SET 5. SITUATION: In 2010 the economists Carmen Reinhart and Kenneth Rogoff reported that advanced economies whose public debt was above 90 percent of GDP (gross domestic product, the value of everything an economy produces in a year) grew at -0.1 percent a year on average. In 2013 Thomas Herndon, Michael Ash and Robert Pollin rebuilt the figure from the authors' working spreadsheet. The table gives the seven countries in that average as the spreadsheet carried them. It counted one year for New Zealand, 1951, and carried its growth at -7.9 percent where the country's own sheet said -7.6; it left out New Zealand's four earlier years above 90 percent, 1946 to 1949.
      What does the cell print, and what explains the gap between its two averages?
      (a) 71 -0.07 1.68: counted by country, one New Zealand year weighs as much as nineteen British years.
      (b) 71 1.68 -0.07: counted by year, New Zealand's one bad year drags the second average below zero.
      (c) 71 -0.07 -0.07: both lines average the same seven growth figures, so the weights change nothing.
      (d) 7 -0.07 1.68: years counts the seven countries, and the second line weights each one by its years.
    why: >-
      The first average treats the seven country figures alike, so New Zealand's one counted year at
      -7.9 weighs as much as the United Kingdom's nineteen years at 2.4: -0.5 over 7 is -0.07, which
      rounds to the -0.1 Reinhart and Rogoff published. The second weights each country by its counted
      years, 119.3 over 71 country-years, which is 1.68. Herndon, Ash and Pollin (2013, Table 3) give
      -0.1 for the spreadsheet as it stood and 1.7 once each of the same years counts; Reinhart and
      Rogoff defended equal weights, to keep one country's unusual episode from dominating. Either way
      the week's point stands: an average of averages carries its weights silently, and here the choice
      moves the answer by 1.7 points.
    wrong:
      b: >-
        Swaps the two: equal weight for each country is what lets one year count as much as nineteen.
      c: >-
        The weights are the whole difference: the same seven figures give -0.07 counted once each and
        1.68 counted once for each year.
      d: >-
        years adds up the years, 71; seven is the number of keys in the dictionary.
    answer: >-
      An average of averages gives every group the same vote whatever its size, so I say which weighting
      I used and show the other beside it; here that moves the answer from about zero to 1.7 percent.

  - id: debt-rows
    type: Scenario set
    label: Choose the check
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS
    day: Wed
    key: d
    anchor: "Input 200, clean 183, rejected 14: does it reconcile, and what is the missing number?"
    text: |-
      SET 5, continued.
      The working spreadsheet held its 20 countries in rows 30 to 49, but the formula for each average covered rows 30 to 44, which left out Australia, Austria, Belgium, Canada and Denmark; the authors accepted the error when it was found. Which check, run before publication, would have caught it?
      (a) Recompute each band's average as a median, which a few missing rows cannot move far.
      (b) Plot growth against debt for every country, and look for a point that breaks the pattern.
      (c) Recompute each band's average with the same formula on a fresh copy of the sheet.
      (d) Check the rows each average's formula spans against the 20 country rows in the sheet.
    why: >-
      It is Wednesday's reconciliation applied to a formula: set what went in against what should have
      gone in. Twenty country rows in the sheet against a formula spanning fifteen is a gap nobody misses
      once it is checked. Counting the countries inside an average would not do, since no band held all
      20: only ten countries ever sat above 90 percent. None of the other checks looks at the rows at
      all (Herndon, Ash and Pollin, 2013, note 5; Reinhart and Rogoff acknowledged the error in April
      2013).
    wrong:
      a: >-
        A median of the wrong rows still summarises the wrong rows; nothing in the statistic shows which
        rows were in it.
      b: >-
        A missing country leaves no point on the chart to break any pattern, so the plot looks as clean
        as the sheet.
      c: >-
        The same formula on a copy spans the same fifteen rows and returns the same figure, so the rerun
        agrees with the error.
    answer: >-
      Before any average leaves me I check the rows it covers against the rows it should cover, the same
      input-equals-output check as a cleaning run, because a formula can drop five countries without an
      error.

  - id: orbiter-units
    type: One correct option
    label: Choose the first move
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, FDE
    day: Wed
    key: b
    anchor: Finance and your dashboard disagree; what do you do?
    text: |-
      NASA's Mars Climate Orbiter was lost on 23 September 1999 as it reached Mars. One team's ground software wrote the thrusters' impulse in pound-force seconds, while the interface specification, and the navigation software that read the file, used newton-seconds, so every firing's effect was understated by a factor of 4.45. Through the spring and summer of 1999, engineers raised concerns about differences between navigation solutions, but only informally. As the spacecraft approached Mars, solutions from Doppler data alone consistently placed it closer to the planet than the other solutions did, and the differences were not resolved (NASA Mishap Investigation Board, 1999). In this week's terms, what should have happened when the solutions disagreed?
      (a) Adopt the solution built on the most tracking data, since more data averages out the noise.
      (b) Treat the disagreement as the finding, and trace its cause before the next manoeuvre.
      (c) Average the solutions, and carry their spread forward as the uncertainty of the approach.
      (d) Plan the approach on the solution farthest from the planet, since it leaves the widest margin.
    why: >-
      Two methods that should agree and do not are a reconciliation waiting to be done, the same move as
      Wednesday's two Q1 figures: neither is right by rank until the gap is explained. Here the gap led
      to the units, a value read across a boundary without its unit, which is why Wednesday converts on
      purpose, once, and names the unit. The board's report says the discrepancies were reported only
      informally and not resolved, and it names inadequate communication between project elements among
      the contributing causes.
    wrong:
      a: >-
        More data carrying the same mismodelled thrust is more of the same error, the dashboard trusted
        over the books because it refreshes daily.
      c: >-
        Averaging a right figure with a wrong one gives a third figure that is wrong, Anand's objection to
        averaging the dashboard with the books.
      d: >-
        The solution that looked safest misled: the craft was lower than planned, as the Doppler-only
        solutions suggested, and the board put its lowest point at 57 km against a planned 226 km.
    answer: >-
      When two figures that should agree do not, the disagreement is the finding: I trace it before
      anyone acts on either, and I check units at every hand-off between teams, because a value can
      parse perfectly and still be in the wrong unit.

  - id: flu-fit
    type: More than one correct
    label: Choose both reasons
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS
    day: Thu
    key: b, e
    anchor: Revenue rose after a discount; did the campaign work, and what would you need to know?
    text: |-
      Google Flu Trends estimated flu activity in the United States from how often people searched for certain terms. Its builders tested 50 million search terms for those whose weekly volume best fit 1,152 data points of the CDC's figures (the Centers for Disease Control and Prevention, which counts doctor visits for flu-like illness), and weeded out terms such as high school basketball that fit well and had nothing to do with flu (Lazer and colleagues, Science, 2014). The paper gives two reasons such a term can fit: one tied to the season, and one that holds for any search through so many terms. Which are they? Mark every correct option.
      (a) Basketball games spread flu, since crowds gather indoors through the winter.
      (b) Winter drives both basketball searches and flu visits, so each rises with the season.
      (c) The CDC's figures carried errors that the basketball searches happened to match.
      (d) Search volume measures illness directly, so any term searched in winter measures flu.
      (e) Among 50 million candidate terms, some will fit 1,152 points by chance alone.
    why: >-
      Two things let an unrelated term fit. The season drives both basketball and flu, so the term tracks
      the calendar, a shared cause of the kind Thursday called a confounder; the authors call the first
      version of the model "part flu detector, part winter detector". And with 50 million candidates
      tried against 1,152 points, some will fit by chance alone, the arithmetic of Thursday's twenty
      invented segments, one of which came back small with nothing going on. The model also missed the
      2009 H1N1 pandemic, which did not follow the winter, and from August 2011 it ran high in 100 of
      108 weeks.
    wrong:
      a: >-
        Invents a causal path the data never tested; the paper calls such terms unrelated to the flu.
      c: >-
        The CDC's surveillance figures were the target the model was built to predict, and the paper
        reports the model's errors against them.
      d: >-
        Search volume measures searching, which is why the model drifted when search behaviour changed.
    answer: >-
      A proxy that fits on the season can be a winter detector, and a fit found among millions of tries
      can be chance, so I test a correlation on data it was not chosen on, and against a simple baseline,
      before I trust it.

  - id: bing-alert
    type: One correct option
    label: Answer the alert
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Thu
    key: b
    anchor: How do you know whether a change in a metric is significant?
    text: |-
      In 2012 an idea for changing how Bing displayed the headlines of its search ads had waited more than six months for a slot, until an engineer ran it as an A/B test, a controlled experiment that shows a change to a random share of users and compares them with the rest. Within hours the new version was producing abnormally high revenue, and a "too good to be true" alert fired (Kohavi and Thomke, Harvard Business Review, 2017). You are the analyst on call. What do you do first?
      (a) Ship the change to every user now, since each hour of delay costs revenue.
      (b) Treat the alert as a likely bug, and check the logging and the group split.
      (c) Stop the test and discard it, since a lift that large is almost always a bug.
      (d) Leave the test running for a quarter, until the lift settles near normal results.
    why: >-
      The ladder's first rung applies to good news too: confirm the change is real before acting on it.
      Such alerts usually signal a bug, the article says, so the first checks are the plumbing: revenue
      logged the same way in both groups, users split as planned, nothing broken in either version. In
      Bing's case the alert was no bug: the checks passed, and the analysis showed revenue up 12
      percent, more than 100 million US dollars a year in the United States alone, without hurting key
      user-experience metrics, the best revenue idea in Bing's history.
    wrong:
      a: >-
        Acts on a number nobody has confirmed; if the lift were a logging bug, every user would get the
        bug.
      c: >-
        The reflex that kills the best ideas: the checks are cheap, and here they showed the lift was
        real.
      d: >-
        A quarter's wait checks nothing that a look at the logging and the split would not check within
        the hour.
    answer: >-
      A result that looks too good gets the same first rung as a drop that looks too bad: I confirm the
      logging and the split before I believe it, then size the lift and check the guardrail metrics
      before anyone ships it.

  - id: wald-buyers
    type: True or false
    label: Judge the fairer figure
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Thu
    key: d
    anchor: How do you handle missing data?
    text: |-
      In the Second World War, Abraham Wald of the Statistical Research Group at Columbia University estimated how vulnerable aircraft were from the damage on the aircraft that came back, reasoning that a hit a returning aircraft carries is a hit an aircraft can survive (Mangel and Samaniego, Journal of the American Statistical Association, 1984). Back at Kalpa, Kavya lays two versions of the Retail-Plus figure side by side. Per member, over all 22 members: Rs 3,279 in Q1 and Rs 2,169 in Q2. Per buyer, over the 20 members who bought in Q1 and the 16 who bought in Q2: Rs 3,607 and Rs 2,982. Statement: the per-buyer figure is the fairer read, since a member who bought nothing has no spend to average. True or false, and why?
      (a) True: per buyer it falls Rs 625, which is the fall among the members who still buy.
      (b) True: per buyer or per member, it falls by about a third of Q1's spend.
      (c) False: per buyer it falls by about half, as fewer buyers share Q2's total.
      (d) False: per buyer it falls a sixth against a third, as 6 members stopped buying.
    why: >-
      Members who stopped buying are the aircraft that did not come back: counting only buyers leaves
      them out of exactly the quarter in which they stopped. Per member the fall is Rs 1,110, 33.9
      percent of Q1's Rs 3,279, about a third; per buyer it is Rs 625, 17.3 percent of Rs 3,607, about a
      sixth, because 6 members who bought in Q1 bought nothing in Q2. Meera's question is whether the
      tier is spending less, and the tier includes the members who went quiet.
    wrong:
      a: >-
        Right fall, wrong question: the members who stopped buying are the finding, as the aircraft that
        did not return carried the answer.
      b: >-
        The two bases differ: 33.9 percent per member against 17.3 percent per buyer.
      c: >-
        Fewer buyers lift the Q2 average rather than lower it; per buyer the fall is 17.3 percent.
    answer: >-
      Before I average I ask who is missing from the denominator; per member all 22 count, so the
      members who stopped buying show up as the fall they are, where the per-buyer figure hides half of
      it.

  # ---------------------------------------------------------------- Part 5, a delivery company, illustrative
  - id: sale-mix
    type: Scenario set
    label: Compute at one mix
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS, FDE
    day: Thu
    key: A fall of 2.5 percent.
    anchor: Revenue rose after a discount; did the campaign work, and what would you need to know?
    text: |-
      SET 6. SITUATION: Last month the company's marketing team sent a 20 percent weekend offer to 500 customers, 250 members and 250 regular customers, and not to the other 1,000, of whom 400 were members and 600 regular. That month the 500 spent Rs 1,025 each and the 1,000 spent Rs 960 each, a lift of 6.8 percent, which is the marketing lead's case for sending the offer again at the festival. The chart and its table split the same customers by tier.
      At the no-offer group's mix of members and regular customers, what would the offer group have spent per customer? Give its change against the no-offer group's Rs 960, as a percentage to one decimal place.
    why: >-
      Members and regular customers each spent less with the offer, Rs 1,470 against Rs 1,500 and Rs 580
      against Rs 600, yet the offer group's blend rose 6.8 percent, because half of it were members
      against four in ten of the rest. Set at the no-offer group's mix, 400 members in 1,000, the offer
      group spends 0.4 times 1,470 plus 0.6 times 580, which is 588 plus 348, Rs 936, a fall of 2.5
      percent against Rs 960: the lift was the mix of who received the offer.
    wrong:
      "A rise of 6.8 percent": >-
        The blend as it came, with half the offer group members against four in ten of the rest.
      "A fall of 2.0 percent": >-
        Members alone, 1,470 against 1,500.
      "A fall of 3.3 percent": >-
        Regular customers alone, 580 against 600.
      "A fall of 2.4 percent": >-
        Sets the no-offer group at the offer group's half-and-half mix, where the item asks for the
        no-offer group's mix.
    answer: >-
      A total can rise while every tier falls when the mix shifts, so I set both groups at one mix before
      I credit an offer; here the offer group at the other group's mix spends 2.5 percent less.

  - id: sale-advice
    type: Scenario set
    label: Advise on the festival
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS, FDE
    day: Thu
    key: c
    anchor: Revenue rose after a discount; did the campaign work, and what would you need to know?
    text: |-
      SET 6, continued.
      The marketing lead wants to send the offer again at the festival, at 25 percent off, to the same kind of list. What do you advise?
      (a) Send it at 25 percent off: the offer group outspent the rest by 6.8 percent, and a deeper cut should widen the lead.
      (b) Do not send it as it ran: each tier spent less with the offer, and at 25 percent off orders must rise by a quarter to hold revenue.
      (c) Do not send it as it ran: each tier spent less with the offer, and at 25 percent off orders must rise by a third to hold revenue.
      (d) Send it to members only: members spend about two and a half times what regular customers do, so the offer pays best there.
    why: >-
      Inside both tiers the offer group spent less, so last month's lift was who received the offer, and
      nothing in the table shows the offer adding spend. A deeper cut asks more: at 25 percent off every
      order brings in 0.75 of its price, so orders must rise by 1 over 0.75, a third, just to hold
      revenue, where a 20 percent cut needed a quarter. The honest advice is not to repeat it as it ran,
      and to test it on a random hold-back inside each tier first.
    wrong:
      a: >-
        Credits the blend the tier split has just contradicted, and deepens the cut the break-even
        punishes.
      b: >-
        Right advice, wrong arithmetic: 25 percent off needs 1 over 0.75, a rise of a third; a quarter
        is the break-even for 20 percent off.
      d: >-
        Confuses how much members spend with what the offer does to it: members with the offer spent
        less than members without it.
    answer: >-
      I would not repeat it as it ran: spend fell inside both tiers, so the lift was the mix, and at 25
      percent off orders must rise by a third just to hold revenue; I would test it on a random
      hold-back inside each tier first.

  - id: tool-print
    type: One correct option
    label: Predict what the model reads
    level: Hard
    min: 4
    tag: "[F]"
    roles: DS, FDE
    day: Tue
    key: b
    anchor: Why does a function that prints instead of returning break a pipeline?
    exhibit:
      caption: One conversation, and the agent's order-status tool as first written. Illustrative.
      mermaid: |
        flowchart LR
          C["Customer asks<br/>about an order"] --> M1["Model call 1<br/>billed"]
          M1 --> T["Tool runs<br/>get_order_status"]
          T --> M2["Model call 2<br/>billed"]
          M2 --> R["Reply to<br/>the customer"]
      code:
        lang: python
        text: |
          ORDER_STATUS = {"1041": "delivered", "1042": "out for delivery"}

          def get_order_status(order_id):
              if order_id in ORDER_STATUS:
                  return ORDER_STATUS[order_id]
              print(f"order {order_id}: not found")

          results = [str(get_order_status(o)) for o in ["1042", "1099", "1041"]]
    text: |-
      The agent sends the model whatever the tool returns, as text. Three customers ask about orders 1042, 1099, a mistyped number, and 1041. What does the model read as the three tool results, and which change fixes it?
      (a) 'out for delivery', 'not found', 'delivered'; nothing, since the tool already reports the missing order.
      (b) 'out for delivery', 'None', 'delivered'; return a "not found" message where the tool now prints one.
      (c) 'out for delivery', 'order 1099: not found', 'delivered'; send the console's last line as the result.
      (d) 'out for delivery', 'None', 'delivered'; wrap the call in try and except so that the error is caught.
    why: >-
      For a known order the function returns the status. For 1099 it prints a line to the console and
      runs off its end, so it hands back None, and str(None) is the text 'None': the model reads 'None'
      and may tell the customer it cannot find anything, or guess. Nothing raises an error, so try and
      except catch nothing; the fix is to return the "not found" message the function now only prints.
      It is Tuesday's print-against-return trap, one layer further from anyone who would notice.
    wrong:
      a: >-
        The printed line goes to the console; the caller receives the return value, which is None.
      c: >-
        Would pass on whatever last reached the console, which is a log, never a result.
      d: >-
        No error is raised: str(None) is the four-letter text 'None', which is why the fault is silent.
    answer: >-
      A tool must return its result, because the agent passes on the return value and never the console;
      I test each tool on what it returns, the unknown cases included, and I log the tool result the
      model actually received.

  - id: agent-history
    type: One correct option
    label: Count the messages
    level: Hard
    min: 4
    tag: "[SV]"
    roles: DS, FDE
    day: Tue
    key: a
    anchor: "A list against a dictionary: when do you reach for each?"
    exhibit:
      caption: The agent's loop as first written, and three customers on one server. Illustrative.
      code:
        lang: python
        text: |
          def run_agent(message, history=[]):
              history.append({"role": "user", "content": message})
              reply = call_model(history)            # sends every message in history
              history.append({"role": "assistant", "content": reply})
              return reply

          run_agent("Where is order 1042?")          # customer A
          run_agent("Please cancel order 2210")      # customer B
          run_agent("Is my refund done?")            # customer C
    text: |-
      Customer C says the agent's reply mentioned somebody else's order. How many messages does C's model call send, and which change gives each conversation only its own messages?
      (a) 5; default history to None, and make a new list inside the function when it is None.
      (b) 1; nothing, since each call starts again from the empty list in the definition.
      (c) 3; keep the default list, and trim it to the last 3 messages on each call.
      (d) 5; move history out to one list at module level that every call to run_agent appends to.
    why: >-
      A default value is built once, when Python defines the function, so every call that uses it
      appends to the same list. A's call sends 1 message and appends the reply; B's sends 3; C's
      appends its question and sends 5, two of them A's and two B's, and the bill grows with every
      conversation the server handles. history=None, with a new list made inside when it is None, gives
      each conversation its own list; in a real agent the list lives under the conversation's id.
    wrong:
      b: >-
        The empty list in the definition is made once, when the function is defined, and never again.
      c: >-
        Counts the three questions and forgets the two replies; trimming keeps other customers' messages
        in the list anyway.
      d: >-
        Right count, wrong fix: a module-level list is the same shared list, written in plain sight.
    answer: >-
      A mutable default is created once and shared by every call, so I default to None and build the list
      inside; in an agent, a conversation's state belongs to that conversation, kept under its id, never
      to the function.

  - id: agent-cost
    type: One correct option
    label: Size the bill
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS, FDE
    day: Mon
    key: d
    anchor: Mean or median for order value, and why?
    exhibit:
      caption: Cost per conversation in one shift. Every model call costs Rs 0.40. Illustrative.
      table:
        head: [Conversation, Model calls, "Cost, Rs"]
        rows:
          - [C-01, "4", "1.60"]
          - [C-02, "3", "1.20"]
          - [C-03, "5", "2.00"]
          - [C-04, "4", "1.60"]
          - [C-05, "3", "1.20"]
          - [C-06, "3", "1.20"]
          - [C-07, "105", "42.00"]
    text: |-
      In C-07 the model kept calling the same tool until a timeout stopped it. The head of support wants the typical conversation's cost on the dashboard, and asks what a cap of 5 model calls per conversation would have saved this shift. Which pair is right?
      (a) Rs 7.26, the mean of all seven; the cap would have saved Rs 40.00.
      (b) Rs 1.40, the median once C-07 is dropped; the cap would have saved Rs 40.00.
      (c) Rs 1.60, the median of all seven; the cap would have saved Rs 42.00.
      (d) Rs 1.60, the median of all seven; the cap would have saved Rs 40.00.
    why: >-
      Sorted, the seven costs are 1.20, 1.20, 1.20, 1.60, 1.60, 2.00 and 42.00, so the median, the
      fourth, is Rs 1.60, and it moves only when typical conversations get dearer; the mean, Rs 7.26, is
      four and a half times a typical conversation and swings with every loop. C-07 is a real cost and
      stays in the log. Capped at 5 calls it would have cost 5 times Rs 0.40, Rs 2.00, so the cap saves
      Rs 42.00 less Rs 2.00, Rs 40.00: Monday's refusal to let one bulk order speak for every order, in
      an agent, with the control that stops the next loop.
    wrong:
      a: >-
        Right saving, wrong typical: the mean moves with the one conversation that looped.
      b: >-
        Drops a real run to reach the typical cost, when the median needs no deletion to resist it.
      c: >-
        Forgets that the capped conversation still pays for its 5 calls, Rs 2.00.
    answer: >-
      The typical cost is the median, Rs 1.60, with every run left in the log; a cap on model calls
      stops the next loop, and here it would have saved Rs 40.00 of the shift's Rs 50.80.

  - id: sql-failing
    type: One correct option
    label: Predict the query's rows
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: a
    anchor: What is the difference between WHERE and HAVING?
    exhibit:
      caption: >-
        The support head asks which tools failed at least 30 times in the week of 21 to 27 September;
        a call failed when its status is anything but ok. The log's calls by tool, status and week, and
        the analyst's query. Illustrative.
      table:
        head: [tool, status, 21 to 27 Sep, 14 to 20 Sep]
        rows:
          - [order_status, ok, "410", "388"]
          - [order_status, error, "12", "9"]
          - [order_status, timeout, "22", "6"]
          - [refund, ok, "96", "90"]
          - [refund, error, "35", "40"]
          - [refund, timeout, "3", "2"]
          - [handover, error, "9", "11"]
          - [handover, timeout, "18", "25"]
      code:
        lang: sql
        text: |
          SELECT tool, COUNT(*) AS failed_calls
          FROM calls
          WHERE status <> 'ok'
            AND called_on BETWEEN '2026-09-21' AND '2026-09-27'
          GROUP BY tool
          HAVING COUNT(*) >= 30;
    text: |-
      What does the query return?
      (a) Two rows, order_status 34 and refund 38.
      (b) One row, refund 35, and nothing for order_status.
      (c) Three rows, order_status 49, refund 80 and handover 63.
      (d) Three rows, order_status 34, refund 38 and handover 27.
    why: >-
      WHERE keeps single rows before grouping: calls whose status is not ok, errors and timeouts alike,
      in the week of 21 to 27 September. GROUP BY then counts them per tool, 12 plus 22 is 34 for
      order_status, 35 plus 3 is 38 for refund and 9 plus 18 is 27 for handover, and HAVING, which runs
      on the groups, keeps the tools at 30 or more. Handover's 27 falls under Kavya's floor, and the
      earlier week's rows never enter.
    wrong:
      b: >-
        Counts only status 'error', so the timeouts, the calls that failed worst, drop out of the
        failures.
      c: >-
        Drops the date filter, so the earlier week's calls join this week's.
      d: >-
        Stops before HAVING, which is what removes the tool under 30.
    answer: >-
      WHERE filters rows before grouping and HAVING filters groups after it, so the failure rule and the
      week go in WHERE and the floor of 30 goes in HAVING; I check a query's failure definition against
      the dashboard's before I trust its count.

  - id: sql-count
    type: Match the following
    bank: sql-results
    label: Match the count
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: "6"
    anchor: How do you handle missing data?
    exhibit:
      caption: >-
        Eight calls from the same log, illustrative. latency_ms is empty, NULL, when a call timed out;
        tool is NULL when the model replied without calling one.
      table:
        head: [call_id, conversation_id, tool, status, latency_ms]
        rows:
          - ["1", CV-1, order_status, ok, "800"]
          - ["2", CV-1, order_status, ok, "1200"]
          - ["3", CV-2, refund, error, "600"]
          - ["4", CV-3, order_status, timeout, "NULL"]
          - ["5", CV-3, refund, ok, "1000"]
          - ["6", CV-4, "NULL", ok, "400"]
          - ["7", CV-5, handover, timeout, "NULL"]
          - ["8", CV-6, order_status, ok, "800"]
    text: |-
      SELECT COUNT(latency_ms) FROM calls;
    why: >-
      COUNT of a column counts the values in it, and the two timed-out calls have none, so it returns 6;
      COUNT(*) would return 8. A dashboard that labels this "calls" undercounts exactly the calls that
      went worst.
    wrong:
      "8": >-
        COUNT(*) counts rows; COUNT(latency_ms) counts values, and two of them are NULL.
    answer: >-
      COUNT(*) counts rows and COUNT(column) counts values, so a NULL-heavy column undercounts quietly; I
      say which one a dashboard shows.

  - id: sql-avg
    type: Match the following
    bank: sql-results
    label: Match the average
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: "800"
    anchor: How do you handle missing data?
    text: |-
      SELECT AVG(latency_ms) FROM calls;
    why: >-
      AVG skips NULL, so it averages the six calls that finished, 4,800 over 6, which is 800. The two
      timeouts, the slowest calls of all, are left out, and the dashboard's latency looks better than any
      customer's wait. Reading NULL as zero gives 600, which is wrong too, since a timeout did not take
      no time.
    wrong:
      "600": >-
        Reads NULL as zero, 4,800 over 8; AVG leaves NULL rows out of both the sum and the count.
    answer: >-
      AVG averages the values present, so the calls that never finished vanish from it; I report the
      timeouts beside the average, never inside it.

  - id: sql-rate
    type: Match the following
    bank: sql-results
    label: Match the rate
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Tue
    key: "0"
    anchor: Why is a rate without a denominator meaningless?
    text: |-
      SELECT COUNT(*) FILTER (WHERE status <> 'ok') / COUNT(*) FROM calls;
    why: >-
      Both counts are integers, and PostgreSQL divides an integer by an integer as integers, so 3 over 8
      returns 0 and the dashboard shows a failure rate of 0 percent. Multiplying by 1.0 first, or casting
      one side, returns 0.375.
    wrong:
      "0.375": >-
        The true share, which needs a decimal division; an integer over an integer drops the fraction.
    answer: >-
      PostgreSQL divides integers as integers, so every rate gets a 1.0 or a cast before the division,
      and I check a rate of exactly 0 against its counts.

