# The Word paper's first page: "What this paper is for", and the Rules table's Company row.
purpose: >-
  This week Meera Raghavan asked whether the Rs 12 crore Marketing wants for acquisition goes to the
  branch of revenue that is actually short, Anand Iyer disputed the Q1 figure the ERP export put on
  the dashboard, and Meera now has to decide what the growth review hears about Retail-Plus, Student
  and the monsoon sale. This paper puts those decisions in front of you again, cold, and then the
  same traps in public cases and in a delivery company's offer and AI agent, where interviewers will
  test them. The room's scores in each part, set beside the ratings you give in step one, decide
  where Monday's revision starts. A wrong answer tells Monday more than a blank one, so answer every
  item.
company: >-
  Parts 1 to 3 are set inside Kalpa Retail, where you work as a trainee engineer in the data and AI
  team of its Global Capability Centre: Meera Raghavan is its CEO, Anand Iyer its finance controller
  and Kavya Nair a senior analyst in its data team, and Marketing and Finance appear by function. Part
  4 draws on public cases, each with its source named beside it, and Part 5 imagines a food-delivery
  company, its offer and its support agent, all illustrative. Every number an item needs is on the
  page.

additions:
  # ---------------------------------------------------------------- Part 1, Kalpa, Monday and Tuesday
  - id: sales-net
    type: One correct option
    label: Predict the output
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Mon
    key: b
    anchor: A business says 'grow revenue 15 percent'; how do you turn that into questions data can answer?
    exhibit:
      caption: >-
        Monday's 30 orders by status, and the analyst's cell. The int() is there because one amount
        arrived as the text "4500".
      table:
        head: [Status, Orders, Rupees]
        rows:
          - [delivered, "21", "5,20,790"]
          - [returned, "5", "14,970"]
          - [cancelled, "4", "9,050"]
      code:
        lang: python
        text: |
          sales, n = 0, 0
          for o in ORDERS:
              if o["status"] == "delivered" or "returned":
                  sales += int(o["amount"])
                  n += 1
          print(n, "orders, Rs", sales)
    text: |-
      Every Kalpa order carries a status: delivered (it reached the customer), returned (it came back for a refund) or cancelled (it never left the shelf). Meera's first reading of sales counts every order that left the shelf, delivered or returned, and leaves out the cancelled ones; refunds get a line of their own in her note. The analyst ran this cell on Monday's 30 orders to give her that figure. What does it print, and how does it compare with the figure Meera asked for?
      (a) 26 orders, Rs 535760, which is Meera's figure exactly.
      (b) 30 orders, Rs 544810, which is Rs 9,050 above Meera's figure.
      (c) 21 orders, Rs 520790, which is Rs 14,970 below Meera's figure.
      (d) 30 orders, Rs 544810, which is Rs 14,970 above Meera's figure.
    why: >-
      The test reads as (o["status"] == "delivered") or "returned", and a non-empty string counts as
      true, so every order passes, cancellations included. The cell counts all 30 orders and sums
      every row of the status table: 5,20,790 plus 14,970 plus 9,050 is Rs 5,44,810. Meera's figure,
      delivered and returned, is 26 orders and Rs 5,35,760, so the cell overstates it by the Rs 9,050
      of cancelled orders: Monday's round 1 trap, reached through a line that sounds right read aloud.
    wrong:
      a: >-
        What the analyst meant, and what status in ("delivered", "returned") prints. The line as
        written never compares the status with "returned" at all.
      c: >-
        Reads the or "returned" as dead code, so that only delivered orders pass. Python evaluates the
        whole or, and its right side, a non-empty string, is true on its own.
      d: >-
        Gets the printed line right and the gap wrong: the orders Meera leaves out are the cancelled
        ones, Rs 9,050, and the returned ones sit inside her figure.
    answer: >-
      An or joins two conditions, never two values, so I write status in ("delivered", "returned"),
      and before any total goes to Meera I check it against the status counts: 26 orders and
      Rs 5,35,760 on her definition.

  - id: first-order
    type: Applied maths
    label: Price the first order
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Mon
    key: Rs 2,060.
    anchor: Mean or median for order value, and why?
    exhibit:
      caption: >-
        Monday's 30 orders by status: 21 delivered, 5 returned and 4 cancelled, each status's
        amounts sorted from the smallest, in rupees.
      table:
        head: [Status, Places, Amounts]
        rows:
          - [delivered, 1 to 7, "400, 860, 940, 1,120, 1,190, 1,440, 1,520"]
          - [delivered, 8 to 14, "1,650, 1,890, 2,020, 2,060, 2,090, 2,110, 2,300"]
          - [delivered, 15 to 21, "2,500, 2,520, 2,780, 2,800, 4,100, 4,500, 4,80,000"]
          - [returned, 1 to 5, "1,240, 2,880, 2,930, 3,830, 4,090"]
          - [cancelled, 1 to 4, "1,450, 2,430, 2,430, 2,740"]
    text: |-
      Marketing's payback model needs what a new customer's first order is typically worth to Kalpa, and it uses Rs 18,160, the mean of Monday's 30 orders. A cancelled order is never charged and a returned one is refunded, so only a delivered order stays paid for; Finance's books hold every delivered order, the Rs 4,80,000 Business order the room found by sorting among them. What figure goes back to Marketing? Give it in rupees.
    why: >-
      Three decisions stand between Rs 18,160 and the answer. Only delivered orders stay paid for, so
      the 21 delivered orders are the population. One of them, the Rs 4,80,000 Business order, is 92
      percent of their Rs 5,20,790 and lifts their mean to Rs 24,800, twelve times a typical order, so
      a typical first order needs the median. The median of 21 sorted values is the 11th, Rs 2,060,
      with the Business order kept in the file, as Finance's books keep it.
    wrong:
      "Rs 18,160": >-
        The mean of all 30, which carries cancelled and refunded orders and sits eight times above a
        typical order because of one sale.
      "Rs 24,800": >-
        The right orders and the wrong statistic: one Business order lifts the delivered mean to twelve
        times the typical order.
      "Rs 2,205": >-
        The median of all 30, which counts orders Kalpa was never paid for or refunded.
      "Rs 2,100": >-
        The median of the 26 orders delivered or returned, which counts refunded orders as paid.
      "Rs 2,040": >-
        The median once the Business order is deleted, which removes a real sale that Finance's books
        hold.
      "Rs 2,090": >-
        The 12th value, one place past the middle of 21.
    answer: >-
      For a typical first order I use the median of the orders that stay paid for, Rs 2,060 on
      Monday's file, and I keep the Rs 4,80,000 order in with a flag, since it is real; the mean stays
      for totals, never for the typical order.

  - id: quarter-counter
    type: One correct option
    label: Predict the headline
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Tue
    key: d
    anchor: Sales dropped 15 percent last month; how would you investigate?
    exhibit:
      caption: Tuesday's export, 200 rows, by segment and quarter, and the analyst's cell.
      table:
        head: [Segment, Q1 rows, Q2 rows]
        rows:
          - [Retail-Core, "38", "36"]
          - [Retail-Plus, "51", "26"]
          - [Business, "20", "17"]
          - [Student, "5", "7"]
          - [all, "114", "86"]
      code:
        lang: python
        text: |
          SEGMENTS = ["Retail-Core", "Retail-Plus", "Business", "Student"]
          orders_in = {}
          for q in ["Q1", "Q2"]:
              for seg in SEGMENTS:
                  n = 0
                  for o in ORDERS:
                      if o["quarter"] == q and o["segment"] == seg:
                          n += 1
              orders_in[q] = n
          change = (orders_in["Q2"] / orders_in["Q1"] - 1) * 100
          print(orders_in, f"{change:+.1f}%")
    text: |-
      For Meera's first slide an analyst wants the orders in each quarter of Tuesday's export, and writes this cell. What does it print?
      (a) {'Q1': 114, 'Q2': 86} -24.6%
      (b) {'Q1': 38, 'Q2': 36} -5.3%
      (c) {'Q1': 51, 'Q2': 26} -49.0%
      (d) {'Q1': 5, 'Q2': 7} +40.0%
    why: >-
      The counter n = 0 sits inside the segment loop, so it restarts for every segment, and
      orders_in[q] = n runs once per quarter, after that loop, when n holds only the last segment's
      count. Student is last, so the slide reads 5 orders then 7, a rise of 40.0 percent, where the
      company's rows fell from 114 to 86. Nothing raises an error. Tuesday's first rung is the check
      that catches it: the quarter counts must add back to the 200 rows in the file, and 5 plus 7 is
      12.
    wrong:
      a: >-
        What the analyst meant. The total needs the counter set once per quarter, before the segment
        loop, or the segment counts kept and summed.
      b: >-
        Reads the first segment's count as the one that sticks. The counter restarts for each segment,
        so the last one, Student, is what remains.
      c: >-
        Picks the segment that moved most. The loop's order decides which count survives, and
        Retail-Plus is second of four.
    answer: >-
      A counter belongs at the level of the thing it counts, so a quarter's total is set once per
      quarter; and before a number reaches a slide I check that the parts add back to the file, because
      5 and 7 from a 200-row export is the tell.

  - id: budget-flip
    type: One correct option
    label: Find what flips the call
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, FDE
    day: Tue
    key: c
    anchor: Marketing insists the answer is acquisition and your data says frequency; how do you make the case in the room?
    exhibit:
      caption: Marketing's estimates for the next quarter, for each customer won.
      table:
        head: [Route, Cost to win one, Revenue in the next quarter]
        rows:
          - [A new customer, "Rs 1,200", "Rs 2,400"]
          - [A lapsed member won back, "Rs 600", "Rs 1,500"]
    text: |-
      Tuesday's decomposition found the same 69 customers in both quarters and orders per customer down from 1.65 to 1.25, so the note proposes winning lapsed Retail-Plus members back before any spend on acquisition. Marketing answers with its own estimates, in the table. Kavya compares the two routes on the revenue each brings in the next quarter for every rupee spent. Which one of these changes, on its own, would make acquisition the better use of the next rupee?
      (a) A new customer's orders in the next quarter rise to Rs 2,800.
      (b) Winning a new customer costs Rs 1,000 through a cheaper channel.
      (c) Winning back a member costs Rs 800 once the easiest are won.
      (d) A member won back brings only Rs 1,300 in the next quarter.
    why: >-
      On Marketing's estimates a new customer returns 2,400 over 1,200, Rs 2.00 in the quarter for each
      rupee, and a member won back returns 1,500 over 600, Rs 2.50, so winning back leads. Only a
      dearer win-back flips it: at Rs 800 a member returns 1,500 over 800, Rs 1.88, below acquisition's
      Rs 2.00. The tree says a 10 percent lift in any branch adds the same revenue, so the choice
      between branches is this cost comparison, and on these estimates it turns once a win-back costs
      more than Rs 750.
    wrong:
      a: >-
        Raises acquisition to 2,800 over 1,200, Rs 2.33 a rupee, still short of the Rs 2.50 a won-back
        member returns.
      b: >-
        Raises acquisition to 2,400 over 1,000, Rs 2.40 a rupee, close and still short of Rs 2.50.
      d: >-
        Cuts the win-back to 1,300 over 600, Rs 2.17 a rupee, still ahead of acquisition's Rs 2.00.
    answer: >-
      Frequency is the branch that moved, so winning members back leads until a rupee there returns
      less than a rupee on acquisition; on these estimates that happens only when a win-back costs more
      than Rs 750, and I would put that number to Marketing.

