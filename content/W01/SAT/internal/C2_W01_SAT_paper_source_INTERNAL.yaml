notes:
  11:
    label: Predict the comparison
    min: 2.5
    why: >-
      False. Two strings compare character by character from the left, and "4" sorts after "3", so '4500'
      comes after '30000' and the comparison is False. Nothing raises an error, so a sort, a max or a
      filter on unconverted amounts ranks a Rs 4,500 order above a Rs 30,000 one without a word. The
      tracker's own version, '4500' > 3000, raises a TypeError instead, because Python 3 will not order
      text against a number. Either way the fix is the week's: convert each amount once, at the read, and
      log what fails.
    wrong:
      "True": >-
        Reads the text as the numbers it spells. Strings compare letter by letter, so the first
        characters, 4 and 3, decide it.
    answer: >-
      Everything from a CSV is text until I convert it, and text sorts as text, so '4500' ranks above
      '30000'; I convert once at the read and log every value that fails.
  20:
    label: Pick the first rung
    min: 1.5
    why: >-
      The first rung is confirming that the drop is real: the same definitions, matched windows, a
      complete export and no pipeline artefact.
    wrong:
      b: >-
        Decomposing a drop that may not exist wastes the next four rungs.
      c: >-
        A hypothesis before the facts is the answer interviewers mark down.
      d: >-
        Isolating a segment comes after the tree says which branch moved.
    answer: >-
      First I confirm the drop is real, then compare like with like, decompose, isolate and only then
      hypothesise.
  24:
    label: Decide what a duplicate is
    min: 2.5
    why: >-
      Whether two rows are one order is decided by the identity rule written for an order, and for
      Kalpa's orders that rule is the order_id. The two copies of KR-02151 differ in their dates, so a
      check that compares whole rows finds nothing, which is Wednesday's round 2 trap: a re-sent
      record carries a fresh date, and only the identity rule sees it as the same order.
    wrong:
      a: >-
        The whole-row rule, which is the trap: any field that changes on a re-send, such as a date,
        hides the repeat, and the check reports none.
      c: >-
        Choosing which date to keep comes after deciding the rows are one order, and it cannot decide it.
      d: >-
        The two amounts are equal here, and even differing amounts can be one order entered twice with
        a correction; the rule decides, and the amounts are evidence.
    answer: >-
      I write down what makes two records one order, the order_id for Kalpa, and key the duplicate check
      on it, because a whole-row check misses every repeat whose date or line changed.
  35:
    label: Check four p-value statements
    min: 4
    why: >-
      The p-value assumes chance alone, is small when the gap would be rare under chance, and is silent on
      size. It is never the probability that the hypothesis is true, which is the same misreading as a
      3 percent chance of being wrong.
    wrong:
      c: >-
        The probability that the hypothesis is true is exactly what the p-value does not compute.
    answer: >-
      The p-value assumes chance alone and says how rare my gap would be there; it is not the chance I am
      right, and it says nothing about size.
  43:
    label: Name the pattern
    min: 4
    why: >-
      Inside each segment the sale group spent 3.0 percent less, Rs 4,850 against Rs 5,000 and Rs 1,940
      against Rs 2,000, yet the blend rose 6.1 percent, because half the sale group were Retail-Plus
      members, who spend more in any month, against two in five of the rest. The total moved on the mix of
      customers, the reversal Thursday named.
    wrong:
      b: >-
        The arithmetic is right: 30 customers at Rs 4,850 and 30 at Rs 1,940 average Rs 3,395.
      c: >-
        A monsoon effect would move both groups alike; here the gap reverses inside each segment.
      d: >-
        The pattern is plain on 160 customers; the question is what it means, and the split answers it.
    answer: >-
      A total can rise while every segment falls when the mix shifts, so I split by segment before I
      credit the campaign; here the sale group was simply richer in Retail-Plus members.
  45:
    label: Advise on Diwali
    min: 4
    why: >-
      Inside both segments the sale group spent 3.0 percent less, and at the other group's mix the sale
      customers would have averaged Rs 3,104 against Rs 3,200. The 6.1 percent is who received the sale,
      so repeating it as designed repeats a campaign that has shown no gain; at 15 percent off, volume
      would have to rise 17.6 percent just to hold revenue.
    wrong:
      a: >-
        Credits the blend that the segment split has just contradicted.
      b: >-
        More of a discount that has shown no gain is not a fix.
      c: >-
        The campaign can be evaluated, and the split evaluates it: no gain inside either segment.
    answer: >-
      I would not repeat it as designed: spend fell inside both segments and the lift is a mix effect, so
      Diwali should hold back a random slice inside each segment and measure the difference.
  46:
    label: Size the discount's effect
    why: >-
      Revenue is price times quantity, so the factors multiply: 1.10 times 0.85 is 0.935, a fall of 6.5
      percent. The same tree says a 15 percent discount needs 17.6 percent more volume just to hold
      revenue, since 1 over 0.85 is 1.176.
    wrong:
      "5 percent fall": >-
        Adds the percentages, 10 less 15, instead of multiplying the factors.
      "10 percent rise": >-
        Counts the extra quantity and forgets that every unit now sells for 15 percent less.
    answer: >-
      Multiply the factors, 1.10 times 0.85 is 0.935, so revenue falls 6.5 percent, and the discount loses
      money unless volume rises more than 17.6 percent.
  47:
    label: Compute median and mean
    min: 1.5
    why: >-
      The middle of five sorted values is Rs 1,400; the sum, Rs 4,85,400, over 5 is Rs 97,080.
    wrong:
      "median Rs 2,000": >-
        Takes the fourth value, or sorts carelessly.
      "mean Rs 1,350": >-
        Drops the large order before averaging, which removes a real sale.
    answer: >-
      The median is Rs 1,400 and the mean Rs 97,080, so I report the median as typical and name the one
      order that drives the mean.
  51:
    label: Order the ladder
    why: >-
      Confirm the drop is real, compare like with like, decompose, isolate, then hypothesise.
    wrong:
      "e, b, d, a, c": >-
        Decomposes before confirming the drop is real.
      "b, e, a, d, c": >-
        Skips like with like until after isolating, so unequal windows contaminate the decomposition.
    answer: >-
      Real, like with like, decompose, isolate, hypothesise: most people skip the second rung.
  52:
    label: Order the cleaning pass
    why: >-
      Profile, decide each defect with a reason, reconcile, then recompute.
    wrong:
      "b, d, c, a": >-
        Recomputes before reconciling, so the new tree may rest on missing rows.
      "d, b, a, c": >-
        Decides fixes before profiling, so the decisions are guesses.
    answer: >-
      Profile, decide, reconcile, recompute: the reconciliation comes before any number leaves.

stretch:
  - text: |
      Marketing concedes that frequency fell but says acquisition is still the cheaper way to add Rs 1 crore of revenue. What would you need to see before agreeing, and how would you say it to Meera in three sentences?
    answer: >-
      I would need the cost of adding Rs 1 crore through each branch: acquisition cost per new customer
      times the customers needed, against the cost of the offer that brings back the same revenue from
      existing customers, both over the same window and at the same margin. To Meera: "Frequency is the
      branch that moved, so it is where the leak is. Acquisition may still be cheaper per rupee, and here
      is the cost comparison that would show it. Until we have that, I would fund a small, measured test
      of each rather than Rs 12 crore on one."
  - text: |
      A shuffle test on the gap between two segments returns p = 0.03. Meera asks, "So we are 97 percent sure?" Answer in two sentences she can repeat to the board.
    answer: >-
      "No: if there were no real difference, a gap this large would show up by chance only about 3 times
      in 100. It tells us the gap is unlikely to be luck, not how likely we are to be right, and not
      whether the gap is big enough to act on."
  - text: |
      You have two hours and a raw export, and Meera wants the Q1 figure at the end of them. What do you do first, what do you skip, and what do you refuse to skip?
    answer: >-
      First, profile the fields and check the window and the identity rule, because those decide whether
      any number is honest. Skip polish: charts, formatting and every exploration beyond the question
      asked. Refuse to skip the reconciliation, rows and rupees, because a figure that does not reconcile
      is one Finance will overturn, and it is the step rooms drop under time pressure.
  - text: |
      The head of customer support asks for one number for the support agent's weekly review. Which number do you give, and what goes beside it so that it cannot mislead?
    answer: >-
      The share of conversations the agent resolved without a person, with its denominator (how many
      conversations, over which week) and the share handed to a person beside it, since a rate without
      its base cannot be checked. Beside it go the median cost per conversation and the count of runs
      stopped by the cap on model calls, so a cheaper week that simply refused more customers shows up as
      what it is.
