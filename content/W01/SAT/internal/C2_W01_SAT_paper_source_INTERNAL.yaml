# The Word paper's first page: "What this paper is for", and the Rules table's Company row.
purpose: >-
  This week Meera Raghavan asked whether the Rs 12 crore Marketing wants for acquisition goes to the
  branch of revenue that is actually short, Anand Iyer disputed the Q1 figure the ERP export put on
  the dashboard, and Meera now has to decide whether the monsoon discount runs again at Diwali. This
  paper puts those decisions in front of you again, cold, and then the same traps in public cases and
  in an AI agent's logs, where interviewers will test them. The room's scores in each part, set beside
  the ratings you give in step one, decide where Monday's revision starts. A wrong answer tells Monday
  more than a blank one, so answer every item.
company: >-
  Parts 1 to 3 are set inside Kalpa Retail, where you work as a trainee engineer in the data and AI
  team of its Global Capability Centre: Meera Raghavan is its CEO, Anand Iyer its finance controller
  and Kavya Nair a senior analyst in its data team, and Marketing and Finance appear by function. Part
  4 draws on public cases, each with its source named beside it, and Part 5 imagines the support
  agent of a food-delivery company such as Swiggy, with illustrative numbers. Every number an item
  needs is on the page.

additions:
  # ---------------------------------------------------------------- Part 1, Kalpa, Monday and Tuesday
  - id: sales-net
    type: One correct option
    label: Predict the output
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Mon
    key: c
    anchor: A business says 'grow revenue 15 percent'; how do you turn that into questions data can answer?
    exhibit:
      caption: >-
        Monday's 30 orders by status, and the analyst's cell. The int() is there because one amount
        arrived as the text "4500".
      table:
        head: [Status, Orders, Rupees]
        rows:
          - [delivered, "21", "5,20,790"]
          - [returned, "5", "14,970"]
          - [cancelled, "4", "9,050"]
          - [all, "30", "5,44,810"]
      code:
        lang: python
        text: |
          sales, n = 0, 0
          for o in ORDERS:
              if o["status"] == "delivered" or "returned":
                  sales += int(o["amount"])
                  n += 1
          print(n, "orders, Rs", sales)
    text: |-
      Every Kalpa order carries a status: delivered (it reached the customer), returned (it came back for a refund) or cancelled (it never left the shelf). Meera asked for sales net of cancellations, and the analyst ran this cell on Monday's 30 orders. What does it print?
      (a) 26 orders, Rs 535760
      (b) 21 orders, Rs 520790
      (c) 30 orders, Rs 544810
      (d) 5 orders, Rs 14970
    why: >-
      The test reads as (o["status"] == "delivered") or "returned", and a non-empty string counts as
      true, so every order passes, cancellations included. The cell counts all 30 orders and prints the
      booked total, Rs 5,44,810: Monday's round 1 trap, reached through a line that sounds right read
      aloud. The status table is the check that catches it, since sales net of cancellations must land
      on 26 orders and Rs 5,35,760.
    wrong:
      a: >-
        What the analyst meant, and what status in ("delivered", "returned") prints. The line as
        written never compares the status with "returned" at all.
      b: >-
        Reads the or "returned" as dead code. Python evaluates the whole or, and its right side, a
        non-empty string, is true on its own.
      d: >-
        Reads the last condition as the only one that counts. An or is true when either side is, and
        here the right side always is.
    answer: >-
      An or joins two conditions, never two values, so I write status in ("delivered", "returned"),
      and before any total goes to Meera I check it against the status counts: 26 orders and
      Rs 5,35,760 net of cancellations.

  - id: payback-typical
    type: One correct option
    label: Price the first order
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Mon
    key: b
    anchor: Mean or median for order value, and why?
    text: |-
      Marketing's payback model asks what a new customer's first order is worth, and it uses Rs 18,160, the mean of Monday's 30 orders. The median of the same orders is Rs 2,205, and one Business order of Rs 4,80,000, which the room found by sorting, is 88 percent of the Rs 5,44,810 booked. What goes back to Marketing?
      (a) Keep Rs 18,160, since the mean times the 30 orders gives back the booked revenue exactly.
      (b) Use the median, about Rs 2,205, and keep the Rs 4,80,000 order in the file with a flag.
      (c) Delete the Rs 4,80,000 order from the file as an error, and use the mean of the other 29.
      (d) Use the mean of the 21 delivered orders, Rs 24,800, since only those became sales.
    why: >-
      One order carries 88 percent of the rupees, so the mean is about eight times the typical order,
      and 29 of the 30 orders sit below it. The median, Rs 2,205, is what a typical first order is
      worth. The Business order stays in the file with a flag, because it is a real sale that Finance's
      books hold. Priced at the mean, each first order looks eight times as valuable as it is, so the
      model would promise the Rs 12 crore back on about an eighth of the orders it would really take.
    wrong:
      a: >-
        True of the total and wrong for the question. Mean times count rebuilds revenue, which is why
        the mean stays in the tree, but a payback model asks what one typical order is worth.
      c: >-
        The mean of the other 29, Rs 2,235, is close to the median, but deleting a real Rs 4,80,000 sale
        breaks the reconciliation with Finance's books; Wednesday kept the genuine bulk order and
        flagged it.
      d: >-
        Fixes the definition and keeps the statistic that failed. The delivered mean still carries the
        Business order and rises to Rs 24,800, further from a typical order than before.
    answer: >-
      For a typical first order I report the median, about Rs 2,205, and keep the Rs 4,80,000 order in
      the file with a flag, because it is real revenue; the mean stays for totals, since mean times
      count is revenue.

  - id: quarter-counter
    type: One correct option
    label: Predict the headline
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Tue
    key: d
    anchor: Sales dropped 15 percent last month; how would you investigate?
    exhibit:
      caption: Tuesday's 200 orders by segment and quarter, and the analyst's cell.
      table:
        head: [Segment, Q1 orders, Q2 orders]
        rows:
          - [Retail-Core, "38", "36"]
          - [Retail-Plus, "51", "26"]
          - [Business, "20", "17"]
          - [Student, "5", "7"]
          - [all, "114", "86"]
      code:
        lang: python
        text: |
          SEGMENTS = ["Retail-Core", "Retail-Plus", "Business", "Student"]
          orders_in = {}
          for q in ["Q1", "Q2"]:
              for seg in SEGMENTS:
                  n = 0
                  for o in ORDERS:
                      if o["quarter"] == q and o["segment"] == seg:
                          n += 1
              orders_in[q] = n
          change = (orders_in["Q2"] / orders_in["Q1"] - 1) * 100
          print(orders_in, f"{change:+.1f}%")
    text: |-
      For Meera's first slide an analyst wants the orders placed in each quarter of Tuesday's export, and writes this cell. What does it print?
      (a) {'Q1': 114, 'Q2': 86} -24.6%
      (b) {'Q1': 38, 'Q2': 36} -5.3%
      (c) {'Q1': 51, 'Q2': 26} -49.0%
      (d) {'Q1': 5, 'Q2': 7} +40.0%
    why: >-
      The counter n = 0 sits inside the segment loop, so it restarts for every segment, and
      orders_in[q] = n runs once per quarter, after that loop, when n holds only the last segment's
      count. Student is last, so the slide reads 5 orders then 7, a rise of 40.0 percent, where the
      company's orders fell from 114 to 86. Nothing raises an error. Tuesday's first rung is the check
      that catches it: the quarter counts must add back to the 200 orders in the file, and 5 plus 7 is
      12.
    wrong:
      a: >-
        What the analyst meant. The total needs the counter set once per quarter, before the segment
        loop, or the segment counts kept and summed.
      b: >-
        Reads the first segment's count as the one that sticks. The counter restarts for each segment,
        so the last one, Student, is what remains.
      c: >-
        Picks the segment that moved most. The loop's order decides which count survives, and
        Retail-Plus is second of four.
    answer: >-
      A counter belongs at the level of the thing it counts, so a quarter's total is set once per
      quarter; and before a number reaches a slide I check that the parts add back to the file, because
      5 and 7 from a 200-order export is the tell.

  - id: budget-fact
    type: One correct option
    label: Name what would change the call
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, FDE
    day: Tue
    key: d
    anchor: Marketing insists the answer is acquisition and your data says frequency; how do you make the case in the room?
    text: |-
      Tuesday's decomposition goes to Meera: the same 69 customers bought in both quarters, orders per customer fell from 1.65 to 1.25, and revenue per order rose 18 percent, mostly because the smaller Retail-Plus orders fell away. The note says frequency, how often customers come back, is the branch that moved, and proposes spending on bringing customers back before any acquisition. Which fact, if it turned up, would make acquisition the better use of Marketing's Rs 12 crore?
      (a) Marketing's campaigns reach more people per rupee than they did in the same quarter last year.
      (b) The fall in orders per customer sits almost entirely in Retail-Plus, the paid-membership tier.
      (c) Customers who still buy spend 18 percent more per order, so each one who returns is worth more.
      (d) A rupee spent winning new customers buys more revenue than a rupee spent bringing them back.
    why: >-
      The tree multiplies, so a 10 percent lift in any branch adds the same 10 percent of revenue, and
      the choice between branches turns on what each costs to move. Customers held at 69, so
      acquisition cannot explain the fall, and frequency is where the note rightly leads; acquisition
      becomes the better spend only if a rupee there buys more revenue than a rupee spent bringing
      customers back.
    wrong:
      a: >-
        Reach is not revenue. More people seen per rupee says nothing about the revenue each rupee
        brings back against the retention alternative.
      b: >-
        Already in the finding, and it points at frequency: it tells the team where to aim an offer to
        bring members back.
      c: >-
        Already in the finding. Each returning order being worth more strengthens the case for bringing
        customers back.
    answer: >-
      Frequency is the branch that moved, so it is where the leak is; I would move the money to
      acquisition only if a rupee there buys more revenue than a rupee spent bringing customers back,
      and I would ask Marketing for that cost comparison.

  # ---------------------------------------------------------------- Part 2, Kalpa, Wednesday
  - id: reader-header
    type: One correct option
    label: Predict the output
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Wed
    key: b
    anchor: Everything read from a CSV is a string; what breaks and where do you convert?
    exhibit:
      caption: A new analyst's read of the export.
      code:
        lang: python
        text: |
          import csv
          with open("C2_W01_D03_orders_STUDENT.csv") as f:
              reader = csv.DictReader(f)
              next(reader)                  # skip the header line
              rows = list(reader)
          print(len(rows), rows[0]["order_id"])
    text: |-
      The export's first line names its columns, and 201 order rows follow it. The first order is KR-02001, a Q1 order of Rs 2,200. What does the cell print?
      (a) 201 KR-02001
      (b) 200 KR-02002
      (c) 200 KR-02001
      (d) 201 KR-02002
    why: >-
      csv.DictReader reads the header line itself, to name the fields, so the first next() hands back
      the first order, KR-02001, and the comment is wrong about what it skips. The list then holds the
      other 200 orders and starts at KR-02002. Nothing fails: Q1 is Rs 2,200 short, and the
      reconciliation's input count reads 200 against a file of 201 order rows, which is the check that
      catches it.
    wrong:
      a: >-
        What the analyst meant. The header is gone before next() runs, so the call takes a real order
        with it.
      c: >-
        Counts the loss and keeps the first order. The row that next() consumed is the first order,
        KR-02001.
      d: >-
        Keeps every row while losing the first. A reader is one pass through the file, so a row handed
        to next() is gone from the list.
    answer: >-
      A DictReader has already used the header line, so an extra next() silently drops the first order;
      I count input rows against the file's own count before I clean anything, because a
      reconciliation that starts one row short can still close.

  - id: evidence-copy
    type: True or false
    label: Judge the auditor's copy
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, FDE
    day: Wed
    key: c
    anchor: An auditor asks why you dropped 14 rows; walk them through it.
    exhibit:
      caption: Two rows of the export as the reader hands them over, and the analyst's pass.
      code:
        lang: python
        text: |
          rows = [{"order_id": "KR-02063", "amount": "twelve"},
                  {"order_id": "KR-02064", "amount": "3150"}]
          as_arrived = rows.copy()        # the export as it came, for the auditor
          for r in rows:
              r["amount"] = int(r["amount"]) if r["amount"].isdigit() else 0
    text: |-
      The auditor wants every amount as the export gave it, so before the pass converts the amounts in place the analyst keeps a copy. Statement: after the pass, as_arrived[0]["amount"] still holds "twelve". True or false, and why?
      (a) True, because rows.copy() builds a new list, and the pass only loops over rows.
      (b) True, because a dictionary inside a copied list is copied along with the list.
      (c) False, because both lists hold the same dictionaries, which the pass rewrote.
      (d) False, because rows.copy() hands back the very same list object as rows.
    why: >-
      rows.copy() makes a new list whose two slots point at the same two dictionaries, a shallow copy.
      The pass rewrites each dictionary's amount in place, so as_arrived now shows 0 where the export
      said "twelve", and the auditor's evidence has been rewritten by the step it was meant to check.
      Keeping the export as it came needs copies of the dictionaries, [dict(r) for r in rows], or
      better, the file itself, which the pass never touches.
    wrong:
      a: >-
        Right about the list, wrong about what it holds. The copy is a new list, but its items are the
        same dictionaries the pass changes.
      b: >-
        The misconception the item tests. A list copy copies references, never the dictionaries they
        point to.
      d: >-
        Right verdict, wrong reason. rows.copy() does build a new list, so as_arrived is rows is False;
        the sharing happens one level down.
    answer: >-
      A list copy is shallow, so the dictionaries inside it are shared and a pass that edits them in
      place edits the evidence; I keep the raw rows untouched, as copies of each dictionary or as the
      file itself, and write every change to the decisions log.

  - id: reject-loop
    type: More than one correct
    label: Choose every fix
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Wed
    key: b, d
    anchor: "Input 200, clean 183, rejected 14: does it reconcile, and what is the missing number?"
    exhibit:
      caption: Five invented rows laid out as the export's are, and a pass meant to set aside every unreadable amount.
      code:
        lang: python
        text: |
          rows = [("KR-09051", "2400"), ("KR-09052", "twelve"), ("KR-09053", "n/a"),
                  ("KR-09054", "1850"), ("KR-09055", "3100")]
          rejects = []
          for row in rows:
              if not row[1].isdigit():
                  rows.remove(row)
                  rejects.append(row)
          print(len(rows), "+", len(rejects), "=", len(rows) + len(rejects))
    text: |-
      The pass prints 4 + 1 = 5, so its rows reconcile, yet order KR-09053 is still among the clean rows. Which rewrites set aside every unreadable row and keep every readable one? Mark every correct option.
      (a) Loop over rows as now, but call rejects.append(row) before rows.remove(row).
      (b) Loop over a copy, for row in list(rows):, and remove each bad row from rows.
      (c) Loop over rows as now, and add continue straight after the rows.remove(row).
      (d) Build two new lists: kept from rows with digit amounts, rejects from the rest.
      (e) Loop over rows as now, and set a bad row's amount to "0" instead of removing it.
    why: >-
      Removing an item from the list a for loop is walking shifts every later item one place left, so
      the loop steps over the row after each removal: KR-09053 follows KR-09052 and is never tested. The
      counts still close, 4 + 1 = 5, because whatever is left counts as clean, which is Wednesday's
      lesson that rows can reconcile by construction. Walking a copy, (b), or building new lists, (d),
      tests every row once.
    wrong:
      a: >-
        Swaps two lines and keeps the removal inside the loop, so the skip happens exactly as before.
      c: >-
        continue only ends the current turn of the loop; the skipped row was lost when the list
        shifted.
      e: >-
        Stops the skip by coercing the unreadable amount to zero, Wednesday's round 1 trap: the order
        stays clean at Rs 0, and the log never hears of it.
    answer: >-
      I never remove from the list I am looping over; I build the clean list and the rejects list as
      two new lists, and I check that every input row landed in exactly one of them, reason attached.

  - id: monday-number
    type: Scenario set
    label: Choose Monday's number
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Tue
    key: d
    anchor: What has to match before a quarter-on-quarter comparison is fair?
    text: |-
      SET 4. SITUATION: Tuesday's numbers reached Meera before Wednesday's reconciliation did. A dashboard tile read on 15 September set Q2 so far, 11 of its 13 weeks, against all of Q1 and showed revenue down 25.9 percent. The closed quarters as exported read Rs 2.10 crore and Rs 1.87 crore, down 11.0 percent. The reconciliation then set aside 14 duplicated Q1 rows worth Rs 19,98,210, which brought Q1 to Rs 1.90 crore, the figure in Anand's books, and left Q2 at Rs 1.87 crore.
      Meera's growth review is on Monday. Which change in revenue goes into her note?
      (a) Down 25.9 percent, the tile's reading, since it is the most recent view of Q2.
      (b) Down 12.4 percent, the tile's weekly rate against Q1's, which levels the windows.
      (c) Down 11.0 percent, the closed quarters as exported, since both hold 13 weeks.
      (d) Down 1.6 percent, the closed quarters after the reconciliation with the books.
    why: >-
      Two corrections stand between the tile and the truth. The tile set 11 weeks of Q2 against 13 of
      Q1, and closed quarters fix that at 11.0 percent; Q1 as exported still held 14 duplicated rows
      worth Rs 19,98,210, and on the reconciled file the change is (1.87 less 1.90) over 1.90, a fall
      of 1.6 percent measured from the starting quarter. It is the only figure that compares like with
      like and agrees with the books.
    wrong:
      a: >-
        Sets 11 weeks against 13 and a duplicated Q1 against a clean Q2; both errors push the same way.
      b: >-
        Levels the windows and keeps the duplicates, and it treats Q2 as unfinished when the quarter
        has closed.
      c: >-
        Tuesday's honest number on Tuesday's data. The reconciliation found Q1 inflated by Rs 19,98,210,
        so the fall shrinks to 1.6 percent.
    answer: >-
      I report the fall on matched windows and reconciled data, 1.6 percent, and I say what changed
      since Tuesday's 11.0: duplicated Q1 rows that Finance's books never held.

