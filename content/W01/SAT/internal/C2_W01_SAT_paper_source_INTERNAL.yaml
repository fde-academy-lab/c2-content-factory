# Week 1 Saturday paper: the week's source file, laid on the tracker's bank by
# scripts/build_saturday_paper.py. Block style throughout, since a comma inside an inline mapping
# splits a reason in two without any error.
#
# The bank sets what is tested and this file sets the bar: every bank item prints in a part, is
# folded into a deeper printed item that tests its concept, or moves to the stretch page. Parts 1 to
# 3 continue the week's Kalpa cases; part 4 sets the week's traps in public cases, each checked
# against its source on 30 September 2026; part 5 sets them in an AI support agent's code and log,
# at a company named only as an example, with illustrative numbers.

parts:
  - title: Where the revenue went
    shows: whether you can read revenue from orders and say what would change a budget call
    intro: >-
      Kalpa Retail sells through its app, its website and its stores. Its revenue is a tree of
      branches multiplied together: customers, orders per customer (how often each customer buys),
      items per order and price per item, less the discounts given; revenue per order, the average
      order value, is the last two branches together. Retail-Plus is Kalpa's paid-membership tier,
      customers who pay to be members, and Business is its segment of corporate buyers. Marketing
      wants Rs 12 crore to acquire new customers, and Meera Raghavan, the CEO, will not sign until the
      data answers her: "Is acquisition even the branch that is short?" Anand Iyer, the finance
      controller, adds a rule of his own: "No averages. One business customer can move an average."
    exhibits:
      - caption: Kalpa's revenue tree. The branches multiply, and the discounts come off the product.
        mermaid: |
          flowchart LR
            R["Revenue"] --> C["Customers<br/>distinct buyers"]
            R --> F["Orders per customer<br/>orders over customers"]
            R --> I["Items per order<br/>items over orders"]
            R --> P["Price per item<br/>rupees over items"]
            R --> D["Less discounts<br/>rupees given back"]
    items: [47, "new:sales-net", "new:payback-typical", 46, "new:quarter-counter", 20,
            "new:budget-fact", 51]
  - title: Which Q1 figure is right
    shows: whether you read an export as an auditor will and close its rows and its rupees
    intro: >-
      Kalpa's dashboard reads an ERP export, a copy of the orders taken out of the company's order
      system, while Finance's books, which Anand Iyer signs, record the revenue Kalpa reports. Anand
      replied to all on Tuesday's finding: "Your dashboard says Q1 was Rs 2.1 crore. Our books say
      1.9." The ERP team adds that the CSV file was stitched from two extracts during the Q1
      migration. A reconciliation proves which figure is right: every row of the export ends in the
      clean file or in the rejects log with its reason, so input rows equal clean rows plus rejected
      rows, and the clean rupees tie to the books.
    exhibits:
      - caption: Where the two Q1 figures come from.
        mermaid: |
          flowchart LR
            E1["Extract 1"] --> CSV["orders.csv<br/>201 order rows"]
            E2["Extract 2<br/>Q1 migration"] --> CSV
            CSV --> D["Dashboard<br/>Q1 Rs 2.1 crore"]
            B["Finance's books<br/>Q1 Rs 1.9 crore"]
            D -.-|"Rs 20 lakh apart"| B
    items: ["new:reader-header", 11, "new:evidence-copy", "new:reject-loop", 24, "new:monday-number",
            "new:plus-clean", 52]
  - title: Real, worth it, and caused
    shows: whether you can say what chance, a count and a fair test let you claim
    intro: >-
      Meera has set the growth review for Monday and sent three questions. "One: Retail-Plus is
      down, smaller than first reported. Real, or the wobble we see every quarter? Two: Student is up
      40 percent; should I move budget there? Three: marketing ran a monsoon-sale discount for
      Retail-Plus in August, says it lifted revenue 6 percent, and wants to repeat it for Diwali."
      Her constraint: "One page, two minutes. If the honest answer is 'we do not know yet', say so and
      tell me what would tell us." A shuffle test answers the first question: deal the members'
      figures to the two quarters at random thousands of times, and count how often chance alone
      makes a gap as large as the real one. That share is the p-value.
    exhibits:
      - caption: >-
          Retail-Plus, 5,000 shuffles of its 22 members' delivered revenue between the quarters. Each
          gap is Q1 spend per member less Q2, in rupees, so a fall is a positive gap; the real fall is
          Rs 1,110 per member.
        mermaid: |
          xychart-beta
            title "Retail-Plus: 5,000 shuffled gaps"
            x-axis "Gap per member, Rs" ["-1,110 or less", "-1,110 to -555", "-555 to 0", "0 to 555", "555 to 1,110", "1,110 or more"]
            y-axis "Shuffles" 0 --> 1800
            bar [117, 728, 1620, 1679, 721, 135]
    items: [35, "new:shuffle-sign", "new:student-line", 43, 45, "new:diwali-test"]
  - title: The same traps, in public
    shows: whether you spot the week's traps in public cases and name the check for each
    intro: >-
      Interviewers at strong AI and data teams like to test a method on a case the candidate has not
      seen. Every case in this part is on the public record, with its source named beside it, and
      every number an item needs is on the page. Read each one the way Kavya Nair reads a draft: what
      the number is, what it was computed on, and which check would have caught it.
    items: ["new:debt-weights", "new:debt-rows", "new:orbiter-units", "new:flu-fit", "new:bing-alert",
            "new:wald-buyers"]
  - title: The agent's bill and its logs
    shows: whether you can read an agent's code and log and size its cost honestly
    intro: >-
      Suppose you join the AI team of a food-delivery company such as Swiggy; the agent, its logs
      and every number in this part are illustrative. For each customer conversation a large language
      model reads the message, may ask for a tool (an order's status, a refund within a limit, a hand-off
      to a person) and writes the reply. Every model call is billed by the token, a small piece of text,
      and writes one row to a log table. The head of customer support owns two numbers: the cost per
      conversation, and the share of conversations the agent resolves without a person.
    exhibits:
      - caption: One conversation. The agent calls the model twice, and each call is billed.
        mermaid: |
          flowchart LR
            C["Customer asks<br/>about SW-1042"] --> M1["Model call 1<br/>billed"]
            M1 --> T["Tool runs<br/>get_order_status"]
            T --> M2["Model call 2<br/>billed"]
            M2 --> R["Reply to<br/>the customer"]
    items: ["new:tool-print", "new:agent-history", "new:agent-cost", "new:sql-where",
            "new:sql-having", "new:sql-count", "new:sql-avg", "new:sql-rate"]

