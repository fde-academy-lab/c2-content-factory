    key: b
    anchor: 42 percent on 12 users against 31 percent on 1,200; which do you trust?
    exhibit:
      caption: >-
        Student's 12 orders dealt to Q1 or Q2 by the toss of a coin, 5,000 times: the worlds by the
        number of orders that landed in Q2.
      table:
        head: [Q2 orders out of 12, Worlds]
        rows:
          - [4 or fewer, "918"]
          - ["5", "964"]
