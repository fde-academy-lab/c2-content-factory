  23:
    into: "new:reject-loop"
    why: The reject-loop item's correct fixes log every unreadable row and continue, and its wrong ones lose or coerce rows, the choice this item tests.
  25:
    into: "new:reject-loop"
    why: The reject-loop item is a run whose counts close while a row is wrongly kept, the deeper form of counts that do not close.
  26:
