      Only a random hold-back inside each segment gives two groups alike in everything but the offer:
      the same season, the same mix, and customers who did not choose themselves. Every design here
      uses chance somewhere; what matters is what it decides and which two groups end up side by side.
      The other designs compare groups that differ in something besides the discount, a segment, a year
      or the kind of customer who opts in.
