# The Word paper's first page: "What this paper is for", and the Rules table's Company row.
purpose: >-
  This week Meera Raghavan, Kalpa Retail's CEO, asked whether the Rs 12 crore Marketing wants for
  winning new customers goes to the part of revenue that fell; Anand Iyer, the finance controller,
  disputed the Q1 figure on the team's dashboard; and Meera now has to decide what Monday's growth
  review hears about Retail-Plus, Student and the monsoon sale. Parts 1 to 3 put those decisions to
  you again, with no notes, and Parts 4 and 5 set the same mistakes in public cases and at a
  food-delivery company, where interviewers test them. The room's score in each part, set beside the
  rating you give it in step one, decides where Monday's revision starts. A wrong answer tells Monday
  more than a blank does.
company: >-
  Parts 1 to 3 are set inside Kalpa Retail, where you work as a trainee engineer in the data and AI
  team of its Global Capability Centre, the in-house centre that builds Kalpa's data and AI systems.
  Meera Raghavan is Kalpa Retail's CEO, Anand Iyer its finance controller and Kavya Nair the senior
  analyst on your team. Part 4 draws on four public cases, and Part 5 imagines a food-delivery
  company, its offer and its support agent, all illustrative. Every number an item needs is on the
  page.

additions:
  # ---------------------------------------------------------------- Part 1, Kalpa, Monday and Tuesday
  - id: sales-net
    type: One correct option
    label: Predict the output and the call
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Mon
    key: c
    anchor: A business says 'grow revenue 15 percent'; how do you turn that into questions data can answer?
    exhibit:
      caption: >-
        The 29 consumer orders in the team's first sample of 30 orders, every order outside the
        Business segment, by channel and status, and the analyst's cell. The int() is there because
        one amount arrived as the text "4500".
      table:
        head: [Channel, Delivered, Returned, Cancelled]
        rows:
          - [app, "10 orders, Rs 18,600", none, none]
          - [web, "5 orders, Rs 12,320", "5 orders, Rs 14,970", none]
          - [store, "5 orders, Rs 9,870", none, "4 orders, Rs 9,050"]
      code:
        lang: python
        text: |
          sales = {"app": 0, "web": 0, "store": 0}
          for o in CONSUMER_ORDERS:                 # the 29 orders in the table
              if o["status"] == "delivered" or "returned":
                  sales[o["channel"]] += int(o["amount"])
          print(sales)
    text: |-
      Every Kalpa order carries a status: delivered (it reached the customer), returned (it came back for a refund) or cancelled (it never left the shelf). Meera will fund one of two asks next quarter, the app team's new checkout or the store team's refit. Her rule is to back the channel whose consumer orders in the sample brought in more, counting every order that was not cancelled. The analyst wrote this cell to settle it. What does it print, and which channel does her rule back?
      (a) {'app': 18600, 'web': 27290, 'store': 18920}; her rule backs the store.
      (b) {'app': 18600, 'web': 27290, 'store': 9870}; her rule backs the app.
      (c) {'app': 18600, 'web': 27290, 'store': 18920}; her rule backs the app.
      (d) {'app': 18600, 'web': 27290, 'store': 9870}; her rule backs the store.
    why: >-
      The test reads as (o["status"] == "delivered") or "returned", and a non-empty string counts as
      true, so every order passes, the cancelled ones included. The store's four cancelled orders,
      Rs 9,050, lift it to Rs 18,920, just above the app's Rs 18,600, and web's figure is right only
      because web had no cancellations. Meera's rule counts the orders that were not cancelled, which
      the table gives: the app's Rs 18,600 against the store's Rs 9,870, so her rule backs the app by
      almost two to one. Taken as printed, the cell would have funded the channel that lost four of
      its nine consumer orders to cancellation, which is the cancelled-orders trap of Monday's round 1.
    wrong:
      a: >-
        The cell does print this, and the call follows the print: the store's Rs 18,920 carries its
        four cancelled orders, which Meera's rule leaves out.
      b: >-
        The call is the one the table supports, beside the output the analyst meant to get; the line
        compares the status with "delivered" alone, so every order passes.
      d: >-
        This option reads the cell as the analyst meant it and then misapplies the rule, since
        Rs 9,870 is below the app's Rs 18,600.
    answer: >-
      An or joins two whole conditions, so I write status in ("delivered", "returned"); and before a
      figure settles a budget I check it against the counts by status, because here the cell would
      have funded the channel with four cancellations in nine.

  - id: first-order
    type: Applied maths
    label: Price the typical first order
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Mon
    key: Rs 2,205.
    anchor: Mean or median for order value, and why?
    exhibit:
      caption: >-
        The first sample's 30 orders by status: 21 delivered, 5 returned and 4 cancelled, each
        status's amounts sorted from the smallest, in rupees.
      table:
        head: [Status, Places, Amounts]
        rows:
          - [delivered, 1 to 7, "400, 860, 940, 1,120, 1,190, 1,440, 1,520"]
          - [delivered, 8 to 14, "1,650, 1,890, 2,020, 2,060, 2,090, 2,110, 2,300"]
          - [delivered, 15 to 21, "2,500, 2,520, 2,780, 2,800, 4,100, 4,500, 4,80,000"]
          - [returned, 1 to 5, "1,240, 2,880, 2,930, 3,830, 4,090"]
          - [cancelled, 1 to 4, "1,450, 2,430, 2,430, 2,740"]
    text: |-
      Marketing's payback model asks how long a typical new customer takes to repay what it cost to win them. The model covers every new customer, business buyers included, and it takes cancellations and returns off at their own rates. For the value of a typical first order it uses Rs 18,160, the mean of the sample's 30 orders. What figure should it use? Give it in rupees.
    why: >-
      The model applies its own cancellation and return rates, so it needs an order's booked value,
      before anything is cancelled or returned, and all 30 orders are the population: dropping the
      cancelled and returned ones first, or counting them at zero, would take them off a second time
      when the rates run. A typical first order needs the median, since the Rs 4,80,000 Business
      order is 88 percent of the sample's Rs 5,44,810 and lifts the mean to Rs 18,160, eight times a
      typical order. The model covers business buyers, so that order stays in. The median of 30 sorted
      amounts is halfway between the 15th, Rs 2,110, and the 16th, Rs 2,300, which is Rs 2,205, the
      figure Monday gave for acquisition payback.
    wrong:
      "Rs 18,160": >-
        The mean of all 30 carries the one Business order, which lifts it to eight times a typical
        order.
      "Rs 2,060": >-
        This is the median of the 21 delivered orders, which drops the cancelled and returned orders
        before the model's own rates take them off again.
      "Rs 24,800": >-
        Averaging only the 21 delivered orders drops orders the rates already handle and lets the
        Business order lift the figure to twelve times a typical order.
      "Rs 1,480": >-
        Counting the cancelled and returned orders at zero takes them off once here and again when the
        model's rates run.
      "Rs 2,100": >-
        The 26 orders delivered or returned leave out the cancelled orders, which the model's
        cancellation rate already takes off.
      "Rs 2,110": >-
        This is the 15th amount alone, or the median of 29 once the Business order is deleted; the
        median of an even count is halfway between the middle two, and the model covers business
        buyers.
      "Rs 2,300": >-
        The 16th amount alone misses the median of 30, which is halfway between the 15th and the 16th.
      "Rs 2,040": >-
        Dropping the cancelled and returned orders and the Business order as well leaves 20 delivered
        consumer orders, whose median this is.
    answer: >-
      For a typical first order I use the median of the booked orders, Rs 2,205 on the first sample,
      since the payback model takes cancellations and returns off at its own rates, and I keep the
      Rs 4,80,000 order in with a flag, since the model covers business buyers; the mean is for
      totals.

  - id: quarter-counter
    type: One correct option
    label: Predict the headline
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Tue
    key: d
    anchor: Sales dropped 15 percent last month; how would you investigate?
    exhibit:
      caption: >-
        Tuesday's export, a file of Kalpa's orders copied out of its order system, counted by segment
        and quarter, and the analyst's cell, in which ORDERS holds the export's 200 rows.
      table:
        head: [Segment, Q1 rows, Q2 rows]
        rows:
          - [Student, "5", "7"]
          - [Retail-Plus, "51", "26"]
          - [Business, "20", "17"]
          - [Retail-Core, "38", "36"]
          - [all, "114", "86"]
      code:
        lang: python
        text: |
          SEGMENTS = ["Student", "Retail-Plus", "Business", "Retail-Core"]
          orders_in = {}
          for q in ["Q1", "Q2"]:
              for seg in SEGMENTS:
                  n = 0
                  for o in ORDERS:
                      if o["quarter"] == q and o["segment"] == seg:
                          n += 1
              orders_in[q] = n
          change = (orders_in["Q2"] / orders_in["Q1"] - 1) * 100
          print(orders_in, f"{change:+.1f}%")
    text: |-
      For Meera's first slide an analyst wants the orders in each quarter of Tuesday's export, and writes this cell. What does it print?
      (a) {'Q1': 114, 'Q2': 86} -24.6%
      (b) {'Q1': 5, 'Q2': 7} +40.0%
      (c) {'Q1': 114, 'Q2': 200} +75.4%
      (d) {'Q1': 38, 'Q2': 36} -5.3%
    why: >-
      The counter n = 0 sits inside the segment loop, so it restarts for every segment, and
      orders_in[q] = n runs once per quarter, after that loop, when n holds only the last segment's
      count. Retail-Core is last, so the slide reads 38 orders then 36, a fall of 5.3 percent, where
      the company's rows fell from 114 to 86, 24.6 percent. The loop is valid Python, so no error
      flags it. Tuesday's first rung is the check that catches it: the quarter counts must add back to
      the 200 rows in the file, and 38 plus 36 is 74.
    wrong:
      a: >-
        This is what the analyst meant to print; the total needs the counter set once per quarter,
        before the segment loop, or the segment counts kept and summed.
      b: >-
        It takes the first segment's count as the one that sticks, where the counter restarts for
        each segment and the last one, Retail-Core, is what remains.
      c: >-
        A counter set once, before both loops, would print this by carrying Q1's 114 into Q2; here
        the counter restarts for every segment.
    answer: >-
      A counter belongs at the level of the thing it counts, so a quarter's total is set once per
      quarter; and before a number reaches a slide I check that the parts add back to the file,
      because 38 and 36 from a 200-row export is the tell.

  - id: budget-flip
