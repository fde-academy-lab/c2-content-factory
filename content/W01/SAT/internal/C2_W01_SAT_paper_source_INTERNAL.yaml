  - id: debt-weights
    type: Scenario set
    label: Predict the output and the weight
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Tue
    key: d
    anchor: Why is a rate without a denominator meaningless?
    exhibit:
      caption: The two averages, computed on the seven countries as the table gives them.
      code:
        lang: python
        text: |
          above_90 = {"Greece": (19, 2.9), "Ireland": (7, 2.4), "Italy": (10, 1.0),
                      "Japan": (11, 0.7), "New Zealand": (1, -7.9),
                      "United Kingdom": (19, 2.4), "United States": (4, -2.0)}
          years = sum(n for n, g in above_90.values())
          by_country = sum(g for n, g in above_90.values()) / len(above_90)
          by_year = sum(n * g for n, g in above_90.values()) / years
          print(years, f"{by_country:.2f}", f"{by_year:.2f}")
    text: |-
      SET 5. SITUATION: In 2010 the economists Carmen Reinhart and Kenneth Rogoff published the average growth of advanced economies in the years their public debt stood above 90 percent of GDP (gross domestic product, the value of everything an economy produces in a year). They sorted each country's years into four bands by how high its debt stood, the top band above 90 percent, and averaged growth within each band. In 2013 Thomas Herndon, Michael Ash and Robert Pollin rebuilt the figure from the authors' working spreadsheet. The table gives the seven countries in that average as the spreadsheet carried them. It counted one year for New Zealand, 1951, and carried its growth at -7.9 percent where the country's own sheet said -7.6; it left out New Zealand's four earlier years above 90 percent, 1946 to 1949.
      What does the cell print, and how much of the first printed average's weight rests on New Zealand's single year?
      (a) 71 -0.07 1.68; New Zealand's single year carries a seventy-first of that weight.
      (b) 71 1.68 -0.07; New Zealand's single year carries a seventh of that weight.
      (c) 71 1.68 -0.07; New Zealand's single year carries a seventy-first of that weight.
      (d) 71 -0.07 1.68; New Zealand's single year carries a seventh of that weight.
    why: >-
      The first average treats the seven country figures alike, so New Zealand's one counted year at
      -7.9 carries a seventh of the weight, as much as the United Kingdom's nineteen years at 2.4: -0.5
      over 7 is -0.07, which rounds to the -0.1 Reinhart and Rogoff published. The second weights each
      country by its counted years, 119.3 over 71 country-years, which is 1.68, and there New Zealand's
      year carries a seventy-first. Herndon, Ash and Pollin (PERI Working Paper 322, April 2013, Table
      3) give -0.1 for the spreadsheet as it stood and 1.7 once each of the same years counts; Reinhart
      and Rogoff defended equal weights, to keep one country's unusual episode from dominating. An
      average of averages gives each group the same weight whatever its size, and nothing in the
      printed figure shows which weights were used; here the choice moves the answer by 1.7 points.
    wrong:
      a: >-
        The output is right; a seventy-first is New Zealand's share of the second average, which counts
        years, and the question asks about the first.
      b: >-
        This option swaps the two averages; the first printed is the one by country, where one year
        carries a seventh.
      c: >-
        It swaps the two averages and the weights, where the first printed average is by country.
    answer: >-
      An average of averages gives every group the same vote whatever its size, so I say which weighting
      I used and show the other beside it; here that moves the answer from about zero to 1.7 percent.

  - id: debt-rows
    type: Scenario set
    label: Choose the check
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS
    day: Wed
    key: d
    anchor: "Input 200, clean 183, rejected 14: does it reconcile, and what is the missing number?"
    text: |-
      SET 5, continued.
      The working spreadsheet held its 20 countries in rows 30 to 49, but the formula for each average covered rows 30 to 44, which left out Australia, Austria, Belgium, Canada and Denmark; the authors accepted the error when it was found. Only 10 of the 20 countries ever had a year with debt above 90 percent. Which check, run before publication, would have caught it?
      (a) Count the countries inside each band's average, and check that every band holds all 20.
      (b) Plot growth against debt for every country, and look for a point that breaks the pattern.
      (c) Recompute each band's average with the same formula on a fresh copy of the sheet.
      (d) Check the rows each average's formula spans against the 20 country rows in the sheet.
    why: >-
      It is Wednesday's reconciliation applied to a formula: set what went in against what should have
      gone in, here twenty country rows in the sheet against a formula spanning fifteen. Counting the
      countries inside each average cannot tell a dropped row from a band a country never entered: only
      ten countries ever had a year above 90 percent, so the top band fails that count even on a
      correct sheet. Neither of the other two checks looks at the rows at all (Herndon, Ash and Pollin,
      PERI Working Paper 322, April 2013, note 5 and page 8; Reinhart and Rogoff acknowledged the error
      in April 2013).
    wrong:
      a: >-
        A band holds only the countries whose debt ever sat in it, and only ten ever sat above 90
        percent, so this check fails on the top band whether the formula is right or wrong.
      b: >-
        A missing country leaves no point on the chart to break any pattern, so the plot looks as clean
        as the sheet.
      c: >-
        The same formula on a copy spans the same fifteen rows and returns the same figure, so the rerun
        agrees with the error.
    answer: >-
      Before any average leaves me I check the rows it covers against the rows it should cover, the same
      input-equals-output check as a cleaning run, because a formula can drop five countries without an
      error.

  - id: orbiter-units
    type: One correct option
    label: Choose the first move
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, FDE
    day: Wed
    key: b
    anchor: Finance and your dashboard disagree; what do you do?
    text: |-
      NASA's Mars Climate Orbiter was lost on 23 September 1999 as it reached Mars. One team's ground software wrote the thrusters' impulse in pound-force seconds, while the interface specification, and the navigation software that read the file, used newton-seconds, so every firing's effect was understated by a factor of 4.45. Through the spring and summer of 1999, engineers raised concerns about differences between navigation solutions, the team's estimates of the spacecraft's path. As the spacecraft approached Mars, solutions from Doppler data alone consistently placed it closer to the planet than the other solutions did (NASA Mishap Investigation Board, 1999). What should the team have done when the solutions disagreed?
      (a) Adopt the solution built on the most tracking data, since more data averages out the noise.
      (b) Treat the disagreement as the finding, and trace its cause before the next manoeuvre.
      (c) Average the solutions, and carry their spread forward as the uncertainty of the approach.
      (d) Plan the approach on the solution farthest from the planet, since it leaves the widest margin.
    why: >-
      When two methods that should agree do not, the gap has to be explained before either is used,
      the same move as Wednesday's two Q1 figures, whose Rs 20 lakh gap was traced to copied rows before
      Finance would act on either. Here the gap led to the units, a value read across a boundary without
      its unit, which is why Wednesday converts on purpose, once, and names the unit. The board's report
      says the discrepancies were reported only informally and not resolved, and it names inadequate
      communication between project elements among the contributing causes.
    wrong:
      a: >-
        Every solution carried the same mismodelled thrust, so the one built on the most tracking data
        carried the error too, and more data could not average it out.
      c: >-
        Averaging a right solution with a wrong one gives a third figure that is also wrong, and the
        spread carried forward says nothing about which one to trust.
      d: >-
        The solution that looked safest misled: the craft was lower than planned, as the Doppler-only
        solutions suggested, and the board put its lowest point at 57 km against a planned 226 km.
    answer: >-
      When two figures that should agree do not, the disagreement is the finding: I trace it before
      anyone acts on either, and I check units at every hand-off between teams, because a value can
      parse perfectly and still be in the wrong unit.

  - id: flu-fit
    type: More than one correct
    label: Choose both reasons
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS
    day: Thu
    key: b, e
    anchor: Revenue rose after a discount; did the campaign work, and what would you need to know?
    text: |-
      Google Flu Trends estimated flu activity in the United States from how often people searched for certain terms. Its builders tested 50 million search terms for those whose weekly volume best fit 1,152 data points of the CDC's figures (the Centers for Disease Control and Prevention, which counts doctor visits for flu-like illness), and weeded out terms such as high school basketball that fit well and had nothing to do with flu (Lazer and colleagues, Science, 2014). The paper gives two reasons such a term can fit. Which two does it give? Mark every correct option.
      (a) Basketball games spread flu, since crowds gather indoors through the winter.
      (b) Winter drives both basketball searches and flu visits, so each rises with the season.
      (c) The CDC's figures carried errors that the basketball searches happened to match.
      (d) Search volume measures illness directly, so any term searched in winter measures flu.
      (e) Among 50 million candidate terms, some will fit 1,152 points by chance alone.
    why: >-
      Two things let an unrelated term fit. The season drives both basketball and flu, so the term tracks
      the calendar, a shared cause of the kind Thursday called a confounder; the authors call the first
      version of the model "part flu detector, part winter detector". And with 50 million candidates
      tried against 1,152 points, some will fit by chance alone, the arithmetic of Thursday's twenty
      invented segments, one of which came back small with nothing going on. The model also missed the
      2009 H1N1 pandemic, which did not follow the winter, and from August 2011 it ran high in 100 of
      108 weeks.
    wrong:
      a: >-
        This reason invents a causal path the data never tested, and the paper calls such terms
        unrelated to the flu.
      c: >-
        The CDC's surveillance figures were the target the model was built to predict, and the paper
        reports the model's errors against them.
      d: >-
        Search volume measures searching, which is why the model drifted when search behaviour changed.
    answer: >-
      A proxy that fits on the season can be a winter detector, and a fit found among millions of tries
      can be chance, so I test a correlation on data it was not chosen on, and against a simple baseline,
      before I trust it.

  - id: bing-alert
    type: One correct option
    label: Answer the alert
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Thu
    key: b
    anchor: How do you know whether a change in a metric is significant?
    text: |-
      In 2012 an idea for changing how Bing displayed the headlines of its search ads had waited more than six months for a slot, until an engineer ran it as an A/B test, a controlled experiment that shows a change to a random share of users and compares them with the rest. Within hours the new version was producing abnormally high revenue, and a "too good to be true" alert fired (Kohavi and Thomke, Harvard Business Review, 2017). You are the analyst on call. What do you do first?
      (a) Ship the change to every user now, since each hour of delay costs revenue.
      (b) Treat the alert as a likely bug, and check the logging and the group split.
      (c) Stop the test and discard it, since a lift that large is almost always a bug.
      (d) Leave the test running for a quarter, until the lift settles near normal results.
    why: >-
      The ladder's first rung applies to good news too: confirm the change is real before acting on it.
      Such alerts usually signal a bug, the article says, so the first checks are the plumbing: whether
      revenue was logged the same way in both groups, and whether users were split as planned. In
      Bing's case the alert was no bug: the checks passed, and the analysis showed revenue up 12
      percent, more than 100 million US dollars a year in the United States alone, without hurting the
      main user-experience metrics, the best revenue idea in Bing's history.
    wrong:
      a: >-
        Shipping now acts on a number nobody has confirmed, and if the lift were a logging bug, every
        user would get the bug.
      c: >-
        Discarding the test throws it away before the cheap checks have run, and here those checks
        showed the lift was real.
      d: >-
        A quarter's wait checks nothing that a look at the logging and the split would not check within
        the hour.
    answer: >-
      A result that looks too good gets the same first rung as a drop that looks too bad: I confirm the
      logging and the split before I believe it, then size the lift and check the guardrail metrics
      before anyone ships it.

  # ---------------------------------------------------------------- Part 5, a delivery company, illustrative
  - id: sale-mix
    type: Scenario set
    label: Size the offer's effect
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS, FDE
    day: Thu
    key: A fall of Rs 12,500.
    anchor: Revenue rose after a discount; did the campaign work, and what would you need to know?
    text: |-
      SET 6. SITUATION: Last month the company's marketing team sent a 20 percent weekend offer to 500 customers, 250 members and 250 regular customers, and not to the other 1,000, of whom 400 were members and 600 regular. That month the 500 spent Rs 1,025 each and the 1,000 spent Rs 960 each, a lift of 6.8 percent, which is the marketing lead's case for sending the offer again at the festival. The chart and its table split the same customers by tier.
      On these figures, how much more or less did the 500 customers who got the offer spend last month, all 500 together, than the same customers would have spent without it? Give the total in rupees.
    why: >-
      Inside each tier the offer group spent less: members Rs 1,470 against Rs 1,500, Rs 30 less each,
      and regular customers Rs 580 against Rs 600, Rs 20 less each. The 500 were 250 of each, so they
      spent 250 times 30 plus 250 times 20, Rs 12,500, less than the same customers would have without
      the offer, with each tier's customers who did not get it standing in for them. The blend says
      the opposite, Rs 65 more each or Rs 32,500 in all, because half the offer group were members
      against four in ten of the rest, and members spend more in any month: the lift was the mix of who
      received the offer.
    wrong:
      "A rise of Rs 32,500": >-
        This is the blend as it came, Rs 65 more each, with half the offer group members against four in
        ten of the rest.
      "A fall of Rs 12,000": >-
        Setting the offer group at the other group's mix, four members in ten, ignores that the 500
        were half members.
      "A fall of Rs 25": >-
        Rs 25 is the fall for each customer, Rs 12,500 over 500, where the item asks for the total of
        all 500.
      "A fall of Rs 7,500": >-
        This counts the members alone, 250 of them at Rs 30 less each.
      "A fall of Rs 5,000": >-
        The regular customers alone make this, 250 of them at Rs 20 less each.
    answer: >-
      A total can rise while every tier falls when the mix shifts, so I set each customer against
      customers of the same tier before I credit an offer; here the 500 spent Rs 12,500 less than they
      would have.

  - id: sale-advice
    type: Scenario set
    label: Advise on the festival
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS, FDE
    day: Thu
    key: b
    anchor: Revenue rose after a discount; did the campaign work, and what would you need to know?
    text: |-
      SET 6, continued.
      The marketing lead wants to send the offer again at the festival, at 25 percent off, to the same kind of list. What do you advise?
      (a) Send it again at 25 percent off; orders need to rise by a quarter to hold revenue.
      (b) Do not send it as it ran; orders need to rise by a third to hold revenue at 25 percent off.
      (c) Send it again at 25 percent off; orders need to rise by a third to hold revenue.
      (d) Do not send it as it ran; orders need to rise by a quarter to hold revenue at 25 percent off.
    why: >-
      Inside both tiers the offer group spent less, so last month's lift was who received the offer, and
      nothing in the table shows the offer adding spend. A deeper cut asks more: at 25 percent off every
      order brings in 0.75 of its price, so orders must rise by 1 over 0.75, a third, just to hold
      revenue, where a 20 percent cut needed a quarter. The advice is not to repeat it as it ran, and
      to test it on a random hold-back inside each tier first.
    wrong:
      a: >-
        This option credits the blend that the tier split contradicts, and it uses the break-even of a
        20 percent cut.
      c: >-
        A third is the right break-even, and the call ignores what it means: the blend's lift was the
        mix, and a deeper cut only raises the bar.
      d: >-
        The call is right and the arithmetic is a cut behind: a quarter is the break-even for 20 percent
        off, and 25 percent off needs 1 over 0.75, a third.
    answer: >-
      I would not repeat it as it ran: spend fell inside both tiers, so the lift was the mix, and at 25
      percent off orders must rise by a third just to hold revenue; I would test it on a random
      hold-back inside each tier first.

  - id: tool-print
    type: One correct option
    label: Predict what the model and the dashboard read
    level: Hard
    min: 4
    tag: "[F]"
    roles: DS, FDE
    day: Tue
    key: c
    anchor: Why does a function that prints instead of returning break a pipeline?
    exhibit:
      caption: One conversation, and the agent's order-status tool as first written.
      mermaid: |
        flowchart LR
          C["Customer asks<br/>about an order"] --> M1["Model call 1<br/>billed"]
          M1 --> T["Tool runs<br/>get_order_status"]
          T --> M2["Model call 2<br/>billed"]
          M2 --> R["Reply to<br/>the customer"]
      code:
        lang: python
        text: |
          ORDER_STATUS = {"1041": "delivered", "1042": "out for delivery"}

          def get_order_status(order_id):
              if order_id in ORDER_STATUS:
                  return ORDER_STATUS[order_id]
              print(f"order {order_id}: not found")

          results = [str(get_order_status(o)) for o in ["1042", "1099", "1041"]]
          found = sum(1 for r in results if r)         # the dashboard's lookups found
    text: |-
      The agent sends the model whatever the tool returns, as text, and the support head's dashboard counts a lookup as found when that text is not empty. Three customers ask about orders 1042, 1099, a mistyped number, and 1041. What does the model read as the tool's result for 1099, and what does found hold?
      (a) 'None', and found holds 2 of the 3 lookups.
      (b) 'order 1099: not found', and found holds 2 of the 3 lookups.
      (c) 'None', and found holds 3 of the 3 lookups.
      (d) 'order 1099: not found', and found holds 3 of the 3 lookups.
    why: >-
      For a known order the function returns the status. For 1099 it prints a line to the console and
      runs off its end, so it hands back None, and str(None) is the four-letter text 'None': the model
      reads 'None' and may tell the customer it cannot find anything, or guess. The dashboard's test is
      whether the text is empty, and 'None' is not, so found holds 3 and the page shows every lookup
      found where one failed, with no error at any step. The fix is to return the "not found" message
      the function now only prints, and to count a lookup as found on what it returned, since some text
      always comes back. It is Tuesday's print-against-return trap, met inside an agent.
    wrong:
      a: >-
        The model does read 'None', but as a non-empty string it passes the test that None itself would
        fail, so found holds 3.
      b: >-
        The printed line goes to the console; the caller receives the return value, and a non-empty
        message would count as found too.
      d: >-
        found does hold 3, but the model sees only the returned None turned into text, and the printed
        line goes to the console.
    answer: >-
      A tool must return its result, because the agent passes on the return value and the console
      reaches nobody;
      I test each tool on what it returns, the unknown cases included, and I count success on what came
      back, since the text 'None' passes any test for an empty string.

  - id: agent-history
    type: One correct option
    label: Count the messages and choose the fix
    level: Hard
    min: 4
    tag: "[SV]"
    roles: DS, FDE
    day: Tue
    key: a
    anchor: "A list against a dictionary: when do you reach for each?"
    exhibit:
      caption: The agent's loop as first written, and three customers on one server.
      code:
        lang: python
        text: |
          def run_agent(message, history=[]):
              history.append({"role": "user", "content": message})
              reply = call_model(history)            # sends every message in history
              history.append({"role": "assistant", "content": reply})
              return reply

          run_agent("Where is order 1042?")          # customer A
          run_agent("Please cancel order 2210")      # customer B
          run_agent("Is my refund done?")            # customer C
    text: |-
      Customers often write more than once, and the server answers several conversations at the same time. Here customers A, B and C have each sent a first message, in that order. How many messages does C's model call send, and which change gives every conversation its own messages across all its turns?
      (a) 5; keep each conversation's messages under its conversation id, and pass that list in.
      (b) 3; keep the default list, and clear it at the end of every call so the next customer starts empty.
      (c) 5; keep the default list, and clear it at the end of every call so the next customer starts empty.
      (d) 3; keep each conversation's messages under its conversation id, and pass that list in.
    why: >-
      A default value is built once, when Python defines the function, so every call that uses it
      appends to the same list. A's call sends 1 message and appends the reply; B's sends 3; C's
      appends its question and sends 5, two of them A's and two B's. Clearing the shared list after each
      call fails twice over: two conversations answered at the same time still share it mid-call, and a
      customer's second message arrives to an empty list that has forgotten the first. Each
      conversation's messages belong under its own id, passed in as its history on every turn.
    wrong:
      b: >-
        This count takes the three questions and forgets the two replies, and the fix breaks both
        concurrent conversations and second messages.
      c: >-
        The count is right, and a list cleared after each call is still shared while calls overlap and
        forgets each customer's earlier turns.
      d: >-
        The fix is right, and the count misses the replies: each call appends the reply as well as the
        question, so C's call sends 5.
    answer: >-
      A mutable default is created once and shared by every call, so I keep no state in one; in an
      agent, a conversation's messages belong to that conversation, kept under its id and passed in on
      every turn.

  - id: agent-cost
    type: One correct option
    label: Size the cap
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS, FDE
    day: Mon
    key: b
    anchor: Mean or median for order value, and why?
    exhibit:
      caption: Cost per conversation in one shift, where every model call costs Rs 0.40.
      table:
        head: [Conversation, Model calls, "Cost, Rs"]
        rows:
          - [C-01, "4", "1.60"]
          - [C-02, "3", "1.20"]
          - [C-03, "5", "2.00"]
          - [C-04, "4", "1.60"]
          - [C-05, "3", "1.20"]
          - [C-06, "3", "1.20"]
          - [C-07, "105", "42.00"]
    text: |-
      In C-07 the model kept calling the same tool until a timeout stopped it. The head of support wants the typical conversation's cost on the dashboard, and a cap on model calls set at twice the calls of a typical conversation. Which pair is right: the typical cost, and what that cap would have saved this shift?
      (a) Rs 7.26 is the typical cost, and the cap would have saved Rs 38.80.
      (b) Rs 1.60 is the typical cost, and the cap would have saved Rs 38.80.
      (c) Rs 1.60 is the typical cost, and the cap would have saved Rs 27.60.
      (d) Rs 7.26 is the typical cost, and the cap would have saved Rs 27.60.
    why: >-
      Typical means the median. Sorted, the seven costs are 1.20, 1.20, 1.20, 1.60, 1.60, 2.00 and 42.00,
      so the typical cost is the fourth, Rs 1.60; the mean, Rs 7.26, is four and a half times a typical
      conversation and swings with every loop. The cap rests on the same choice: the typical
      conversation makes 4 calls, the median of 3, 3, 3, 4, 4, 5 and 105, so the cap is 8. Capped, C-07
      would still have paid for 8 calls, Rs 3.20, so the cap saves Rs 42.00 less Rs 3.20, Rs 38.80. Set
      from the mean, 18.1 calls, the cap would sit at 36 and save only Rs 27.60, a limit the loop itself
      had inflated. C-07 is a real cost and stays in the log.
    wrong:
      a: >-
        Rs 38.80 is the right saving, and Rs 7.26 is the mean, which moves with the one conversation
        that looped.
      c: >-
        Rs 1.60 is the typical cost, and Rs 27.60 comes from a cap set from the mean, 18.1 calls, which
        the loop itself inflated.
      d: >-
        This pair uses the mean twice, for the typical cost and for the cap, and both carry C-07's 105
        calls.
    answer: >-
      The typical cost is the median, Rs 1.60, with every run left in the log; a cap on model calls set
      from the median, 8, stops the next loop, and here it would have saved Rs 38.80 of the shift's
      Rs 50.80.

  - id: sql-failing
    type: One correct option
    label: Predict the query's rows
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: a
    anchor: What is the difference between WHERE and HAVING?
    exhibit:
      caption: >-
        The support head asks which tools failed at least 30 times in the week of 21 to 27 September;
        a call failed when its status is anything but ok, and called_on is a date, with no time of
        day. The log's calls by tool, status and week, and the analyst's query.
      table:
        head: [tool, status, 21 to 27 Sep, 14 to 20 Sep]
        rows:
          - [order_status, ok, "410", "388"]
          - [order_status, error, "12", "9"]
          - [order_status, timeout, "22", "6"]
          - [refund, ok, "96", "90"]
          - [refund, error, "35", "40"]
          - [refund, timeout, "3", "2"]
          - [handover, ok, "48", "51"]
          - [handover, error, "9", "11"]
          - [handover, timeout, "18", "25"]
      code:
        lang: sql
        text: |
          SELECT tool, COUNT(*) AS failed_calls
          FROM calls
          WHERE status <> 'ok'
            AND called_on BETWEEN '2026-09-21' AND '2026-09-27'
          GROUP BY tool
          HAVING COUNT(*) >= 30;
    text: |-
      What does the query return?
      (a) Two rows, order_status 34 and refund 38.
      (b) One row, refund 35, and nothing for order_status.
      (c) Three rows, order_status 49, refund 80 and handover 63.
      (d) Three rows, order_status 34, refund 38 and handover 27.
    why: >-
      WHERE keeps single rows before grouping: calls whose status is not ok, errors and timeouts alike,
      in the week of 21 to 27 September. GROUP BY then counts them per tool, 12 plus 22 is 34 for
      order_status, 35 plus 3 is 38 for refund and 9 plus 18 is 27 for handover, and HAVING, which runs
      on the groups, keeps the tools at 30 or more. Handover's 27 falls under the support head's floor,
      and the earlier week's rows never enter.
    wrong:
      b: >-
        This row counts only status 'error', so the timeouts, the calls that failed worst, drop out of
        the failures.
      c: >-
        These counts leave out the date filter, so the earlier week's calls join this week's.
      d: >-
        These rows stop before HAVING, which is what removes the tool under 30.
    answer: >-
      WHERE filters rows before grouping and HAVING filters groups after it, so the failure rule and the
      week go in WHERE and the floor of 30 goes in HAVING; I check a query's failure definition against
      the dashboard's before I trust its count.

  - id: sql-count
    type: Match the following
    bank: sql-results
    label: Match the count
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: "6"
    anchor: How do you handle missing data?
    exhibit:
      caption: >-
        Eight calls from the same log. latency_ms is empty, NULL, when a call timed out; tool is NULL
        when the model replied without calling one.
      table:
        head: [call_id, conversation_id, tool, status, latency_ms]
        rows:
          - ["1", CV-1, order_status, ok, "800"]
          - ["2", CV-1, order_status, ok, "1200"]
          - ["3", CV-2, refund, error, "600"]
          - ["4", CV-3, order_status, timeout, "NULL"]
          - ["5", CV-3, refund, ok, "1000"]
          - ["6", CV-4, "NULL", ok, "400"]
          - ["7", CV-5, handover, timeout, "NULL"]
          - ["8", CV-6, order_status, ok, "800"]
    text: |-
      SELECT COUNT(latency_ms) FROM calls;
    why: >-
      COUNT of a column counts the values in it, and the two timed-out calls have none, so it returns 6;
      COUNT(*) would return 8. A dashboard that labels this "calls" undercounts the calls that went
      worst.
    wrong:
      "8": >-
        COUNT(*) counts rows; COUNT(latency_ms) counts values, and two of them are NULL.
    answer: >-
      COUNT(*) counts rows and COUNT(column) counts values, so a column full of NULLs undercounts with no
      warning; I say which one a dashboard shows.

  - id: sql-avg
    type: Match the following
    bank: sql-results
    label: Match the average
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: "800"
    anchor: How do you handle missing data?
    text: |-
      SELECT AVG(latency_ms) FROM calls;
    why: >-
      AVG skips NULL, so it averages the six calls that finished, 4,800 over 6, which is 800. The two
      timeouts, the slowest calls of all, are left out, so the average understates the wait of the
      customers who timed out. Reading NULL as zero gives 600, which is wrong too, since it counts the
      slowest calls as instant.
    wrong:
      "600": >-
        This reads NULL as zero, 4,800 over 8, where AVG leaves NULL rows out of both the sum and the
        count.
    answer: >-
      AVG averages the values present, so the calls that never finished vanish from it; I report the
      timeouts as their own count beside the average.

  - id: sql-rate
    type: Match the following
    bank: sql-results
    label: Match the rate
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Tue
    key: "0"
    anchor: Why is a rate without a denominator meaningless?
    text: |-
      SELECT COUNT(*) FILTER (WHERE status <> 'ok') / COUNT(*) FROM calls;
    why: >-
      Both counts are integers, and PostgreSQL divides an integer by an integer as integers, so 3 over 8
      returns 0 and the dashboard shows a failure rate of 0 percent. Multiplying by 1.0 first, or casting
      one side, returns 0.375.
    wrong:
      "0.375": >-
        This is the true share, which needs a decimal division, and an integer over an integer drops the
        fraction.
    answer: >-
      PostgreSQL divides integers as integers, so every rate gets a 1.0 or a cast before the division,
      and I check a rate of 0 against its counts.

