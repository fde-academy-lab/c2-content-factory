additions:
  - type: Scenario set
    id: rows-as-customers
    level: Easy
    tag: "[S]"
    roles: BA, DS
    day: Mon
    min: 2.5
    key: "2.00 (or 2)"
    anchor: Marketing wants budget for acquisition; what would you check before agreeing it is the right branch?
    text: |
      SET 4. SITUATION: Kalpa's April export for two segments holds 500 order rows placed by 250 distinct customers. Retail: 400 orders, revenue Rs 8.0 lakh. Business: 100 orders, revenue Rs 12.0 lakh. A slide built from the export reads: orders per customer 1.00, average order value Rs 7,000.
      Orders per customer in this export is ____.
    why: >-
      Orders per customer is 500 orders over 250 distinct customers, which is 2.00. The slide divided
      500 rows by 500, because it counted every row as a customer, and a row is an order.
    wrong:
      "1.00": >-
        Counting rows as customers. Each row is one order, so dividing orders by rows always gives
        1.00 and reads as "nobody comes back", whatever the customers actually did.
      "0.50": >-
        The ratio turned upside down: customers over orders. Say the rate's numerator and
        denominator aloud before dividing, and the inversion shows.
    answer: >-
      I count distinct customers before any per-customer rate, because 500 rows from 250 people is
      2.00 orders each, and the 1.00 on the slide would have sent Rs 12 crore to the wrong branch.

  - type: Scenario set
    id: average-of-averages
    level: Medium
    tag: "[S]"
    roles: BA, DS
    day: Tue
    min: 2.5
    key: "4,000 (Rs 4,000)"
    anchor: Why is a rate without a denominator meaningless?
    text: |
      SET 4, continued.
      The average order value across both segments is Rs ____.
    why: >-
      Revenue over orders across both segments: Rs 20.0 lakh over 500 orders is Rs 4,000. Retail's
      400 orders carry four times the weight of Business's 100.
    wrong:
      "7,000": >-
        The average of the two segment averages, Rs 2,000 and Rs 12,000, which weights a 100-order
        segment the same as a 400-order one. It is the slide's figure, and it overstates the typical
        basket by 75 percent.
      "2,000": >-
        Retail's own average, taken as typical because Retail holds most orders. It ignores the 100
        Business orders, which carry more than half the revenue.
    answer: >-
      An average of averages ignores how many orders each average stands on, so I divide total
      revenue by total orders, Rs 20.0 lakh over 500, which is Rs 4,000 and not the Rs 7,000 on the
      slide.

  - type: Scenario set
    id: broken-slide
    level: Hard
    tag: "[D]"
    roles: BA, FDE
    day: Tue
    min: 2.5
    key: c
    anchor: Marketing insists the answer is acquisition and your data says frequency; how do you make the case in the room?
    text: |
      SET 4, continued.
      Marketing reads the slide as "nobody comes back, so buy new customers". What do you say in the room?
      (a) Agree, because the export shows each customer placing exactly one order in April.
      (b) Agree, once the median order value has been checked beside the Rs 7,000 mean.
      (c) Push back: 250 customers placed 500 orders, so "nobody comes back" is false.
      (d) Push back, because the Rs 7,000 average shows customers already spend enough.
    why: >-
      The slide's 1.00 is rows over rows. On distinct customers the same export gives 2.00, so the
      claim that nobody returns is simply false, and the case for acquisition loses its premise
      before any cost is discussed.
    wrong:
      a: >-
        Takes the slide's 1.00 at face value. The export shows 500 orders from 250 people, so it
        shows the opposite.
      b: >-
        Checks the wrong number. Median against mean is the right question for a skewed order value,
        but the error behind "nobody comes back" is the customer count, and the median cannot fix it.
      d: >-
        Pushes back with the slide's other broken figure. Rs 7,000 is an average of averages, and the
        true figure is Rs 4,000, so the argument collapses the moment Marketing checks it.
    answer: >-
      I'd put the denominator on the table: 250 customers placed 500 orders, so frequency is 2.00
      and returning customers exist; acquisition may still be the right call, and if it is, it wins
      on what each branch costs to move.

  - type: Scenario set
    id: whole-record-dedupe
    level: Medium
    tag: "[F]"
    roles: BA, DS
    day: Wed
    min: 2.5
    key: d
    anchor: How do you find duplicates, and what makes two records the same?
    text: |
      SET 5. SITUATION: Kalpa's store-channel export for Q1 holds 1,200 rows worth Rs 96.0 lakh. A dedupe that compares whole records reports 0 duplicates. A second pass keyed on order_id finds 40 rows whose order_id already appeared, each differing from the first row only in its timestamp. The run keeps 1,160 clean rows worth Rs 88.0 lakh and logs the 40 repeats as rejects worth Rs 5.0 lakh.
      Which duplicate count should the run trust?
      (a) Zero, because a duplicate has to match the earlier row in every field.
      (b) Zero, because a different timestamp proves two separate orders were placed.
      (c) Forty, but only once Finance has confirmed every pair by hand.
      (d) Forty, because the identity rule says one order_id is one order.
    why: >-
      What makes two rows the same order is the identity rule written down for an order, and here
      that rule is the order_id. A re-sent record with a fresh timestamp differs as a whole row, so
      a whole-record dedupe finds nothing, which is exactly why its zero cannot be trusted.
    wrong:
      a: >-
        The whole-record definition, which is the trap: any field that changes on a re-send, such as
        a timestamp, hides the repeat, so the check reports zero on a file that is not clean.
      b: >-
        Reads the timestamp as identity. A timestamp records when the row was written, and a system
        that re-sends an order writes a new one, so the order_id is what names the order.
      c: >-
        Hands the identity rule to someone else. Finance can confirm a sample, but the rule is
        written once and applied to every row, and 40 manual checks do not scale to next quarter.
    answer: >-
      Two rows are the same order when the identity rule says so, and for orders that is the
      order_id; a whole-record dedupe reporting zero only tells me some field changed on the
      re-send, so I key the check on the identity and log every repeat with its reason.

  - type: Scenario set
    id: rows-not-rupees
    level: Hard
    tag: "[D]"
    roles: BA, FDE
    day: Wed
    min: 2.5
    key: b
    anchor: Finance and your dashboard disagree; what do you do?
    text: |
      SET 5, continued.
      The row counts add up: 1,160 clean plus 40 rejected is 1,200. What is the honest status of the run?
      (a) Reconciled, because the clean rows and the rejects add back to the 1,200 input rows.
      (b) Not reconciled, because Rs 3.0 lakh is in neither the clean file nor the log.
      (c) Not reconciled, because Rs 8.0 lakh left the file when the 40 repeats were removed.
      (d) Reconciled, because a gap under 5 percent of the input is within ordinary rounding.
    why: >-
      A run reconciles on rows and on rupees. Rs 88.0 lakh clean plus Rs 5.0 lakh rejected is
      Rs 93.0 lakh against Rs 96.0 lakh in, so Rs 3.0 lakh has gone somewhere no log records, such as
      amounts coerced to zero. Nothing leaves for Finance until those rupees are found.
    wrong:
      a: >-
        Stops at the count. Rows can balance while money does not, because a row that stays in the
        file with its amount zeroed still counts as one clean row.
      c: >-
        Subtracts clean from input and forgets the rejects. Rs 96.0 lakh less Rs 88.0 lakh is 8.0,
        but Rs 5.0 lakh of that is logged and accounted for, which leaves 3.0.
      d: >-
        Treats an accounting gap as noise. Rupees in a ledger do not round: 3.1 percent of a quarter
        is a figure Finance will find, and a reconciliation either closes or it does not.
    answer: >-
      I reconcile rows and then rupees; here the rows close and Rs 3.0 lakh does not, so I trace
      that gap row by row, usually to an amount coerced to zero, before any figure goes to Finance.

  # Three code items for part 4, 2 minutes each, which takes the timed paper from 113.5 to 119.5
  # minutes. Every exhibit is invented data run through code faithful to the week's notebooks, and
  # its printed output is recorded in the provenance as the proof of the key.
  - type: One correct option
    id: blank-discount
    level: Medium
    tag: "[S]"
    roles: BA, DS
    day: Tue
    min: 2
    key: d
    anchor: How do you handle missing data?
    exhibit:
      caption: Five invented orders, and the loop that counts the ones with a discount.
      code:
        lang: python
        text: |
          orders = [{"order_id": "INV-1", "discount": 150},
                    {"order_id": "INV-2", "discount": 0}, {"order_id": "INV-3"},
                    {"order_id": "INV-4", "discount": 200}, {"order_id": "INV-5"}]
          with_discount = 0
          for order in orders:
              if order.get("discount", 0) > 0:
                  with_discount += 1
          print(with_discount, "of", len(orders), "orders had a discount")
    text: |
      The discount field is optional in Kalpa's export. Marketing reads the line this prints as "three orders in five had no discount" and wants the offer extended to those three. What is the honest reading?
      (a) Three in five had no discount, so the offer would reach customers who had none.
      (b) Two of the three are unknown, and 2 in 5 remains the share to report.
      (c) Two of the three are broken records, so they belong in the rejects log.
      (d) Two of the three are unknown, so the share is 2 of the 3 recorded.
    why: >-
      The loop prints "2 of 5 orders had a discount". It counts an order only when its discount is
      above zero, and .get hands back the default 0 for an order with no discount field, so the
      three without are INV-2, which records a zero, and INV-3 and INV-5, which carry no discount
      field at all. An optional field left blank is unknown: the share is 2 of the 3 orders that
      record a discount, and across all five it lies between 40 and 80 percent.
    wrong:
      a: >-
        The blank read as zero, the trap Tuesday's round 2 staged: .get's default turns two unknown
        discounts into none, and Marketing extends the offer to orders that may already have had
        one.
      b: >-
        Knows the two blanks are unknown and reports 2 in 5 anyway, which counts them as
        undiscounted after all. It is Tuesday's round 2 trap in its quietest form; the share runs
        over the orders that record a discount.
      c: >-
        Sends real orders to the rejects log for a blank optional field. Wednesday's log took rows
        that broke a rule, such as an amount that would not convert, and Wednesday's round 3 kept a
        record with a missing field and flagged it, because dropping it says the order never
        happened.
    answer: >-
      A blank is unknown, never zero: I report the share over the orders that record the field, 2
      of 3 here, say how many are blank, and give the range across all of them before anyone
      extends an offer on it.

  - type: One correct option
    id: helper-summary
    level: Hard
    tag: "[F]"
    roles: BA, DS
    day: Tue
    min: 2
    key: b
    anchor: Why does a function that prints instead of returning break a pipeline?
    exhibit:
      caption: The helper and the summary line, run on two cities' invented figures.
      code:
        lang: python
        text: |
          def pct_change(before, after):
              change = 100 * (after - before) / before
              if abs(change) > 30:
                  print(f"check by hand: {change:+.1f}%")
              else:
                  return round(change, 1)
          changes = {"Pune": pct_change(1.60, 0.80), "Delhi": pct_change(1.50, 1.41)}
          print({city: v for city, v in changes.items() if v and v < 0})
    text: |
      The analyst sends Meera the last line this prints as the cities where orders per customer fell from Q1 to Q2. What does that line give her, and why?
      (a) Both cities, Pune down 50.0 percent and Delhi down 6.0, with Pune flagged for a check.
      (b) Delhi alone, because Pune's change came back as None and the filter dropped it.
      (c) Delhi alone, and rightly, since the check-by-hand line was a warning about Pune's data.
      (d) Delhi alone, because Pune's change came back as zero, and zero is not a fall.
    why: >-
      Pune moves from 1.60 to 0.80, a change of -50.0 percent and beyond the helper's 30, so the
      helper prints "check by hand: -50.0%" and hands back None. Delhi's -6.0 comes back as a
      number. The filter keeps a value only when it is present and below zero, and None counts as
      false, so the last line reads {'Delhi': -6.0} and tells Meera that the city which halved did
      not fall at all.
    wrong:
      a: >-
        Reads print as return, the trap Tuesday's escalated case staged: the helper shows -50.0% on
        the screen and hands the caller None, so Pune never reaches the line.
      c: >-
        Takes the printed line for a warning about the data, which is how Tuesday's escalated case
        let its summary stand. Pune's figures are sound; the helper printed the change instead of
        returning it.
      d: >-
        Reads the missing return as zero, the belief behind Tuesday's round 2 blank read as zero.
        Python has no numeric default: the helper hands back None, and the filter drops it because
        None counts as false.
    answer: >-
      A helper that prints on one path hands back None on that path, and a filter drops None
      without a word, so the summary lost the city that halved; my helpers return every change, and
      a separate column flags the ones to check by hand.

  - type: One correct option
    id: first-copy
    level: Hard
    tag: "[F]"
    roles: BA, FDE
    day: Wed
    min: 2
    key: a
    anchor: Everything read from a CSV is a string; what breaks and where do you convert?
    exhibit:
      caption: Four invented rows in file order, and the cleaning pass run on them.
      code:
        lang: python
        text: |
          rows = [("A", "2400"), ("B", "n/a"), ("B", "1800"), ("C", "3100")]
          first = {}
          for order_id, amount in rows:
              first.setdefault(order_id, amount)
          clean = [int(a) for a in first.values() if a != "n/a"]
          print(len(rows), "rows:", len(clean), "clean,", len(rows) - len(clean),
                "set aside; Rs", sum(clean))
    text: |
      Finance's books hold orders A, B and C at Rs 7,300 in all. This pass cleans four rows of the export, read in file order. What does it print?
      (a) 4 rows: 2 clean, 2 set aside; Rs 5500
      (b) 4 rows: 3 clean, 1 set aside; Rs 7300
      (c) 4 rows: 3 clean, 1 set aside; Rs 5500
      (d) 4 rows: 2 clean, 2 set aside; Rs 7300
    why: >-
      The dictionary keeps the first amount it meets for each order_id, since setdefault never
      overwrites, so B keeps "n/a" and its readable copy, Rs 1,800, is passed over as a repeat. The
      conversion step then drops "n/a", so order B leaves the clean file altogether. The pass counts
      everything that is not clean as set aside, 4 less 2, so the rows add up by construction while
      the total, Rs 5,500, is Rs 1,800 short of the books. It prints "4 rows: 2 clean, 2 set aside;
      Rs 5500".
    wrong:
      b: >-
        Keeps the copy that validates, which is the fix from Wednesday's round 3 and not what this
        pass does: setdefault keeps the first copy it meets, and here that is the unreadable one.
      c: >-
        Keeps the unreadable amount as an order at Rs 0, the coercion Wednesday's round 1 staged.
        This pass drops "n/a" at the conversion step, so B leaves the clean file instead of staying
        at zero.
      d: >-
        Assumes the rupees close because the rows do, the trap Wednesday's round 3 staged: 4 = 2 + 2
        holds by construction, and the total is still Rs 1,800 short of the books.
    answer: >-
      I convert every amount at the read and only then apply the identity rule, keeping the copy
      that validates, and I reconcile rupees as well as rows, because here the rows close at 4 = 2
      + 2 while Rs 1,800 of order B has vanished.

