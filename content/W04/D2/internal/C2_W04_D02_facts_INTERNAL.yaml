corrections:
- The per-driver-week read is per active driver-week, one driver with a row in driver_weeks that week
  (6,360 before, 6,500 after), never per enrolled driver-week. It rose 0.8 percent because bookings rose
  3.0 percent while active driver-weeks rose 2.2 percent; hours do not enter that ratio, so the case file's
  'because hours rose' is replaced.
- The fall in rupees per peak online hour is 16.9 percent (260.4 / 313.5 - 1), printed as 17 percent;
  the draft's 17.1 was an arithmetic slip.
- Monday's data counts peak hours on all seven days, two three-hour windows a day, 42 hours a week at
  most (Monday's max_peak_hours_per_week), while the case file's guarantee names weekday windows. Tuesday's
  validate step uses the data's definition and says so, and leans on driver-hours per rider request, a
  ratio no window definition changes.
- The draft's drivers-at-peak chain divided by an idle share on top of trips per online hour, which already
  carries idle time. The chain now uses trips per busy driver-hour and walks requests from a crowd to
  a count, as the spine's L5 asks.
- The draft's UPI assumptions landed 0.4 percent from NPCI's figure, which teaches that a guesstimate
  should land on its anchor. The worked chain now uses round numbers a candidate would reach without the
  anchor and lands 13 percent below it.
