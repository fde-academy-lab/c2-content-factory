# content/W04/D5/internal/C2_W04_D05_facts_INTERNAL.yaml, written by C2_W04_D05_make_data_INTERNAL.py.
# Every number a Friday learner sees, with the form it prints in, how it was computed and where
# it is used. Public facts carry their R2 id; toys are labelled invented where they appear; the
# kalpa sections are TRAINER until the lab finds them.
#
# Corrections to the case file (docs/detailing/W04_case_file.md, Friday):
#   1. Hold-out MAEs are forecasts from one origin (22 Jun 2026), so no rule sees a week it is
#      scored on. The case file's naive 21,000, drift 11,500, same-week-last-year 9,200,
#      festival-aligned 8,900, finance 9,600 and vendor 14,800 become 14,923, 14,842, 9,831, 6,615,
#      6,615 and 16,400.
#   2. Festival-aligned and finance's rule tie on the hold-out: no hold-out week lies within five
#      weeks of a Diwali, so both copy the same calendar week a year back and add the same 4
#      percent; they part only in the festive weeks.
#   3. Drift sits beside naive: the line from 30 Sep 2024 to 22 Jun 2026 rises 70 shipments a week,
#      so the case file's 11,500 has nothing to stand on.
#   4. The vendor's hold-out misses are all above the actual and grow with the weeks ahead (3.6
#      percent in the first six weeks, 11.5 percent in the last six); the case file's 'two weeks
#      after the 2025 festival' lie in its fitted history, where it sits within 2 percent.
#   5. The 2026 window: the festival-aligned baseline is 19.5 percent above the same calendar weeks
#      of 2025 and 4.0 percent above the same weeks counted from Diwali; the case file's 'about 6
#      percent' becomes those two numbers. Finance is 4.0 percent above the calendar window and
#      -9.5 percent against the festival-aligned one; the vendor is 22.0 percent above the calendar
#      window and 2.1 percent above the aligned total.
#   6. The hold-out is 29 Jun to 21 Sep 2026: thirteen Mondays end on 21 Sep (the case file's
#      correction of 12 Oct 2026).
#   7. The ordinary week is about 210,000 at the level; the ordinary weeks of 11 Nov to 23 Dec 2024
#      run 212,700 to 223,500 with season, payday and noise.
#   8. Kalpa's April to September 2026 are v4's monthly order sums, lumpy because two large
#      Business orders (Rs 1.23 crore on 28 Apr and Rs 1.99 crore on 13 Jul 2026) sit in them; the
#      year before mirrors that shape about 4 percent lower.
#   9. Kalpa's vendor rows for April 2026 onward are its forecast from March 2026, labelled
#      forecast, never fitted.

