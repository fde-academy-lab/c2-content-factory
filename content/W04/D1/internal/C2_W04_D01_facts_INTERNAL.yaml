corrections:
- what: The case file prints the twelve-row hand count as hours 60 to 74, trips 114
    to 110, trips per online hour 1.90 to 1.49. The six after rows as printed sum
    to 88 trips, which gives 1.19 trips per online hour. The facts file records the
    computed value, and every learner file reads 88 trips and 1.19 trips per online
    hour on the hand count.
  where: docs/detailing/W04_case_file.md, Monday twelve rows and L1 numbers
