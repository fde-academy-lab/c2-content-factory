    day: Fri
    key: a
    anchor: >-
      A vendor promises 22 percent growth; how do you test the claim?
    exhibit:
      caption: >-
        The M5 forecasting competition, 2020: Walmart's daily unit sales of 3,049 products, every
        entry scored on 28 days it never saw; 1,972 of the 5,507 teams, 35.8 percent, beat the
        seasonal naive. From the official scores workbook and the accuracy paper, checked 13 October
        2026.
      table:
        head:
          - Entry
          - Average error, lower is better
        rows:
          - [The winning team, "0.520"]
          - ["Seasonal naive, the same day of the week before", "0.847"]
          - ["Multilayer perceptron, a machine-learning benchmark", "0.977"]
          - ["Random forest, a machine-learning benchmark", "1.010"]
          - ["Naive, the last day seen", "1.752"]
    text: |-
      The vendor's sponsor says: "Our curve fits two years of Lucknow's weeks within 2 percent, and machine learning won M5, so the curve should go to the plan." Using Exhibit 5C, which reply holds?
      (a) A fit is no forecast: on M5's unseen days the seasonal naive beat both machine-learning benchmarks and most teams; score the curve on the hidden weeks.
      (b) Agree: the winning entries in M5 were machine learning, so a curve that fits two years of Lucknow's weeks this closely has earned its place in the plan.
      (c) Fit and forecast agree on a series this regular: a curve within 2 percent of two years of weeks will stay within 2 percent of the next ten weeks.
      (d) Score the curve on its fitted weeks with MAPE as well as MAE, and send it to the plan if both measures stay under 2 percent of the actual.
    why: >-
      M5 judged every entry on days it never saw, and on that test the seasonal naive, at 0.847, beat
      the perceptron's 0.977 and the random forest's 1.010, and only 1,972 of the 5,507 teams, 35.8
      percent, beat it; the top entries that did win were machine learning, which is why the honest test is the
      same for any model. The vendor's curve fits its 91 training weeks within 1.4 percent, and on
      the thirteen hidden weeks it missed by 16,400 shipments a week against the seasonal naive's
      9,831, almost all of it too high. Makridakis and colleagues (PLOS ONE, 2018) made the same
      point on 1,045 monthly series: the models that fitted best did not necessarily forecast best.
    wrong:
      b: >-
        M5's winners were machine learning that beat the seasonal naive on days they never saw; a fit
        to past weeks is a different test, and the sponsor's curve has not passed the forecast one.
      c: >-
        A curve tuned to its own past can fit within 2 percent and miss the next weeks widely; the
        vendor's missed by 16,400 a week.
      d: >-
        Any measure on the fitted weeks scores the fit; only weeks the curve never saw score the
        forecast.
    answer: >-
      I score every model, of any family, on the latest periods it never saw, against the naive and
      the seasonal naive, before its fit counts for anything.
  - id: asym
    label: "Price the misses"
    type: One correct option
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS, FDE
    day: Fri
    key: d
    anchor: >-
      How do you evaluate a forecast?
    exhibit:
      caption: >-
        Lucknow's thirteen hidden weeks, beginning 29 June to 21 September 2026. An idle packer-shift
        costs Rs 650 for 120 shipments, Rs 5.42 for each shipment planned and not shipped, and a late
        shipment costs Rs 25; both are assumptions.
      table:
        head:
          - Forecast
          - Shipments forecast too high, summed
          - Shipments forecast too low, summed
          - Weeks too high, of 13
        rows:
          - ["Festival-aligned, last year's weeks matched by Diwali plus 4 percent", "40,748", "45,248", "6"]
          - [Same week last year, "7,300", "120,500", "2"]
          - [The vendor's curve, "211,300", "1,900", "12"]
    text: |-
      What is each forecast's mean absolute error a week, which costs least on these weeks with its misses priced, and what follows for the plan?
      (a) 6,615, 9,831 and 16,400 a week; festival-aligned costs least, about Rs 13.5 lakh, so the plan books its forecast with no cushion above it.
      (b) 6,615, 9,831 and 16,400 a week; the vendor costs least, about Rs 11.9 lakh, so the plan books its curve at plus 22 percent for the festive weeks.
      (c) About minus 346, minus 8,708 and 16,108 a week, the signed misses averaged; festival-aligned is nearly unbiased, so the plan sits at its forecast.
      (d) 6,615, 9,831 and 16,400; the vendor costs least, Rs 11.9 lakh, only because it errs high, the cheap side; compare each at its own 0.82 point.
    why: >-
      Mean absolute error adds the misses with their signs dropped and divides by the weeks: 85,996
      over 13 is 6,615 for festival-aligned, 127,800 over 13 is 9,831 for the copy of last year, and
      213,200 over 13 is 16,400 for the vendor, about 148 percent above festival-aligned. Priced, a
      spare shipment costs Rs 5.42 and a late one Rs 25: the vendor's misses cost about Rs 11.9 lakh,
      festival-aligned's Rs 13.5 lakh and the copy's Rs 30.5 lakh, so the vendor is cheapest only
      because it errs high, the cheap side, by an amount nobody chose. The fair comparison moves each
      forecast to its own 0.82 point, 25 over 25 plus 5.42: there festival-aligned and the copy cost
      about Rs 8.8 lakh each and the vendor Rs 10.0 lakh. These weeks hold no festival, so only the
      festival can separate festival-aligned from the copy, and the plan books festival-aligned raised
      toward its 0.82 point, because a late shipment costs about 4.6 times a spare one.
    wrong:
      a: >-
        Festival-aligned has the lowest mean miss, but priced it costs Rs 13.5 lakh against the
        vendor's Rs 11.9 lakh, and a plan at the forecast itself sits short in about half the weeks,
        the costly side.
      b: >-
        The vendor is cheap on these weeks only because it runs high on the cheap side; at its own
        0.82 point it costs more, and its 22 percent was never tested on a festival.
      c: >-
        Signed misses cancel: festival-aligned's 40,748 high and 45,248 low net to almost nothing,
        while the packing floor pays for every one of them.
    answer: >-
      I fix the measure before scoring, in the business's unit, then price each direction of miss and
      compare forecasts at the quantile the two costs set, never at the raw error alone.
