    key: b
    anchor: >-
      A guesstimate: how many drivers must be online at the evening peak?
    exhibit:
      caption: >-
        Delhi Metro's published counts and how DMRC counts a journey, each in the words its source
        uses, checked 13 October 2026.
      table:
        head:
          - Count
          - Value
          - When
          - Source
        rows:
          - [Average daily passenger journeys, 64.06 lakh, "the current average, August 2026", "The Tribune, 9 August 2026, citing DMRC"]
          - [Passenger boardings, "82,44,903", "17 September 2026, DMRC's highest-ever day, during a bus strike", "Republic World, 18 September 2026, quoting DMRC"]
          - [How a journey is counted, "One for each line, or corridor, a passenger uses to reach the destination", "PTI's report of DMRC's method, 30 August 2023", "Deccan Herald, reporting PTI"]
          - [Line uses and riders when the line count began, "45,35,932 line uses on 29 May; nearly 27 lakh commuters a day on the network in February", "2018, PTI's report of 30 May 2018", "LatestLY, reporting PTI"]
    text: |-
      A pair's chain puts Delhi Metro at about 60 lakh rider trips on a weekday, each trip counted once from the gate where the rider enters to the gate where they leave (invented). They set it against Exhibit 2C, call their estimate 6 to 27 percent low, and raise it. Which reading of the check holds?
      (a) Converted at 2018's mix of line uses to riders, the record day's 82,44,903 passenger boardings are about 49 lakh trips, so the chain runs about 22 percent high and is checked down.
      (b) Converted at 2018's mix of line uses to riders, the average day's 64.06 lakh journeys are about 38 lakh trips, so the chain runs about 57 percent high and is checked down.
      (c) Set against the average day alone, since 17 September was a record during a strike, 64.06 lakh puts the chain 6 percent low, so it is raised to about 64 lakh.
      (d) Set against the record day, the busiest day the network has carried, 82,44,903 puts the chain 27 percent low, so it is raised toward 82 lakh.
    why: >-
      Two things are wrong with the pair's check, and both have to be fixed. DMRC's journeys count
      each line a passenger uses to reach a destination, so a trip with one change of line counts
      twice (Deccan Herald, reporting PTI, 30 August 2023, checked 13 October 2026), and the chain
      counts trips gate to gate. When DMRC began counting lines, in 2018, it read 45,35,932 line uses
      on 29 May against nearly 27 lakh commuters a day in February (PTI, 30 May 2018, via LatestLY,
      checked 13 October 2026), about 1.68 line uses a rider. At that mix the average day's 64.06
      lakh journeys are about 38 lakh trips, and the chain's 60 lakh runs about 57 percent high, so
      its trips per person are checked and the answer moves down, never up. The conversion is rough,
      two counts from different months of 2018, and the call does not hang on it: any mix above
      about 1.07 line uses a rider puts the average day below 60 lakh trips. The check also needs an
      ordinary day: 82,44,903 was one record day, during a bus strike, so it checks nothing about a
      weekday. Tuesday's deck teaches the check in the chapter on The guesstimate: clarify, map,
      calculate, validate, where a published number is read in its own unit before the answer
      moves toward it, and Monday's deck uses Delhi Metro's count in the chapter on Definitions:
      numerator, denominator, window, exclusions.
    wrong:
      a: >-
        The unit is converted and the day is wrong: 17 September 2026 was a record during a bus
        strike, so it cannot check an ordinary weekday, and on the average day the chain runs about
        57 percent high.
      c: >-
        The record day is set aside and the unit is not: 64.06 lakh counts each line a rider uses, so
        setting it against trips gate to gate makes a chain that runs high look low.
      d: >-
        Both mistakes at once: a record strike day, counted by line, set against an ordinary
        weekday's trips counted gate to gate.
    answer: >-
      I validate in the unit the estimate counts and on an ordinary period, so I convert a published
      count to my unit before I move my answer toward it, and I set a record day aside.
