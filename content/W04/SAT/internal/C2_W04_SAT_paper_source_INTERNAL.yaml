  - id: ctr-slot
    label: "Read the strip by slot"
    type: One correct option
    level: Hard
    min: 3.5
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: b
    anchor: >-
      Support, confidence, lift: which one cannot be fooled by popularity, and why?
    exhibit:
      caption: >-
        Click-through by slot on the strip, the three weeks before the switch on 7 September 2026 and
        the three weeks after. Before the switch, milk was suggested only in slot 3, on 2 percent of
        the strip's impressions.
      table:
        head:
          - Slot
          - Milk's share of the slot's impressions, after
          - Click-through on milk, after
          - Click-through on other items, before
          - Click-through on other items, after
        rows:
          - [Slot 1, 70 percent, 1.4 percent, 7.5 percent, 8.2 percent]
          - [Slot 2, 50 percent, 1.1 percent, 6.1 percent, 6.8 percent]
          - [Slot 3, 30 percent, 0.9 percent, 4.9 percent, 5.4 percent]
          - [The strip, "50 percent, from 2 before", "1.2 percent, 1.2 before", 6.2 percent, 6.4 percent]
    text: |-
      The growth lead's draft for the category manager reads: "Shoppers clicked the strip less after the monsoon, so the strip needs a redesign." Using Exhibit 3B, which reading holds?
      (a) Shoppers' habits changed after the monsoon: the strip's click-through fell from 6.1 to 3.8 percent, and every slot shows the same fall.
      (b) No row clicks less than before; the fall is milk's share of impressions, and slot 1, with milk on 70 percent of them, loses most.
      (c) Slot 3 is the weak slot: its click-through on other items is the lowest of the three, so the strip should drop to two slots.
      (d) Milk's own click-through collapsed after the switch, so toned milk should leave the strip and the curated list should come back.
    why: >-
      Milk's click-through held at 1.2 percent and other items rose from 6.2 to 6.4, so no row fell;
      what changed is milk's share of the impressions, from 2 to 50 percent, and half the impressions
      at 1.2 with half at 6.4 is the strip's 3.8. By slot, the clicks lost to milk per 100 impressions
      are its share times the gap: 0.70 times (8.2 less 1.4), about 4.76 in slot 1; 0.50 times (6.8
      less 1.1), about 2.85 in slot 2; and 0.30 times (5.4 less 0.9), about 1.35 in slot 3. So slot 1
      loses most, and ranking by lift above a support floor recovers most there.
    wrong:
      a: >-
        Every row held or rose; the strip's rate fell because milk took half the impressions, so the
        habit story names a cause the rows refuse.
      c: >-
        Slot 3 clicks lowest because it is the third slot, before and after the switch; it loses the
        fewest clicks to milk, about 1.35 per 100 impressions.
      d: >-
        Milk clicked at 1.2 percent before and after; it was always the weak suggestion, and the
        ranking put it in half the impressions.
    answer: >-
      Before I name a cause for a blended rate I split it into its parts; here every part held and
      the mix moved, so the fix is the ranking, starting with slot 1.
  - id: heavy
    label: "Allow for heavy buyers"
    type: One correct option
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Wed
    key: c
    anchor: >-
      Support, confidence, lift: which one cannot be fooled by popularity, and why?
    exhibit:
      caption: >-
        Two pairs in September 2026's 40,000 Pune carts from 12,000 customers. The top tenth of
        customers, 1,200 of them, place 38 percent of all carts and 73 percent of the carts that
        hold chips and cold drink together.
      table:
        head:
          - Pair
          - Carts with the first item
          - Carts with the second item
          - Carts with both
          - Lift with chance counted within each cart's size
          - The same, with each customer also counted once
        rows:
          - [Chips and cold drink, "4,800", "4,920", "2,000", "2.48", "1.95"]
          - [Onions and tomatoes, "8,800", "8,000", "3,000", "1.38", "1.38"]
    text: |-
      The strip gives a slot only to a pair with a lift of at least 1.5, above a support floor of 1 percent of carts. Exhibit 3C holds two pairs' counts and their lifts recomputed for cart size and for heavy buyers. Which pairs keep a slot?
      (a) Both: per cart they read 3.39 and 1.70, both above 1.5 and above the floor, and the recomputed lifts only restate the same carts.
      (b) Neither: 73 percent of the chips-and-cold-drink carts come from a tenth of the customers, so its lift belongs to a few heavy buyers.
      (c) Chips and cold drink only: it holds 1.95 after both corrections, while onions and tomatoes falls from 1.70 to 1.38.
      (d) Onions and tomatoes only: its lift moved least when recomputed, from 1.70 to 1.38, so it is the steadier pair to give the slot.
    why: >-
      Per cart, chips and cold drink has a support of 2,000 over 40,000, 5.0 percent, against chance's
      0.12 times 0.123, so a lift of 3.39; onions and tomatoes, 7.5 percent against 0.22 times 0.20,
      a lift of 1.70. Both clear the floor. Heavy buyers repeat a pair across many carts, and bigger
      carts hold any pair by chance, so the expected count is sized by each cart and each customer
      counted once. Corrected for both, chips and cold drink still reads 1.95 and keeps its slot;
      onions and tomatoes reads 1.38, below the 1.5 rule, and loses its slot. Amazon's team met the
      same problem and measured the increased likelihood of buying an item with any given purchase,
      which scales heavy buyers down (Amazon Science, checked 13 October 2026).
    wrong:
      a: >-
        Both clear 1.5 only per cart; a lift inflated by heavy buyers and big carts is the number the
        corrections exist to check, and onions and tomatoes fails it.
      b: >-
        73 percent from the top tenth inflates the lift, and the correction removes that: chips and
        cold drink still reads 1.95 with each customer counted once and cart size allowed for.
      d: >-
        A small move proves nothing; onions and tomatoes ends at 1.38, below the strip's 1.5, which
        is what decides the slot.
    answer: >-
      Lift divides by the base rate, and the base rate itself must be measured per customer and per
      cart size, or heavy buyers make every pair look stronger than it is.
  - id: watch
    label: "Judge two thin pairs"
    type: True or false
    level: Hard
    min: 3
    tag: "[F]"
    roles: BA
    day: Wed
    key: a
    anchor: >-
      A pair has lift 4 and support 0.3 percent; act or not?
    exhibit:
      caption: >-
        Two pairs with a high lift. Ice cream is in 4 percent of Pune carts.
      table:
        head:
          - Pair
          - Where
          - Holding both
          - Out of
          - Lift
        rows:
          - [Car phone mount and car charger, "Kalpa Retail, the lab's consumer baskets", "2 baskets", "812", "4.0"]
          - [Ice cream and chocolate sauce, "Swiggy Instamart, Pune, September", "100 carts", "40,000", "4.6"]
    text: |-
      Statement: a pair with a lift of about 4 and a support of about 0.25 percent belongs on a watch list before it belongs in a campaign. Judge it on both pairs in Exhibit 3E. True or false, and why?
      (a) True: Kalpa's pair rests on 2 baskets, where one basket moves its lift by half, and Instamart's real 100 carts sit beside ice cream alone.
      (b) True: both pairs have the same support of 0.25 percent, so both are equally doubtful, and both should be dropped from the strip and from Kalpa's plan.
      (c) False: a lift of 4 is four times what chance gives, and a lift that far above 1 earns a campaign slot whatever the pair's support turns out to be.
      (d) False: Instamart's 100 carts are enough to act on, so its pair goes straight into the strip while Kalpa's pair waits for more baskets to arrive.
    why: >-
      True. Both pairs have a support of 0.25 percent, 2 of 812 and 100 of 40,000, and each waits for
      evidence before it gets a campaign. Kalpa's lift rests on 2 baskets, so one basket more makes it
      6 and one fewer makes it 2. Instamart's pair is real, 100 carts against the 22 chance gives,
      but the strip would show it only beside ice cream, about 2,400 of 60,000 cart-page views a day
      if views follow carts; it goes to a small test in which a random half of shoppers in two zones
      see it, with the decision rule fixed before it starts. Wednesday's lab put the car pair on its
      watch list for the same reason.
    wrong:
      b: >-
        The same support does not make the pairs equally doubtful: 100 carts are a real pair and 2
        baskets are not, and a watch list keeps both for evidence instead of dropping them.
      c: >-
        A lift on a handful of baskets moves by luck, and a slot a pair cannot fill earns nothing
        however high its lift.
      d: >-
        100 carts show the pair is real; they cannot show that suggesting sauce sells sauce, which
        only a test of the suggestion can.
    answer: >-
      A high lift on a thin support goes on a watch list with a test designed for it; it earns a slot
      when the test shows the suggestion adds margin.
  - id: margin
    label: "Price the bundle slot"
    type: One correct option
    level: Hard
    min: 3.5
    tag: "[F]"
    roles: BA, FDE
    day: Wed
    key: c
    anchor: >-
      How would you turn a basket analysis into a recommendation with a number?
    text: |-
      Swiggy's shareholder letter for April to June 2025 describes Maxxsaver, a discount unlocked once a cart passes a set size, as handing part of the larger basket's margin back to the user. A growth lead proposes a bundle slot on the same logic, with these invented numbers: 30,000 cart-page views a day; 5 percent of views click the slot; half the clicks add the item; the item sells for Rs 30 and earns Rs 10 of margin before a Rs 3 bundle discount; and half of the adds would have happened anyway, through search or habit. What is the slot worth a day?
      (a) Rs 22,500: the 750 adds a day at the item's Rs 30 price, the sales the slot rings up at the till
      (b) Rs 5,250: the 750 adds a day at the Rs 7 left after the discount, every add counted as new
      (c) Rs 1,500: the 375 new adds' Rs 10 of margin, less the Rs 3 discount paid on all 750 adds
      (d) Rs 2,625: the 375 new adds at the Rs 7 left after the discount, paid on those adds alone
    why: >-
      30,000 views times 5 percent is 1,500 clicks, and half add the item: 750 adds a day. Half of
      them would have happened anyway, so the slot creates 375, each worth Rs 10 of margin, Rs 3,750.
      The Rs 3 discount is paid on every bundled add, the 375 that would have happened anyway
      included: 750 times Rs 3 is Rs 2,250. The slot is worth Rs 3,750 less Rs 2,250, Rs 1,500 a day.
      Swiggy's letter (checked 13 October 2026) describes Maxxsaver as returning part of the larger
      basket's margin to the user; the week's reading of it is that the discount is a cost line on
      every cart that takes it.
    wrong:
      a: >-
        Rs 22,500 is the till's sales, and a slot is worth the margin it adds, never the sales it
        rings up.
      b: >-
        Rs 5,250 counts every add as new; half would have come anyway, so only 375 add margin.
      d: >-
        The discount is paid on all 750 bundled adds, including the 375 that would have happened
        anyway, so pricing it on the new adds alone misses Rs 1,125 a day.
    answer: >-
      A slot's value is the incremental adds times their margin, less the discount paid on every add
      that takes it, and only a holdout measures the incremental share.
  # ---------------------------------------------------------------- Part 4, Thursday
  - id: funnel-units
    label: "Read the flow two ways"
    type: One correct option
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Thu
    key: d
    anchor: >-
      Retention dropped; walk me through your investigation.
    exhibit:
      caption: >-
        Zomato Gold members in Chennai, September 2026: the order flow counted in sessions and in
        members. The home carousel opens a restaurant's menu without a search.
      table:
        head:
          - Step
          - Sessions that reached it
          - Members who reached it
        rows:
          - [Open, "194,211", "49,822"]
          - [Search, "131,974", "45,865"]
          - [Menu view, "155,729", "46,477"]
          - [Add to cart, "52,948", "28,351"]
          - [Checkout start, "42,358", "25,740"]
          - [Order placed, "27,212", "21,574"]
    text: |-
      The membership lead's chart for September reads "search to menu view: 118 percent" and "menu view to add-to-cart: 34 percent, the biggest loss". Exhibit 4C counts the same flow two ways. Which reading holds?
      (a) Menu view to add-to-cart is the loss: at 34 percent it is the lowest step of the flow, so the menu pages are the first thing to fix.
      (b) Every step should be divided by the 194,211 sessions that opened the app, which puts search at 68, menu view at 80 and add-to-cart at 27 percent.
      (c) A step above 100 percent means the event log counts menu views twice, so every count after search is suspect until the log is rebuilt.
      (d) Units are mixed and one step is an artefact: carousel menus skip search, so that step tops 100 percent; per member, menu to cart is 61 percent.
    why: >-
      Each step is over the step before, in one unit. Per session, search to menu view is 155,729
      over 131,974, 118 percent, because the carousel opens menus without a search: search is a step
      members can skip, an artefact and no gain. Menu view to add-to-cart is 34 percent per session
      and 61 per member, 28,351 over 46,477, because a member browses several menus across sessions
      before adding to one cart. A step's level says little about a loss; the loss is where a rate
      changed, for whom and since when, which the next item reads.
    wrong:
      a: >-
        34 percent is per session, and a member browses menus across several sessions; per member
        the step converts 61 percent, and a low step is a loss only when it fell.
      b: >-
        Dividing every step by the opening count hides which step lost whom: each step's base is the
        step before, so the reader sees where people stop.
      c: >-
        The carousel opens menus with no search, so more menu views than searches is the flow itself;
        the order records match the event log, 27,212 member orders in September.
    answer: >-
      Before I blame a stage I name its unit, divide each step by the step before, and check for
      steps people can skip, so an artefact is never read as a loss.
  - id: android
    label: "Find the fix and its cost"
