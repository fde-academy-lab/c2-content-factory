          - ["Finance's rule, the same month last year plus 4 percent", "19.69", 4 percent above, "3.5"]
          - ["Festival-aligned, matched by Diwali, plus 4 percent", "19.69", 4 percent above, "3.5"]
          - [The vendor's curve, "23.09", 22 percent above, "38.8"]
    text: |-
      The plan line for the same six months is Rs 21.77 crore, the months a year earlier plus 15 percent. Anand asks which number goes in front of the board for October 2026 to March 2027, how wrong it could be, and whether the plan line can stand as the board's forecast. Using Exhibits 5A and 5E, which answer holds?
      (a) Rs 19.69 crore, festival-aligned, off by about Rs 3.5 lakh a month on six unseen months, none with a Diwali; the plan line stands as the board's forecast, since it sits inside the forecasts' range, Rs 18.93 to 23.09 crore.
      (b) Rs 19.69 crore, festival-aligned, off by about Rs 3.5 lakh a month on six unseen months, none with a Diwali, about Rs 21 lakh if all six miss one way; the plan sits Rs 2.08 crore above, a target the forecast does not reach.
      (c) Rs 21.39 crore, midway between finance's rule and the vendor's curve, off by about Rs 3.5 lakh a month on six unseen months, none with a Diwali, about Rs 21 lakh if all six miss one way; the plan sits Rs 38 lakh above, within two such errors.
      (d) Rs 21.39 crore, midway between finance's rule and the vendor's curve, off by about Rs 3.5 lakh a month on six unseen months, none with a Diwali; the plan line stands as the board's forecast, since it sits inside the forecasts' range, Rs 18.93 to 23.09 crore.
    why: >-
      Two choices decide the answer. The number is a forecast that was tested: festival-aligned
      matches last year's months by Diwali, books Rs 19.69 crore, and on April to September 2026, six
      months it never saw and none with a Diwali (Exhibit 5A), it missed by about Rs 3.5 lakh a
      month, so the six months could miss by about Rs 21 lakh if every month missed the same way.
      Rs 21.39 crore splits the difference between finance's rule and the vendor's curve, was never
      scored on unseen months and has no error of its own, so the Rs 3.5 lakh in options c and d is
      festival-aligned's, borrowed. Then the plan line: Rs 21.77 crore sits Rs 2.08 crore above
      festival-aligned, about ten times the Rs 21 lakh, so the plan is a target the forecast does not
      reach, and the board hears both numbers apart. The range of the forecasts, Rs 18.93 to 23.09
      crore, measures how far they disagree and is no error: its top end, the vendor's curve, missed
      by Rs 38.8 lakh a month on the same unseen months. The spike month itself is untested, since
      April to September holds no Diwali in any year on Exhibit 5A, and the board is told so;
      finance's rule books the same total with the same miss and puts the spike in October, while
      festival-aligned puts it in November, Diwali's month this year, and the board plans stock and
      staff by month. Friday's deck teaches the error on unseen months in SECTION 3, Holding out;
      MAE and MAPE in the business's units (half one, S22 to S29), and the forecast note's lines in
      SECTION 4, Beating the baseline; the vendor curve tested; the good-enough call and the forecast
      note (S34 to S37), applied to the staffing note in SECTION 7 (half two, S12 to S15).
    wrong:
      a: >-
        The range of the forecasts measures how far they disagree, and its top end missed by Rs 38.8
        lakh a month; festival-aligned's own error, about Rs 21 lakh over six months, leaves the Rs
        2.08 crore gap a target.
      c: >-
        Rs 21.39 crore splits the difference between two forecasts and was never scored on unseen
        months, so the Rs 3.5 lakh is festival-aligned's error, borrowed.
      d: >-
        The midpoint tests neither forecast and borrows festival-aligned's Rs 3.5 lakh, and the range
        of the forecasts measures how far they disagree, never an error.
    answer: >-
      I give the board the forecast that beat the baseline on months it never saw, its error bar in
      rupees with what the bar could not test, and the plan's gap set against that error, so a
      target is never read as a forecast.
