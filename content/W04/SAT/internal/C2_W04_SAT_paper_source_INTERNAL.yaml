    text: |-
      Anand asks which number goes in front of the board for October 2026 to March 2027, and how wrong it could be. Diwali falls on 8 November 2026. Using Exhibit 5E, which sentence answers him?
      (a) "Rs 23.09 crore, the vendor's curve: it fits its 18 fitted months within 1.8 percent, the closest fit of any forecast on the table."
      (b) "Rs 19.69 crore, festival-aligned, spike in November, Rs 2.08 crore under plan; on six unseen months it missed by about Rs 3.5 lakh a month."
      (c) "Rs 21.39 crore, halfway between finance's 4 percent and the vendor's 22, so neither side's error carries the board's number on its own."
      (d) "Rs 19.69 crore, finance's rule, spike in October: finance's rule and festival-aligned agree on the six months, so either may go to the board."
    why: >-
      Festival-aligned puts the spike in November, Diwali's month this year, and books Rs 19.69 crore,
      Rs 2.08 crore under the plan line's Rs 21.77 crore. Its error bar is its own miss on six months
      it never saw, about Rs 3.5 lakh a month, about Rs 21 lakh if all six missed the same way; none
      of those months held a Diwali, so the spike month itself is untested, which the sentence says
      when Anand asks. The vendor misses by Rs 38.8 lakh a month on the same months and the copy
      without growth by Rs 11.7 lakh. Finance's rule books the same total and the wrong month, and the
      board plans stock and staff by month.
    wrong:
      a: >-
        A fit to months it saw is no forecast; on the six it never saw the vendor missed by Rs 38.8
