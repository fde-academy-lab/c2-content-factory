    anchor: >-
      Support, confidence, lift: which one cannot be fooled by popularity, and why?
    exhibit:
      caption: >-
        Click-through by slot on the strip, the three weeks before the switch on 7 September 2026 and
        the three weeks after. Before the switch, milk was suggested only in slot 3, on 2 percent of
        the strip's impressions.
      table:
        head:
          - Slot
          - Milk's share of the slot's impressions, after
          - Click-through on milk, after
          - Click-through on other items, before
          - Click-through on other items, after
        rows:
          - [Slot 1, 70 percent, 1.4 percent, 7.5 percent, 8.2 percent]
          - [Slot 2, 50 percent, 1.1 percent, 6.1 percent, 6.8 percent]
          - [Slot 3, 30 percent, 0.9 percent, 4.9 percent, 5.4 percent]
          - [The strip, "50 percent, from 2 before", "1.2 percent, 1.2 before", 6.2 percent, 6.4 percent]
    text: |-
      The growth lead's draft for the category manager reads: "Shoppers clicked the strip less after the monsoon, so the strip needs a redesign." Using Exhibit 3B, which reading holds, and which slot is fixed first?
      (a) Shoppers clicked less after the monsoon, and slot 1 fell furthest, from 7.5 percent, so slot 1's suggestions are redesigned first.
      (b) Neither milk nor other items click less; milk went from 2 to 50 percent of impressions, so slot 1, at 70 percent milk, is re-ranked first.
      (c) Neither milk nor other items click less; milk went from 2 to 50 percent of impressions, so slot 3, where milk clicks least, at 0.9 percent, is re-ranked first.
      (d) Shoppers clicked less after the monsoon, and slot 3's milk clicks least, at 0.9 percent, so slot 3's suggestions are redesigned first.
    why: >-
      Milk's click-through held at 1.2 percent and other items rose from 6.2 to 6.4, so no row fell;
      what changed is milk's share of the impressions, from 2 to 50 percent, and half the impressions
      at 1.2 with half at 6.4 is the strip's 3.8. The loss sits where milk displaced the most clicks:
      its share times the gap it opens, 0.70 times (8.2 less 1.4), about 4.76 clicks per 100
      impressions in slot 1; 0.50 times (6.8 less 1.1), about 2.85 in slot 2; and 0.30 times (5.4
      less 0.9), about 1.35 in slot 3. So slot 1 is re-ranked first, by lift above a support floor.
      Milk clicks least in slot 3, at 0.9 percent, and slot 3 still loses the fewest clicks to milk,
      since milk holds only 30 percent of its impressions.
      Wednesday's deck teaches the popular partner in SECTION 4, The confidence trap; lift near one
      (half one, S21 to S25), and finds the strip's fall in SECTION 8 (S52 to S55, with D54 on slot
      1).
    wrong:
      a: >-
        Slot 1 did fall furthest, and the cause is milk's 70 percent share of its impressions; milk
        held at 1.2 percent and other items rose in every slot, so no shopper habit changed.
      c: >-
        Milk's 0.9 percent in slot 3 is the lowest rate, and the loss is share times gap: milk costs
        slot 3 about 1.35 clicks per 100 impressions against 4.76 in slot 1, so slot 1 comes first.
      d: >-
        Every row held or rose, so the habit story names a cause the rows refuse, and milk's low rate
        in slot 3 sits on its smallest share, the slot that loses least to milk.
    answer: >-
      Before I name a cause for a blended rate I split it into its parts; here every part held and
      the mix moved, so the fix is the ranking, starting with slot 1.
