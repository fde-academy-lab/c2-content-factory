  - id: swiggy
    label: "Read the weaned cohort"
    type: One correct option
    level: Medium
    min: 3.5
    tag: "[F]"
    roles: BA, DS
    day: Thu
    key: a
    anchor: >-
      How would you use cohort analysis to find a retention issue?
    exhibit:
      caption: >-
        An invented cohort of ten users: how many were active in each quarter after joining, before
        and after its five weakest users were weaned away.
      table:
        head:
          - Quarter after joining
          - "1"
          - "2"
          - "3"
          - "4"
        rows:
          - ["All ten users, active", "7", "5", "4", "3"]
          - ["The five kept after the weakest five are weaned away, active", "5", "5", "4", "3"]
    text: |-
      Swiggy's shareholder letter for July to September 2025 says it "weaned away certain users from the platform with low potential Lifetime values", and it prints a table of Instamart cohort spend indexed to one cohort's first quarter. Exhibit 4E is invented. A deck shows this cohort's third quarter after the weakest five are weaned away and calls it strong retention. What does the third quarter read for the ten who joined and for the five kept, and what do you ask before trusting a published cohort chart?
      (a) 40 percent of the users who joined and 80 percent of those kept; ask what each cell divides by, users who joined or kept, and whether it counts users, orders or spend.
      (b) 40 percent of the users who joined and 80 percent of those kept; ask whether the cohort was acquired in a sale quarter, which would explain a strong cohort.
      (c) 40 percent of the users who joined and 60 percent of those kept; ask what each cell divides by, users who joined or kept, and whether it counts users, orders or spend.
      (d) 40 percent of the users who joined and 60 percent of those kept; ask whether the cohort was acquired in a sale quarter, which would explain a strong cohort.
    why: >-
      In the third quarter 4 of the cohort's users are active: 4 of the 10 who joined is 40 percent,
      and 4 of the 5 who stayed is 80. Letting the weak users go doubles that cell and every later one
      with nobody's behaviour changing. So before trusting a published cohort chart, ask what it
      divides by, users who joined or users who stayed, and what it counts, users, orders or spend.
      Swiggy's letter (Q2 FY26, checked 13 October 2026) indexes each cohort's spend to the Q4 FY24
      cohort's first quarter and states no denominator; the question is fair to ask of it, and the
      invented cohort says nothing about Swiggy's own numbers.
      Thursday's deck teaches the cohort table in SECTION 1, Cohort construction (half one, S6 to
      S12), and the weaned users in the fallback's SECTION 12 (fallback S1 to S3), which runs if the
      faculty block slips.
    wrong:
      b: >-
        A cell that doubles when weak users leave has to say what it divides by and what it counts
        before its shape is read, and the acquisition quarter explains nothing about a cell that
        rose with nobody's behaviour changing.
      c: >-
        60 percent is the fourth quarter, 3 of 5; the third quarter's 4 of 5 is 80.
      d: >-
        60 percent reads the fourth quarter, and the acquisition quarter is a second question that
        cannot explain a cell lifted by dropping users.
    answer: >-
      I ask a cohort chart its denominator and its measure before I read its shape, since dropping
      weak users lifts every later cell with nobody's habit changing.
