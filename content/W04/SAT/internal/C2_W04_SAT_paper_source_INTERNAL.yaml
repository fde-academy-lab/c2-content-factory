  - id: m5
    label: "Answer the sponsor"
    type: One correct option
    level: Medium
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Fri
    key: a
    anchor: >-
      A vendor promises 22 percent growth; how do you test the claim?
    exhibit:
      caption: >-
        The M5 forecasting competition, 2020: Walmart's daily unit sales of 3,049 products, every
        entry scored on 28 days it never saw. From the official scores workbook and the accuracy
        paper, checked 13 October 2026.
      table:
        head:
          - Entry
          - Average error, lower is better
        rows:
          - [The winning team, "0.520"]
          - ["Seasonal naive, the same day of the week before", "0.847"]
          - ["Multilayer perceptron, a machine-learning benchmark", "0.977"]
          - ["Random forest, a machine-learning benchmark", "1.010"]
          - ["Naive, the last day seen", "1.752"]
    text: |-
      The vendor's sponsor says: "Our curve fits two years of Lucknow's weeks within 2 percent, and machine learning won M5, so the curve should go to the plan." Using Exhibit 5C, which test must the curve pass before it goes to the plan?
      (a) Hold back the latest thirteen weeks, and send the curve to the plan only if it beats the seasonal naive on those weeks.
      (b) Hold back thirteen weeks drawn at random from the two years, and send the curve to the plan only if it beats the seasonal naive on those weeks.
      (c) Hold back the latest thirteen weeks, and send the curve to the plan only if it beats the naive on those weeks.
      (d) Hold back thirteen weeks drawn at random from the two years, and send the curve to the plan only if it beats the naive on those weeks.
    why: >-
      A fit is no forecast, so the curve is tested the way the plan will use it, and two choices
      decide the test. Where: the plan books weeks after the data ends, so the curve is fitted on the
      earlier weeks and scored on the latest weeks it never saw. Weeks drawn at random from the two
      years sit between weeks the curve was fitted on, so scoring there measures how well it fills
      gaps, close to its fit; Makridakis and colleagues found on 1,045 monthly series that the models
      that fitted best did not necessarily forecast best (PLOS ONE, 2018, checked 13 October 2026).
      Against what: on M5's unseen days the seasonal naive scored 0.847 and beat both
      machine-learning benchmarks on Exhibit 5C, 0.977 and 1.010, while every other entry on the
      exhibit beat the naive's 1.752, so on seasonal weeks beating the naive proves little; only 1,972 of the
      5,507 teams, 35.8 percent, beat the seasonal naive (the M5 accuracy paper, checked 13 October
      2026). The top entries that did win were machine learning, which is why the test is the same
      for any model. Friday's thirteen hidden weeks ran this test: the vendor's curve fitted its 91
      training weeks within 1.4 percent and missed the hidden weeks by 16,400 shipments a week
      against the same-week copy's 9,831, almost all of it too high. Those weeks, beginning 29 June to
      21 September 2026, hold no festival; Exhibit 5D does not print their dates, so give them when the
      room asks. A rolling origin that takes in 2025's festival is the next test, which Friday's
      fallback runs.
      Friday's deck teaches the held-back latest weeks in SECTION 3, Holding out; MAE and MAPE in
      the business's units (half one, S22 to S29), the bar in SECTION 2, Naive, seasonal naive and
      drift baselines (S14 to S21), and the curve tested in SECTION 4 (S30 to S37) and SECTION 6 (S49
      to S59).
    wrong:
      b: >-
        Weeks drawn at random sit between weeks the curve was fitted on, so the score measures how
        well it fills gaps, close to its fit; the plan needs the weeks after the data, so the latest
        weeks are held back.
      c: >-
        Every other entry on Exhibit 5C beat the naive's 1.752, while the seasonal naive's 0.847 beat both
        machine-learning benchmarks, so on seasonal weeks the seasonal naive is the bar.
      d: >-
        Random weeks score a gap-filling fit, and the naive is the bar every other entry on Exhibit
        5C cleared; the test is the latest weeks against the seasonal naive.
    answer: >-
      I score every model, of any family, on the latest periods it never saw, against the naive and
      the seasonal naive, before its fit counts for anything.
