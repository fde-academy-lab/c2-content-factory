    anchor: >-
      Present a recommendation to a non-technical stakeholder in two minutes.
    text: |-
      A colleague cites Amazon's 2017 letter to shareholders, which says Amazon's meetings start with a six-page memo read in silence, use no slides, and that a great memo probably takes a week or more to write. Statement: the city head's Thursday review should get a memo in place of the one slide. True or false, and why?
      (a) True: a memo forces full sentences where bullets hide the reasoning, so it beats a slide in any meeting, whatever the slot it is given.
      (b) True: a memo can carry all three appendix pages in its body, so no role's question is left without its answer in the room.
      (c) False: the letter says Amazon reads its memos after the meeting has ended, so a memo would leave the room no time to argue at the review.
      (d) False: the ask is one slide in five minutes, and the letter itself says a great memo probably takes a week or more to write.
    why: >-
      False. The ask is one slide, five minutes, at Thursday's review, and the letter's own key point
      is that a great memo probably should take a week or more (Amazon's 2017 letter to shareholders,
      filed 18 April 2018, checked 13 October 2026). A memo serves a reader with an hour and a writer
      with a week; the city head asked for five minutes. The afternoon's written case was the memo form
      of the same answer, for a reader with the time to read it.
      Tuesday's deck teaches it in the chapter on The AI-free written business case, where Amazon's
      memo sits.
    wrong:
      a: >-
        Full sentences are the memo's strength, and the format still has to fit the reader's slot; a
        five-minute review is no place for six pages.
      b: >-
        The appendix pages exist for questions a role will ask; folding them into a memo makes every
        reader read every role's answer before the claim.
      c: >-
        The letter says the memo is read in silence at the start of the meeting, so this reason gets
        the source wrong.
    answer: >-
      I choose the form the decision-maker asked for: a slide for five minutes, and a memo for the
      reader who has an hour, written by someone who has a week.
  - id: estimate-order
    label: "Order the estimate"
    type: Order the steps
    level: Medium
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Tue
    key: b, d, e, a
    anchor: >-
      A guesstimate: how many drivers must be online at the evening peak?
    text: |-
      The city head's afternoon ask is roughly how many drivers must be online at the weekday evening peak to keep the median rider wait under five minutes. The guesstimate runs clarify, map, calculate, validate: four of these six steps make it, and two would spoil it. Leave those two out and write the other four in the order they run.
      (a) Re-run the chain at Exhibit 1A's 1.90 trips per peak online hour before the launch, which gives about 5,000 drivers
      (b) Ask whether it is drivers online at one moment or across the window, which window, which product, and the city's median or every zone's
      (c) Re-run the chain at Exhibit 1A's 2.13 rider requests per peak online hour before the launch, which gives about 4,500 drivers
      (d) Write the formula: drivers online equal trips to serve in an hour, over trips one online driver completes in an hour, times a buffer for the busiest half hour
      (e) Work it aloud: about 8,330 evening trips an hour over 1.68 trips per online driver-hour is about 4,960, and 15 percent more for the busiest half hour is about 5,700
      (f) Re-run the chain at Exhibit 1A's 1.58 trips per peak online hour after the launch, the latest weeks, which gives about 6,100 drivers
    why: >-
      Clarify (b), map (d), calculate (e), validate (a). The chain's numbers are assumptions said
      aloud: about 1 crore people, 1 weekday Uber trip for every 100 people, a quarter of the day's
      trips in the three evening hours, 2.4 trips an hour for a busy driver with about 30 percent of
      online drivers idle at a moment, so 1.68 trips per online driver-hour, and a buffer of 1.15. The
      check sets the assumed 1.68 against a measured rate in the same unit, trips per peak online
      hour, from weeks that met the goal without paying for idle hours: 1.90 before the launch, at a
      4.8-minute median wait. Re-run there, 8,333 trips over 1.90 times 1.15 is about 5,040, so the
      answer moves down to about 5,000. Two checks spoil it, each a mistake analysts make. Step c
      re-runs the chain on rider requests per online hour, a different unit: requests ran above trips
      (251,910 against 224,200 before the launch), so 2.13 overstates what an online hour completes
      and the answer lands near 4,500. Step f takes the latest weeks, and Exhibit 1A shows why they
      mislead: after the launch the guarantee paid for online hours that carried no trips, so 1.58
      counts idle hours the wait did not need, and the extra hours bought 0.2 minutes, 4.8 to 4.6;
      re-run at 1.58 the chain asks for about 6,100 drivers, the idle tail included. Tuesday's deck
      teaches the four steps in the chapter on The guesstimate: clarify, map, calculate, validate,
      and Monday's deck the idle hours the guarantee paid for.
    wrong:
      c: >-
        Rider requests per online hour is the wrong unit for a chain that counts trips served;
        requests ran above trips before the launch, so the re-run lands near 4,500 for the wrong
        reason.
      f: >-
        1.58 is the rate after the guarantee paid for online hours that carried no trips, so it
        counts idle hours the wait did not need: the extra hours bought 0.2 minutes. The weeks
        before the launch held the wait at 4.8 minutes at 1.90.
    answer: >-
      Clarify the moment and the window, say the formula, calculate aloud with a unit on every
      factor, then validate against a measured figure in the same unit, from a period that met the
      goal without the distortion I am sizing.
  - id: four-checks
    label: "Check four sources"
    type: More than one correct
    level: Medium
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Tue
    key: a, c
    anchor: >-
      A guesstimate: how many customers could a new store sign up to a loyalty tier in its first year?
    text: |-
      Before the review, a colleague lines up five checks on four numbers. Three come from published sources: NPCI counted 24.07 billion UPI transactions in September 2026, "averaging 802 million daily transactions" (Outlook Money, 2 October 2026); "Flipkart recorded 6.3 million concurrent users in a minute" (Flipkart Stories, 9 October 2026); and DMart's FY26 total revenue was Rs 66,968 crore, with 85 stores added to reach 500 (Avenue Supermarts, 2 May 2026). The fourth is a city invented for a drill. Which checks are sound? Mark every correct option.
      (a) UPI, September 2026: 24.07 billion transactions over the month's 30 days, 802 million a day, set against an estimate of payments a day
      (b) Flipkart, 9 October 2026: 63 million concurrent users in a minute as the festive season opened, set against an estimate of users online at peak
      (c) DMart, FY26: Rs 66,968 crore over the year's average of 415 and 500 stores, about Rs 146 crore a store, set against an estimate of revenue a store
      (d) A city of two million people, invented for a drill: 5 lakh households at four people to a household, set against an estimate of the city's UPI users
      (e) UPI, September 2026: the same 802 million a day, set against an estimate of the payments made on Diwali day itself
    why: >-
      Two hold. NPCI's 24.07 billion for September 2026, over that month's 30 days, is the 802 million
      a day Outlook Money reported (2 October 2026, checked 13 October 2026), and a per-day estimate
      is compared per day. DMart's revenue spread over the stores open across the year, the average
      of 415 and 500, gives about Rs 146 crore a store (Avenue Supermarts, 2 May 2026, checked 13
      October 2026). It is a rough check: 58 of the 85 new stores opened in the last quarter, so with
      openings spread evenly the year held about 439 store-years, about Rs 152 crore each, and a
      first-year estimate sits below either figure. Flipkart's own words say 6.3 million concurrent
      users in a minute, and 63 is the number in the post's web address, a decimal point lost. The
      drill city's households are right at 5 lakh, and households are not users: a household of four
      holds several people who pay, so the check sets households against people.
      Tuesday's deck teaches the validate step and its sanity tests in the chapter on The
      guesstimate: clarify, map, calculate, validate, and the lab checks Anand's new store against
      DMart.
    wrong:
      b: >-
        The post's own words, printed in the stem, say 6.3 million (Flipkart Stories, 9 October 2026,
        checked 13 October 2026); 63 is the figure in its web address, so the check runs ten times
        high.
      d: >-
        Two million over four is 5 lakh households, and an estimate of UPI users counts people,
        several to a household, so the check sets households against people.
      e: >-
        The unit matches and the period does not: 802 million is September's average day, and a
        festival day's payments are a different period, so the check would pull a sound Diwali-day
        estimate down toward an ordinary day.
    answer: >-
      Before I validate against a published number I read the source's own words, its unit and its
      period, and I check that my estimate is counted the same way.
