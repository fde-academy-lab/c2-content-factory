  - id: swiggy
    label: "Ask for the denominator"
    type: One correct option
    level: Hard
    min: 3.5
    tag: "[F]"
    roles: BA, DS
    day: Thu
    key: a
    anchor: >-
      How would you use cohort analysis to find a retention issue?
    exhibit:
      caption: >-
        An invented cohort of ten users: how many were active in each quarter after joining, before
        and after its five weakest users were weaned away.
      table:
        head:
          - Quarter after joining
          - "1"
          - "2"
          - "3"
          - "4"
        rows:
          - ["All ten users, active", "7", "5", "4", "3"]
          - ["The five kept after the weakest five are weaned away, active", "5", "5", "4", "3"]
    text: |-
      Swiggy's shareholder letter for July to September 2025 says it "weaned away certain users from the platform with low potential Lifetime values", and its table of Instamart cohort spend states no denominator. Exhibit 4E is invented. A deck shows this cohort's third quarter after the weakest five are weaned away and calls it strong retention. What does the third quarter read on each base, and what do you ask before trusting a published cohort chart?
      (a) 40 percent per user who joined, 80 per user who stayed; ask what the cells divide by and whether they count users, orders or spend.
      (b) 80 percent on both bases, since the five weaned users had stopped ordering anyway; ask only which quarter the cohort was acquired in.
      (c) 40 percent per user who joined and 60 per user who stayed; ask whether every cohort in the table is indexed to the same first quarter.
      (d) 80 percent per user who joined and 40 per user who stayed; ask whether the weaned users were counted twice in the table's cells.
    why: >-
      In the third quarter 4 of the cohort's users are active: 4 of the 10 who joined is 40 percent,
      and 4 of the 5 who stayed is 80. Letting the weak users go doubles that cell and every later one
      with nobody's behaviour changing. So before trusting a published cohort chart, ask what it
      divides by, users who joined or users who stayed, and what it counts, users, orders or spend.
      Swiggy's letter (Q2 FY26, checked 13 October 2026) indexes each cohort's spend to the Q4 FY24
      cohort's first quarter and states no denominator; the question is fair to ask of it, and the
      invented cohort says nothing about Swiggy's own numbers.
    wrong:
      b: >-
        On the base of users who joined, the five weaned users stay in the denominator, so the cell
        reads 40 percent; only the base of users who stayed reads 80.
      c: >-
        60 percent is the fourth quarter, 3 of 5; the third quarter's 4 of 5 is 80.
      d: >-
        The bases are swapped: dividing by the 10 who joined gives the lower number, 40 percent.
    answer: >-
      I ask a cohort chart its denominator and its measure before I read its shape, since dropping
      weak users lifts every later cell with nobody's habit changing.
  - id: kalpa-window
    label: "Answer the app team"
    type: One correct option
    level: Hard
    min: 3.5
    tag: "[D]"
    roles: BA
    day: Thu
    key: c
    anchor: >-
      The app team says the funnel stage you blamed is fine; what evidence do you bring to the meeting?
    exhibit:
      caption: >-
        Kalpa Retail's Retail-Plus tier in the app, as Thursday's lab found it. Blended retention,
        the members who joined before the month and opened the app in it, read 41 percent in July,
        August and September 2026.
      table:
        head:
          - Stretch of 2026
          - Carts
          - Checkouts
          - Add-to-cart to checkout
        rows:
          - [Before 20 August, "34", "28", 82 percent]
          - [20 August to 9 September, "12", "10", 83 percent]
          - ["10 to 30 September, the auto-reorder window", "11", "7", 64 percent]
    text: |-
      The app team says the auto-reorder feature has been fixed and asks the head of Retail-Plus to close the ticket, since blended retention has not moved. Which reply holds on Exhibit 4F?
      (a) Close it: blended retention held at 41 percent across the window, so the app lost no members and the step needs no further look.
      (b) Blame the monsoon cohort: August's members joined weakest, so the window's lost checkouts came from them and the app is not involved.
      (c) Keep it open: checkout per cart fell inside the window, 7 of 11 against 10 of 12, about 2 short; check the step and read three more weeks.
      (d) Rebuild checkout now: a 19-point fall is the largest move in the tier's funnel, and a full three-week window of carts is enough to act on.
    why: >-
      Checkout per cart fell from 82 and 83 percent to 64 inside the window, which is the stage's
      conversion by date that settles the dispute. It rests on 11 carts: at the earlier 10 in 12,
      about 9 would have checked out and 7 did, so about 2 checkouts are missing in three weeks. The
      call is to flag the step with its dates and counts and read the next three weeks before anyone
      rebuilds it. Blended retention cannot see a step inside a session, so its flat 41 percent says
      nothing about the checkout.
    wrong:
      a: >-
        Retention counts members who opened the app at all, so a member who opened it and failed to
        check out still counts as retained; the step fell while the blend held.
      b: >-
        The window's carts came from members of every cohort, and the fall sits in one step inside one
        window; a cohort's weakness is a different question.
      d: >-
        Eleven carts and about 2 missing checkouts are a reason to look, never to rebuild; the next
        three weeks confirm or clear it.
    answer: >-
      I show the step by date, with its counts, concede that a small window could be noise, and ask
      for the weeks that would confirm it before anything is rebuilt.
  # ---------------------------------------------------------------- Part 5, Friday
  - id: calendar
    label: "Move the spike"
    type: Applied maths
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Fri
    key: >-
      Seasonal naive: October Rs 427.6 lakh and November Rs 297.0 lakh, which puts the spike in
      October. Festival-aligned for November, Diwali's month in 2026: October 2025's Rs 427.6 lakh
      times 1.04, about Rs 444.7 lakh. The spike belongs in November.
    anchor: >-
      What baseline must any forecast beat, and why?
    exhibit:
      caption: >-
        Kalpa Retail's revenue in October and November, Rs lakh, from Friday's lab.
      table:
        head:
          - Month
          - "2024"
          - "2025"
        rows:
          - [October, "415.1", "427.6"]
          - [November, "286.8", "297.0"]
    text: |-
      Anand's board line needs October and November 2026. Using Exhibits 5A and 5B, give the seasonal naive for both months, then the festival-aligned copy, last year's Diwali month plus 4 percent, for whichever 2026 month holds Diwali, and say which month should carry the festival's spike.
    why: >-
      The seasonal naive copies the same month a year earlier: October 2026 gets October 2025's Rs
      427.6 lakh and November gets Rs 297.0 lakh, so it puts the spike in October. Diwali fell in
      October in 2024 and 2025 and falls on 8 November 2026, so the copy carries a festival month into
      a month with no festival. The festival-aligned copy gives November 2026, Diwali's month, last
      year's Diwali month: Rs 427.6 lakh times 1.04, about Rs 444.7 lakh. Accept the three numbers to
