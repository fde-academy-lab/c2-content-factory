notes:
  1:
    label: "Complete the north-star line"
    bank: mon-words
    min: 1.5
    why: >-
      A north star names the outcome a plan exists to move, and a guardrail is a number that must not
      get worse while it rises, so it catches a harmful way of hitting the north star. On Monday's
      redesign the north star was completed peak trips per enrolled driver online at peak each week,
      and its guardrails were the share of offers accepted, the rider's wait by zone and the top-up
      per completed trip. Leading inputs move before the north star and proxies stand in for it, and
      neither catches harm. The singular words in the bank, window, baseline and target, do not fit
      the plural blank.
      Monday's deck teaches it in the chapter on North-star and guardrail metrics.
    answer: >-
      The north star is the outcome the plan exists for, and each guardrail catches one cheap way of
      hitting it, so I name the cheap way beside each guardrail.
  2:
    label: "Complete the definition"
    bank: mon-words
    min: 1.5
    why: >-
      A complete definition names its numerator, its denominator, its window and its exclusions, and
      the window is the period counted, which decides what a before-and-after comparison holds.
      Kalpa's growth-plan comparison started on 20 August because the monsoon sale ended on 19
      August, so the sale's extra orders sat in neither window. A baseline is what a number is
      compared with, and a target is what the plan hopes it reaches; neither is part of the
      definition. Guardrails sit beside a definition as numbers of their own, and each word in the
      bank is used once, so guardrails belongs to Q1.
      Monday's deck teaches it in the chapter on Definitions: numerator, denominator, window,
      exclusions.
    answer: >-
      A number is computable once its numerator, denominator, window and exclusions are written down,
      and it is safe to pay for once its guardrails are.
  29:
    label: "Say what stays"
    level: Medium
    why: >-
      The method carries over: the metric written with its numerator, denominator and window; a
      guardrail the people measured cannot move; and a test against a baseline before any lift is
      trusted. What changes is the cost of an error, since a nudge toward a loan that defaults costs
      Kalpa Financial Services twenty times what it loses by passing over a good customer, so the
      rupee cost of a wrong nudge in each direction is the line Rohan Desai's version rewrites. On the
      Retail tables a wrong nudge cost a discount and some annoyance, so the same threshold would sit
      in a very different place.
      Each method comes from its day: the definition and the guardrail from Monday's chapters on
      Definitions: numerator, denominator, window, exclusions and North-star and guardrail metrics,
      and the test against a baseline from Wednesday's SECTION 6 (half one, S31 to S35) and Friday's
      SECTION 4 (half one, S30 to S37).
    wrong:
      c: >-
        The rupee cost of a wrong nudge is the line that changes most: in lending a wrong approval
        costs twenty times a wrongful rejection, while on the Retail tables a wasted nudge costs a
        small discount and some annoyance, so the threshold moves.
    answer: >-
      The definition, the guardrail and the baseline test travel with me; what I rewrite for lending
      is the price of each error, because a bad nudge there costs twenty times a missed good one.
  30:
    label: "Compute the confidence"
    why: >-
      Confidence of case, then charger, counts the charger among the baskets that hold the case: 165
      of 200, 0.825. It answers how reliably a case basket holds a charger, and it says nothing yet
      about chance, which is the next item.
      Wednesday's deck teaches it in SECTION 2, Confidence: how reliably together? (half one, S11 to
      S15).
    answer: >-
      Confidence shrinks the world to the baskets that hold A and asks how often B is there too.
  31:
    label: "Compute the lift"
    why: >-
      Lift divides the confidence by the charger's own share of baskets: 0.825 over 0.85 is 0.97, the
      same as 165 seen against the 170 chance gives (1,000 times 0.2 times 0.85). It is symmetric, so
      the charger buyers' share of cases gives the same 0.97. Wednesday's lab found the same shape on
      Kalpa's own baskets: the charger in 84.5 percent of the 812 consumer baskets, and the screen
      protector toward it at a confidence of 0.82 and a lift of 0.97.
      Wednesday's deck teaches it in SECTION 3, Chance and lift: more often than chance? (half one,
      S16 to S20).
    answer: >-
      Lift is the pair's count over the count chance gives, so a partner that is in almost every
      basket reads a high confidence and a lift of about 1.
  32:
    label: "Make the call to merchandising"
    level: Medium
    why: >-
      A lift of 0.97 means case buyers take a charger slightly less often than shoppers in general, so
      a bundle would pay a discount on chargers the case buyers were buying anyway and sell no extra
      one. The confidence of 0.825 looks strong only because the charger is in 85 percent of all
      baskets. The lab's three lines for merchandising were the same call on the lab's own counts:
      refuse the charger bundle, promote the wireless earphones with their case (lift 3.1 at a
      support of 6 percent, 49 baskets, three-quarters of them Retail-Plus) and watch the car pair.
      Wednesday's deck teaches it in SECTION 4, The confidence trap; lift near one (half one, S21 to
      S25), and the lab makes the same call on Kalpa's charger.
    wrong:
      a: >-
        More than 80 percent of case buyers take a charger because more than 80 percent of everyone
        does; confidence is the measure a popular partner fools.
      b: >-
        1,000 baskets support a lift well enough when the pair sits in 165 of them; a small sample
        is the problem of a pair in two or three baskets.
      d: >-
        A deeper discount spends more margin on chargers that would have sold anyway, and a lift
        below 1 is the weakest pairing in the data, never the strongest.
    answer: >-
      High confidence toward a popular item is a base rate, so I divide by it: a lift below 1 refuses
      the bundle, whatever the confidence says.
  33:
    label: "Compute May's blend"
    why: >-
      May's blend weights each cohort by its size: 500 of A's 1,000 and 1,140 of B's 3,000 retain,
      1,640 of 4,000, 41 percent. Averaging the two rates without weights gives 44, which is the
      mean of ratios the week kept refusing.
      Thursday's deck teaches it in SECTION 3, Blended numbers against cohort truth (half one, S20
      to S26).
    answer: >-
      A blended rate is the cohorts' rates weighted by their sizes, so I add the members first and
      divide once.
  34:
    label: "Compute June's blend"
    level: Medium
    why: >-
      June adds cohort C: 460 of A, 1,050 of B and 950 of C's 2,000 retain, 2,460 of 6,000, 41
      percent again. Both old cohorts fell, A from 50 to 46 and B from 38 to 35, and the new cohort in
      its first month lands above the old blend, so the blend holds.
      Thursday's deck teaches it in SECTION 3, Blended numbers against cohort truth (half one, S20
      to S26).
    answer: >-
      A new cohort in its strong first month props up a blend while every old cohort falls, so I read
      each cohort at the same age before I read the blend.
  35:
    label: "Choose the honest headline"
    level: Medium
    min: 3
    why: >-
      A and B both fell, A from 50 to 46 and B from 38 to 35, and C, a third of June's members in its
      first month, held the blend up; the headline names the fall and its cause. Without C, June's
      blend is A's 460 and B's 1,050 retained of their 4,000 members, 1,510 of 4,000, about 37.8
      percent, which is the size of what C hid. Zomato Gold's dashboard did the same in Chennai,
      holding month-two retention at 38 percent while each signup month's month one fell from 58
      percent in January to 49 in July, and Kalpa's Retail-Plus tier held flat in July, August and
      September while every cohort fell, which Thursday's lab found. Fixing each member's entry month
      is what lets the decline show.
      Thursday's deck teaches it in SECTION 3, Blended numbers against cohort truth (half one, S20
      to S26), and reads Gold's flat 38 the same way in SECTION 6 (S45 to S54).
    wrong:
      b: >-
        40.5 averages A's 46 and B's 35 as if the two cohorts were the same size, and B is three
        times A, so the weighted blend is 1,510 of 4,000, about 37.8 percent.
      c: >-
        C's 47.5 in June sits above both existing cohorts in the same month, 46 and 35, so C is what
        holds the blend up; the comparison sets C's June beside A's May, a different month, and
        leaves out B, three times A's size.
      d: >-
        C retains above both existing cohorts in June, so it props the blend, and 40.5 averages two
        cohorts of very different sizes.
    answer: >-
      A flat blend over falling cohorts is a mix effect, so I say the cohorts fell, size the fall
      without the newcomers, name the cohort that propped the blend, and show each at the same age.
  41:
    label: "Give two baselines"
    min: 3
    why: >-
      The naive repeats the last month seen, September 2025's Rs 2.1 crore; the seasonal naive
      copies the same month a year earlier, October 2024's Rs 3.2 crore, and both Octobers held
      Diwali, so the copy carries the festival into the right month. The next item asks what the same
      copy does when the festival moves.
      Friday's deck teaches it in SECTION 2, Naive, seasonal naive and drift baselines (half one,
      S14 to S21).
    answer: >-
      Every forecast must beat the naive and the seasonal naive on months it never saw, and the
      seasonal naive is the hard one wherever the season repeats on the calendar.

additions:
  # ---------------------------------------------------------------- Part 1, Monday
  - id: tf-leading
    label: "Judge the statement"
    type: True or false
    level: Easy
    min: 2.5
    tag: "[F]"
    roles: BA
    day: Mon
    key: c
    anchor: >-
      North-star against guardrail, with one example pair.
    text: |-
      The city team's dashboard puts rider requests per peak online hour, zone by zone, beside its north star, completed peak trips per enrolled driver online at peak each week. Statement: a leading indicator moves after the north-star metric has already moved. True or false, and why?
      (a) True: requests per online hour fell from 2.13 to 1.75 over the six weeks after the north star had moved, which is how it confirms the north star.
      (b) True: a leading indicator is read once the quarter's result is in, which is why the dashboard keeps it on the page beside the north star it explains.
      (c) False: it moves first, while the team can act; requests per online hour by zone say where to send drivers before the week's trips are in.
      (d) False: a leading indicator moves in the same week as the north star, since both are counted from that week's completed peak trips in every zone.
    why: >-
      False. A leading indicator moves before the north star, while a team can still act on it; a
      lagging number confirms later. Rider requests per peak online hour, by zone, say where riders
      are waiting before the week's completed trips are counted, so the city can send drivers there.
      It fell from 2.13 to 1.75 because the new online hours went where riders were few, while the
      north star barely moved, from 35.76 to 35.89 trips per online driver-week (Monday's case data).
      Monday's deck teaches it in the chapter on Leading against lagging indicators.
    wrong:
      a: >-
        The north star barely moved, 35.76 to 35.89, so requests per online hour fell without the
        north star moving first; confirming afterwards is what a lagging number does.
      b: >-
        A number read after the quarter's result is in is a lagging number by definition, and it
        arrives too late to change the quarter.
      d: >-
        Requests per online hour divides rider requests by driver hours and never counts trips, and a
        leading number is useful exactly because it moves before the trips do.
    answer: >-
      A leading indicator moves first, while I can still act, so I pick one the team controls this
      week and show the north star it is meant to move.
  - id: twelve-rows
    label: "Read six drivers"
    type: One correct option
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Mon
    key: b
    anchor: >-
      How would you measure the success of a new feature? Walk your metric design.
    exhibit:
      caption: >-
        Six drivers, one week from the six before the launch, the week beginning 10 August 2026, and
        one week from the six after it, the week beginning 21 September 2026. Shamshabad and
        Rajendranagar are two of the city's three outer zones.
      table:
        head:
          - Driver
          - Zone
          - Week
          - Peak online hours
          - Offers shown
          - Offers accepted
          - Completed trips
        rows:
          - [A, Jubilee Hills, before, "10", "24", "21", "21"]
          - [A, Jubilee Hills, after, "11", "25", "22", "22"]
          - [B, Banjara Hills, before, "9", "20", "17", "17"]
          - [B, Banjara Hills, after, "10", "21", "18", "18"]
          - [C, Gachibowli, before, "11", "25", "22", "22"]
          - [C, Gachibowli, after, "12", "26", "23", "23"]
          - [D, Madhapur, before, "10", "22", "19", "19"]
          - [D, Madhapur, after, "11", "23", "20", "20"]
          - [E, Shamshabad, before, "10", "21", "18", "18"]
          - [E, Shamshabad, after, "16", "14", "4", "3"]
          - [F, Rajendranagar, before, "10", "20", "17", "17"]
          - [F, Rajendranagar, after, "14", "12", "3", "2"]
    text: |-
      The city team's note to the city head reads: "Peak online hours up 24 percent: supply target met. We recommend extending the guarantee to two more cities." What do the six drivers in Exhibit 1B show, and which number answers the note?
      (a) Averaged driver by driver, the six fell only to 1.31, less than the totals say, so the reply tells the city head the guarantee cut trips per hour 31 percent across the city.
      (b) Summed, the six fell from 1.90 to 1.19 trips an hour, further than the city's 1.58 on Exhibit 1A, so the reply quotes 1.58 and shows E and F as where hours went.
      (c) Summed, the six fell from 1.90 to 1.19 trips an hour, so the reply tells the city head the guarantee cut trips per hour 37 percent across the city.
      (d) Averaged driver by driver, the six fell only to 1.31, less than the totals say though further than the city's 1.58, so the reply quotes 1.58 and shows E and F as where hours went.
    why: >-
      Summed, the six drivers' hours went from 60 to 74 while their trips fell from 114 to 88, so
      trips per online hour fell from 1.90 to 1.19: add the trips, add the hours, divide once. The
      1.31 is the average of each driver's own rate, which gives a 10-hour week the weight of a
      16-hour week and so understates how far the six fell. The six fall further than the city
      because they were picked to show the mechanism: E and F, in two of the three outer zones, added
      10 hours between them and lost 30 trips, a third of this sample against 15 percent of the
      city's 1,200 drivers in the idle tail (Monday's case data). So the size goes to the city head
      as the city's own 1.90 to 1.58 from Exhibit 1A, about 17 percent, with E and F as where the new
      hours went. The note itself fails the proxy test: a number hit while the outcome got worse.
      Monday's deck teaches the proxy test in the chapter on What to measure and why; the proxy
      test, and runs it on the twelve rows in the first case chapter.
    wrong:
      a: >-
        1.31 averages the drivers' own rates and understates the six's fall, and a 31 percent fall
        told as the city's ignores the 1.58 that Exhibit 1A prints for the city.
      c: >-
        1.19 is right for the six, who were picked to show the mechanism with two outer-zone drivers
        among them; the city's own rate fell to 1.58, about 17 percent, so a 37 percent fall more
        than doubles the city's.
      d: >-
        1.31 averages each driver's own rate, giving a 10-hour week the weight of a 16-hour week, so
        the six fell further than it says: all trips over all hours is 1.19.
    answer: >-
      I add the trips and the hours before I divide, and I size a change on the city's own numbers,
      keeping a hand-picked sample to show where it happened.
  - id: tf-target
    label: "Judge the statement on a case"
    type: True or false
    level: Easy
    min: 2.5
    tag: "[F]"
    roles: BA, FDE
    day: Mon
    key: d
    anchor: >-
      What makes a metric gameable, and how do you write one that is not?
    exhibit:
      caption: >-
        Wells Fargo's cross-sell metric, as the SEC's order of February 2020 (Release 34-88257)
        describes it, checked 13 October 2026.
      table:
        head:
          - Line
          - What the order found
        rows:
          - [What it counted, Accounts and products per retail bank household]
          - [Use, "No usage condition: an unused debit card, the largest product category, could stay in the count for up to four years"]
          - [How staff were judged, "Against sales goals, with the number of products sold a significant criterion in their evaluations"]
          - [What staff did, "Opened accounts customers had not asked for; moved customers' money into new accounts so they counted as funded; changed contact details so satisfaction surveys would not reach customers"]
          - [The 2013 change, "Remittance accounts already open were added to the count without investors being told, giving 0.04 of that year's 0.11 rise in the ratio; the rest of the rise came from more accounts and products inactive for at least 365 days"]
    text: |-
      Statement: any target changes the behaviour of the people who are paid to hit it. Judge it on Exhibit 1C. True or false, and why?
      (a) False: a target changes behaviour only where its rules leave a gap, and the order describes rules that some staff broke, never the target itself.
      (b) False: staff were paid on sales, so the cross-sell count moved only when the bank itself changed the definition, as it did in 2013.
      (c) True: the count rose because customers bought more products, and staff behaviour followed the customers' new demand for accounts.
      (d) True: staff judged on products sold opened accounts nobody asked for, staged funding and dodged the surveys, each to move their count.
    why: >-
      True. Staff measured on the cross-sell count changed what they did to move it, in ways the bank
      never meant: accounts customers had not asked for, money moved in so a new account counted as
      funded, and contact details changed so surveys missed the customers (SEC order, Release
      34-88257, checked 13 October 2026). The same thing happened on a smaller scale in Hyderabad,
      where 180 drivers took their peak online hours to 2.1 times while their trips fell 12 percent.
      The 2016 penalties, the CFPB's USD 100 million with the OCC's USD 35 million and Los Angeles's
      USD 50 million, came to USD 185 million between them by our sum (the CFPB's release of 8
      September 2016, checked 13 October 2026), and the 2020 settlement with the SEC and the Justice
      Department to USD 3 billion.
      Monday's deck teaches it in the chapter on What to measure and why; the proxy test, where
      Wells Fargo is the case, and in the chapter on Gaming, and definitions that resist it.
    wrong:
      a: >-
        The order describes the staff's behaviour moving with the target staff were judged against; a
        gap in the rules is what any target finds, which is the statement's point.
      b: >-
        Staff sales credit rode on the same count, and the count moved with the accounts staff
        opened; the 2013 addition was a second, separate way it rose.
      c: >-
        The order says the accounts were unused, unneeded or unauthorised, so the rise was staff
        behaviour, never customer demand.
    answer: >-
      People paid on a number move it the cheapest way open to them, so I write each definition
      asking how the people measured could raise it without the outcome moving.
  - id: wells-silent
    label: "Choose two additions"
    type: One correct option
    level: Medium
    min: 3.5
    tag: "[F]"
    roles: BA, FDE
    day: Mon
    key: c
    anchor: >-
      What makes a metric gameable, and how do you write one that is not?
    text: |-
      Exhibit 1C's last row is the 2013 change. Which two additions to the ratio's written definition would have shown investors the 0.04, and kept the rest of that year's rise out of the ratio?
      (a) A guardrail on revenue per household, read beside the ratio every quarter on the same households; and an exclusion that drops any product unused for a year
      (b) A guardrail on revenue per household, read beside the ratio every quarter on the same households; and an exclusion that drops the remittance accounts added to the count that year
      (c) A dated log of every change to what is counted, with that year's ratio also on the old definition; and an exclusion that drops any product unused for a year
      (d) A dated log of every change to what is counted, with that year's ratio also on the old definition; and an exclusion that drops the remittance accounts added to the count that year
    why: >-
      Two different things raised the ratio in 2013, and each needs its own addition. The 0.04, about
      36 percent of the 0.11 rise, came from a change of what is counted: remittance accounts that
      already existed joined the count. The addition that shows a change of definition is a dated
      change log, with the year of the change printed on both definitions, so a reader sees a step
      and never reads it as growth; Monday's seven lines ask that each exclusion be dated if it
      changes, and the log keeps that date for every change to what is counted. A guardrail on revenue per household could not show it, since
      accounts that already existed had already earned their revenue, so nothing beside the ratio
      would move when they joined the count; a guardrail is a second number and keeps nothing out of
      the ratio itself. The rest of the rise came from more accounts and products inactive for at
      least 365 days (the SEC's order, Release 34-88257, paragraph 42, checked 13 October 2026), and
      the count carried no condition on use, so an unused debit card could stay in it for up to four
      years. An exclusion that drops any product unused for a year keeps that rest out. Dropping the
      remittance accounts added that year takes out the 0.04 the log exists to show and leaves the
      rest, the products unused for at least 365 days, in the ratio. The order says investors were never told of
      the 2013 addition, which is the breach the change log exists to prevent. Monday's deck teaches
      the four lines of a definition in the chapter on Definitions: numerator, denominator, window,
      exclusions, gaming in the chapter on Gaming, and definitions that resist it, and the page that
      carries both in the chapter on The metric definition artifact.
    wrong:
      a: >-
        Remittance accounts that already existed had already earned their revenue, so revenue per
        household would not move when they joined the count; the 0.04 shows only in a dated log with
        the year's ratio also on the old definition.
      b: >-
        A guardrail beside the ratio would not move when existing accounts joined the count, and
        dropping the remittance accounts takes out the 0.04 itself while the inactive products stay in.
      d: >-
        The log shows the 0.04, and dropping the remittance accounts then takes that same 0.04 out, so
        the rest of the rise, products unused for at least 365 days, stays in the ratio.
    answer: >-
      Every change to what a metric counts goes in a dated change log, with the old definition run
      beside the new for the year it changes, and every count carries an exclusion on use, so neither
      a step nor an unused product is ever read as growth.
  - id: kalpa-sheet
    label: "Mark the definition sheet"
    type: More than one correct
    level: Hard
    min: 3.5
    tag: "[F]"
    roles: BA
    day: Mon
    key: c, d, e
    anchor: >-
      North-star against guardrail, with one example pair.
    exhibit:
      caption: >-
        Kalpa Retail's Retail-Plus tier, 120 members, as Monday's lab found it: 10 to 30 September
        2026 against 20 August to 9 September 2026.
      table:
        head:
          - Measure
          - Window over comparison
        rows:
          - [Reorders placed per member, 1.22 times]
          - [Booked value of those placements per member, 0.96 times]
          - [Placements in the window that became a separate delivered order, "None: every one was an auto-reorder the app placed, then cancelled, merged into a later order or left pending"]
    text: |-
      Meera Raghavan, Kalpa Retail's CEO, wants one number for the growth plan and the numbers that stop it being gamed. The head of Retail-Plus proposed reorders per member, and the lab found Exhibit 1D. Which lines of the plan's definition sheet are right? Mark every correct option.
      (a) North star: reorders placed per Retail-Plus member per month, which the window shows rising 1.22 times
      (b) Leading input: last quarter's audited revenue, broken down by store and by member tier
      (c) Exclusions: placements cancelled, merged into a later order or still pending, so a reorder nobody received never counts
      (d) Guardrail: revenue per active customer, read each month beside the north star on the same members
      (e) Leading input: add-to-cart events per active app member, counted each week from the app's event log
    why: >-
      The lab found placements per member up 1.22 times while their booked value per member fell to
      0.96, and none of the window's placements became an order a member received: the app placed
      low-value reorders on its own. So the exclusions drop placements nobody received (c); revenue
      per active customer guards against frequency bought with small orders (d); and add-to-cart
      events move before the month's delivered orders, while a team can act on them (e). The growth
      plan's north star, as the lab's exercise wrote it, is delivered orders per active customer per
      month.
      Monday's deck teaches the sheet's lines in the chapters on North-star and guardrail metrics,
      Leading against lagging indicators and The metric definition artifact, and the lab finds
      Exhibit 1D.
    wrong:
      a: >-
        Reorders placed is the number the app raised on its own, up 1.22 times with none delivered,
        so it fails the proxy test.
      b: >-
        Last quarter's audited revenue arrives after the quarter has closed, so it is a lagging
        number that can only confirm.
    answer: >-
      My north star counts what the customer received, my exclusions drop what the system did on its
      own, and each guardrail names the cheap way it catches.
  # ---------------------------------------------------------------- Part 2, Tuesday
  - id: slide-order
    label: "Build the slide"
    type: Order the steps
    level: Hard
    min: 3.5
    tag: "[S]"
    roles: BA
    day: Tue
    key: e, b, d, f
    anchor: >-
      Present a recommendation to a non-technical stakeholder in two minutes.
    text: |-
      The one-slide answer runs, from the top: the claim, written as the title; the evidence; the caveat; and the action. Four of these seven lines fill the four slots on Exhibit 2A's numbers, and three would spoil the slide. Leave those three out and write the other four in slot order, from the top.
      (a) Move every driver in every zone to the redesigned pay from Monday; the city head signs
      (b) Bookings per peak online hour fell 17 percent, from Rs 314 to Rs 260, at the same Rs 165 a trip
      (c) Bookings per active driver-week rose 0.8 percent, so the scheme is paying its way
      (d) The monsoon ended inside the six weeks after the launch, and no weeks from last year are in the data
      (e) The guarantee is paying for peak online hours in which drivers complete no trips
      (f) Test the redesigned pay on half the drivers, picked at random, for six weeks; the city head signs
      (g) Bookings per peak online hour fell 21 percent, from Rs 314 to Rs 260, at the same Rs 165 a trip
    why: >-
      The stem prints the slots' order, claim, evidence, caveat, action, so the item is which line
      fills each slot, and three choices decide it. The claim reads the denominator the scheme pays
      for: the guarantee pays per peak online hour, so the title is that it pays for hours that carry
      no trips (e). Bookings per active driver-week rose 0.8 percent, Rs 5,817 to Rs 5,861, only
      because each driver-week carried about four more online hours while each hour earned Rs 54
      less, so a title built on it reads the flattering denominator (c). The evidence is the hour's
      bookings, and a fall is measured against where it started: Rs 314 less Rs 260 is Rs 54, 17
      percent of Rs 314 (b); 21 percent divides the same Rs 54 by the Rs 260 it fell to (g). The
      caveat leaves part of the fall to the season, and the action answers it: a test on half the
      drivers, picked at random, runs the old pay and the new in the same weeks, so the season falls
      on both halves and the difference is the redesign's (f). Moving every driver at once (a) leaves
      nothing to compare with, so the season and the redesign stay mixed. Tuesday's deck teaches the
      four slots in the chapter on The one-slide answer: claim, evidence, caveat, action, and
      Monday's deck the denominator the scheme pays for.
    wrong:
      a: >-
        A city-wide switch from Monday leaves no drivers on the old pay, so the season and the
        redesign stay mixed and the caveat above it goes unanswered; the test on half the drivers
        answers it.
      c: >-
        Bookings per active driver-week rose only because each driver-week carried about four more
        online hours while each hour earned Rs 54 less; the scheme pays per online hour, so this
        title reads the flattering denominator.
      g: >-
        Rs 54 over the Rs 260 the hour fell to is 21 percent; a fall is measured against where it
        started, Rs 54 over Rs 314, 17 percent.
    answer: >-
      Claim in the title, one number with its denominator and its change on the right base, the
      caveat on the page, then the action with its cost and who signs it, an action that answers the
      caveat.
  - id: keep-two
    label: "Keep two elements"
    type: More than one correct
    level: Hard
    min: 2.5
    tag: "[F]"
    roles: BA
    day: Tue
    key: a, c
    anchor: >-
      What do you leave off the slide, and where does it go?
    text: |-
      A second draft argues that riders got little for the Rs 1.9 crore of top-up. Which two elements carry that claim? Mark both; every other element moves to an appendix page headed by the question a named role will ask.
      (a) Median rider wait at peak, 4.8 to 4.6 minutes
      (b) Rider requests at peak, 251,910 to 256,556
      (c) Top-up for each extra trip: Rs 2,836, for a trip worth Rs 165
      (d) Top-up for each completed trip: Rs 82, for a trip worth Rs 165
      (e) The top-up split: 61 percent to driver-weeks under half acceptance
    why: >-
      The claim has two halves. "Riders got little" is what riders received, and the wait barely
      moved, from 4.8 to 4.6 minutes; rider requests are what riders asked for, so they cannot show
      what riders got. "For the Rs 1.9 crore" is the price of what the money bought: Rs 1.9 crore over
      the 6,700 extra peak trips (230,900 against 224,200, Exhibit 1A) is about Rs 2,836 for a trip
      worth Rs 165. Rs 82 a completed trip spreads the same money over all 230,900 trips, though the
      six weeks before carried 224,200 with no top-up at all, so it prices the average trip and hides
      how little the money bought. Requests go to marketing's page, the Rs 82 to finance's and the 61 percent
      split to the page that answers where the money went; the caveat, which this draft does not
      list, would stay on the slide.
      Tuesday's deck teaches it in the chapter on What to leave out, and the appendix.
    wrong:
      b: >-
        Requests count what riders asked for, and they rose 1.8 percent; what riders got is the wait,
        and requests belong on marketing's page.
      d: >-
        Rs 82 spreads the top-up over every completed trip, though the six weeks before carried
        224,200 trips with no top-up; what the Rs 1.9 crore bought is the 6,700 extra trips, Rs 2,836
        each.
      e: >-
        The split says where the money went, which supports a different claim, that the scheme pays
        the idle; it belongs on the page that answers that question.
    answer: >-
      I keep what the claim needs, priced at the margin, and send the rest to one appendix page per
      role, each headed by the question that role will ask; I never send the caveat there.
  - id: concede
    label: "Judge the defence"
    type: True or false
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, FDE
    day: Tue
    key: c
    anchor: >-
      A stakeholder's objection is partly right; how do you answer it?
    exhibit:
      caption: >-
        Uber Hyderabad's peak weeks, the six before the launch on 31 August 2026 and the six after
        it: rider requests at peak and trips per peak online hour, week by week.
      table:
        head:
          - Week beginning
          - Window
          - Rider requests at peak
          - Trips per peak online hour
        rows:
          - [20 July, before, "41,155", "1.88"]
          - [27 July, before, "41,608", "1.91"]
          - [3 August, before, "41,896", "1.89"]
          - [10 August, before, "42,101", "1.92"]
          - [17 August, before, "42,431", "1.93"]
          - [24 August, before, "42,719", "1.88"]
          - [31 August, after, "43,589", "1.64"]
          - [7 September, after, "43,878", "1.59"]
          - [14 September, after, "43,507", "1.57"]
          - [21 September, after, "42,602", "1.55"]
          - [28 September, after, "41,819", "1.56"]
          - [5 October, after, "41,161", "1.56"]
    text: |-
      At the review the finance partner says: "The monsoon ended inside your six weeks, so what your slide shows is the season, not your scheme." Statement: the strongest reply concedes nothing, since any concession hands the objector the meeting. Judge it on Exhibit 2B. True or false, and why?
      (a) True: concede nothing, and show that peak requests rose 1.8 percent over the six weeks after the launch, from 251,910 to 256,556, while trips per peak online hour fell from 1.90 to 1.58.
      (b) True: concede nothing, and show that in the last three weeks peak requests sat back inside their range before the launch while trips per peak online hour held near 1.56.
      (c) False: grant that the rains ended inside the window, then show that in the last three weeks peak requests sat back inside their range before the launch while trips per peak online hour held near 1.56.
      (d) False: grant that the rains ended inside the window, then show that peak requests rose 1.8 percent over the six weeks after the launch, from 251,910 to 256,556, while trips per peak online hour fell from 1.90 to 1.58.
    why: >-
      False. The defence has four moves: restate the objection until its owner agrees, answer from
      the evidence, concede what is true, and say what would change your mind. Finance is partly
      right, since the rains ended inside the six weeks and no weeks from last year are in the data,
      so the true part is conceded in the open. The evidence then has to answer the season where the
      season shows. Over the six weeks requests rose 1.8 percent, but on Exhibit 2B the first three
      weeks after the launch ran 43,507 to 43,878, above every week before it, and then requests fell
      four weeks running from 7 September; the six-week total hides that fall, so it cannot answer an
      objection that the season thinned demand. Even after the fall, the last three weeks ran 41,161
      to 42,602, inside the 41,155 to 42,719 of the six weeks before; the lowest sits only 6 requests
      above that floor, so a learner who reads the last week as back at the floor of the old range has
      read it right. Through those weeks trips per peak online hour held at 1.55 to 1.56 against 1.88
      to 1.93: riders asked as often as before the launch and each online hour still carried fewer
      trips, which a thinner season cannot explain. What would change the analyst's mind is a city where the rains ended and no scheme
      launched, with trips per hour falling as far. Tuesday's deck teaches the four moves in the
      chapter on Defending under challenge: restate, answer, concede, what would change your mind,
      and Monday's deck the window a comparison is read over, in the chapter on Definitions:
      numerator, denominator, window, exclusions.
    wrong:
      a: >-
        Conceding nothing leaves the true part, the rains and the missing weeks from last year,
        unanswered in the room, and the six-week rise comes from the three weeks before requests
        fell four weeks running.
      b: >-
        The evidence is the one that answers the season, and conceding nothing leaves the true part,
        the rains ending inside the window and the missing weeks from last year, unanswered; the claim
        loses the people who already believe it.
      d: >-
        The six-week rise comes from the first three weeks after the launch, before requests fell
        four weeks running from 7 September, so it cannot answer an objection about the season;
        only the last three weeks, back at the old level of demand, can.
    answer: >-
      I restate the objection, concede the true part in the open, answer it from the weeks where the
      other cause would show, and say which fact would change my mind.
  - id: memo
    label: "Judge the memo"
    type: True or false
    level: Easy
