    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, FDE
    day: Thu
    key: b
    anchor: >-
      The app team says the funnel stage you blamed is fine; what evidence do you bring to the meeting?
    exhibit:
      caption: >-
        Add-to-cart to order, per session, 1 August to 13 September 2026 against 14 to 30 September.
        Starting checkout held at 80 percent of carts on every platform; completing a started checkout
        went from 72.5 to 55 percent for Android members, 71 to 70 for iOS members and 65 to 64 for
        non-members on Android. Every Android session moved to the new checkout on 14 September.
      table:
        head:
          - Who
          - Platform
          - Before 14 September
          - From 14 September
        rows:
          - [Members, Android, 58 percent, 44 percent]
          - [Members, iOS, 57 percent, 56 percent]
          - [Members, Web, 55 percent, 55 percent]
          - [Non-members, Android, 52 percent, 51 percent]
    text: |-
      The app team says the new Android checkout cannot be at fault, since non-members use the same checkout and held at 51 percent. Android members reached add-to-cart in 22,841 sessions from 14 to 30 September, 17 days. What is fixed first, and what does the loss cost a week, at Rs 300 to Rs 500 of order value an order?
      (a) The member path of the Android checkout: Android members lose about 3,198 orders a week against their old rate, about Rs 9.6 to 16.0 lakh of order value.
      (b) The member path of the Android checkout: Android members lose about 1,317 orders a week against their old rate, about Rs 4.0 to 6.6 lakh of order value.
      (c) The whole Android checkout, for every user: add-to-cart to order fell for members and non-members alike on Android once the release shipped.
      (d) The August sale cohort: members bought on a discount order less, and their 31 percent month one explains the fall in members' orders.
    why: >-
      The fall sits in one step for one group: completing a started checkout, for Android members,
      from the release date, while iOS members and non-members on the same new checkout held, so the
      break is in what only members see, such as the free-delivery line or the membership check at
      payment. The size: 14 points of 22,841 carts is about 3,198 orders over 17 days, and 7 days of
      17 is about 1,317 a week, Rs 4.0 lakh at Rs 300 and Rs 6.6 lakh at Rs 500. Fixing it ends a
      weekly loss, which is why it goes before the sale cohort's question.
    wrong:
      a: >-
        3,198 is the loss over the 17 days; a week is 7 of them, about 1,317 orders.
      c: >-
        Non-members on Android went from 52 to 51 percent on the same checkout, so the fault is in
        the member path, and rolling back everyone's checkout loses what non-members kept.
      d: >-
        The sale cohort's weak month one is a separate cost; the checkout fall hit members on Android
