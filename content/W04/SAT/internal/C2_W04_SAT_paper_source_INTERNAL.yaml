# Week 4 Saturday: the week's source file, laid on the tracker's bank by
# scripts/build_saturday_paper.py. Block style throughout, so a comma never splits a reason.
#
# The bank sets what is tested and this file sets the bar (decisions saturday-interview-grade,
# saturday-real-cases and saturday-w4-shape in data/programme/facts.yaml). Six parts, named by the
# questions of docs/detailing/W04_analyst_craft_spine.md section 10. Ten bank items print, four of
# them reworded through data/programme/paper_edits.yaml; thirty-two fold into deeper items, each
# with its reason under `folded`; one moves to the stretch page. Twenty-nine new items carry the
# rest, Part 2's seven among them, written by the content team and waiting for the tracker.
#
# Every case number is in a Week 4 day's facts file (content/W04/D{1..5}/internal); every Thursday
# number is from the D4 facts file, and every Delhi Metro or Aced fact from Thursday's sources list,
# never from the case file. Every Kalpa plant printed here was found in that day's TA lab, confirmed
# against its lab note (decision w4-finding-once-found). Every public fact was re-checked on
# 13 October 2026; the URLs and quotes are in internal/C2_W04_SAT_sources_INTERNAL.md, and
# internal/C2_W04_SAT_key_proofs_INTERNAL.py asserts every key that rests on arithmetic.

# The Word paper's first page: "What this paper is for", and the Company row of its Rules table.
purpose: >-
  This week you took five tickets at companies the room uses: Uber's peak-hour guarantee in
  Hyderabad, twice; Swiggy Instamart's bought-together strip in Pune; Zomato Gold's members in
  Chennai; and Flipkart's festive packer plan in Lucknow. Each day the same method ran again on Kalpa
  Retail in the lab. This paper puts the week's calls back to you: which number a scheme should pay
  for, what goes on one slide and how a number sized from nothing is checked, which pairs beat
  chance, where a membership loses people, which forecast goes to the plan, and what changes when the
  method moves to another company. The room's score in each part, set beside the rating you give
  that part in step one, tells Monday's session where to start.
company: >-
  Parts 1 to 5 open on the week's cases at Uber, Swiggy Instamart, Zomato Gold and Flipkart, and
  each is an illustrative case: the company is real, the situation and the data are synthetic, built
  for this class. The Kalpa items continue the labs at Kalpa Retail, where Meera Raghavan is the CEO
  and Anand Iyer the finance controller; the head of Retail-Plus, the merchandising team and the app
  team are named by role. Part 6 moves to Kalpa's other units: Rohan Desai, head of risk at Kalpa
  Financial Services; Dr Priya Menon, COO of Kalpa Health; Ananya Bose, COO of Kalpa Connect; and the
  head of operations at Kalpa Logistics, named by role. Items that use a public case (Wells Fargo,
  Delhi Metro, Flipkart, NPCI's UPI count, DMart, Amazon, Swiggy and the M5 competition) give the
  source beside the fact, and every number an item needs is on the page.

# Shared lettered lists, printed once above the first item that answers from them.
banks:
  mon-words:
    style: words
    options:
      - proxies
      - window
      - leading inputs
      - baseline
      - guardrails
      - target
  sat-briefs:
    style: match
    instruction: >-
      Each numbered row is the first question of a Kalpa brief. Write the letter of the week's
      method that answers it. Each letter is used once at most, and two are not used.
    options:
      - a copy aligned to the festival, planned toward the costlier side
      - cohorts by start month, each read at the same age
      - the average of each row's own rate across the table
      - a definition whose window the measured cannot move, with a guardrail
      - each funnel step over the step before, in one unit
      - lift above a support floor, valued in margin

# The printed order. Bank items by number, the additions by id.
parts:
  - title: Which number should the plan chase, and which should a scheme pay for?
    shows: whether you can write a metric a team cannot hit while the outcome gets worse, and read what a gamed one did
    intro: >-
      On Monday 31 August 2026 Uber's Hyderabad city team launched a peak-hour earnings guarantee
      for enrolled drivers: a floor of Rs 300 per peak online hour, with Uber paying the gap between
      a driver's trip earnings in the peak window and the floor as a top-up. The launch note's goal
      was more drivers on the road at peak, so riders are picked up faster. Exhibit 1A sets the six
      weeks after the launch against the six weeks before. The city head must decide whether to
      extend the scheme to two more cities. Illustrative case: the company is real, the situation and
      the data are synthetic, built for this class. In the lab the same method ran on Kalpa Retail,
      where the head of Retail-Plus had proposed reorders per member as the growth plan's number.
    exhibits:
      - caption: >-
          Uber Hyderabad's peak-hour guarantee, the six weeks beginning 20 July 2026 against the six
          beginning 31 August 2026, the launch day.
        table:
          head:
            - Measure
            - Six weeks before
            - Six weeks after
          rows:
            - ["Peak online hours, all enrolled drivers", "118,000", "146,300"]
            - [Completed peak trips, "224,200", "230,900"]
            - [Trips per peak online hour, "1.90", "1.58"]
            - [Rider requests at peak, "251,910", "256,556"]
            - [Rider requests per peak online hour, "2.13", "1.75"]
            - [Offers accepted over offers shown, "0.86", "0.73"]
            - ["Median rider wait at peak, minutes", "4.8", "4.6"]
            - [Top-up paid, Rs 0, Rs 1.9 crore]
    items: [1, 2, "new:tf-leading", "new:twelve-rows", "new:tf-target", "new:wells-silent", "new:kalpa-sheet"]
  - title: Can the number survive the room, and can you size a city from nothing?
    shows: whether you can put one claim on one slide, defend it without retreating, and size a number from nothing with a check in the right unit
    intro: >-
      On Tuesday the city head asked for Monday's redesign on one slide at Thursday's city review:
      five minutes, with the driver-operations lead, the marketing lead and the finance partner in
      the room, each of whom loses something under it. The redesign pays per completed peak trip,
      with a floor on the share of offers a driver accepts. The number the slide must explain is in
      Exhibit 2A. In the afternoon the city head asked a second question with no dataset: roughly how
      many drivers must be online at the weekday evening peak to keep the median rider wait under
      five minutes. Illustrative case: the company is real, the situation and the data are
      synthetic, built for this class. In the lab each learner presented Kalpa's north star on one
      slide to a Kalpa head, then sized Anand's new-store question against DMart.
    exhibits:
      - caption: >-
          The same peak bookings read three ways, Uber Hyderabad, the six weeks before the launch and
          the six weeks after.
        table:
          head:
            - Read
            - Six weeks before
            - Six weeks after
          rows:
            - [Bookings per peak online hour, Rs 314, Rs 260]
            - [Bookings per active driver-week, "Rs 5,817", "Rs 5,861"]
            - [Bookings per completed trip, Rs 165, Rs 165]
    items: ["new:slide-order", "new:keep-two", "new:concede", "new:memo", "new:estimate-order", "new:four-checks", "new:metro"]
  - title: Which pairs beat chance, and what is a slot worth?
    shows: whether you can tell a pair that beats chance from one that rides a popular item, and put a slot's value in margin
    intro: >-
      Swiggy Instamart's cart page in Pune shows a strip of three suggested items under the cart.
      Until 6 September 2026 the strip was a curated list by category; from Monday 7 September it
      ranked items by how often they sit in the same cart as the items already in it, counted over
      the previous four weeks. Toned milk is in 71 percent of Pune carts, so it now appears beside
      nearly everything, and the strip's click-through, clicks over impressions, fell from 6.1
      percent in the three weeks before the switch to 3.8 percent in the three weeks after. The
      category manager and the growth lead want the pairs the strip should show and a rupee value on
      a slot. Illustrative case: the company is real, the situation and the data are synthetic,
      built for this class. In the lab Kalpa Retail's merchandising team wanted every product paired
      with the Rs 199 phone charger, "because it is in 80 percent of baskets".
    exhibits:
      - caption: >-
          Swiggy Instamart, Pune: the ticket's headline numbers.
        table:
          head:
            - Measure
            - Value
          rows:
            - [Carts in the September sample, "40,000 carts from 12,000 customers in eight zones"]
            - [Carts holding toned milk, 71 percent]
            - ["Strip click-through, 17 August to 6 September", 6.1 percent]
            - ["Strip click-through, 7 to 27 September", 3.8 percent]
    items: ["new:ctr-slot", "new:heavy", 30, 31, 32, "new:watch", "new:margin"]
  - title: Where is the tier losing people?
    shows: whether you can separate a cohort problem from an everyone problem and find the step that changed, in the right unit
    intro: >-
      Zomato Gold's membership dashboard for Chennai reports month-two retention flat at 38 percent
      in June, July, August and September 2026: of the members two or more months past their signup
      month, the share who ordered in the month. Exhibit 4A gives each signup month's own month-one
      rate. The August cohort signed up in a sale week on a discounted first month. On Monday 14
      September 2026 a new checkout flow shipped on Android. The membership lead asks whether it is a
      cohort problem or an everyone problem, which step of the order flow owns the loss, and what
      should be fixed first. Illustrative case: the company is real, the situation and the data are
      synthetic, built for this class. In the lab the head of Retail-Plus put the same questions
      about Kalpa Retail's tier.
    exhibits:
      - caption: >-
          Zomato Gold, Chennai: members by signup month in 2026, and the share who ordered in month
          one, the calendar month after signup. 53,089 members joined from January to September.
        table:
          head:
            - Signup month
            - Members
            - Ordered in month one
          rows:
            - [January, "4,854", 58 percent]
            - [February, "5,055", 56 percent]
            - [March, "5,449", 55 percent]
            - [April, "4,859", 53 percent]
            - [May, "4,905", 52 percent]
            - [June, "4,821", 50 percent]
            - [July, "5,057", 49 percent]
            - [August, "13,000", 31 percent]
    items: [33, 34, 35, "new:funnel-units", "new:android", "new:swiggy", "new:kalpa-window"]
  - title: Which forecast earns the plan's trust?
    shows: whether you can choose a forecast on weeks it never saw, place the festival in the right month and price a miss in each direction
    intro: >-
      Flipkart's Lucknow fulfilment centre has 104 weeks of outbound shipments, the weeks beginning
      30 September 2024 to 21 September 2026. The planner must book packer shifts for the eight
      festive weeks beginning 12 October to 30 November 2026, and a packer packs about 120 shipments
      a shift. Finance's rule is the same weeks last year plus 4 percent; a vendor's curve promises
      22 percent more. Every forecast was also scored on the thirteen weeks beginning 29 June to 21
      September 2026, which it never saw. Diwali's dates are in Exhibit 5A. Illustrative case: the
      company is real, the situation and the data are synthetic, built for this class. In the lab
      Anand Iyer, Kalpa Retail's finance controller, had the same choice for the board: two
      forecasts eighteen points apart.
    exhibits:
      - caption: >-
          Diwali in the Government of India's holiday lists for 2024, 2025 and 2026 (DoPT, as
          reproduced by staffnews.in, checked 13 October 2026).
        table:
          head:
            - Year
            - Diwali
            - The week it falls in
          rows:
            - ["2024", Thursday 31 October 2024, the week beginning 28 October 2024]
            - ["2025", Monday 20 October 2025, the week beginning 20 October 2025]
            - ["2026", Sunday 8 November 2026, the week beginning 2 November 2026]
    items: [41, "new:calendar", "new:m5", "new:asym", "new:kalpa-board"]
  - title: What changes when the method moves company?
    shows: whether you can carry the week's methods to another company and name what changed, the metric, the constraint and the cost of an error
    intro: >-
      This afternoon's spoken drill hands each pair of groups a one-paragraph brief, at another
      company the room uses or at one of Kalpa's other units, and every answer names the metric, the
      constraint and the cost of an error that changed, what stays, and what would change back on
      the Retail tables. This part puts the same move to you on paper. Kalpa Financial Services is
      Rohan Desai's payments and lending business; Kalpa Logistics moves parcels, and its head of
      operations is named by role; Kalpa Health, whose COO is Dr Priya Menon, runs laboratories and
      patient service centres that test US patients and bill US payers in dollars; and Kalpa Connect,
      whose COO is Ananya Bose, runs telecom and subscriptions. The briefs are illustrative.
    exhibits:
      - caption: >-
          The week's five tickets, each found at one company, and the Kalpa units this part carries
          them to.
        mermaid: |-
          flowchart TB
            W["The week's five tickets"] --> M["Mon, Uber, Hyderabad:<br/>the number a scheme pays for"]
            W --> T["Tue, the same case:<br/>one slide, a number from nothing"]
            W --> X["Wed, Swiggy Instamart, Pune:<br/>pairs beyond chance, a slot in margin"]
            W --> H["Thu, Zomato Gold, Chennai:<br/>cohorts against the blend"]
            W --> F["Fri, Flipkart, Lucknow:<br/>a baseline that beats the fit"]
            M --> K["Kalpa's other units: Financial Services,<br/>Logistics, Health and Connect"]
            T --> K
            X --> K
            H --> K
            F --> K
    items: [29, "new:brief-logistics", "new:brief-health", "new:brief-connect", "new:brief-finance", "new:amazon"]

