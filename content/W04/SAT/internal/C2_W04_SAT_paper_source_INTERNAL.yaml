folded:
  3:
    into: "32"
    why: The call on the case and the charger turns on a lift of 0.97 against a confidence of 0.825, and the reason for option a, the most tempting wrong answer, is that confidence is the measure a popular item fools, so lift is the one that is not fooled.
  4:
    into: "32"
    why: The key reads the lift of 0.97 as case buyers taking a charger about as often as chance alone gives, slightly less, which is what a lift of about 1 means.
  5:
    into: "35"
    why: The honest headline needs each cohort read from the month its members joined, and its reason names the entry moment as what fixes a cohort.
  6:
    into: "41"
    why: The item asks for the seasonal naive by name and keys it as the same month a year earlier, which is the blank bank 6 fills.
  7:
    into: "new:kalpa-board"
