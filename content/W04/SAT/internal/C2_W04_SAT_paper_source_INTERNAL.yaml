notes:
  1:
    label: "Complete the north-star line"
    bank: mon-words
    min: 1.5
    why: >-
      A north star names the outcome a plan exists to move, and a guardrail is a number that must not
      get worse while it rises, so it catches a harmful way of hitting the north star. On Monday's
      redesign the north star was completed peak trips per enrolled driver online at peak each week,
      and its guardrails were the share of offers accepted, the rider's wait by zone and the top-up
      per completed trip. Leading inputs move before the north star and proxies stand in for it, and
      neither catches harm. The singular words in the bank, window, baseline and target, do not fit
      the plural blank.
    answer: >-
      The north star is the outcome the plan exists for, and each guardrail catches one cheap way of
      hitting it, so I name the cheap way beside each guardrail.
  2:
    label: "Complete the definition"
    bank: mon-words
    min: 1.5
    why: >-
      A complete definition names its numerator, its denominator, its window and its exclusions, and
      the window is the period counted, which decides what a before-and-after comparison holds.
      Kalpa's growth-plan comparison started on 20 August because the monsoon sale ended on 19
      August, so the sale's extra orders sat in neither window. A baseline is what a number is
      compared with, and a target is what the plan hopes it reaches; neither is part of the
      definition. The plural words in the bank do not fit the singular blank.
    answer: >-
      A number is computable once its numerator, denominator, window and exclusions are written down,
      and it is safe to pay for once its guardrails are.
  29:
    label: "Say what stays"
    why: >-
      The method carries over: the metric written with its numerator, denominator and window; a
      guardrail the people measured cannot move; and a test against a baseline before any lift is
      trusted. What changes is the cost of an error, since a nudge toward a loan that defaults costs
      Kalpa Financial Services twenty times what it loses by passing over a good customer, so the
      rupee cost of a wrong nudge in each direction is the line Rohan Desai's version rewrites. On the
      Retail tables a wrong nudge cost a discount and some annoyance, so the same threshold would sit
      in a very different place.
    wrong:
      c: >-
        The rupee cost of a wrong nudge is the line that changes most: in lending one direction costs
        twenty times the other, where Retail's two errors cost about the same.
    answer: >-
      The definition, the guardrail and the baseline test travel with me; what I rewrite for lending
      is the price of each error, because a bad nudge there costs twenty times a missed good one.
  30:
    label: "Compute the confidence"
    why: >-
      Confidence of case, then charger, counts the charger among the baskets that hold the case: 165
      of 200, 0.825. It answers how reliably a case basket holds a charger, and it says nothing yet
      about chance, which is the next item.
    answer: >-
      Confidence shrinks the world to the baskets that hold A and asks how often B is there too.
  31:
    label: "Compute the lift"
    why: >-
      Lift divides the confidence by the charger's own share of baskets: 0.825 over 0.85 is 0.97, the
      same as 165 seen against the 170 chance gives (1,000 times 0.2 times 0.85). It is symmetric, so
      the charger buyers' share of cases gives the same 0.97. Wednesday's lab found the same shape on
      Kalpa's own baskets: the charger in 84.5 percent of the 812 consumer baskets, and the screen
      protector toward it at a confidence of 0.82 and a lift of 0.97.
    answer: >-
      Lift is the pair's count over the count chance gives, so a partner that is in almost every
      basket reads a high confidence and a lift of about 1.
  32:
    label: "Make the call to merchandising"
    level: Medium
    why: >-
      A lift of 0.97 means case buyers take a charger slightly less often than shoppers in general, so
      a bundle would pay a discount on chargers the case buyers were buying anyway and sell no extra
      one. The confidence of 0.825 looks strong only because the charger is in 85 percent of all
      baskets. The lab's three lines for merchandising were the same call on Kalpa's real counts:
      refuse the charger bundle, promote the wireless earphones with their case (lift 3.1 at a
      support of 6 percent, 49 baskets, three-quarters of them Retail-Plus) and watch the car pair.
    wrong:
      a: >-
        More than 80 percent of case buyers take a charger because more than 80 percent of everyone
        does; confidence is the measure a popular partner fools.
      b: >-
        1,000 baskets support a lift well enough when the pair sits in 165 of them; a small sample
        is the problem of a pair in two or three baskets.
      d: >-
        A deeper discount spends more margin on chargers that would have sold anyway, and a lift
        below 1 is the weakest pairing in the data, never the strongest.
    answer: >-
      High confidence toward a popular item is a base rate, so I divide by it: a lift below 1 refuses
      the bundle, whatever the confidence says.
  33:
    label: "Compute May's blend"
    why: >-
      May's blend weights each cohort by its size: 500 of A's 1,000 and 1,140 of B's 3,000 retain,
      1,640 of 4,000, 41 percent. Averaging the two rates without weights gives 44, which is the
      mean of ratios the week kept refusing.
    answer: >-
      A blended rate is the cohorts' rates weighted by their sizes, so I add the members first and
      divide once.
  34:
    label: "Compute June's blend"
    level: Medium
    why: >-
      June adds cohort C: 460 of A, 1,050 of B and 950 of C's 2,000 retain, 2,460 of 6,000, 41
      percent again. Both old cohorts fell, A from 50 to 46 and B from 38 to 35, and the new cohort in
      its first month lands above the old blend, so the blend holds.
    answer: >-
      A new cohort in its strong first month props up a blend while every old cohort falls, so I read
      each cohort at the same age before I read the blend.
  35:
    label: "Choose the honest headline"
    why: >-
      A and B both declined, and C, a third of June's members in their first and strongest month,
      held the blend at 41 percent; the headline names the decline and its cause. Zomato Gold's
      dashboard did the same in Chennai, holding month-two retention at 38 percent while each signup
      month's month one fell from 58 percent in January to 49 in July, and Kalpa's Retail-Plus tier
      read 41 percent in July, August and September while every cohort fell, which Thursday's lab
      found. Fixing each member's entry month is what lets the decline show.
    wrong:
      b: >-
        C retains better only because it is in its first month; read at the same age, every cohort
        here falls.
      c: >-
        A flat 41 percent hides two falling cohorts, so a plan that changes nothing keeps losing the
        members already in.
      d: >-
        The blend is consistent: it is the sizes times the rates, and 1,640 over 4,000 and 2,460 over
        6,000 are both 41 percent.
    answer: >-
      A flat blend over falling cohorts is a mix effect, so I say the cohorts fell, name the cohort
      that propped up the blend, and show each at the same age.
  41:
    label: "Give two baselines"
    min: 3
    why: >-
      The naive repeats the last month seen, September 2025's Rs 2.1 crore; the seasonal naive
      copies the same month a year earlier, October 2024's Rs 3.2 crore, and both Octobers held
      Diwali, so the copy carries the festival into the right month. The next item asks what the same
      copy does when the festival moves.
    answer: >-
      Every forecast must beat the naive and the seasonal naive on months it never saw, and the
      seasonal naive is the hard one wherever the season repeats on the calendar.

additions:
  # ---------------------------------------------------------------- Part 1, Monday
  - id: tf-leading
    label: "Judge the statement"
    type: True or false
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA
    day: Mon
    key: c
    anchor: >-
      North-star against guardrail, with one example pair.
    text: |-
      The city team's dashboard puts rider requests per peak online hour, zone by zone, beside its north star, completed peak trips per enrolled driver online at peak each week. Statement: a leading indicator moves after the north-star metric has already moved. True or false, and why?
      (a) True: requests per online hour fell from 2.13 to 1.75 over the six weeks after the north star had moved, which is how it confirms the north star.
      (b) True: a leading indicator is read once the quarter's result is in, which is why the dashboard keeps it on the page beside the north star it explains.
      (c) False: it moves first, while the team can act; requests per online hour by zone say where to send drivers before the week's trips are in.
      (d) False: a leading indicator moves in the same week as the north star, since both are counted from that week's completed peak trips in every zone.
    why: >-
      False. A leading indicator moves before the north star, while a team can still act on it; a
      lagging number confirms later. Rider requests per peak online hour, by zone, say where riders
      are waiting before the week's completed trips are counted, so the city can send drivers there.
      It fell from 2.13 to 1.75 because the new online hours went where riders were few, while the
      north star barely moved, from 35.76 to 35.89 trips per online driver-week.
    wrong:
      a: >-
        The north star barely moved, 35.76 to 35.89, so requests per online hour fell without the
        north star moving first; confirming afterwards is what a lagging number does.
      b: >-
        A number read after the quarter's result is in is a lagging number by definition, and it
        arrives too late to change the quarter.
      d: >-
        Requests per online hour divides rider requests by driver hours and never counts trips, and a
        leading number is useful exactly because it moves before the trips do.
    answer: >-
      A leading indicator moves first, while I can still act, so I pick one the team controls this
      week and show the north star it is meant to move.
  - id: twelve-rows
    label: "Read six drivers"
    type: One correct option
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Mon
    key: a
    anchor: >-
      How would you measure the success of a new feature? Walk your metric design.
    exhibit:
      caption: >-
        Six drivers, one week before the launch (the week beginning 10 August 2026) and one week after
        it (the week beginning 21 September 2026). Shamshabad and Rajendranagar are two of the
        city's three outer zones.
      table:
        head:
          - Driver
          - Zone
          - Week
          - Peak online hours
          - Offers shown
          - Offers accepted
          - Completed trips
        rows:
          - [A, Jubilee Hills, before, "10", "24", "21", "21"]
          - [A, Jubilee Hills, after, "11", "25", "22", "22"]
          - [B, Banjara Hills, before, "9", "20", "17", "17"]
          - [B, Banjara Hills, after, "10", "21", "18", "18"]
          - [C, Gachibowli, before, "11", "25", "22", "22"]
          - [C, Gachibowli, after, "12", "26", "23", "23"]
          - [D, Madhapur, before, "10", "22", "19", "19"]
          - [D, Madhapur, after, "11", "23", "20", "20"]
          - [E, Shamshabad, before, "10", "21", "18", "18"]
          - [E, Shamshabad, after, "16", "14", "4", "3"]
          - [F, Rajendranagar, before, "10", "20", "17", "17"]
          - [F, Rajendranagar, after, "14", "12", "3", "2"]
    text: |-
      The city team's note to the city head reads: "Peak online hours up 24 percent: supply target met. We recommend extending the guarantee to two more cities." Using the six drivers in Exhibit 1B, what do the rows show, and what should the city head be told?
      (a) Trips per hour fell from 1.90 to 1.19 as hours rose from 60 to 74; E and F added 10 hours and lost 30 trips, so hold the extension and pay for completed trips.
      (b) Hours went from 60 to 74, up 23 percent, close to the city's 24, and A to D kept about two trips an hour, so the guarantee added supply and the extension can go ahead.
      (c) Trips fell from 114 to 88 because riders asked for fewer trips after the monsoon, as E's and F's offers show, so the guarantee is not the cause of the fall.
      (d) Averaged driver by driver, trips per hour went from 1.90 to 1.31, a smaller fall than the totals show, so supply held up and the extension can go ahead.
    why: >-
      Summed, the six drivers' hours went from 60 to 74, up 23 percent, while their trips fell from
      114 to 88, so trips per online hour fell from 1.90 to 1.19. E and F, in the outer zones, added 10
      hours between them and lost 30 trips, while A to D added 4 hours and 4 trips. The note is a
      number hit while the outcome got worse, which is the proxy test failed: a driver can raise
      online hours by keeping the app open where riders are few. The six fall further than the
      city's 1.90 to 1.58 because two of them sit in the idle tail, a third of the sample against 15
      percent of the city's 1,200 drivers, which a careful answer says aloud. The fix pays for
      completed peak trips with an acceptance floor as the guardrail.
    wrong:
      b: >-
        Hours rose, and trips fell 23 percent with them; A to D held their rate, but E and F made 5
        trips in 30 hours after the launch, and the note hides them inside the total.
      c: >-
        Rider requests rose 1.8 percent city-wide; E and F were shown fewer offers because they sat
        in outer zones where riders are few, which is the gaming, never a fall in demand.
      d: >-
        1.31 is the average of each driver's own rate, which gives a 10-hour week and a 16-hour week
        the same weight; the city's rate is all trips over all hours, and both fell.
    answer: >-
      Before I call online hours supply, I ask whether a driver could raise them without a rider
      being served, and I read trips per online hour and the wait by zone beside them.
  - id: tf-target
    label: "Judge the statement on a case"
    type: True or false
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, FDE
    day: Mon
    key: d
    anchor: >-
      What makes a metric gameable, and how do you write one that is not?
    exhibit:
      caption: >-
        Wells Fargo's cross-sell metric, as the SEC's order of February 2020 (Release 34-88257)
        describes it, checked 13 October 2026.
      table:
        head:
          - Line
          - What the order found
        rows:
          - [What it counted, Accounts and products per retail bank household]
          - [Use, "No usage condition: an unused debit card, the largest product category, could stay in the count for up to four years"]
          - [What staff did, "Opened accounts customers had not asked for; moved customers' money into new accounts so they counted as funded; changed contact details so satisfaction surveys would not reach customers"]
          - [The 2013 change, "Remittance accounts were added to the count without investors being told, giving 0.04 of that year's 0.11 rise in the ratio"]
    text: |-
      Statement: any target changes the behaviour of the people who are paid to hit it. Judge it on Exhibit 1C. True or false, and why?
      (a) False: a target changes behaviour only where its rules leave a gap, and the order describes rules that some staff broke, never the target itself.
      (b) False: staff were paid on sales, so the cross-sell count moved only when the bank itself changed the definition, as it did in 2013.
      (c) True: the count rose because customers bought more products, and staff behaviour followed the customers' new demand for accounts.
      (d) True: staff paid on the count opened accounts nobody asked for, staged funding and dodged the surveys, each to move the number the bank paid for.
    why: >-
      True. Staff measured on the cross-sell count changed what they did to move it, in ways the bank
      never meant: accounts customers had not asked for, money moved in so a new account counted as
      funded, and contact details changed so surveys missed the customers (SEC order, Release
      34-88257, checked 13 October 2026). The same thing happened on a smaller scale in Hyderabad,
      where 180 drivers took their peak online hours to 2.1 times while their trips fell 12 percent.
      The 2016 penalties, the CFPB's USD 100 million with the OCC's USD 35 million and Los Angeles's
      USD 50 million, came to USD 185 million (the CFPB's release of 8 September 2016, checked 13
      October 2026), and the 2020 settlement with the SEC and the Justice Department to USD 3
      billion.
    wrong:
      a: >-
        The order describes the staff's behaviour moving with the target the bank paid on; a gap in
        the rules is what any target finds, which is the statement's point.
      b: >-
        Staff sales credit rode on the same count, and the count moved with the accounts staff
        opened; the 2013 addition was a second, separate way it rose.
      c: >-
        The order says the accounts were unused, unneeded or unauthorised, so the rise was staff
        behaviour, never customer demand.
    answer: >-
      People paid on a number move it the cheapest way open to them, so I write each definition
      asking how the people measured could raise it without the outcome moving.
  - id: wells-silent
    label: "Size the silent change"
    type: One correct option
    level: Hard
    min: 3.5
    tag: "[F]"
    roles: BA, FDE
    day: Mon
    key: b
    anchor: >-
      What makes a metric gameable, and how do you write one that is not?
    text: |-
      Exhibit 1C's last row is the 2013 change. What share of Wells Fargo's 2013 rise in the ratio came from the change of definition alone, and which line of a complete metric definition would have shown it to investors?
      (a) About 36 percent, 0.04 of 0.11; a guardrail on customer satisfaction, which would have fallen as soon as the new accounts joined the count.
      (b) About 36 percent, 0.04 of 0.11; a dated log of every change to what is counted, with the year's ratio printed on the old definition too.
      (c) About 4 percent, the 0.04 itself; the window, since a ratio counted over a shorter period would have shown the new accounts sooner.
      (d) None of it: remittance accounts are products a household holds, so the rise was real, and no line of the definition was breached.
    why: >-
      0.04 of the 0.11 rise is about 36 percent, and it came from counting a new kind of account, so
      that much of the year's rise reflected no change in what households held. The line that shows
      it is the dated change log: every change to what is counted carries a date and a note, and the
      year of the change prints the ratio on both definitions so a reader can see the step. The SEC's
      order (Release 34-88257, checked 13 October 2026) says investors were not told of the 2013
      addition, which is the breach, and that the rest of the 0.11 came from accounts and products
      inactive for at least 365 days, so none of the year's rise was households using more.
    wrong:
      a: >-
        Satisfaction surveys measure the customers' view, and the order says staff changed contact
        details so the surveys missed them; a guardrail the measured can redirect guards nothing, and
        neither would catch a definition change.
      c: >-
        0.04 is a change in the ratio, and its share of the 0.11 rise is 36 percent; the window
        decides the period counted and cannot show a new kind of account joining the count.
      d: >-
        The accounts may be real products, and the ratio still rose by counting a new kind of account
        that the year before did not count, which says nothing about households holding more.
    answer: >-
      Every change to what a metric counts goes in a dated change log, with the old definition run
      beside the new for the year it changes, so a step is never read as growth.
  - id: kalpa-sheet
    label: "Mark the definition sheet"
    type: More than one correct
    level: Hard
    min: 3.5
    tag: "[F]"
    roles: BA
    day: Mon
    key: c, d, e
    anchor: >-
      North-star against guardrail, with one example pair.
    exhibit:
      caption: >-
        Kalpa Retail's Retail-Plus tier, 120 members, as Monday's lab found it: 10 to 30 September
        2026 against 20 August to 9 September 2026.
      table:
        head:
          - Measure
          - Window over comparison
        rows:
          - [Reorders placed per member, 1.22 times]
          - [Booked value of those placements per member, 0.96 times]
          - [Placements in the window that became a separate delivered order, "None: each was an auto-reorder, cancelled, merged into a later order or still pending"]
    text: |-
      Meera Raghavan, Kalpa Retail's CEO, wants one number for the growth plan and the numbers that stop it being gamed. The head of Retail-Plus proposed reorders per member, and the lab found Exhibit 1D. Which lines of the plan's definition sheet are right? Mark every correct option.
      (a) North star: reorders placed per Retail-Plus member per month, which the window shows rising 1.22 times
      (b) Leading input: last quarter's audited revenue, which tells the team early where the plan stands
      (c) Exclusions: placements cancelled, merged into a later order or still pending, so a reorder nobody received never counts
      (d) Guardrail: revenue per active customer, which falls when frequency is bought with low-value orders
      (e) Leading input: add-to-cart events per active app member, which move before the month's delivered orders
    why: >-
      The lab found placements per member up 1.22 times while their booked value per member fell to
      0.96, and none of the window's placements became an order a member received: the app placed
      low-value reorders on its own. So the exclusions drop placements nobody received (c); revenue
      per active customer guards against frequency bought with small orders (d); and add-to-cart
      events move before the month's delivered orders, while a team can act on them (e). The growth
      plan's north star, as the lab's exercise wrote it, is delivered orders per active customer per
      month.
    wrong:
      a: >-
        Reorders placed is the number the app raised on its own, up 1.22 times with none delivered,
        so it fails the proxy test.
      b: >-
        Last quarter's audited revenue arrives after the quarter has closed, so it is a lagging
        number that can only confirm.
    answer: >-
      My north star counts what the customer received, my exclusions drop what the system did on its
      own, and each guardrail names the cheap way it catches.
  # ---------------------------------------------------------------- Part 2, Tuesday
  - id: slide-order
    label: "Build the slide"
    type: Order the steps
    level: Hard
    min: 3.5
    tag: "[S]"
    roles: BA
    day: Tue
    key: c, d, b, a
    anchor: >-
      Present a recommendation to a non-technical stakeholder in two minutes.
    text: |-
      Four of these six lines make the city head's slide, and two would spoil it. Leave those two out and write the other four in the order they appear on the slide, from the top.
      (a) The action: pay per completed peak trip with an acceptance floor, tested on half the drivers for six weeks, which the city head signs
      (b) The caveat: the monsoon ended inside the six weeks after the launch, and there are no weeks from last year to compare with
      (c) The title, as a claim: the guarantee is paying for online hours that carry no trips
      (d) The evidence: bookings per peak online hour fell from Rs 314 to Rs 260 at the same Rs 165 fare
      (e) The title, as a topic: "Peak-hour guarantee: six-week review"
      (f) The headline number: peak online hours up 24 percent since the launch
    why: >-
      A one-slide answer runs claim, evidence, caveat, action: the title states the claim a reader
      could act on from the title alone, one number with its denominator carries it, the caveat sits
      in plain sight, and the action names its cost and who signs. The topic title (e) gives the
      reader nothing to act on, and "peak online hours up 24 percent" (f) is Monday's trap resold,
      the number that looked like success while trips per online hour fell from 1.90 to 1.58.
    answer: >-
      Claim in the title, one number with its denominator, the caveat on the page, then the action
      with its cost and who signs it.
  - id: keep-two
    label: "Keep two elements"
    type: More than one correct
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA
    day: Tue
    key: a, c
    anchor: >-
      What do you leave off the slide, and where does it go?
    text: |-
      A second draft argues that riders got little for the Rs 1.9 crore of top-up. Which two elements carry that claim? Mark both; every other element moves to an appendix page headed by the question a named role will ask.
      (a) Median rider wait at peak, 4.8 to 4.6 minutes
      (b) Offers shown to drivers, 269,773 to 347,583
      (c) Top-up for each extra trip: Rs 2,836, for a trip worth Rs 165
      (d) Bookings per active driver-week, Rs 5,817 to Rs 5,861
      (e) The top-up split: 61 percent to driver-weeks under half acceptance
    why: >-
      "Riders got little" is the wait, which barely moved from 4.8 to 4.6 minutes, and "for the Rs 1.9
      crore" is the price of each extra trip: Rs 1.9 crore over the 6,700 extra peak trips is about
      Rs 2,836 for a trip worth Rs 165. Offers shown belong on driver operations' page, bookings per
      active driver-week on finance's, and the 61 percent split on the page that answers where the
      money went. Each moves to an appendix page headed by the question its owner will ask; the
      caveat, which this draft does not list, would stay on the slide.
    wrong:
      b: >-
        Offers shown rose because declined requests are offered again, which is driver operations'
        question and says nothing about what riders got.
      d: >-
        Bookings per active driver-week rose 0.8 percent because each driver-week carried about four
        more online hours; it is finance's number and flatters the scheme.
      e: >-
        The split says where the money went, which supports a different claim, that the scheme pays
        the idle; it belongs on the page that answers that question.
    answer: >-
      I keep what the claim needs and send the rest to one appendix page per role, each headed by the
      question that role will ask; I never send the caveat there.
  - id: concede
    label: "Judge the defence"
    type: True or false
    level: Hard
    min: 3.5
    tag: "[F]"
    roles: BA, FDE
    day: Tue
    key: c
    anchor: >-
      A stakeholder's objection is partly right; how do you answer it?
    text: |-
      At the review the finance partner says: "The fall in bookings per hour is the monsoon's end, not your scheme." Statement: the strongest reply concedes nothing, since any concession hands the objector the meeting. True or false, and why?
      (a) True: a concession tells the room the claim is weak, so the analyst restates the Rs 314 to Rs 260 chart and moves straight on to the action.
      (b) True: the per-hour chart already answers the season, since the fare held at Rs 165, so a concession could only add a doubt the chart has removed.
      (c) False: grant that part may be the season, then show weekly requests back in their old range while trips per hour held at 1.56 against 1.90.
      (d) False: concede the point in full and take the slide off the agenda until a year of weeks exists to set these six weeks against.
    why: >-
      False. The defence has four moves: restate the objection until its owner agrees, answer from
      the evidence, concede what is true, and say what would change your mind. Finance is partly
      right, since the monsoon ended inside the six weeks and there are no weeks from last year. The
      evidence answers the rest: in the last three weeks after the launch, weekly rider requests were
      back inside the range of the six weeks before (41,161 to 42,602 against 41,155 to 42,719),
      while trips per online hour ran at 1.56 against 1.90. What would change the analyst's mind is a
      city where the rains ended and no scheme launched, with trips per hour falling as far.
    wrong:
      a: >-
        Conceding nothing is the weak defence: the room hears the true part go unanswered, and the
        claim loses the people who already believe it.
      b: >-
        The fare held, which says each trip earned the same; it cannot say whether the season cut
        the trips an hour carries, which is finance's point.
      d: >-
        Conceding everything drops a claim the evidence supports, and the scheme keeps paying for
        another six weeks while the room waits for a year of data.
    answer: >-
      I restate the objection, answer it from the evidence, concede the true part in the open, and
      say which fact would change my mind.
  - id: memo
    label: "Judge the memo"
    type: True or false
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA
    day: Tue
    key: d
    anchor: >-
      Present a recommendation to a non-technical stakeholder in two minutes.
    text: |-
      A colleague cites Amazon's 2017 letter to shareholders, which says Amazon's meetings start with a six-page memo read in silence, use no slides, and that a great memo probably takes a week or more to write. Statement: the city head's Thursday review should get a memo in place of the one slide. True or false, and why?
      (a) True: a memo forces full sentences where bullets hide the reasoning, so it beats a slide in any meeting, whatever the slot it is given.
      (b) True: a memo can carry all three appendix pages in its body, so no role's question is left without its answer in the room.
      (c) False: the letter says Amazon reads its memos after the meeting has ended, so a memo would leave the room no time to argue at the review.
      (d) False: the ask is one slide in five minutes, and a great memo takes a week; the letter's lesson is that each element earns its place.
    why: >-
      False. The ask is one slide, five minutes, at Thursday's review, and the letter itself says a
      great memo probably takes a week or more (Amazon's 2017 letter to shareholders, filed 18 April
      2018, checked 13 October 2026). The memo's lesson carries to the slide: every element must earn
      its place the way a sentence does in a memo. The afternoon's written case was the memo form of
      the same answer, for a reader with the time to read it.
    wrong:
      a: >-
        Full sentences are the memo's strength, and the format still has to fit the reader's slot; a
        five-minute review is no place for six pages.
      b: >-
        The appendix pages exist for questions a role will ask; folding them into a memo makes every
        reader read every role's answer before the claim.
      c: >-
        The letter says the memo is read in silence at the start of the meeting, so this reason gets
        the source wrong.
    answer: >-
      I choose the form the decision-maker asked for and make every element earn its place; the memo
      is for the reader who has an hour and a week to write for.
  - id: estimate-order
    label: "Order the estimate"
    type: Order the steps
    level: Hard
    min: 3.5
    tag: "[S]"
    roles: BA, DS
    day: Tue
    key: b, d, e, a
    anchor: >-
      A guesstimate: how many drivers must be online at the evening peak?
    text: |-
      The city head's afternoon ask is roughly how many drivers must be online at the weekday evening peak to keep the median rider wait under five minutes. Four of these five steps make the estimate, and one would spoil it. Leave that one out and write the other four in the order they run.
      (a) Set the chain's 0.60 online driver-hours per completed trip beside the case's 0.53 before the launch, and move the answer to about 5,000 to 5,700
      (b) Ask whether it is drivers online at one moment or across the window, which window, which product, and the city's median or every zone's
      (c) Divide the day's 1 lakh trips by the 2.4 trips a busy driver fits in an hour, which gives about 41,700 drivers
      (d) Write the formula: drivers online equal trips to serve in an hour, over trips one online driver completes in an hour, times a buffer for the busiest half hour
      (e) Work it aloud: about 8,330 evening trips an hour over 1.68 trips per online driver-hour is about 4,960, and 15 percent more for the busiest half hour is about 5,700
    why: >-
      Clarify (b), map (d), calculate (e), validate (a): the dojo's four steps. The chain's numbers are
      assumptions said aloud: about 1 crore people, 1 weekday Uber trip for every 100 people, a
      quarter of the day's trips in the three evening hours, 2.4 trips an hour for a busy driver and
      about 30 percent of online drivers idle at a moment, so 1.68 trips per online driver-hour, and a
      buffer of 1.15. The check compares like with like, online driver-hours per completed trip, 0.60
      in the chain against the case's 0.53, so the chain runs about an eighth high and the checked
      answer is about 5,000 to 5,700. Step c divides a day's trips by an hour's rate, a day treated
      as an hour, which is why it spoils the estimate.
    answer: >-
      Clarify the moment and the window, say the formula, calculate aloud with a unit on every
      factor, then check against a figure in the same unit and move the answer if the check says so.
  - id: four-checks
    label: "Check four sources"
    type: More than one correct
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Tue
    key: a, c
    anchor: >-
      A guesstimate: how many customers could a new store sign up to a loyalty tier in its first year?
    text: |-
      Before the review, a colleague lines up four published numbers to check estimates against. Which checks are sound? Mark every correct option.
      (a) UPI, September 2026: 24.07 billion transactions over the month's 30 days, 802 million a day, set against an estimate of payments a day
      (b) Flipkart, 9 October 2026: 63 million concurrent users in a minute, as the page's web address reads, set against a capacity estimate
      (c) DMart, FY26: Rs 66,968 crore of revenue over the average of 415 stores at the year's start and 500 at its end, about Rs 146 crore a store
      (d) A city of two million people, invented for a drill, taken to hold eight million households at four people to a household
    why: >-
      Two hold. NPCI's 24.07 billion for September 2026, over that month's 30 days, is the 802 million
      a day Outlook Money reported (2 October 2026, checked 13 October 2026), and a per-day estimate
      is compared per day. DMart's revenue spread over the stores open across the year, the average
      of 415 and 500, gives about Rs 146 crore a store (Avenue Supermarts, 2 May 2026, checked 13
      October 2026); a first-year store sells less than that, which is why DMart reports two-year-old
      stores separately. Flipkart's own text says 6.3 million concurrent users in a minute; the 63 is
      in its web address. Households are people divided by about four, 20 lakh over 4 is 5 lakh, so
      eight million households is people multiplied.
    wrong:
      b: >-
        The page's text says 6.3 million (Flipkart Stories, 9 October 2026, checked 13 October 2026);
        the web address reads 63, so the check is ten times high, and "concurrent in a minute" mixes
        a moment with a minute.
      d: >-
        Households can never outnumber people; at four to a household, two million people make
        about 5 lakh households.
    answer: >-
      Before I validate against a published number I read the source's own words, its unit and its
      period, and I check that my estimate is counted the same way.
  - id: metro
    label: "Read the metro counts"
    type: One correct option
    level: Hard
    min: 3.5
    tag: "[S]"
    roles: BA, DS
    day: Tue
    key: a
    anchor: >-
      A guesstimate: how many drivers must be online at the evening peak?
    exhibit:
      caption: >-
        Delhi Metro's two published counts, each in the words its source uses, checked 13 October
        2026.
      table:
        head:
          - Count
          - Value
          - When
          - Source
        rows:
          - [Average daily passenger journeys, 64.06 lakh, "2026, all days", "The Tribune, 9 August 2026, citing DMRC"]
          - [Passenger boardings, "82,44,903", "17 September 2026, during a bus strike", "Republic World, 18 September 2026, quoting DMRC"]
    text: |-
      A pair's chain puts Delhi Metro at about 60 lakh rider trips on a weekday, each trip counted once from the gate where the rider enters to the gate where they leave (invented). They set it against Exhibit 2B, call their estimate 6 to 27 percent low, and raise it. Which reading of the check is right?
      (a) Trips are set against line uses: DMRC counts a journey for each line a rider uses, so 64.06 lakh exceeds the trips, and 17 September was a record day.
      (b) The estimate is 6 percent low on an ordinary day and 27 percent low at the city's true peak, so the pair should raise the whole chain by about a fifth.
      (c) A boarding is one rider entering at one gate, so the 82,44,903 boardings are the count to set trips against, since journeys count each change of line.
      (d) The check is sound, since DMRC's average day and its record day bracket the estimate between 64.06 lakh and 82.45 lakh trips.
    why: >-
      DMRC's journeys count each line a passenger uses to reach a destination, so a trip with one
      change of line counts twice (Deccan Herald, reporting PTI, 30 August 2023, checked 13 October
      2026). When DMRC first used the count, in May 2018, it read 45,35,932 line uses on one day
      against gate ridership near 27 lakh a day earlier that year (PTI, 30 May 2018). So the 64.06
      lakh average runs above the trips riders take, and an estimate of trips has to be compared with
      trips, or converted. The 82,44,903 was one record day, during a bus strike, never an ordinary
      weekday.
    wrong:
      b: >-
        Raising the chain trusts both checks, and both count something else: line uses, and one
        record day.
      c: >-
        The boardings record was reported as beating the earlier record of more than 81 lakh
        passenger journeys, so the two are reported as one count; and whatever a boarding counts,
        17 September 2026 was a record day during a bus strike.
      d: >-
        A bracket from two counts in another unit brackets nothing, since neither counts the trips
        the chain estimates.
    answer: >-
      I validate in the unit the estimate counts and on an ordinary period, so I ask what each
      published number counts before I move my answer toward it.
