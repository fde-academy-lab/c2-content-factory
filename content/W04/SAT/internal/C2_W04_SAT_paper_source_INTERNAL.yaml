# Exhibits under each scenario set's situation, drawn only from the set's own numbers.
exhibits:
  "1":
    caption: >-
      Set 1's round counts, as the situation gives them.
    table:
      head:
        - Baskets
        - Count
      rows:
        - [All consumer baskets in the sample, "1,000"]
        - [With the phone charger, "850"]
        - [With a phone case, "200"]
        - [With both, "165"]
  "2":
    caption: >-
      Set 2's three cohorts, as the situation gives them.
    table:
      head:
        - Cohort
        - Members
        - Retention in May
        - Retention in June
