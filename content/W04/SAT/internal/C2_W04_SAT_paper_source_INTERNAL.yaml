    text: |-
      Amazon India, a fulfilment centre's festive packer plan (illustrative case: the company is real, and every number below except Amazon's own figure is hypothetical). Amazon says its Great Indian Festival 2025 drew over 276 crore customer visits, 70 percent of them from tier 2 and 3 cities. Suppose its centre in a tier 2 city pays Rs 650 for an idle packer-shift of 120 shipments, as Lucknow does, while a late shipment costs it Rs 10, against Lucknow's Rs 25. What share of weeks should its plan cover, and what carries over from Lucknow unchanged?
      (a) About 0.35; the festival-aligned copy, held-back weeks and a price on each way of missing carry over.
      (b) About 0.35; the copy of last year's calendar weeks carries over, the plainest baseline any plan has.
      (c) About 0.65; the copy of last year's calendar weeks carries over, the plainest baseline any plan has.
      (d) About 0.65; the festival-aligned copy, held-back weeks and a price on each way of missing carry over.
    why: >-
      A spare shipment costs Rs 650 over 120, about Rs 5.42, and a late one Rs 10 here, so the plan
      should cover 10 over 10 plus 5.42 of weeks, about 0.65, where Lucknow's Rs 25 gave about 0.82.
      The cost of an error changed, so the plan's share changed; the method did not: hold out the
      latest weeks, copy last year by distance from the festival, price each direction of miss and
      set the share from the two costs. On Kalpa's Retail tables the same question would turn on the
      cost of an empty shelf against stock left over.
      Friday's fallback sets the plan share from the two costs (S10 and S11, beyond the row), and
      Friday's SECTION 5 (half one, S43 to S46) the festival-aligned copy.
    wrong:
      a: >-
        0.35 puts the cheap cost on top: the share to cover is the late cost over the sum, 10 over 10
        plus 5.42, about 0.65, below Lucknow's 0.82 because a late shipment costs less here.
      b: >-
        0.35 is the share upside down, and the calendar copy is the part that never carries over,
        since Diwali moves from year to year.
      c: >-
        The calendar copy is the part that never carries over: Diwali moves,
        from 20 October 2025 to 8 November 2026, so Lucknow's plan copied last year's weeks by their
        distance from the festival, and that alignment to the event that drives the peak is what
        carries over.
    answer: >-
      What stays is the method; what I rewrite is the cost of each error, and the plan's share of
      weeks follows from the two costs.

# Untimed and unmarked, for anyone who finishes early; each is the kind of follow-up an interviewer
# asks after a first answer, and the mock-interview round draws on them.
stretch:
  - text: |-
      In Hyderabad the 180 drivers in the idle tail completed 33,440 peak trips in the six weeks after the launch, about 31 trips and 39 peak online hours a driver a week. If the redesign drives all of them off the app, who carries those trips, how many more peak online hours does that take, and what do you watch in the first month?
    answer: >-
      About 17,600 more peak online hours from the drivers who already complete 1.90 trips an hour,
      33,440 over 1.90. For the first month watch the drivers online in the first peak hour and
      drivers' earnings per online hour every week, and read the wait zone by zone, since the idle
      tail sat in the outer zones where riders wait longest.
  - text: |-
      A growth lead wants to test one suggestion: half the shoppers in two zones, picked at random, see a second item beside the first. With invented numbers, today 5 percent of carts holding the first item also hold the second, and a rise to 8 percent would pay for the slot. How many carts holding the first item does each half need, at 5 percent significance and 80 percent power, and what happens to that count if only half of the rise is new buying?
    answer: >-
      About 1,056 carts holding the first item in each half to see 5 rise to 8 percent, and about
      3,777 if only half of that rise is new buying, since halving the effect more than triples the
      count. Randomise shoppers, never carts, fix the length before day one from that count, and read
      the share of first-item carts that add the second, with margin per shopper as the guardrail and
      the threshold set in advance. The rates are invented; Wednesday's ice cream and chocolate sauce,
      6.25 to 9.45 percent, needs about 1,105 and 4,014 carts a half by the same formula.
  - text: |-
      An AI writing assistant launched two months ago, and its weekly active users hit a record in launch week and are still near it. Is the product sticking?
    answer: >-
      Define active as a draft the user keeps, and check the count first, since model, prompt and
      pricing changes move every cohort in one week. Split weekly actives by signup week and draw each
      cohort's kept-draft curve by weeks since signup: with invented numbers, the launch cohort keeps
      24 percent at week four against 36 for a later weekly cohort, while the blended count stays near
      the record because each new week adds a cohort. If the later cohorts flatten by week six while
      the launch cohort keeps sliding, the product sticks for the users who came looking for it.
  - text: |-
      A planner reads where the plan should sit, against the chosen forecast, from the same thirteen weeks that chose the forecast. Is that circular, and what would you do instead?
    answer: >-
      Yes, and every forecast was tuned the same way, which is why each is compared at its own 0.82
      point; with thirteen weeks the point is loose, 2.6 percent by one reading and 4.1 by another
      common one. A rolling origin cures it: from 29 September 2025 every week has a year behind it,
      so the copies can be forecast from many origins, 2025's festival included, and the cushion set
      on weeks the final test never touches.
