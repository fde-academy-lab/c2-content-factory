corrections:
- line: the fix-first concept chapter's cost (D4_plan.md section 3, chapter 5; the spine's Thursday table)
  case_file: '60 students times a first-year fee of Rs 1 to 1.5 lakh: Rs 60 to 90 lakh a year'
  here: '48 joiners (60 fewer acceptances x the 80 percent who join, or 288 less 240) times Rs 1 to 1.5
    lakh: Rs 48 to 72 lakh, Rs 57.6 lakh at Rs 1.2 lakh'
  why: fee income arrives from students who join, and the plan's own second route counts 48 joiners; pricing
    acceptances would put a unit error in the chapter that teaches the cost in its unit
- line: the college's applicants (D4_plan.md section 3, chapter 4)
  case_file: 850 applicants, 28 percent joined
  here: 900 applicants, 26.7 percent joined
  why: 28 percent sat beside last cycle's 28.8 in the same chapter; the spine fixes only the applications
- line: the gym's dashboard (the spine's Thursday table)
  case_file: the 400 January joiners counted in January
  here: the dashboard counts a member from the month after she joins, so January reads the 100 older members
    and February adds the January joiners in their month one
  why: SECTION 1 teaches that the joining month is month zero and is never counted, so the gym's own dashboard
    keeps the same rule
- line: the gym's roster (D4_plan.md section 4)
  case_file: one row per member per month
  here: one row per member with a column per month, as a gym's register is kept; notebook 01 turns it
    into one row per member per month with melt
  why: the concept notebook prints the example in full, and thirty rows print where 150 would not
- line: the dashboard's 38 percent
  case_file: blended over members who signed up before the month
  here: members two or more months past their signup month (the ticket's words, month-two retention)
  why: with every cohort falling and the 13,000-member sale cohort at 31 percent in month one, a blend
    that counts it in September cannot stay at 38 (it can reach about 36.5 at most); the explorer's Th1
    counts the dashboard the same way
- line: members signed up January to September
  case_file: 60,000
  here: 53,089
  why: seven cohorts of about 5,000, August's 13,000 and a September of about 5,000 sum to about 53,000;
    60,000 would need a second sale cohort in September that the ticket never mentions
- line: the twelve rows
  case_file: August 2 of 5 in month one; 6 of 12 in September
  here: August 0 of 5; 2 of 12
  why: 6 of 12 needs members to come back after leaving, which breaks every cohort falling on the card;
    2 of 5 (40 percent) sits a point from Kalpa's 41; 1 of 5 (20 percent) equals the sale-week members'
    own full-data month one (19.8), and 3 of 12 (25 percent) sits within a point of Kalpa's per-member
    checkout (24.5)
- line: the events table
  case_file: member_id
  here: user_id with is_member
  why: the ticket compares non-members on Android, so the log carries a comparison sample of non-member
    users; a member's user_id is her member_id
- line: Kalpa retention
  case_file: orders of any status
  here: app activity, the case file's fallback
  why: 37 of the 120 Retail-Plus customers ordered in September in v4, so no assignment of membership
    months reaches 41 percent on orders
- line: the funnel toy
  case_file: 100 visits; checkout 10 of 50 per session against 10 of 20 per member
  here: 100 sessions; checkout 10 of 100 sessions against 10 of 20 people
  why: a toy that counts 100 visits and then 50 sessions mixes units, and 10 of 50 is not a step over
    the step before (the first cold read's blocker)
- line: the guesstimate's catch
  case_file: journeys and boardings are different units
  here: DMRC's passenger journeys count each line a rider uses, and the 82,44,903 boardings record beat
    the 81 lakh passenger-journeys record, so both are one line-use count; the catch is trips against
    line uses
  why: Deccan Herald (PTI), 30 August 2023, and The Tribune, both checked 12 October 2026
- line: the walk's source
  case_file: 'Aced: tracking first, segments before a root cause'
  here: the hypothesis board's order, with Aced cited only for what its page says
  why: Aced's sample answer starts by defining the metric and says to rule out data issues first
- line: the tracking check
  case_file: the app team's mapping and the release date moved a week
  here: the order records against the event log; the moved cut dates the fall
  why: the rename shipped with the release, so a logging fault would also start on 14 September (the second
    cold read)
