# Week 2 Saturday: the week's source file, laid on the tracker's bank by
# scripts/build_saturday_paper.py. Block style throughout, so a comma never splits a reason.
#
# The bank sets the topics and this file sets the bar (the requester's plan of 30 September 2026,
# raised twice the same day after two blind sittings). Three bank items print: two answered from a
# word bank and one with a reworded stem and options. Fifty-five fold into deeper items that test
# their concepts, each with its reason under `folded`. Thirty new items carry the rest. Every Kalpa
# number was computed on the week's warehouse and files, and every public-case fact was checked
# against its source on 30 September 2026; on 1 October 2026 every number, term, quotation and rule
# the paper repeats was checked again against the Week 2 packs as merged. The provenance record
# lists all three, and internal/C2_W02_SAT_key_proofs_INTERNAL.py asserts every key.

# The Word paper's first page: "What this paper is for", and the Company row of its Rules table.
purpose: >-
  This week you computed Anand's Monday numbers in the warehouse, set what Kalpa collected against
  what it booked, drew up Marketing's protect list with its flag on falling spend, built the growth
  team's table of customers in pandas, and carried the numbers to Monday's growth review in Excel.
  This paper puts those decisions to you again with no notes and no assistant, on the week's own
  tables, on six public cases and on the tables an AI team keeps. The room's score in each part,
  set beside the rating you give that part in step one, tells Monday's session where to start.
company: >-
  Parts 1 to 4 and the workbook in Part 5 are set inside Kalpa Retail, where you work as a trainee
  engineer in the data and AI team of its Global Capability Centre, the in-house centre that builds
  Kalpa's data and AI systems. Anand Iyer is Kalpa Retail's finance controller, Kavya Nair the senior
  analyst on your team and Meera Raghavan the CEO; the head of Retail-Plus, the marketing lead, the
  growth team, the data platform lead and Meera's chief of staff are named by role. Six items draw
  on public cases at Facebook, Public Health England, genomics journals, an economics paper,
  JPMorgan and Uber, each with its source beside it. Part 6 imagines the AI team of a food-delivery
  company, and its tables and numbers are illustrative. Every number an item needs is on the page.

# Shared lettered lists, printed once above the first item that answers from them.
banks:
  mon-words:
    style: words
    options:
      - sort
      - CTE
      - view
      - guarantee
      - subquery
  fri-fix:
    style: match
    instruction: >-
      Each numbered row is a job the chief of staff's workbook must do. Write the letter of the
      technique that does it. Each letter is used once at most, and two are not used.
    options:
      - SUBTOTAL with function number 109
      - VLOOKUP with its fourth argument left out
      - a labelled input cell feeding a scenario line
      - XLOOKUP with its if_not_found argument set
      - Remove Duplicates across every column
      - a first-row flag per order, then SUMIFS

# The printed order. Bank items by number, the additions by id.
parts:
  - title: Can the warehouse give Anand Monday numbers that his analyst can audit line by line?
    shows: whether you can write the Monday queries so every ratio, average and sample counts what it says
    intro: >-
      Anand Iyer, Kalpa Retail's finance controller, keeps the books every revenue figure has to match,
      and he asked the team for the same numbers every week: "I want these numbers every Monday, for
      every segment and channel, computed from the warehouse itself. No notebooks, no exports, nothing a
      person can mistype." The numbers are revenue, orders and customers for each segment, the groups
      Kalpa sells to (Business, its corporate buyers; Retail-Core, its everyday shoppers; Retail-Plus,
      the paid membership tier; and Student), and for each channel (app, web and store), and revenue
      means booked revenue, every order at its amount, whatever its status. The warehouse is Kalpa's
      Postgres database, and its two quarters of orders, called the book, are the one copy everybody
      reads; it stores April to June as quarter 'Q1' and July to September as 'Q2'. The saved queries
      that produce the numbers are the Monday suite. Anand signs the Monday sheet after his analyst has
      audited every query in the suite line by line, and the head of Retail-Plus reads the tier's line
      to decide which members the team works to keep, so a ratio or an average that counts the wrong
      people sends the tier's retention budget the wrong way.
    items: ["new:int-div", 2, 3, "new:avg-spend", "new:tool-choice", "new:facebook"]
  - title: Can Anand sign what Kalpa collected against what it booked, with nothing lost or counted twice?
    shows: whether you can join payments to orders without losing or repeating one, and hold what fails a check
    intro: >-
      Anand replied to the Monday numbers: "Booked revenue is not collected revenue. Some orders are
      paid in two instalments, some are refunded, some were never paid at all. Show me, order by order,
      what we actually collected against what we booked in Q2. If there is a gap, I want to know which
      orders and which channel." Collected is the cash that arrived for the booked orders, each payment
      counted once. The data platform lead added that "the payments feed sometimes double-posts when
      the gateway retries": in a gateway retry, the payment service posts the same instalment of the
      same order twice. Anand signs the collected figure for the CEO's Monday page, and his collections
      team rings every customer on the unpaid list, so an order the report drops goes unchased and a
      payment counted twice shows cash Kalpa never received. The bridge walks from booked to collected
      in named moves, each with its list of orders: booked, less the orders never paid, less any paid
      short, is collected.
    items: ["new:join-counts", "new:report-steps", "new:where-on-payments", "new:reporting-day", "new:phe-checks"]
  - title: Which members should Marketing protect and call, and did July to September keep pace with the plan?
    shows: whether you can rank and flag members inside each segment and read a running total against its plan
    intro: >-
      The marketing lead wrote to the team: "Retail-Plus frequency is the problem, so we want to
      protect our best members before they drift. Give us the top fifty customers by Q2 revenue in each
      segment, and flag anyone whose monthly spend has fallen for two months running. And Meera wants to
      see revenue accumulate week by week against the plan line, so we know by mid-quarter whether we
      are on track." Each segment's top fifty make its protect list, and Marketing spends its retention
      budget, a call and a renewal offer, on the members the lists name, so a list cut by the wrong
      rule, or a flag that misreads a member, rings the wrong people. Meera Raghavan, the CEO, decides at
      mid-quarter whether to hold the plan, push a campaign or move budget. The plan line sets
      Rs 75,69,230 of revenue for each of the quarter's 13 plan weeks, which start on Mondays from 6
      July; plan to date adds up the plan weeks to the end of the one being read, and booked to date
      does the same for the orders.
    items: ["new:rows-shipped", 27, "new:share-window", "new:lag-gap", "new:run-rate"]
  - title: Can the growth team act on Monday's table of 340 customers without checking it first?
    shows: whether you can build and check a table of one row per customer through merges and pivots in pandas
    intro: >-
      Kalpa Retail's growth team, with the data platform lead, asked for one thing it would use every
      week: "One table, one row per customer, refreshed every Monday: how recently each customer bought,
      how often, how much, their segment, whether the monsoon sale reached them, and the flags we act
      on. Marketing's analysts live in Python, so build it in pandas, from the warehouse, and make it
      refresh in one run." The three numbers are recency, the days from a customer's last order to the
      data's last date, 28 September 2026; frequency, the orders placed; and spend, the rupees those
      orders booked. The monsoon sale was a campaign Kalpa ran in August 2026. Every Monday the growth
      team sends a win-back code to customers who have gone quiet and a first-order nudge to those who
      never ordered, straight from the table and with no analyst watching, so a customer missing from
      it gets no offer and a customer counted twice inflates every total built on it. Kavya Nair, the
      senior analyst, reviews the table before it leaves the team.
    items: ["new:merge-guard", "new:first-touch", "new:months-view", "new:genes"]
  - title: Which spreadsheet numbers can a director trust, in Monday's workbook and in three public cases?
    shows: whether you can build the workbook a director changes in the room and catch a spreadsheet's silent errors
    intro: >-
      Meera's chief of staff builds the deck for Monday's growth review and works only in Excel:
      "Monday's growth review deck needs three things I can open on my laptop without a login: the
      revenue tree by segment for both quarters, the top-fifty protect list with a lookup so I can find
      any member by id, and one number on the front page with its trend. Nothing that needs Python. If
      a director changes an assumption in the room, the sheet must recalculate in front of them." The
      directors read the front page first and may read nothing else, and the head of Retail-Plus sizes
      each city's retention budget from the protect list in the room, so a sheet that shows a wrong
      number with nothing red beside it misleads both. The three public cases after the workbook are
      spreadsheets whose numbers people relied on.
    exhibits:
      - mermaid: |-
          flowchart LR
            E["Friday's export:<br/>one row per payment"] --> T["Tree tab:<br/>revenue by segment"]
            C["Customer table:<br/>one row per customer"] --> P["Protect tab:<br/>top fifty, a lookup"]
            T --> F["Front page:<br/>one number, its trend"]
            D["A director's<br/>what-if"] --> F
        table:
          head:
            - order_id
            - segment
            - order_amount
            - paid_amount
          rows:
            - [KR-00028, Business, "6,35,000", "3,81,000"]
            - [KR-00028, Business, "6,35,000", "2,54,000"]
        caption: >-
          The chief of staff's workbook for Monday's review, and two rows of Friday's export: one row
          per payment, with the order's booked amount, order_amount, repeated on each.
    items: ["new:fix-lookup", "new:fix-foot", "new:fix-tree", "new:fix-whatif", "new:range-check", "new:var-formula", "new:gross-fare"]
  - title: Can a food-delivery company's AI team trust the numbers behind its model and budget decisions?
    shows: whether you can read an AI team's tables and code and say which decision a wrong number would change
    intro: >-
      Suppose a food-delivery company runs a support assistant, a chatbot that answers customers and
      hands hard cases to a person. Its AI team scores each model version on a fixed set of test
      tickets, which is an evaluation run; it collects customers' ratings of the replies; and it logs
      every conversation, every handoff to a person, every call to the model and every visit. The team
      lead decides which model ships and which is retrained, the product lead sets the assistant's
      budget, and the finance partner pays the model's bill, which is charged by the token, a unit of
      text the model reads or writes. Each of them acts on one number from these tables, so a wrong
      number changes which model ships, which is retrained, what the assistant may spend or when its
      calls move to a cheaper model. The company, its tables and every number below are illustrative.
    exhibits:
      - table:
          head:
            - Table
            - One row per
            - Columns
          rows:
            - [predictions, test ticket, "ticket, pred"]
            - [labels, label from the annotation vendor, "ticket, label"]
            - [eval_runs, evaluation run, "model, run_id, finished_on, accuracy"]
            - [replies, reply to a customer, "reply_id, model, rating"]
            - [conversations, conversation, conversation_id]
            - [handoffs, handoff to a person, conversation_id]
            - [calls, call to the model, "call_id, day, tokens"]
            - [visits, a user's use of the assistant on a day, "day, user_id"]
        caption: >-
          The assistant team's tables, as this part imagines them.
    items: ["new:eval-fanout", "new:latest-run", "new:low-ratings", "new:not-in", "new:token-peers", "new:weekly-users"]

