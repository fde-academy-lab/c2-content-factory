  - id: merge-guard
    label: "Size the merge"
    type: Scenario set
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS, FDE
    day: Thu
    key: a
    anchor: >-
      Which merge argument raises on duplicate keys, and which error?
    text: |-
      SET 6. SITUATION: The customer table has 340 rows, one per customer, and its spend column adds up to the book's Rs 19,84,00,000 for both quarters. The monsoon sale's exposure feed, which lists the customers the sale reached, holds 136 rows for 130 customers. The analyst merges the feed onto the table with how='left' and sends the result to Excel, where a pivot sums spend.
      How many rows does the merged table hold, and what should Monday's refresh carry before the pivot is built?
      (a) 346 rows, and validate='one_to_one' on the merge, which raises a MergeError
      (b) 340 rows, and nothing more, since a left merge keeps the customer table's rows
      (c) 352 rows, and drop_duplicates() on the merged table to take out the extra rows
      (d) 136 rows, and indicator=True on the merge to flag the rows before the pivot
    why: >-
      A left merge keeps every customer and writes one row per matching feed row; the feed has 136 rows
      for 130 customers, so six of its rows repeat a customer already there, and each adds a row: 340 +
      6 = 346 (six customers were sent twice, on 3 and 11 August). validate='one_to_one' checks that
      the key is unique on both sides and raises pandas' MergeError ("Merge keys are not unique in right
      dataset; not a one-to-one merge") before a merged table exists; an assert on the row count would
      stop the run too. Unguarded, the pivot reads Rs 19,84,45,800, Rs 45,800 over the book. Run on
      pandas 3.0.5 on the week's files on 30 September 2026.
    wrong:
      b: >-
        A left merge keeps each customer once only when the right key is unique; the six repeated rows
        add six rows, and the pivot reads Rs 45,800 over the book.
      c: >-
        Counts each repeated customer's two rows as extra, where only the second is; and
        drop_duplicates() stops nothing, since the repeated rows differ in exposed_date and survive it.
      d: >-
        An inner merge would keep 136 rows; a left merge keeps all 340 customers. indicator labels each
        row both or left_only, and stops nothing.
    answer: >-
      A merge grows the left table only when a key repeats on the right; validate= states the
      relationship it must keep and raises MergeError the moment the keys break it, and a row-count
      check says the same thing in numbers.
  - id: first-touch
    label: "Trace the first exposure"
    type: Scenario set
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS, FDE
    day: Thu
    key: d
    anchor: >-
      A pivot's total disagrees with the warehouse; where do you look first?
    exhibit:
      caption: >-
        Next Monday's feed from the campaign tool, its rows for three customers in the order it sends
        them, and the step the refresh now runs on the feed before the merge.
      table:
        head:
          - customer_id
          - campaign_id
          - exposed_date
        rows:
          - [C-0001, CMP-MONSOON-26, "2026-08-11"]
          - [C-0002, CMP-MONSOON-26, "2026-08-11"]
          - [C-0001, CMP-MONSOON-26, "2026-08-03"]
          - [C-0002, CMP-MONSOON-26, "2026-08-03"]
          - [C-0012, CMP-MONSOON-26, "2026-08-03"]
      code:
        lang: python
        text: |-
          first = feed.drop_duplicates(subset="customer_id")
    text: |-
      SET 6, continued.
      Marketing's rule is one exposure per customer, the first by date, and the sale's report credits the sale with every order a customer places from that exposure on. Which exposure does the step above keep for C-0001, and what does the report make of C-0001's orders?
      (a) The 3 August send, so each order C-0001 placed from then on is credited to the sale
      (b) Both sends, since they differ in exposed_date, so C-0001's orders after its second send count twice
      (c) Neither send, since the step drops every customer the feed repeats, so none of C-0001's orders count
      (d) The 11 August send, so the orders C-0001 placed in the eight days before it go uncredited
    why: >-
      drop_duplicates with subset='customer_id' compares the customer id alone and, by its default
      keep='first', keeps each customer's first row in the order the file lists it. The tool lists each
      customer's 11 August send before its 3 August one, so C-0001 keeps 11 August, its second
      exposure, and the report credits the sale only from then on: orders placed from 3 to 10 August,
      after the real first exposure, go uncredited. On the week's book that is C-0001's order of 6
      August, Rs 1,200. Sorting by exposed_date from the earliest before the same step keeps 3 August
      for C-0001 and C-0002 and C-0012's one row: 130 rows, one per customer, and the merge returns 340
      rows with spend on the book. Run on pandas 3.0.5 on the exhibit's rows and on the week's feed
      sent in the same order, on 30 September 2026.
    wrong:
      a: >-
        Reads first as earliest; the step keeps the first row in the order the file lists it, and the
        tool lists C-0001's 11 August send first.
      b: >-
        Reads the step as dropping only rows that repeat in every column; subset='customer_id' compares
        the customer id alone, so one row per customer stays.
      c: >-
        Reads the default as keep=False, which drops every repeated customer; the default is
        keep='first', which keeps one row for each.
    answer: >-
      A rule stated by date is applied by date: sort by exposed_date from the earliest, then keep each
      customer's first row, because a file's order is whatever the sender chose, and keep the guard on
      so next week's feed fails loudly instead of quietly.
  - id: months-view
    label: "Predict the months view"
    type: One correct option
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Thu
    key: b
    anchor: >-
      pivot against melt: which widens and which lengthens?
    exhibit:
      caption: >-
        The analyst's months view for the head of Retail-Plus, on five illustrative orders.
      code:
        lang: python
        text: |-
          import pandas as pd
          plus = pd.DataFrame({
              "member": ["M1", "M1", "M1", "M2", "M2"],
              "month":  ["Jun", "Jun", "Jul", "Jun", "Jun"],
              "amount": [3000, 1000, 2400, 1800, 600]})
          wide = plus.pivot_table(index="member", columns="month", values="amount")
          long = wide.reset_index().melt(id_vars="member", value_name="amount")
          print(wide.loc["M1", "Jun"], len(long), long["amount"].sum())
    text: |-
      The head of Retail-Plus wants one row per member and one column per month, to read who is drifting, and a long copy of the same view for a trend chart. What does the code above print?
      (a) 4000.0 5 8800.0
      (b) 2000.0 4 5600.0
      (c) 3000.0 3 7200.0
      (d) 4000.0 3 8800.0
    why: >-
      pivot_table splits the orders by member and month, applies its default aggfunc, which is the
      mean, and combines one cell per group, so M1's two June orders print as their average, 2000.0,
      where M1 spent 4,000, and M2's June reads 1,200. melt turns the 2 by 2 view into 4 rows, one per
      member and month, including M2's empty July, and sum skips that NaN: 2,000 + 2,400 + 1,200 =
      5600.0 against 8,800 of orders. The check is the grand total against the orders, and the fix is
      aggfunc='sum' with fill_value=0; on Kalpa's Retail-Plus months the default read a fall of 18
      percent where the orders fell 29. Run on pandas 3.0.5 on 30 September 2026.
    wrong:
      a: >-
        Assumes the pivot adds, and that melt hands back the five orders; the pivot averages unless
        aggfunc says otherwise, and melt returns one row per member and month.
      c: >-
        Assumes the pivot keeps each cell's first order, and that melt drops the empty cell; the pivot
        averages, and melt keeps every member and month, NaN included.
      d: >-
        Assumes the pivot adds and melt drops the empty cell, the two misreadings of Thursday's round 3
        trap together.
    answer: >-
      pivot_table widens a column's values into columns and averages unless told to sum; melt
      lengthens it back into rows; I write aggfunc= every time and tie the grand total to the source.
  - id: genes
    label: "Predict the merge"
    type: One correct option
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS
    day: Thu
    key: b
    anchor: >-
      SQL, pandas or Excel: how do you choose?
    exhibit:
      caption: >-
        A lab's gene list after a trip through Excel, and the lab's reference table of gene panels; the
        values are illustrative (Genome Biology, 2016).
      code:
        lang: python
        text: |-
          import pandas as pd
          lab = pd.DataFrame({"symbol": ["TP53", "2-Sep", "BRCA1", "1-Mar"],
                              "fold_change": [2.1, 0.4, 1.8, 3.2]})
          ref = pd.DataFrame({"symbol": ["TP53", "TP53", "SEPT2", "BRCA1", "MARCH1"],
                              "panel": ["A", "D", "B", "A", "C"]})
          m = lab.merge(ref, on="symbol", how="left")
          print(len(m), m["panel"].notna().sum())
    text: |-
      Gene symbols are the short names genes go by in papers and databases. Ziemann and colleagues found that Excel's default settings turn some symbols into dates, and that about a fifth of genomics papers with Excel gene lists carried such errors (Genome Biology, 2016). The code above merges a lab's list, after a trip through Excel, onto the lab's reference table of panels. What does it print?
      (a) 4 4
      (b) 5 3
      (c) 7 5
      (d) 4 2
    why: >-
      The reference table holds one row per gene and panel, and TP53 sits on two panels, so the left
      merge writes TP53 twice: 5 rows from the lab's 4. '2-Sep' and '1-Mar' are SEPT2 and MARCH1 after
      Excel turned them into dates, so they match no symbol and keep a NaN panel: 3 rows carry a panel.
      Nothing raises. The lab's list goes back for the two symbols, fixed at their source, and the
      analyst decides at which grain a gene with two panels is counted before any total is taken.
      Ziemann, Eren and El-Osta, Genome Biology, 2016, checked on 30 September 2026; the code run on
      pandas 3.0.5 the same day.
    wrong:
      a: >-
        Assumes pandas reads 2-Sep and 1-Mar back as gene symbols and that a left merge keeps one row
        per lab gene; the dates stay text that matches nothing, and TP53's two panels give it two rows.
      d: >-
        Sees the two dates match nothing, and misses the fan-out: TP53 sits on two panels, so the left
        merge writes it twice.
      c: >-
        Adds the reference rows nothing matched, SEPT2 and MARCH1, as an outer merge would; a left merge
        keeps only the lab's rows and their matches.
    answer: >-
      After every merge I check two things: the row count against the left table, because a key that
      repeats on the right fans the rows out, and the matches with indicator=True, because a key that
      changed on its way in never matches and never raises.
