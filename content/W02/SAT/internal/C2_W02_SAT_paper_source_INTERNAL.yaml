  - id: months-view
    label: "Predict the months view"
    type: One correct option
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Thu
    key: b
    anchor: >-
      pivot against melt: which widens and which lengthens?
    exhibit:
      caption: >-
        The analyst's months view for the head of Retail-Plus, on four illustrative orders.
      code:
        lang: python
        text: |-
          import pandas as pd
          plus = pd.DataFrame({
              "member": ["M1", "M1", "M1", "M2"],
              "month":  ["Jun", "Jun", "Jul", "Jun"],
              "amount": [3000, 1000, 2400, 1800]})
          wide = plus.pivot_table(index="member", columns="month", values="amount")
          long = wide.reset_index().melt(id_vars="member", value_name="amount")
          print(wide.loc["M1", "Jun"], len(long), long["amount"].sum())
    text: |-
      The head of Retail-Plus wants one row per member and one column per month, to read who is drifting, and a long copy of the same view for a trend chart. What does the code above print?
      (a) 4000.0 4 8200.0
      (b) 2000.0 4 6200.0
      (c) 2000.0 3 6200.0
      (d) 4000.0 3 8200.0
    why: >-
      pivot_table splits the orders by member and month, applies its default aggfunc, which is the
      mean, and combines one cell per group, so M1's two June orders print as their average, 2000.0,
      where M1 spent 4,000. melt turns the 2 by 2 view back into 4 rows, one per member and month,
      including M2's empty July, and sum skips that NaN: 2,000 + 2,400 + 1,800 = 6200.0 against 8,200
      of orders. The check is the grand total against the orders, and the fix is aggfunc='sum' with
      fill_value=0; on Kalpa's Retail-Plus months the default read a fall of 18 percent where the
      orders fell 29. Run on pandas 3.0.5 on 30 September 2026.
    wrong:
      a: >-
        Assumes the pivot adds; it averages unless aggfunc says otherwise, which is Thursday's round 3
        trap.
      c: >-
        Drops the empty cell in melt; melt keeps every member and month, NaN included, which is why
        the long table has 4 rows.
      d: >-
        Both misreadings at once.
    answer: >-
      pivot_table widens a column's values into columns and averages unless told to sum; melt
      lengthens it back into rows; I write aggfunc= every time and tie the grand total to the source.
  - id: genes
    label: "Predict the merge"
    type: One correct option
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS
    day: Thu
    key: a
    anchor: >-
      SQL, pandas or Excel: how do you choose?
    exhibit:
      caption: >-
        A lab's gene list after a trip through Excel, with illustrative values; the conversions are
        the ones Ziemann and colleagues documented (Genome Biology, 2016).
      code:
        lang: python
        text: |-
          import pandas as pd
          lab = pd.DataFrame({"symbol": ["TP53", "2-Sep", "BRCA1", "1-Mar"],
                              "fold_change": [2.1, 0.4, 1.8, 3.2]})
          ref = pd.DataFrame({"symbol": ["TP53", "SEPT2", "BRCA1", "MARCH1", "EGFR"],
                              "panel": ["A", "B", "A", "C", "B"]})
          m = lab.merge(ref, on="symbol", how="left", indicator=True)
          print(len(m), (m["_merge"] == "both").sum())
    text: |-
      A gene symbol is the short name a gene is known by, such as SEPT2 or MARCH1. Ziemann and colleagues found that Excel's default settings turn such symbols into dates, SEPT2 into 2-Sep and MARCH1 into 1-Mar, and that about a fifth of genomics papers with Excel gene lists carried such errors (Genome Biology, 2016). An analyst merges a lab's list onto a reference table. What does the code above print, and what should the analyst do?
      (a) 4 2; two genes lose their annotation with no error, so go back to the lab
      (b) 4 4; pandas parses 2-Sep back to SEPT2, so every gene finds its row
      (c) 5 2; the left merge also brings in EGFR, the reference row nothing matched
      (d) 2 2; a left merge keeps only the genes that found a match in the reference
    why: >-
      A left merge keeps all 4 of the lab's rows; '2-Sep' and '1-Mar' match no symbol, so indicator
      marks them left_only and only 2 rows are both. Nothing raises: two genes lose their annotation
      without a word. The fix belongs at the source, a list kept as text, and the naming body has since
      moved the other way too: in 2020 the HGNC renamed every symbol Excel turned into a date, so SEPT1
      is now SEPTIN1 and MARCH1 is now MARCHF1 (Bruford and colleagues, Nature Genetics, 2020). Both
      papers checked on 30 September 2026; the code run on pandas 3.0.5 the same day.
    wrong:
      b: >-
        pandas reads the text it is given; '2-Sep' stays the string '2-Sep', and no parser turns it back
        into a gene symbol.
      c: >-
        A left merge never adds reference rows that nothing matched; how='right' or how='outer' would.
      d: >-
        A left merge keeps every left row, matched or not; how='inner' would keep 2.
    answer: >-
      A key that changed on its way in never matches and never raises, so after every merge I count the
      matches with indicator=True, and I fix the key at its source rather than in the analysis.
