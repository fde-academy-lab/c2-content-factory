    key: d
    anchor: >-
      How do you present one number so it is not misread?
    exhibit:
      caption: >-
        One week of the visits log, illustrative: the users who opened the assistant on each day.
      table:
        head:
          - Day
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        rows:
          - [Users, "U1, U2, U3", "U1, U4", "U2, U3, U5", "U1, U2", "U3, U4, U6", U1, "U2, U6"]
    text: |-
      The product lead wants the week's active users for the deck. Which number goes on the slide?
      (a) 16
      (b) 2.3
      (c) 3
      (d) 6
    why: >-
      A distinct count does not add across days: U1 used the assistant on four days, so U1 is in
      four daily counts and once in the week's. The week's figure is its own COUNT(DISTINCT user_id)
      over the week's rows, 6, never the sum of the days, 16. Monday's chapter 5 met the same rule
      on Kalpa's book: 244 buyers in April to June and 227 in July to September are 301 customers
      across both quarters, never 471.
    wrong:
      a: >-
        16 adds up the seven daily counts; each count is distinct within its day, and across days
        the same users repeat, so the sum counts them again.
      b: >-
        The average of the daily counts, 2.3, answers how many use the assistant on a typical day, a
        different question from the week's reach.
      c: >-
        3, the busiest day's count, answers how much the assistant must handle at once, and the ask
        was the week's active users.
    answer: >-
      COUNT(DISTINCT ...) does not add across groups; a period's total needs its own distinct count
      over the whole period.

