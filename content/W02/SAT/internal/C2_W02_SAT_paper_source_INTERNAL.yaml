      c: >-
        An export ages from the day it lands and a workbook can be typed over, the two things
        Anand's rule forbids, and Excel is where a finished number meets the room.
      d: >-
        Exploration is how a definition gets agreed; refusing to look leaves Finance to define the
        number blind.
    answer: >-
