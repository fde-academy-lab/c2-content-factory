        Illustrative rates and the sheet's formula for a day's change (JPMorgan Chase, 2013).
      table:
        head:
          - Row
          - Old rate, column B
          - New rate, column C
          - The sheet's change, column D
        rows:
          - ["2", "2.00", "2.60", "=(C2-B2)/(B2+C2)"]
          - ["3", "3.00", "2.40", "=(C3-B3)/(B3+C3)"]
          - ["4", "1.50", "1.80", "=(C4-B4)/(B4+C4)"]
    text: |-
      JPMorgan's task force on the 2012 losses in its Chief Investment Office reported on a value-at-risk model, an estimate of how much a trading book can lose on a bad day, that ran through Excel spreadsheets filled by copying and pasting (JPMorgan Chase, 2013). Suppose the model's documentation defines a day's change as the difference between the new and old rates divided by their average, and that its value at risk moves in step with the size of those changes. The sheet above reports a value at risk of 70 million dollars against the desk's limit of 120 million dollars; both figures are illustrative. What value at risk should the sheet have reported, and is the desk inside its limit? Show the working.
    why: >-
      Column D reads 0.60 / 4.60 = 0.130, -0.60 / 5.40 = -0.111 and 0.30 / 3.30 = 0.091; divided by
      the average, as the documentation defines it, the changes are 0.261, -0.222 and 0.182. The sum
      of the two rates is twice their average, so every change, rising or falling, comes out at half
      its size, and a value at risk that moves with the changes is half what it should be: 70
      million dollars should read 140 million, 20 million over the 120 million limit. The task force
      wrote that the error "likely had the effect of muting volatility by a factor of two and of
      lowering the VaR". A second way to the same number, by hand on one row or in a second tool,
      catches it, as in Thursday's chapter 4, where plain Python, SQL and pandas agreed only once
      they shared one definition. Quoted from the Report of JPMorgan Chase and Co. Management Task
      Force Regarding 2012 CIO Losses, 16 January 2013, pages 123 and 128, checked on 30 September
      2026; the value at risk and the limit here are illustrative.
    answer: >-
      A number that decides risk gets a second, independent calculation against its written definition
      before it is trusted, because a formula can be wrong in every row at once.
  - id: gross-fare
    label: "Size the commission"
    type: Applied maths
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, FDE
    day: Fri
    key: 2.00 dollars, about 8.5 percent of the 23.50 dollars charged
    anchor: >-
      How do you present one number so it is not misread?
    exhibit:
      caption: >-
        Three illustrative trips and the commission charged on each.
      table:
        head:
          - Trip
          - Gross fare, dollars
          - Taxes and fees, dollars
          - Commission charged, dollars
        rows:
          - ["1", "30.00", "2.40", "7.50"]
          - ["2", "20.00", "1.60", "5.00"]
          - ["3", "44.00", "4.00", "11.00"]
    text: |-
      In 2017 Uber told New York City drivers that it had been taking too much commission from them, and that each affected driver would get a refund of about 900 dollars, interest included (CBS News, 2017). Suppose the drivers' terms set the commission at 25 percent of the fare after taxes and fees. How much commission did the three trips above overcharge the driver, and what share of the commission charged is that? Show the working.
    why: >-
      The commission charged is 25 percent of the gross fare on every trip, 7.50, 5.00 and 11.00. The
      fares after taxes and fees are 27.60, 18.40 and 40.00 dollars, so the commission due is 6.90,
      4.60 and 10.00: 0.60 + 0.40 + 1.00 = 2.00 dollars over, which is also 25 percent of the 8.00
      dollars of taxes and fees. Against the 23.50 dollars charged that is 8.5 percent, and every trip
      that carries taxes and fees is overcharged the same way, which is why a percentage's base is part
      of its definition. CBS News, 24 May 2017, reported that Uber had calculated its driver commissions "based
      on gross fares, before any taxes and fees were deducted"; checked on 30 September 2026. The fares
      and the rate here are illustrative.
    answer: >-
      A percentage is defined only with its base, so before any rate is applied I write down what it
      is a percentage of.
