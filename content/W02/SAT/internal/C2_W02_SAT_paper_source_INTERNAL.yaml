  - id: var-formula
    label: "Work the risk figure"
    type: Applied maths
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS, FDE
    day: Fri
    key: >-
      Column D halves every change, 0.130 against 0.261, so the value at risk should read 140 million
      dollars, 20 million over the limit.
    anchor: >-
      Same question, three tools: how do you choose, and defend one choice?
    exhibit:
      caption: >-
        Illustrative rates and the sheet's formula for a day's change (JPMorgan Chase, 2013).
      table:
        head:
          - Row
          - Old rate, column B
          - New rate, column C
          - The sheet's change, column D
        rows:
          - ["2", "2.00", "2.60", "=(C2-B2)/(B2+C2)"]
          - ["3", "3.00", "2.40", "=(C3-B3)/(B3+C3)"]
          - ["4", "1.50", "1.80", "=(C4-B4)/(B4+C4)"]
    text: |-
      JPMorgan's task force on the 2012 losses in its Chief Investment Office reported on a value-at-risk model, an estimate of how much a trading book can lose on a bad day, that ran through Excel spreadsheets filled by copying and pasting (JPMorgan Chase, 2013). Suppose the model's documentation defines a day's change as the difference between the new and old rates divided by their average, and that its value at risk moves in step with the size of those changes. The sheet above reports a value at risk of 70 million dollars against the desk's limit of 120 million dollars; both figures are illustrative. What value at risk should the sheet have reported, and is the desk inside its limit? Show the working.
    why: >-
      Column D reads 0.60 / 4.60 = 0.130, -0.60 / 5.40 = -0.111 and 0.30 / 3.30 = 0.091; divided by
      the average, as the documentation defines it, the changes are 0.261, -0.222 and 0.182. The sum
      of the two rates is twice their average, so every change, rising or falling, comes out at half
      its size, and a value at risk that moves with the changes is half what it should be: 70 million
      dollars should read 140 million, 20 million over the 120 million limit. The task force wrote that
      the error "likely had the effect of muting volatility by a factor of two and of lowering the
      VaR". A second way to the
      same number, by hand on one row or in a second tool, catches it: Kavya's review and Thursday's
      three-tool check. Quoted from the Report of JPMorgan Chase and Co. Management Task Force
      Regarding 2012 CIO Losses, 16 January 2013, pages 123 and 128, checked on 30 September 2026; the
      value at risk and the limit here are illustrative.
    answer: >-
      A number that decides risk gets a second, independent calculation against its written definition
      before it is trusted, because a formula can be wrong in every row at once.
