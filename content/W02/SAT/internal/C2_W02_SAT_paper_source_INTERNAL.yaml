# Week 2 Saturday: the week's source file, laid on the tracker's bank by
# scripts/build_saturday_paper.py. Block style throughout, so a comma never splits a reason.
#
# The bank sets the topics and this file sets the bar (the requester's plan of 30 September 2026).
# Four bank items print: two answered from a word bank, one with a reworded stem and one as the
# tracker has it. Fifty-four fold into deeper items that test their concepts, each with its
# reason under `folded`. Thirty-one new items carry the rest.
# Every Kalpa number was computed on the week's warehouse and files, and every public-case fact
# was checked against its source on 30 September 2026; the provenance record lists both, and
# internal/C2_W02_SAT_key_proofs_INTERNAL.py asserts every key.

# The Word paper's first page: "What this paper is for", and the Company row of its Rules table.
purpose: >-
  This week you computed Anand's Monday numbers in the warehouse, set booked revenue against the
  cash actually collected, drew up Marketing's protect list, built the customer table in pandas and
  carried it to the leadership deck in Excel. This paper finds which of those decisions you can make
  cold, with no notes and no assistant: sizing a join before it runs, choosing the tie rule the
  business asked for, placing the check that stops a wrong number, and reading a query or a few lines
  of pandas before anyone acts on what it returns. Some items take the same traps to public cases and
  to an AI team's tables. The room's scores by part, set beside the ratings you give in step one,
  tell Monday's session where to start.
company: >-
  Parts 1 to 4 and the workbook in Part 5 are set inside Kalpa Retail, the fictional company of
  Weeks 1 and 2: Anand Iyer is its finance controller, Kavya Nair its senior analyst and Meera
  Raghavan its CEO, and the head of Retail-Plus, the data platform lead and Meera's chief of staff
  are named by role. Six items draw on public cases at Facebook, Public Health England, genomics
  journals, an economics paper, JPMorgan and Uber, each with its source beside it. Part 6 imagines
  an AI team at a food-delivery company such as Swiggy or Zomato, and its tables and numbers are
  illustrative. Every number an item needs is on the page.

# Shared lettered lists, printed once above the first item that answers from them.
banks:
  mon-words:
    style: words
    options:
      - sort
      - CTE
      - view
      - guarantee
      - subquery
  fri-fix:
    style: match
    instruction: >-
      Each numbered row is a job the chief of staff's workbook must do. Write the letter of the
      technique that does it. Each letter is used once at most, and two are not used.
    options:
      - SUBTOTAL(109, ...) at the foot of the list
      - VLOOKUP with its fourth argument left out
      - a labelled input cell beside the actual figure
      - XLOOKUP with a message for a missing id
      - Remove Duplicates on the whole export
      - a first-row flag per order, summed with SUMIFS

# The printed order. Bank items by number, the additions by id.
parts:
  - title: Anand's Monday numbers
    shows: whether you read a query the way the database runs it, and choose where a number Finance audits is computed
    intro: >-
      Anand Iyer, Kalpa Retail's finance controller, keeps the books every revenue figure has to match.
      Every Monday he wants revenue, orders and customers for each segment, the groups Kalpa sells to
      (Business, Retail-Core, Retail-Plus, which is the paid-membership tier, and Student), and for
      each channel (app, web and store). His words: "Compute them from the warehouse itself. No
      notebooks, no exports, nothing a person can mistype." The warehouse is the company's central
      Postgres database, and his analyst will audit every query line by line before a number is
      used.
    items: ["new:int-div", 57, 2, 3, "new:monday-fact", "new:facebook"]
  - title: Booked against collected
    shows: whether you size a join before it runs, order the steps of a reconciliation, and decide what leaves when a check fails
    intro: >-
      Booked revenue is the value of the orders customers placed; collected revenue is the cash that
      actually arrived for them. The two differ when an order is never paid, when a large invoice is
      paid in two instalments (two payments against one order), or when the payment gateway records
      one payment twice. Anand asks: "Show me, order by order, what we actually collected against
      what we booked in Q2. If there is a gap, I want to know which orders and which channel." A
      reconciliation is the written account of every rupee between the two figures, and Anand will
      not use a collected number that arrives without one.
    items: ["new:join-counts", "new:report-steps", "new:where-on-payments", "new:reporting-day", "new:phe-checks"]
  - title: The protect list and the plan line
    shows: whether you rank within a segment with the tie rule the business asked for, and read a monthly flag and a run rate before anyone acts
    intro: >-
      Retail-Plus, Kalpa's paid-membership tier, is where orders per member fell. Marketing will
      offer a retention benefit to the members it most wants to keep: "Give us the top fifty
      customers by Q2 revenue in each segment, and flag anyone whose monthly spend has fallen for
      two months running." That list is the protect list. The head of Retail-Plus adds: "If two
      members spent the same, I want them ranked the same, and I want to know how many made the top
      fifty, not forty-nine because of a tie." Meera also wants Q2's revenue to build up week by
      week against the plan line, the revenue the growth plan expects each week.
    items: ["new:rows-shipped", "new:tie-rule", 27, "new:lag-gap", "new:run-rate"]
  - title: One row per customer
    shows: whether you size a merge, place the guard that stops a double count, and read a pivot that averages or a key that changed on its way in
    intro: >-
      Marketing chooses who gets which offer from one table with one row per customer: recency (days
      since the last order), frequency (orders placed) and monetary value (rupees spent), with the
      customer's segment and whether the monsoon sale reached them. The data platform lead: "The
      warehouse queries are fine for Finance, but Marketing's analysts live in Python. Build them the
      table in pandas, from the warehouse, and make it refreshable in one run." It is rebuilt every
      Monday, and Kavya Nair, the senior analyst, reviews it before it leaves the team: "Show me the
      evidence, and do it a second way."
    items: ["new:merge-rows", "new:pivot-total", "new:stop-line", "new:first-touch", "new:months-view", "new:genes"]
  - title: The last mile, and spreadsheets in public
    shows: whether you match each workbook job to the technique that does it, and name the check that catches a spreadsheet error before the room sees it
    intro: >-
      Meera's chief of staff builds the deck for Monday's growth review and works only in Excel: "The
      revenue tree by segment for both quarters, the top-fifty protect list with a lookup so I can
      find any member by id, and one number on the front page with its trend. If a director changes an
      assumption in the room, the sheet must recalculate in front of them." Excel is where analysis
      meets its audience, so an error made here reaches the room directly, as it has at larger
      organisations than Kalpa.
    exhibits:
      - mermaid: |-
          flowchart LR
            W["Warehouse export:<br/>each order once"] --> T["Tree tab:<br/>revenue by segment"]
            W --> P["Protect tab:<br/>top fifty and a lookup"]
            W --> F["Front page:<br/>one number, its trend"]
            D["A director's<br/>what-if"] --> F
        caption: >-
          The chief of staff's workbook for Monday's review.
    items: ["new:fix-lookup", "new:fix-foot", "new:fix-tree", "new:fix-whatif", "new:range-check", "new:var-formula", "new:gross-fare"]
  - title: "Read the code, read the data: an AI team's tables"
    shows: whether you catch the week's traps in the tables an AI team keeps, from evaluation runs to an assistant's logs
    intro: >-
      Kavya Nair: "AI teams interview on the same traps, on their own tables." Suppose a food-delivery
      company such as Swiggy or Zomato runs a support assistant, a chatbot that answers customers and
      hands hard cases to a person. The team scores each model version on a fixed set of test tickets,
      which is an evaluation run; it collects customers' ratings of the replies; and it logs every
      conversation and every handoff to a person. The tables and every number below are illustrative.
    exhibits:
      - table:
          head:
            - Table
            - One row per
            - Columns
          rows:
            - [predictions, test ticket, "ticket, pred"]
            - [labels, label from the annotation vendor, "ticket, label"]
            - [eval_runs, evaluation run, "model, run_id, finished_on, accuracy"]
            - [replies, reply to a customer, "reply_id, model, rating"]
            - [conversations, conversation, conversation_id]
            - [handoffs, handoff to a person, conversation_id]
            - [calls, call to the model, "call_id, day, tokens"]
        caption: >-
          The assistant team's tables, as this part imagines them.
    items: ["new:eval-fanout", "new:latest-run", "new:low-ratings", "new:not-in", "new:token-peers", "new:weekly-users"]

