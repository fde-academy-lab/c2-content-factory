        text: |-
          WITH calls (call_id, day, tokens) AS (VALUES
              (1, DATE '2026-09-21', 400), (2, DATE '2026-09-22', 300),
              (3, DATE '2026-09-22', 500), (4, DATE '2026-09-23', 200))
          SELECT call_id, sum(tokens) OVER (ORDER BY day) AS tokens_so_far
          FROM calls
          ORDER BY call_id;
    text: |-
      The model's bill is charged per token, so the finance partner wants tokens used so far, call by call, to watch the bill build up. What does tokens_so_far read for calls 1 to 4?
      (a) 400, 1200, 1200 and 1400
      (b) 400, 700, 1200 and 1400
      (c) 1400, 1400, 1400 and 1400
      (d) 400, 900, 1200 and 1400
    why: >-
      With an ORDER BY and no frame, the window runs from the first row to the current row and its
      peers, the rows that tie on the ORDER BY. Calls 2 and 3 share 22 September, so both read the
      day's closing figure, 1200, and neither shows its own step. Adding call_id to the window's ORDER
      BY gives each call its own step. Run on PostgreSQL 16.13 on 30 September 2026.
    wrong:
      b: >-
        The one-step-per-row reading, which needs a unique ORDER BY such as day then call_id; with the
        date alone the two calls are peers.
      c: >-
        The whole-table total on every row, which is what sum(tokens) OVER () gives with no ORDER BY;
        with an ORDER BY, the frame stops at the current row and its peers.
      d: >-
        Assumes the database breaks the tie with call 3 first; peers are never split, they share one
        figure.
    answer: >-
      A running total is deterministic only when its ORDER BY is unique; rows that tie are peers and
      share one cumulative figure, so I add a tiebreaker such as the id.
  - id: weekly-users
    label: "Read the chart"
    type: One correct option
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS
    day: Mon
    key: d
    anchor: >-
      How do you present one number so it is not misread?
    exhibit:
      caption: >-
        Distinct users of the assistant on each day of one week, illustrative.
      mermaid: |-
        xychart-beta
          title "Daily active users of the assistant, one week"
          x-axis "Day" ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
          y-axis "Users" 0 --> 1000
          bar [700, 720, 680, 750, 810, 800, 740]
    text: |-
      The seven daily counts in the chart above add up to 5,200. Counted once each, 2,100 different people used the assistant during the week. The product manager wants the week's active users for the deck. Which number do you give, and why?
      (a) 5,200, since each day's count is already a count of distinct users
      (b) 743, the daily average, since it smooths out the busy Friday
      (c) 810, the busiest day, since the deck should show peak demand
      (d) 2,100, since someone active on several days counts once
    why: >-
      A distinct count does not add across days: a person who used the assistant on five days is in
      five daily counts and once in the week's. The week's figure is its own COUNT(DISTINCT user_id)
      over the week's rows, 2,100, never the sum of the days. On Kalpa's book, 244 Q1 buyers and 227
      Q2 buyers are 301 customers across both quarters, not 471.
    wrong:
      a: >-
        Each day is distinct within the day; across days the same people repeat, so the sum counts them
        again.
      b: >-
        An average of daily counts answers how many on a typical day, a different question from the
        week's reach.
      c: >-
        The peak answers capacity planning; the ask was the week's active users.
    answer: >-
      COUNT(DISTINCT ...) does not add across groups; a period's total needs its own distinct count
      over the whole period.

