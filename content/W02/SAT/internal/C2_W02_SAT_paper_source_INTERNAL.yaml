notes:
  2:
    label: "Complete the LIMIT rule"
    bank: mon-words
    min: 1.5
    why: >-
      A table has no stored order, so without ORDER BY the database returns whichever rows its plan
      reaches first, and two runs can differ: Monday's sample of five delivered app orders summed to
      Rs 3,900 and, after a reload that rewrote two rows with their own values, to Rs 4,590. Every
      word in the bank is a noun and fits the blank's grammar; only guarantee fits its sense. "sort"
      is the near miss, since a plan that reads an index may well return sorted rows on some runs,
      which is why a sample can look stable until a reload; what the database withholds is the
      promise.
    answer: >-
      LIMIT without ORDER BY returns some rows, never defined ones, so I order on a unique key before
      I limit.
  3:
    label: "Complete the WITH rule"
    bank: mon-words
    min: 1.5
    why: >-
      WITH names a common table expression, a step the rest of the query reads like a table. A
      subquery is the near miss: it is inline and unnamed. A view is named too, but it is stored
      with CREATE VIEW, never introduced by WITH.
    answer: >-
      A CTE names each step of the logic, so an auditor reads the query top to bottom, one decision
      per block.
  27:
    label: "Choose the approach"
    min: 2.5
    why: >-
      A rank computed within PARTITION BY segment keeps every customer and restarts for each segment;
      the outer query keeps the rows ranked three or better. The window has to be filtered outside,
      because WHERE runs before any window is computed. The whole-table list in the stem is
      Wednesday's round 1 trap: all 35 Business customers who ordered, since the smallest of their
      spends, Rs 2,25,000, is ten times the largest retail spend, then 11 Retail-Plus members and 4
      Retail-Core customers, and no Student.
    wrong:
      a: >-
        GROUP BY collapses each segment to one row, so the customers are gone before LIMIT runs, and
        LIMIT applies once to the whole result, never per group.
      c: >-
        One ORDER BY with LIMIT 3 is the whole-table list at a smaller size: the top three overall,
        all Business, which is the first draft's mistake again.
      d: >-
        HAVING keeps or drops whole groups by an aggregate; it cannot choose rows inside a group.
    answer: >-
      Top N per group is a window: rank inside PARTITION BY the group in a CTE, keep rank N or better
      outside it, and name the tie rule.

additions:
  # ---------------------------------------------------------------- Part 1, Monday
  - id: int-div
    label: "Predict and read the leaf"
    type: Applied maths
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Mon
    key: >-
      It prints 2 and 1. The note should say orders per member fell about 22 percent, from 2.36 to
      1.84.
    anchor: >-
      A stakeholder's analyst must audit your query; what changes in how you write it, and what
      would you refuse to compute in a notebook?
    exhibit:
      caption: >-
        The Retail-Plus branch of Anand's revenue tree, as the warehouse holds it: revenue is members
        who ordered, times orders per member, times revenue per order.
      mermaid: |-
        flowchart LR
          R["Retail-Plus revenue<br/>Apr to Jun: Rs 5,85,770<br/>Jul to Sep: Rs 4,13,380"] --> M["Members who ordered<br/>Apr to Jun: 91<br/>Jul to Sep: 76"]
          R --> F["Orders per member<br/>Apr to Jun: ?<br/>Jul to Sep: ?"]
          R --> V["Revenue per order<br/>Apr to Jun: Rs 2,725<br/>Jul to Sep: Rs 2,953"]
          F --- O["Orders placed<br/>Apr to Jun: 215<br/>Jul to Sep: 140"]
    text: |-
      Anand's analyst fills the missing leaf with SELECT quarter, count(*) / count(DISTINCT customer_id) FROM rp_orders GROUP BY quarter, where rp_orders holds the Retail-Plus orders above, and drafts a note to the head of Retail-Plus from what it returns. What does the query print for each quarter, and what should the note say orders per member did from the first quarter to the second? Show the working.
    why: >-
      count(*) and count(DISTINCT customer_id) are both integers, so Postgres divides integers and
      drops the fraction: 215 / 91 prints 2 for April to June, and 140 / 76 prints 1 for July to
      September. Orders per member were 2.36 and 1.84, and 1.84 against 2.36 is a fall of about 22
      percent; accept 21 to 22 percent, or about a fifth. A note that quotes the printed 2 and 1 says
      orders per member halved, which is Monday's round 2 trap. The fix is count(*)::numeric, and the
      check is to multiply back: 1 times 76 members is 76, against 140 orders. Run on PostgreSQL 16.13
      on the week's warehouse on 30 September 2026.
    answer: >-
      Orders per member is a ratio of two counts, and Postgres divides two integers as integers, so I
      cast one side to numeric and multiply back by the denominator before the number leaves.
  - id: avg-spend
    label: "Predict the average"
    type: One correct option
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS
    day: Mon
    key: c
    anchor: >-
      A stakeholder's analyst must audit your query; what changes in how you write it, and what
      would you refuse to compute in a notebook?
    exhibit:
      caption: >-
        The analyst's query for the head of Retail-Plus.
      code:
        lang: sql
        text: |-
          WITH member_step AS (
              SELECT c.customer_id, sum(o.amount) AS spend
              FROM   customers c
              LEFT   JOIN orders o
                     ON o.customer_id = c.customer_id AND o.quarter = 'Q2'
              WHERE  c.segment = 'Retail-Plus'
              GROUP  BY c.customer_id)
          SELECT round(avg(spend)) AS avg_spend
          FROM   member_step;
    text: |-
      Retail-Plus has 120 members on its books, and from July to September 76 of them ordered, spending Rs 4,13,380 between them. The head of Retail-Plus asks for the average spend per member on the books, and the analyst runs the query above. What does it print?
      (a) An error, since avg cannot read a spend that is NULL
      (b) 3445, the average over all 120 members on the books
      (c) 5439, the average over the 76 members who ordered
      (d) NULL, since one missing spend leaves the whole average empty
    why: >-
      A member with no order in the quarter joins no order row, so sum(o.amount) for that member runs
      over nothing and returns NULL, for 44 of the 120 members; avg skips NULLs, so it divides Rs
      4,13,380 by the 76 members who ordered and prints 5439. The head asked for the average over all
      120 on the books, Rs 3,445, which needs coalesce(sum(o.amount), 0) in the member step. Monday's
      rule is to say who is in every average. Run on PostgreSQL 16.13 on the week's warehouse on 30
      September 2026.
    wrong:
      a: >-
        avg reads NULLs without complaint and leaves them out; nothing in the query raises an error.
      b: >-
        The figure the head asked for, which the query prints only if the member step turns a member
        with no order into 0 with coalesce; as written, those members carry NULL and avg skips them.
      d: >-
        An aggregate skips NULLs; only arithmetic such as spend + NULL returns NULL.
    answer: >-
      AVG skips NULLs, so an average over a LEFT JOIN is an average over the rows that matched unless I
      coalesce the missing ones to zero, and I say who is in every average.
  - id: tool-choice
    label: "Choose where it runs"
    type: One correct option
    level: Medium
    min: 2.5
    tag: "[D]"
    roles: BA, DS
    day: Mon
    key: a
    anchor: >-
      Why would you compute a KPI in the warehouse rather than in a notebook?
    text: |-
      On Monday afternoon the head of Retail-Plus asks the analyst for a chart of orders per member, week by week across both quarters, to see how the figure moved before anyone decides what to report. With Anand's rule in mind, where should that work happen?
      (a) In a notebook that reads the warehouse, since this chart is none of the Monday figures the rule governs
      (b) In the Monday suite as a saved query, since Anand's rule covers every number that anyone at Kalpa looks at
      (c) In a workbook built from Monday's export, since a weekly chart is what Excel does best for a tier's head
      (d) Nowhere yet, since a chart of a figure Finance has not defined will mislead whoever reads it
    why: >-
      Anand's rule names the figures he wants every Monday, revenue, orders and customers by segment
      and channel, and asks for them from the warehouse with no notebooks and no exports. A weekly
      chart of orders per member for the head of Retail-Plus is none of those figures: it is
      exploration, and exploration belongs in a notebook, which should read the warehouse so that it
      works on the same book as the suite. The one direction a number travels is from the warehouse,
      through pandas for the analyst's iteration, to Excel for the room; once the head decides what to
      report, that figure becomes a query in the suite.
    wrong:
      b: >-
        Stretches the rule past its words: it covers the figures Anand files each Monday, and a suite
        that holds every exploratory chart stops being a list an analyst can audit.
      c: >-
        An export is stale the day it lands and a workbook can be typed over, which is what Anand's
        rule rules out; Excel is where a finished number meets the room.
      d: >-
        Exploration is how a definition gets agreed; refusing to look leaves Finance to define the
        number blind.
    answer: >-
      The reported number lives in the warehouse because it reruns unchanged on the source and every
      line can be audited; exploration lives in a notebook that reads the warehouse, and Excel
      presents what has been decided.
  - id: facebook
    label: "Size the overstatement"
    type: One correct option
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS
    day: Mon
    key: d
    anchor: >-
      How do you present one number so it is not misread?
    exhibit:
      caption: >-
        Five illustrative people who played a video and the seconds each watched, with the average
        Facebook defined and the one it calculated (TechCrunch, 2016).
      code:
        lang: sql
        text: |-
          WITH viewers (viewer_id, seconds) AS (VALUES
              (1, 2.0), (2, 14.0), (3, 1.0), (4, 9.0), (5, 4.0))
          SELECT round(sum(seconds) / count(CASE WHEN seconds >= 3 THEN 1 END), 1) AS calculated,
                 round(sum(seconds) / count(*), 1)                                AS defined
          FROM viewers;
    text: |-
      In 2016 Facebook told advertisers that it had defined the average duration of video viewed as the total time spent watching a video divided by the number of people who played it, and had calculated it by dividing by only the people who watched for three seconds or more (TechCrunch, 2016). The query above rebuilds both on five illustrative viewers. By how much does the calculated average overstate the defined one?
      (a) About 40 percent
      (b) 50 percent
      (c) Not at all; the two agree
      (d) About 67 percent
    why: >-
      The CASE has no ELSE, so it returns NULL for the two viewers under three seconds, and count
      skips NULLs: the calculated average divides all 30 seconds by 3 people, 10.0, where the defined
      one divides by all 5 who played, 6.0. Against the defined figure, 10.0 overstates 6.0 by 4.0
      over 6.0, about 67 percent. TechCrunch (Devin Coldewey, 22 September 2016) quoted Facebook's
      definition and its calculation, put the inflation at 60 to 80 percent over two years and
      reported that billing was not affected; checked on 30 September 2026. Run on PostgreSQL 16.13
      on 30 September 2026.
    wrong:
      a: >-
        Divides the gap by the wrong base: 4.0 over the calculated 10.0 is 40 percent, and an
        overstatement is measured against the true figure, the defined 6.0.
      b: >-
        Averages the three long viewers alone, (14 + 9 + 4) / 3 = 9.0 against 6.0; the numerator
        stayed all the time watched, the short viewers' 3 seconds included.
      c: >-
        count(CASE WHEN ... THEN 1 END) counts only the non-NULL results, and a CASE with no ELSE
        returns NULL for the viewers it does not match; Monday's round 3 trap in another form.
    answer: >-
      An average is defined by its denominator; when a filter or a CASE quietly shrinks it, the
      average rises with no change in the data, so I print the numerator and the denominator beside
      the ratio.
  # ---------------------------------------------------------------- Part 2, Tuesday
  - id: join-counts
    label: "Size the join first"
    type: Scenario set
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Tue
    key: a
    anchor: >-
      Your LEFT join grew the row count and revenue doubled; name the cause and the check.
    exhibit:
      caption: >-
        The first query in Anand's report, run before any rupee is summed.
      code:
        lang: sql
        text: |-
          SELECT count(*)            AS rows_out,
                 count(p.payment_id) AS payment_rows
          FROM   orders o
          LEFT   JOIN payments p ON p.order_id = o.order_id
          WHERE  o.quarter = 'Q2';
    text: |-
      SET 4. SITUATION: The quarter from July to September, stored as quarter 'Q2', holds 462 orders booked at Rs 9,84,00,000. In the payments feed, 216 of them have one payment row; 188 have two rows, instalments 1 and 2 of one invoice; 28 have two identical rows, because the gateway posted instalment 1 twice; and 30 delivered orders have no payment row at all. Eight further payment rows carry an order_id that no order has.
      Before the report goes to Anand, the analyst sizes the join by hand. What will the query above return?
      (a) 678 and 648
      (b) 462 and 432
      (c) 650 and 620
      (d) 686 and 656
    why: >-
      A LEFT JOIN writes one row per matching payment row and keeps an order with none as one row of
      NULLs: 216 + 2 times 188 + 2 times 28 + 30 = 678 rows. count(p.payment_id) skips the 30 unpaid
      orders' NULLs where count(*) counts them, so it reads 678 minus 30 = 648, which is also what an
      INNER JOIN would return. The gateway's identical rows join twice like any other rows, and the
      eight payments with no order never meet an order. Run on PostgreSQL 16.13 on the week's
      warehouse on 30 September 2026.
    wrong:
      b: >-
        Reads the join as one row per order, and payment rows as one per paid order; a join repeats an
        order once per matching row, which is Tuesday's round 1 fan-out.
      c: >-
        Assumes the join keeps the gateway's two identical rows once; a join matches rows by key,
        identical or not, so both repeat the order.
      d: >-
        Counts the eight payments with no order as if they had joined; a LEFT JOIN from orders keeps
        only rows that start from an order, and only a FULL OUTER JOIN brings in the payments whose
        order is missing.
    answer: >-
      INNER keeps only matched rows and LEFT keeps every order with NULLs where nothing matched; both
      repeat an order once per matching payment row, so I size the join, rows out against orders in,
      before any rupee is summed.
  - id: report-steps
    label: "Order the report's steps"
    type: Order the steps
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS, FDE
    day: Tue
    key: e, f, b, c, a
    anchor: >-
      Design the validation you run before a joined number reaches Finance, and say what you do when
      it fails at the end of reporting day.
    text: |-
      SET 4, continued.
      Five of these six steps make Anand's collected-revenue report, and one would spoil it. Leave that step out, and write the other five in the order they must run.
      (a) Send booked, collected and the gap to Anand, channel by channel
      (b) LEFT JOIN the quarter's 462 orders to each order's collected figure
      (c) Check that the result has one row for each of the 462 orders, and that each channel's gap equals its unpaid orders' booked value
      (d) Drop every order that has two payment rows, since those are the gateway's double posts
      (e) Keep one payment row for each order and instalment number
      (f) Sum the payment rows to one collected figure for each order
    why: >-
      The step to leave out is d: 188 of the orders with two payment rows are instalments 1 and 2 of
      one invoice, and dropping them throws away real cash along with the 28 repeats. On the same
      book, HAVING count(*) > 1 by order lists 216 orders, and by order and instalment it lists the
      28 repeats. The repeats go first (e), because a sum taken before them keeps the Rs 20,750 the
      gateway posted twice. The payment rows go to one collected figure per order (f), which is what
      the join (b) reads, so the result keeps one row per order; the checks (c) come before anything is
      sent (a), and on Kalpa's book they read 462 rows and a gap of Rs 17,54,930, the unpaid orders'
      booked value exactly. Run on PostgreSQL 16.13 on the week's warehouse on 30 September 2026.
    answer: >-
      De-duplicate at the grain that defines a repeat, aggregate to the join's grain, join, prove the
      row count and the gap, then send.
  - id: where-on-payments
    label: "Run the query by hand"
    type: One correct option
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS, FDE
    day: Tue
    key: b
    anchor: >-
      INNER against LEFT join: what does each drop or keep?
    exhibit:
      caption: >-
        The analyst's query, with three of the quarter's orders and their payment rows written into it.
      code:
        lang: sql
        text: |-
          WITH orders (order_id, amount) AS (VALUES
              ('O-1', 1200), ('O-2', 800), ('O-3', 500)),
          payments (order_id, paid_date, paid) AS (VALUES
              ('O-1', DATE '2026-07-04', 600), ('O-1', DATE '2026-08-04', 600),
              ('O-2', DATE '2026-10-01', 800))
          SELECT count(*) AS rows_out, sum(o.amount) AS booked
          FROM orders o
          LEFT JOIN payments p ON p.order_id = o.order_id
          WHERE p.paid_date BETWEEN DATE '2026-07-01' AND DATE '2026-09-30';
    text: |-
      Anand wants every order of the quarter beside what was collected on it within the quarter, so the analyst adds a date filter on the payments. Before the report goes to him, the analyst runs the query above to count its rows and their booked value. What does it return?
      (a) 1 row, booked Rs 1,200
      (b) 2 rows, booked Rs 2,400
      (c) 3 rows, booked Rs 2,900
      (d) 4 rows, booked Rs 3,700
    why: >-
      O-1's two instalments both fall inside the quarter, so the join gives O-1 two rows and
      sum(o.amount) counts its Rs 1,200 twice. O-2's only payment is dated 1 October, so its joined row
      fails the WHERE. O-3 has no payment, so its paid_date is NULL, BETWEEN on a NULL is unknown, and
      WHERE drops that row too. Two rows remain, booked Rs 2,400, against three orders worth Rs 2,500:
      the report lost two orders and doubled the one it kept. Run on PostgreSQL 16.13 on 30 September
      2026.
    wrong:
      a: >-
        Assumes one row per order, which holds only once payments are brought to one row per order;
        O-1 has two payment rows inside the quarter, so the join repeats it.
      c: >-
        Keeps O-3 as if its NULL date passed the filter; a comparison with NULL is unknown, and WHERE
        keeps only rows where it is true, which is how the date filter in Tuesday's round 3 emptied
        the unpaid list.
      d: >-
        Reads the WHERE as if it sat in the ON clause, where it would keep every order with NULL
        payments on O-2 and O-3; in WHERE it runs after the join and turns the LEFT JOIN into an INNER
        one, which is Tuesday's round 3 trap.
    answer: >-
      A filter on the right-hand table of a LEFT JOIN belongs in ON, because WHERE runs after the join,
      drops the NULL rows and turns the LEFT JOIN back into an INNER one; and the payments go to one
      row per order before the join.
  - id: reporting-day
    label: "Decide what leaves tonight"
    type: One correct option
    level: Medium
    min: 3.5
    tag: "[D]"
    roles: BA, FDE
    day: Tue
    key: c
    anchor: >-
      Design the validation you run before a joined number reaches Finance, and say what you do when
      it fails at the end of reporting day.
    exhibit:
      caption: >-
        Suppose these are the report's figures by channel at the end of a later reporting day; the
        figures are illustrative. The report's row count and its booked total both match their
        sources.
      table:
        head:
          - Channel
          - Booked, Rs
          - Collected, Rs
          - Unpaid orders' booked value, Rs
        rows:
          - [App, "4,25,90,270", "4,25,82,150", "8,120"]
          - [Store, "3,21,48,730", "3,11,90,920", "9,57,810"]
          - [Web, "2,36,61,000", "2,28,50,250", "7,89,000"]
    text: |-
      It is the end of the reporting day, and Anand expects the report tonight. His rule for a late failure is to send what reconciles and hold what does not, and in each channel the gap, booked less collected, should equal the unpaid orders' booked value. What do you send?
      (a) Booked and collected for every channel, with any unexplained gap added to that channel's unpaid list
      (b) Booked for every channel, collected for app and web, and store's collected held back
      (c) Booked for every channel, collected for app and store, and web's collected held back
      (d) Booked for every channel, with all collected held back until every bridge closes
    why: >-
      The gaps are app Rs 8,120 and store Rs 9,57,810, each equal to its unpaid list to the rupee, and
      web Rs 8,10,750, which exceeds its list's Rs 7,89,000 by Rs 21,750 that nobody has explained.
      Booked matches its source, so it goes for every channel; app's and store's collected reconcile,
      so they go; web's collected waits, with the Rs 21,750 named as an open line with an owner and a
      time. That is the rule in the stem, applied channel by channel, and the Tuesday pack's answer to
      a check that fails late. The figures are illustrative: on Kalpa's own book, web's gap equals its
      unpaid list at Rs 7,89,000.
    wrong:
      a: >-
        Adding the unexplained Rs 21,750 to web's unpaid list forces the bridge closed and puts on the
        list an amount that no unpaid order carries.
      b: >-
        Store has the largest gap, and its gap equals its unpaid list to the rupee; the channel whose
        bridge fails is web, by Rs 21,750.
      d: >-
        Holds back two collected figures that reconcile to the rupee, which the rule sends; Anand loses
        app's and store's collected over a doubt that concerns web alone.
    answer: >-
      Before a joined number reaches Finance I check rows in against rows out, the total against its
      source and the gap against a named list; when one fails at the end of the reporting day, what
      reconciles goes out, what does not waits, and the open line is named with its amount, an owner
      and a time.
  - id: phe-checks
    label: "Choose the checks"
    type: More than one correct
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS, FDE
    day: Tue
    key: c, e
    anchor: >-
      Design the validation you run before a joined number reaches Finance, and say what you do when
      it fails at the end of reporting day.
    exhibit:
      caption: >-
        Suppose one day's files from three labs looked like this; the counts are illustrative. An
        .xls sheet holds 65,536 rows, one of them the header.
      table:
        head:
          - Lab file
          - Records in the lab's CSV
          - Data rows in the .xls sheet
          - Rows loaded
          - Rows loaded the day before
        rows:
          - [Lab A, "41,200", "41,200", "41,200", "39,850"]
          - [Lab B, "70,900", "65,535", "65,535", "61,020"]
          - [Lab C, "12,480", "12,480", "12,480", "13,110"]
    text: |-
      In October 2020 Public Health England found that 15,841 positive COVID-19 cases from 25 September to 2 October had been left out of the daily figures, because some files had exceeded the maximum size the load could take (GOV.UK, 2020). The labs' CSV files had been converted to the older .xls format, and records past its limit were "simply left off and not counted when imported" (The Register, 2020). Which of these checks, run on every file, would have stopped Lab B's file on the day in the table? Mark every correct option.
      (a) Compare rows loaded with data rows in the .xls sheet, and stop the file when they differ
      (b) Remove duplicate rows from each file before it is loaded, so that no case counts twice
      (c) Compare rows loaded with records in the lab's CSV, and stop the file when they differ
      (d) Stop any file whose rows loaded fall below that lab's rows loaded the day before
      (e) Stop any file whose sheet holds exactly 65,535 data rows, the most the format allows
    why: >-
      Lab B's file lost 5,365 records in the conversion, 70,900 in the CSV against 65,535 rows in the
      sheet. Comparing rows loaded with the lab's own count of records sees the loss, and a sheet at
      exactly 65,535 data rows sits at the format's limit, which a check can treat as a stop. Rows
      loaded and rows in the sheet were both counted after the cut, so they agree, and Lab B loaded
      more rows than the day before, 65,535 against 61,020, so neither of those checks fires. That is
      Tuesday's habit, rows in against rows out, taken back to the first count in the chain. The facts
      are from the GOV.UK statement of 4 October 2020 (15,841 cases between 25 September and 2
      October; files that exceeded the maximum file size) and The Register of 5 October 2020 (lab CSV
      files stored in the older .xls format, 65,536 rows a sheet, records past the limit left off and
      not counted), both checked on 30 September 2026; the three labs' counts are illustrative.
    wrong:
      a: >-
        Rows loaded and data rows in the sheet were both counted after the conversion cut the file, so
        they agree at 65,535 and the check passes.
      b: >-
        De-duplication removes rows; it cannot find rows that were never loaded.
      d: >-
        Lab B loaded 65,535 rows against 61,020 the day before, so a check for a fall stays quiet while
        5,365 records go missing; a day-on-day check sees only a loss larger than the day's growth.
    answer: >-
      Any step that can drop rows without a warning needs a count on both sides of it, taken back to
      the first count in the chain, and the load stops when they differ; raising a limit only moves
      the cliff.
  # ---------------------------------------------------------------- Part 3, Wednesday
  - id: rows-shipped
    label: "Apply the head's rule"
    type: One correct option
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS
    day: Wed
    key: d
    anchor: >-
      The business says 'ties rank the same'; which function, and how many rows might the top-N report
      ship?
    exhibit:
      caption: >-
        Retail-Plus members in rows 46 to 53 when sorted by the quarter's revenue, highest first, with
        tied members in order of their ids.
      table:
        head:
          - Row, highest revenue first
          - Member
          - Revenue, July to September, Rs
        rows:
          - ["46", C-0162, "3,600"]
          - ["47", C-0264, "3,540"]
          - ["48", C-0189, "3,480"]
          - ["49", C-0206, "3,480"]
          - ["50", C-0185, "3,350"]
          - ["51", C-0242, "3,350"]
          - ["52", C-0259, "3,200"]
          - ["53", C-0252, "3,150"]
    text: |-
      Retail-Plus had 76 members who ordered from July to September. Sorted by their revenue for the quarter, highest first, the top 45 each spent a different amount, all above Rs 3,600, and rows 46 to 53 are in the table. The head of Retail-Plus sets the rule for the protect list: "If two members spent the same, rank them the same. Keep every member who spent at least as much as the fiftieth, and nobody who spent less." Which ranking gives that list, and how many members does it keep?
      (a) DENSE_RANK, keeping every member ranked 50 or better: 52 members
      (b) ROW_NUMBER with member id as tiebreaker, keeping rows 1 to 50: 50 members
      (c) Whole ties only, cutting before any tie that crosses the fiftieth place: 49 members
      (d) RANK, keeping every member ranked 50 or better: 51 members
    why: >-
      RANK gives C-0185 and C-0242 the shared rank 50 and C-0259 rank 52, so 51 members hold a rank
      of 50 or better, and they are exactly the members who spent at least Rs 3,350, the fiftieth
      member's spend. DENSE_RANK leaves no gaps, so the tie at 48 (C-0189 and C-0206) lifts C-0185 and
      C-0242 to dense rank 49 and C-0259, on Rs 3,200, to 50: 52 members, one of whom spent less than
      the fiftieth. ROW_NUMBER numbers every row once and drops C-0242, who spent as much as the
      fiftieth. The note to Marketing gives the list's length and the tie that sets it. Run on
      PostgreSQL 16.13 on the week's warehouse on 30 September 2026.
    wrong:
      a: >-
        Shares ranks, and then keeps C-0259, who spent Rs 3,200, less than both members at the
        fiftieth place; that is Wednesday's trap, where "ties rank the same" quietly shipped a member
        below the line.
      b: >-
        Keeps exactly fifty, the same every Monday, by dropping C-0242, who spent exactly what the
        fiftieth did, on an id nobody chose on purpose; if the budget demands fifty, the tiebreaker is
        a decision the head of Retail-Plus owns.
      c: >-
        Leaves out C-0185 and C-0242, who both spent as much as the fiftieth; the rule keeps them.
    answer: >-
      When the business says ties rank the same, I use RANK and state the list's length and its reason
      in the same line, because the list can ship more than N; if the budget demands exactly N, the
      tiebreaker becomes a decision someone owns.
  - id: share-window
    label: "Choose the share query"
    type: One correct option
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: a
    anchor: >-
      Top-3 per group: GROUP BY or a window, and why?
    text: |-
      Marketing wants each Retail-Plus member's spend beside the member's share of the tier's spend for July to September. The table member_step holds one row per member who ordered, with the columns customer_id and spend. Which query gives each member's share?
      (a) SELECT customer_id, spend, spend / sum(spend) OVER () FROM member_step
      (b) SELECT customer_id, spend, spend / sum(spend) FROM member_step GROUP BY customer_id, spend
      (c) SELECT customer_id, spend, spend / sum(spend) OVER (ORDER BY spend DESC) FROM member_step
      (d) SELECT customer_id, spend, spend / sum(spend) OVER (PARTITION BY customer_id) FROM member_step
    why: >-
      OVER () puts the tier's total on every row without collapsing the rows, so each member's spend
      divides by Rs 4,13,380 and the shares add to 1. Grouping by member makes each sum the member's
      own spend, and so does a partition by member, so both return a share of 1 for everyone; an
      ORDER BY inside the window turns the sum into a running total, so the top spender's share reads 1
      and each later share divides by a larger part of the total. Run on PostgreSQL 16.13 on the
      week's warehouse on 30 September 2026.
    wrong:
      b: >-
        GROUP BY customer_id makes sum(spend) each member's own spend, so every share reads 1.
      c: >-
        An ORDER BY inside the window makes the sum a running total, so the top spender divides by
        their own spend and every share after it by a different part of the total.
      d: >-
        A partition by member sums each member's own row, so every share reads 1.
    answer: >-
      A share of the total is the row's value over sum() OVER (), a window with no partition and no
      order, which keeps every row and puts the total beside it.
  - id: lag-gap
    label: "Run the falling flag"
    type: One correct option
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Wed
    key: b
    anchor: >-
      How would you find customers whose spend fell two months in a row?
    exhibit:
      caption: >-
        Four Retail-Plus members' monthly spend in rupees, from the warehouse's orders.
      table:
        head:
          - Member
          - Apr
          - May
          - Jun
          - Jul
          - Aug
          - Sep
        rows:
          - [C-0161, "3,520", "", "", "4,200", "3,100", "1,900"]
          - [C-0171, "", "2,210", "4,130", "3,800", "2,600", "1,400"]
          - [C-0185, "3,880", "6,990", "2,690", "1,900", "", "1,450"]
          - [C-0216, "", "6,440", "", "4,300", "", "2,540"]
    text: |-
      The falling flag reads member_month, which sums each member's orders by calendar month. It takes prev1 = LAG(spend, 1) and prev2 = LAG(spend, 2), each partitioned by member and ordered by month, and flags a member whose September spend is below prev1 while prev1 is below prev2. Marketing will call every member the flag names and say that their spend fell in both August and September. How many calls does Marketing make, and how many of them say something untrue?
      (a) 2 calls, none of them untrue
      (b) 4 calls, two of them untrue
      (c) 3 calls, one of them untrue
      (d) 1 call, and it is true
    why: >-
      member_month has a row only for a month with an order, and LAG reads the previous row in the
      partition, never the previous calendar month. C-0161 and C-0171 fell from July to August and
      again from August to September, so both are flagged, and rightly. C-0185's September is compared
      with July (1,450 below 1,900) and July with June (1,900 below 2,690), and C-0216's September with
      July and July with May (2,540 below 4,300, below 6,440), so both are flagged too, although neither
      ordered in August: two of the four calls tell a member their spend fell in August and September
      when there was no August reading at all. A calendar check, that the two rows LAG reads are August
      and July, keeps the two genuine falls. Run on PostgreSQL 16.13 on the week's warehouse on 30
      September 2026.
    wrong:
      a: >-
        Assumes LAG steps back one calendar month, so C-0185 and C-0216 would meet an empty August and
        drop out; LAG returns whatever row came before in the window's order, and both are flagged.
      c: >-
        Assumes LAG(spend, 2) returns NULL for C-0216; it has rows for May, July and September, so on
        its September row LAG(spend, 2) returns May's 6,440. LAG returns NULL only on a member's first
        rows, and a comparison with that NULL flags nobody.
      d: >-
        Assumes any member with a month missing before September drops out of the flag; LAG reads
        rows, so C-0161's empty May and June do not matter, and nor do the others' gaps.
    answer: >-
      One row per customer per month, LAG 1 and LAG 2 partitioned by customer and ordered by month, a
      check that the lagged rows really are the previous two calendar months, and a flag where each
      month is below the one before; a month with no order is no reading.
  - id: run-rate
