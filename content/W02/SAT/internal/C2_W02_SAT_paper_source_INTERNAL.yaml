notes:
  2:
    label: "Complete the LIMIT rule"
    bank: mon-words
    min: 1.5
    why: >-
      A table has no stored order, so without ORDER BY the database returns whichever rows its plan
      reaches first, and two runs can differ. In Monday's chapter 6, a sample of five delivered app
      orders from July to September summed to Rs 3,900, and after a reload that rewrote two rows with
      the values they already held, the analyst's rerun drew a different five worth Rs 4,590. Every
      word in the bank is a noun and fits the blank's grammar, and only guarantee fits its sense. Sort
      is the near miss: a plan that reads an index may return sorted rows on some runs, which is why a
      sample can look stable until a reload, but the database promises nothing about it.
    answer: >-
      LIMIT without ORDER BY returns some rows, never defined ones, so I order on a unique key before
      I limit.
  3:
    label: "Complete the WITH rule"
    bank: mon-words
    min: 1.5
    why: >-
      WITH names a common table expression, or CTE, which Monday's chapter 4 called a named step: the
      rest of the query reads it like a table. A subquery is the near miss, since it sits inline with
      no name. A view is named too, but CREATE VIEW stores it in the warehouse, and WITH never
      introduces one.
    answer: >-
      A CTE names each step of the logic, so an auditor reads the query top to bottom, one decision
      per block.
  27:
    label: "Choose the approach"
    min: 2.5
    why: >-
      A rank computed within PARTITION BY segment keeps every customer and starts again in each
      segment, and the outer query keeps the rows ranked three or better. The filter has to sit
      outside the window, because WHERE runs before any window is computed. The list in the stem is
      Wednesday's chapter 2 trap, the whole book numbered once and then split by segment: all 35
      Business customers who ordered, since the smallest of their spends, Rs 2,25,000, is ten times
      the largest retail spend, Rs 21,740, then 11 Retail-Plus members, 4 Retail-Core customers and no
      Student.
    wrong:
      a: >-
        GROUP BY collapses each segment to one row, so the customers are gone before LIMIT runs, and
        LIMIT applies once to the whole result, never per group.
      c: >-
        One ORDER BY with LIMIT 3 is the stem's whole-book list cut shorter: it returns the top three
        overall, all Business, which repeats the first list's mistake.
      d: >-
        HAVING keeps or drops whole groups by an aggregate, so it cannot choose rows inside a group.
    answer: >-
      Top N per group is a window: rank inside PARTITION BY the group in a CTE, keep rank N or better
      outside it, and name the tie rule.

additions:
  # ---------------------------------------------------------------- Part 1, Monday
  - id: int-div
    label: "Predict and read the leaf"
    type: Applied maths
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Mon
    key: >-
      It prints 2 and 1. The note should say orders per member fell about 22 percent, from 2.36 to
      1.84.
    anchor: >-
      A stakeholder's analyst must audit your query; what changes in how you write it, and what
      would you refuse to compute in a notebook?
    exhibit:
      caption: >-
        The Retail-Plus branch of Anand's revenue tree, as the warehouse holds it: revenue is the
        product of the tree's three leaves, members who ordered, orders per member and revenue per
        order.
      mermaid: |-
        flowchart LR
          R["Retail-Plus revenue<br/>Apr to Jun: Rs 5,85,770<br/>Jul to Sep: Rs 4,13,380"] --> M["Members who ordered<br/>Apr to Jun: 91<br/>Jul to Sep: 76"]
          R --> F["Orders per member<br/>Apr to Jun: ?<br/>Jul to Sep: ?"]
          R --> V["Revenue per order<br/>Apr to Jun: Rs 2,725<br/>Jul to Sep: Rs 2,953"]
          F --- O["Orders placed<br/>Apr to Jun: 215<br/>Jul to Sep: 140"]
    text: |-
      Anand's analyst fills the missing leaf with SELECT quarter, count(*) / count(DISTINCT customer_id) FROM rp_orders GROUP BY quarter, where rp_orders holds the Retail-Plus orders above, and drafts a note to the head of Retail-Plus from what it returns. What does the query print for each quarter, and what should the note say orders per member did from the first quarter to the second? Show the working.
    why: >-
      count(*) and count(DISTINCT customer_id) are both whole numbers, so Postgres divides them as
      integers and drops the fraction: 215 / 91 prints 2 for April to June, and 140 / 76 prints 1
      for July to September. Orders per member were 2.36 and 1.84, and 1.84 against 2.36 is a fall
      of 22.0 percent; accept 21 to 22 percent, or about a fifth. A note that quotes the printed 2
      and 1 says orders per member halved, which is Monday's chapter 3 trap. The fix is
      count(*)::numeric, and the check is to multiply back: 1 times 76 members is 76, where the
      orders are 140. Run on PostgreSQL 16.14 on the week's warehouse on 1 October 2026.
    answer: >-
      Orders per member is a ratio of two counts, and Postgres divides two integers as integers, so I
      cast one side to numeric and multiply back by the denominator before the number leaves.
  - id: avg-spend
    label: "Predict the average"
    type: One correct option
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS
    day: Mon
    key: c
    anchor: >-
      A stakeholder's analyst must audit your query; what changes in how you write it, and what
      would you refuse to compute in a notebook?
    exhibit:
      caption: >-
        The analyst's query for the head of Retail-Plus.
      code:
        lang: sql
        text: |-
          WITH member_step AS (
              SELECT c.customer_id, sum(o.amount) AS spend
              FROM   customers c
              LEFT   JOIN orders o
                     ON o.customer_id = c.customer_id AND o.quarter = 'Q2'
              WHERE  c.segment = 'Retail-Plus'
              GROUP  BY c.customer_id)
          SELECT round(avg(spend)) AS avg_spend
          FROM   member_step;
    text: |-
      Retail-Plus has 120 members on its books, and from July to September 76 of them ordered, spending Rs 4,13,380 between them. The head of Retail-Plus asks for the average spend across all 120 members on the books, whether they ordered or not, and the analyst runs the query above. What does it print?
      (a) An error, since avg cannot read a spend that is NULL
      (b) 3445, the average over all 120 members on the books
      (c) 5439, the average over the 76 members who ordered
      (d) NULL, since one missing spend leaves the whole average empty
    why: >-
      A member with no order in the quarter keeps one row from the LEFT JOIN, with NULL in every
      order column, so sum(o.amount) returns NULL for 44 of the 120 members. avg skips NULLs, so it
      divides Rs 4,13,380 by the 76 members who ordered and prints 5439. The head asked for the
      average over all 120 on the books, Rs 3,445, which needs coalesce(sum(o.amount), 0) in the
      member step. Monday's chapter 4 met the same skip from a CASE with no ELSE, and Kavya's rule
      from it is that an average names who is inside it. Run on PostgreSQL 16.14 on the week's
      warehouse on 1 October 2026.
    wrong:
      a: >-
        avg reads NULLs without complaint and leaves them out; nothing in the query raises an error.
      b: >-
        3445 is the figure the head asked for, and the query prints it only once the member step
        turns a member with no order into 0 with coalesce; as written, those members carry NULL and
        avg skips them.
      d: >-
        An aggregate skips NULLs; only arithmetic such as spend + NULL returns NULL.
    answer: >-
      AVG skips NULLs, so an average over a LEFT JOIN is an average over the rows that matched unless I
      coalesce the missing ones to zero, and I say who is in every average.
  - id: tool-choice
    label: "Choose where it runs"
