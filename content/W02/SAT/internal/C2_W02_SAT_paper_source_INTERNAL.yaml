      rows, 9.0 / 6 = 1.5, so the sheet reports growth 2 points lower in high-debt years. Over all six
      countries the high-debt column averages (-1.0 + 1.0 - 3.0 + 1.0 + 6.0 + 5.0) / 6 = 1.5, the same
      as the other years, so the gap disappears. In the paper the averages covered lines 30 to 44 of the
      sheet instead of lines 30 to 49 (footnote 5), and the error, compounded with other errors, took
      0.3 percentage points off the published average for the highest debt group, overstated the
      lowest group by 0.1 and understated the second by 0.2; the replicators' corrected average for
      the highest group, 2.2 percent against the published -0.1, also corrects two other choices, so the
      range alone is not the whole gap (PERI working paper 322, April 2013, page 7, checked on 30
      September 2026). The check that catches a range such as B2:B5 is a count of the rows each range
      covers against the rows in the table, run on every refresh.
