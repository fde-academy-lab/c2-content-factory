  - id: low-ratings
    label: "Predict the rows"
    type: One correct option
    level: Hard
    min: 4
    tag: "[S]"
    roles: DS
    day: Mon
    key: b
    anchor: >-
      WHERE against HAVING, one sentence each.
    exhibit:
      caption: >-
        Seven replies and the ratings customers gave them, illustrative.
      code:
        lang: sql
        text: |-
          WITH replies (reply_id, model, rating) AS (VALUES
              (1, 'bot-a', 1), (2, 'bot-a', 4), (3, 'bot-a', 2),
              (4, 'bot-b', 2), (5, 'bot-b', 5),
              (6, 'bot-c', 5), (7, 'bot-c', 4))
          SELECT model, count(*) AS low_rated
          FROM replies
          WHERE rating <= 2
          GROUP BY model
          HAVING count(*) >= 2;
    text: |-
      Customers rate each reply from 1 to 5. The team lead asks which models had at least two replies rated 2 or below this week. What does the query above return?
      (a) bot-a 2 and bot-b 1
      (b) bot-a 2 alone
      (c) bot-a 2, bot-b 1 and bot-c 0
      (d) bot-a 3, bot-b 2 and bot-c 2
    why: >-
      WHERE runs first and keeps the three low ratings, two for bot-a and one for bot-b. GROUP BY forms
      groups only from those rows, so bot-c forms no group at all, and HAVING then keeps the groups
      with two or more: bot-a, 2. The query never prints a zero row. Run on PostgreSQL 16.13 on 30
      September 2026.
    wrong:
      a: >-
        Applies HAVING before WHERE: judged on all seven ratings every model has two or more, and then
        the rows are filtered. The logical order is WHERE, GROUP BY, HAVING.
      c: >-
        A group exists only for values that survive WHERE; bot-c had no low rating, so it has no row,
        and bot-b's 1 fails HAVING.
      d: >-
        Counts every rating, as if WHERE were ignored; these are the group sizes before any filter.
    answer: >-
      WHERE keeps or drops single rows before any group exists; HAVING keeps or drops whole groups
      after the aggregate is computed, which is why an aggregate can sit in HAVING and never in WHERE.
  - id: not-in
    label: "Predict the count"
    type: One correct option
    level: Hard
    min: 4
    tag: "[F]"
    roles: DS, FDE
    day: Tue
    key: c
    anchor: >-
      How do you find orders with no payment?
    exhibit:
      caption: >-
        Four conversations and the handoff log, illustrative.
      code:
        lang: sql
        text: |-
          WITH conversations (conversation_id) AS (VALUES ('c1'), ('c2'), ('c3'), ('c4')),
          handoffs (conversation_id) AS (VALUES ('c2'), ('c4'), (NULL))
          SELECT count(*) AS resolved_by_bot
          FROM conversations
          WHERE conversation_id NOT IN (SELECT conversation_id FROM handoffs);
    text: |-
      The weekly review reads how many conversations the assistant resolved without a person. This week the handoff log gained a row whose conversation_id is NULL. What does the query above return, and what will the review conclude?
      (a) 2, c1 and c3; the review sees the assistant resolving half the conversations
      (b) 3; the NULL row counts as one more conversation nobody handed off
      (c) 0; the review concludes the assistant resolved nothing without a person
      (d) An error; NOT IN cannot compare a conversation_id with a NULL
    why: >-
      For c1, NOT IN asks c1 <> 'c2' AND c1 <> 'c4' AND c1 <> NULL; the last comparison is unknown, so
      the whole condition is unknown and WHERE drops the row. Every conversation fails the same way,
      so the count is 0 and the review reads a working assistant as useless. NOT EXISTS, or a LEFT
      JOIN kept where the handoff key IS NULL, returns 2. Run on PostgreSQL 16.13 on 30 September
      2026.
    wrong:
      a: >-
        The answer NOT EXISTS gives; NOT IN against a list that holds a NULL can never be true.
      b: >-
        The NULL sits in the subquery's list, never in the outer table, so it cannot add a
        conversation.
      d: >-
        Postgres raises nothing; the comparison with NULL is unknown and the rows are dropped without a
        word.
    answer: >-
      Rows with no match are an anti-join, which I write as NOT EXISTS or as a LEFT JOIN kept where
      the right key IS NULL, never as NOT IN against a column that can hold a NULL.
