  - id: range-check
    label: "Reproduce the comparison"
    type: Applied maths
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS, FDE
    day: Fri
    key: >-
      The sheet reports -0.5 against 1.5, a gap of 2 points; B8 stops at row 5, and over all six
      countries both columns average 1.5, so the gap disappears.
    anchor: >-
      Your pivot shows a different total from the warehouse; where do you look first?
    exhibit:
      caption: >-
        An illustrative sheet that sets growth in high-debt years against growth in other years for
        six countries, in percent.
      table:
        head:
          - Row
          - "A: Country"
          - "B: High-debt years"
          - "C: Other years"
        rows:
          - ["2", Country 1, "-1.0", "2.0"]
          - ["3", Country 2, "1.0", "1.0"]
          - ["4", Country 3, "-3.0", "2.0"]
          - ["5", Country 4, "1.0", "1.0"]
          - ["6", Country 5, "6.0", "2.0"]
          - ["7", Country 6, "5.0", "1.0"]
          - ["8", Average, "=AVERAGE(B2:B5)", "=AVERAGE(C2:C7)"]
    text: |-
      In 2013 Herndon, Ash and Pollin rebuilt an influential 2010 paper by Reinhart and Rogoff from the authors' own working spreadsheet, and found that the paper's average growth for countries with public debt over 90 percent of GDP, the value of everything a country produces in a year, published as -0.1 percent, was 2.2 percent when properly calculated (PERI working paper 322, 2013). The illustrative sheet above goes to a review today. What does it report for the two columns, what do the six countries' figures give, and does its comparison hold? Show the working.
    why: >-
      B8 averages rows 2 to 5 alone, (-1.0 + 1.0 - 3.0 + 1.0) / 4 = -0.5, while C8 covers all six
      rows, 9.0 / 6 = 1.5, so the sheet reports growth 2 points lower in high-debt years. Over all six
      countries the high-debt column averages (-1.0 + 1.0 - 3.0 + 1.0 + 6.0 + 5.0) / 6 = 1.5, the same
      as the other years, so the gap disappears. In the paper the averages covered lines 30 to 44 of the
      sheet instead of lines 30 to 49 (footnote 5), and the error, compounded with other errors, took
      0.3 percentage points off the published average for the highest debt group, overstated the
      lowest group by 0.1 and understated the second by 0.2; the replicators' corrected average for
      the highest group, 2.2 percent against the published -0.1, also corrects two other choices, so the
      range alone is not the whole gap (PERI working paper 322, April 2013, page 7, checked on 30
      September 2026). The check that catches a range such as B2:B5 is a count of the rows each range
      covers against the rows in the table, run on every refresh.
    answer: >-
      Every total in a workbook ties to a control total from the source on each refresh, and every
      range is checked against the rows it should cover, because a range that stops short raises no
      error.
  - id: var-formula
