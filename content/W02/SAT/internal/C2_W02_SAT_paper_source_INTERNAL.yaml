notes:
  2:
    label: "Complete the LIMIT rule"
    bank: mon-words
    min: 1.5
    why: >-
      A table has no stored order, so without ORDER BY the database returns whichever rows its plan
      reaches first, and two runs can differ: Monday's sample of five delivered app orders summed to
      Rs 3,900 and, after a reload that rewrote two rows with their own values, to Rs 4,590. "sort"
      is the near miss, and it fails because a plan that reads an index does return sorted rows on
      some runs; what the database withholds is the promise.
    answer: >-
      LIMIT without ORDER BY returns some rows, never defined ones, so I order on a unique key before
      I limit.
  3:
    label: "Complete the WITH rule"
    bank: mon-words
    min: 1.5
    why: >-
      WITH names a common table expression, a step the rest of the query reads like a table. A
      subquery is the near miss: it is inline and unnamed. A view is named too, but it is stored
      with CREATE VIEW, never introduced by WITH.
    answer: >-
      A CTE names each step of the logic, so an auditor reads the query top to bottom, one decision
      per block.
  27:
    label: "Choose the approach"
    min: 2.5
    why: >-
      A rank computed within PARTITION BY segment keeps every member and restarts for each segment;
      the outer query keeps the rows ranked three or better. The window has to be filtered outside,
      because WHERE runs before any window is computed. The whole-table list in the stem is Wednesday's
      round 1 trap: 35 Business members, 11 Retail-Plus, 4 Retail-Core and no Student.
    wrong:
      a: >-
        GROUP BY collapses each segment to one row, so the members are gone before LIMIT runs, and
        LIMIT applies once to the whole result, never per group.
      c: >-
        One ORDER BY with LIMIT 3 is the whole-table list at a smaller size: the top three overall,
        all Business, which is the first draft's mistake again.
      d: >-
        HAVING keeps or drops whole groups by an aggregate; it cannot choose rows inside a group.
    answer: >-
      Top N per group is a window: rank inside PARTITION BY the group in a CTE, keep rank N or better
      outside it, and name the tie rule.
  57:
    label: "Order the clauses"
    why: >-
      The logical order is FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY: rows are read, filtered,
      grouped, and the groups filtered, before anything is selected or sorted. The common wrong
      answer is the order the clauses are typed, a, c, b, e, f, d, which puts SELECT first; the
      database cannot pick columns from rows it has not yet read, filtered and grouped. The same
      order explains why a SELECT alias works in ORDER BY and fails in WHERE, and why SELECT can name
      only grouped columns and aggregates.
    answer: >-
      FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, and most of the errors a query can raise follow
      from it.

additions:
  # ---------------------------------------------------------------- Part 1, Monday
  - id: int-div
    label: "Predict and read the leaf"
    type: One correct option
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Mon
    key: c
    anchor: >-
      A stakeholder's analyst must audit your query; what changes in how you write it, and what
      would you refuse to compute in a notebook?
    exhibit:
      caption: >-
        The Retail-Plus branch of Anand's revenue tree, as the warehouse holds it: revenue is members
        who ordered, times orders per member, times revenue per order.
      mermaid: |-
        flowchart LR
          R["Retail-Plus revenue<br/>Q1 Rs 5,85,770<br/>Q2 Rs 4,13,380"] --> M["Members who ordered<br/>Q1 91, Q2 76"]
          R --> F["Orders per member<br/>Q1 ?, Q2 ?"]
          R --> V["Revenue per order<br/>Q1 Rs 2,725, Q2 Rs 2,953"]
          F --- O["Orders placed<br/>Q1 215, Q2 140"]
    text: |-
      Anand's analyst fills the missing leaf with SELECT quarter, count(*) / count(DISTINCT customer_id) FROM rp_orders GROUP BY quarter, where rp_orders holds the Retail-Plus orders above. What does the query return, and what should the note to the head of Retail-Plus say?
      (a) 2.36 and 1.84; dividing two counts keeps the decimals, a fall of 22 percent
      (b) 2 and 2; Postgres rounds each ratio to a whole number, so frequency held
      (c) 2 and 1; the counts divide as integers, and the true 2.36 and 1.84 fell 22 percent
      (d) 2 and 1; orders per member halved, so Retail-Plus needs the retention budget first
    why: >-
      count(*) and count(DISTINCT customer_id) are both integers, so Postgres divides integers and
      drops the fraction: 215 / 91 returns 2 and 140 / 76 returns 1. The true figures are 2.36 and
      1.84, a fall of 22 percent, and casting one side, count(*)::numeric, prints them. The check is
      to multiply back: 1 times 76 members is 76, against 140 orders. Run on PostgreSQL 16.13 on the
      week's warehouse on 30 September 2026.
    wrong:
      a: >-
        The decimals appear only when one side is numeric, as in count(*)::numeric; two integer counts
        divide as integers. This is the number the query should print, and does not.
      b: >-
        Postgres truncates integer division; it does not round, and 140 / 76 rounded would be 2, which
        the printed 1 contradicts.
      d: >-
        Reads the printed 2 and 1 as the business fact, which is Monday's round 2 trap: Retail-Plus
        "halved" and the budget went to Retail-Core, where multiplying back (1 times 76 is 76, against
        140 orders) shows the query is wrong.
    answer: >-
      Orders per member is a ratio of two counts, and Postgres divides two integers as integers, so I
      cast one side to numeric and multiply back by the denominator before the number leaves.
  - id: monday-fact
    label: "Name the deciding fact"
    type: One correct option
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, FDE
    day: Mon
    key: a
    anchor: >-
      Why would you compute a KPI in the warehouse rather than in a notebook?
    text: |-
      The Monday suite runs as saved queries in the warehouse, so each Monday it reruns unchanged on the source, and Anand's analyst can read every step. Which fact, if it became true of one of its numbers, would make an Excel workbook the better home for that number?
      (a) Directors will change it in the room as a what-if, and nothing is filed from it
      (b) It must reach Anand at the start of Monday, before the warehouse finishes loading
      (c) Anand's analyst wants to audit it line by line before it reaches the board
      (d) It is revenue per segment, which a pivot gives in two clicks from an export
    why: >-
      Excel's job is the last mile: presenting a number and letting people explore it. A number that
      becomes a what-if for the room, with nothing filed from it, has become that job. Every other
      option is a reason to keep the number in the warehouse, where it reruns unchanged on the source
      and every step can be audited. Friday's operating rule says the same, and gives the one
      direction a number travels: the warehouse computes it, pandas carries the analyst's iteration,
      and Excel presents it to the room, never the other way.
    wrong:
      b: >-
        A workbook fed by an export is staler than the warehouse, never fresher; a number needed early
        on Monday is a scheduling question for the warehouse query.
      c: >-
        Line-by-line audit is the reason the number lives in the warehouse: a query can be read step
        by step, and a typed-over cell leaves no trail.
      d: >-
        Convenience is no reason to move a number Finance reports; a pivot on an export is one more
        copy that can drift from the source.
    answer: >-
      A number Finance audits lives in the warehouse because it reruns unchanged on the source and
      every step can be read; Excel is for presenting it and for what-ifs the room explores, never
      for computing the number of record.
  - id: facebook
    label: "Size the overstatement"
    type: One correct option
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS
    day: Mon
    key: d
    anchor: >-
      How do you present one number so it is not misread?
    exhibit:
      caption: >-
        Five illustrative video views; the metric follows the definition Facebook corrected in 2016
        (TechCrunch, 2016).
      code:
        lang: sql
        text: |-
          WITH views (view_id, seconds) AS (VALUES
              (1, 2), (2, 14), (3, 1), (4, 9), (5, 4))
          SELECT round(sum(seconds)::numeric
                       / count(CASE WHEN seconds >= 3 THEN 1 END), 1) AS reported,
                 round(sum(seconds)::numeric / count(*), 1)          AS per_view
          FROM views;
    text: |-
      In 2016 Facebook told advertisers that its average duration of video viewed had divided the total time watched by the number of views lasting 3 seconds or more, where it should have divided by every view (TechCrunch, 2016). The query above rebuilds both versions of the metric. What does it return, and by how much does the reported figure overstate the average per view?
      (a) 10.0 and 6.0; the reported figure is about 40 percent too high
      (b) 9.0 and 6.0; the reported figure is 50 percent too high
      (c) 6.0 and 6.0; count(CASE ...) counts all five views, so both agree
      (d) 10.0 and 6.0; the reported figure is about 67 percent too high
    why: >-
      The CASE has no ELSE, so it returns NULL for the two short views, and count skips NULLs: the
      reported figure divides all 30 seconds by 3 views, 10.0, where the average per view is 30 over
      5, 6.0. Measured against the true figure, 10.0 overstates 6.0 by 4.0 over 6.0, about 67
      percent. TechCrunch (22 September 2016), citing The Wall Street Journal, put Facebook's
      overstatement at 60 to 80 percent over two years and reported that billing was not affected;
      checked on 30 September 2026. Run on PostgreSQL 16.13 on 30 September 2026.
    wrong:
      a: >-
        Divides the gap by the wrong base: 4.0 over the reported 10.0 is 40 percent, and an
        overstatement is measured against the true figure, 6.0.
      b: >-
        Averages the three long views alone, (14 + 9 + 4) / 3 = 9.0; the metric's numerator was all
        the time watched, and the short views' 3 seconds stay in it.
      c: >-
        count(CASE WHEN ... THEN 1 END) counts only the non-NULL results, and a CASE with no ELSE
        returns NULL for the views it does not match; Monday's round 3 trap in another form.
    answer: >-
      An average is defined by its denominator; when a filter or a CASE quietly shrinks it, the
      average rises with no change in the data, so I print the numerator and the denominator beside
      the ratio.
  # ---------------------------------------------------------------- Part 2, Tuesday
  - id: join-counts
    label: "Size the join first"
    type: Scenario set
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Tue
    key: b
    anchor: >-
      Your LEFT join grew the row count and revenue doubled; name the cause and the check.
    exhibit:
      caption: >-
        The first query in Anand's report, run before any rupee is summed.
      code:
        lang: sql
        text: |-
          SELECT count(*)                   AS rows_out,
                 count(DISTINCT o.order_id) AS orders,
                 count(p.payment_id)        AS payment_rows
          FROM   orders o
          LEFT   JOIN payments p ON p.order_id = o.order_id
          WHERE  o.quarter = 'Q2';
    text: |-
      SET 4. SITUATION: Q2 holds 462 orders, booked at Rs 9,84,00,000. In the payments feed, 216 of them have one payment row; 188 have two rows, instalments 1 and 2 of one invoice; 28 have two identical rows, because the gateway posted instalment 1 twice; and 30 delivered orders have no payment row at all. Eight further payment rows carry an order_id that no order has.
      Before the report goes to Anand, the analyst sizes the join by hand. What will the query above return?
      (a) 462, 462 and 432
      (b) 678, 462 and 648
      (c) 678, 462 and 678
      (d) 686, 470 and 656
    why: >-
      A LEFT JOIN writes one row per matching payment row and keeps an order with none as one row of
      NULLs: 216 + 2 times 188 + 2 times 28 + 30 = 678 rows. count(DISTINCT o.order_id) counts the 462
      orders, and count(p.payment_id) skips the 30 unpaid orders' NULLs, 678 minus 30 = 648, which is
      also what an INNER JOIN would return. The eight payments with no order never meet an order, so
      they are in none of the counts. Run on PostgreSQL 16.13 on the week's warehouse on 30 September
      2026.
    wrong:
      a: >-
        Reads the join as keeping one row per order, and payment rows as one per paid order (462 minus
        30 = 432); a join repeats an order once per matching row, which is Tuesday's round 1 fan-out.
      c: >-
        count(p.payment_id) skips NULLs, and only count(*) counts the 30 unpaid orders' rows; reading
        count(column) as count(*) is Monday's round 1 trap inside a join.
      d: >-
        Counts the eight payments with no order as if they had joined; a LEFT JOIN from orders keeps
        only rows that start from an order, and only a FULL OUTER JOIN brings in the payments whose
        order is missing.
    answer: >-
      INNER keeps only matched rows and LEFT keeps every order with NULLs where nothing matched; both
      repeat an order once per matching payment row, so I size the join, rows out against orders in,
      before any rupee is summed.
  - id: report-steps
    label: "Order the report's steps"
    type: Order the steps
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS, FDE
    day: Tue
    key: c, e, a, d, b
    anchor: >-
      Design the validation you run before a joined number reaches Finance, and say what you do when
      it fails at the end of reporting day.
    text: |-
      SET 4, continued.
      Put the steps of Anand's collected-revenue report in the order they must run.
      (a) LEFT JOIN the 462 orders to those per-order payments
      (b) Send booked, collected and the gap to Anand, by channel
      (c) Keep one row per order and instalment, dropping the gateway's repeats
      (d) Check for 462 rows out, and a gap equal to the unpaid orders' booked value
      (e) Sum the remaining payments to one row per order
    why: >-
      The repeats go first, because a sum taken before them keeps the Rs 20,750 the gateway posted
      twice; the payments go to one row per order before the join, because a join onto payment rows
      repeats every instalment order; the LEFT JOIN keeps all 462 orders; the checks come before
      anything is sent, and on Kalpa's Q2 book they read 462 rows out and a gap of Rs 17,54,930, the
      booked value of the 30 unpaid orders exactly. On the same book, HAVING count(*) > 1 by order
      lists 216 orders, of which 188 are two instalments; grouping by order and instalment leaves the
      28 repeats. The common wrong order sums first (e before c), which keeps the repeats in
      collected, or sends before checking. Run on PostgreSQL 16.13 on the week's warehouse on 30
      September 2026.
    answer: >-
      De-duplicate at the grain that defines a repeat, aggregate to the join's grain, join, prove the
      row count and the gap, then send.
  - id: where-on-payments
    label: "Run the query by hand"
    type: One correct option
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS, FDE
    day: Tue
    key: b
    anchor: >-
      INNER against LEFT join: what does each drop or keep?
    exhibit:
      caption: >-
        The analyst's query, with three Q2 orders and their payment rows written into it.
      code:
        lang: sql
        text: |-
          WITH orders (order_id, amount) AS (VALUES
              ('O-1', 1200), ('O-2', 800), ('O-3', 500)),
          payments (order_id, paid_date, paid) AS (VALUES
              ('O-1', DATE '2026-07-04', 600), ('O-1', DATE '2026-08-04', 600),
              ('O-2', DATE '2026-10-01', 800))
          SELECT count(*) AS rows_out, sum(o.amount) AS booked
          FROM orders o
          LEFT JOIN payments p ON p.order_id = o.order_id
          WHERE p.paid_date BETWEEN DATE '2026-07-01' AND DATE '2026-09-30';
    text: |-
      Anand wants every Q2 order beside what was collected on it within the quarter, so the analyst adds a date filter on the payments. Before the report goes to him, the analyst runs the query above to count its rows and their booked value. What does it return?
      (a) 1 row, booked Rs 1,200
      (b) 2 rows, booked Rs 2,400
      (c) 3 rows, booked Rs 2,900
      (d) 4 rows, booked Rs 3,700
    why: >-
      O-1's two instalments both fall inside the quarter, so the join gives O-1 two rows and
      sum(o.amount) counts its Rs 1,200 twice. O-2's only payment is dated 1 October, so its joined row
      fails the WHERE. O-3 has no payment, so its paid_date is NULL, BETWEEN on a NULL is unknown, and
      WHERE drops that row too. Two rows remain, booked Rs 2,400, against three orders worth Rs 2,500:
      the report lost two orders and doubled the one it kept. Run on PostgreSQL 16.13 on 30 September
      2026.
    wrong:
      a: >-
        Assumes one row per order, which holds only once payments are brought to one row per order;
        O-1 has two payment rows inside the quarter, so the join repeats it.
      c: >-
        Keeps O-3 as if its NULL date passed the filter; a comparison with NULL is unknown, and WHERE
        keeps only rows where it is true, which is how the date filter in Tuesday's round 3 emptied
        the unpaid list.
      d: >-
        Reads the WHERE as if it sat in the ON clause, where it would keep every order with NULL
        payments on O-2 and O-3; in WHERE it runs after the join and turns the LEFT JOIN into an INNER
        one, which is Tuesday's round 3 trap.
    answer: >-
      A filter on the right-hand table of a LEFT JOIN belongs in ON, because WHERE runs after the join,
      drops the NULL rows and turns the LEFT JOIN back into an INNER one; and the payments go to one
      row per order before the join.
  - id: reporting-day
    label: "Decide what leaves tonight"
    type: One correct option
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, FDE
    day: Tue
    key: c
    anchor: >-
      Design the validation you run before a joined number reaches Finance, and say what you do when
      it fails at the end of reporting day.
    exhibit:
      caption: >-
        Suppose these are the report's checks at the end of a later reporting day; the figures are
        illustrative.
      table:
        head:
          - Check
          - Expected
          - Found
          - Result
        rows:
          - [Rows out against the orders in, "462", "462", Passes]
          - [Booked after the join against Monday's figure, "Rs 9,84,00,000", "Rs 9,84,00,000", Passes]
          - [The gap against the unpaid list's booked value, "Rs 17,33,180", "Rs 17,54,930", "Fails by Rs 21,750"]
    text: |-
      It is the end of reporting day, and Anand expects the report tonight. Two checks pass, and the third fails by Rs 21,750 that nobody has explained yet. What do you send?
      (a) Booked and collected, with Rs 21,750 added to the unpaid list so the bridge closes
      (b) Collected alone, as the figure Anand asked for, with the failed check in a footnote
      (c) Booked as it stands, with collected held back and the Rs 21,750 named as an open line
      (d) Nothing tonight, since a report with one failed check is trusted in none of its figures
    why: >-
      Booked passed both of its checks, so it can leave. Collected rests on the check that failed, so
      it waits, and naming the Rs 21,750 as an open line with an owner and a time is what Anand can
      act on. The Tuesday pack gives this answer to its question on the end of reporting day: ship
      booked with the open line named, and hold collected.
    wrong:
      a: >-
        Forcing the bridge to close hides the one fact the check found; the reconciliation would then
        explain a sum that no order carries.
      b: >-
        Sends the one figure the failed check leaves unproven, and a footnote does not travel with a
        number once it is quoted.
      d: >-
        Holds back a figure that passed its checks; Anand loses the booked number over a doubt that
        concerns collected alone.
    answer: >-
      Before a joined number reaches Finance I check rows in against rows out, the total against its
      source and the gap against a named list; when one fails at the end of reporting day, the
      figures that passed go out, the one that failed waits, and the open line is named with an owner
      and a time.
  - id: phe-checks
    label: "Choose the checks"
    type: More than one correct
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS, FDE
    day: Tue
    key: b, d
    anchor: >-
      Design the validation you run before a joined number reaches Finance, and say what you do when
      it fails at the end of reporting day.
    exhibit:
      caption: >-
        Public Health England's case data path in autumn 2020, as reported (GOV.UK, 2020; The
        Register, 2020).
      mermaid: |-
        flowchart LR
          L["Labs' result files<br/>in CSV"] --> X["Converted to .xls:<br/>at most 65,536 rows<br/>a sheet"]
          X --> C["Loaded into<br/>central systems"]
          C --> D["Daily case<br/>dashboard"]
    text: |-
      In October 2020 Public Health England found that 15,841 positive COVID-19 cases from 25 September to 2 October had been left out of the daily figures, because some files were larger than the load could take (GOV.UK, 2020); rows past the old format's limit were dropped without a warning (The Register, 2020). Which of these, run on every file, would have told the team that cases were missing on the day they went missing? Mark every correct option.
      (a) Saving the files in the newer .xlsx format, whose sheets hold about a million rows
      (b) Counting each file's records against the rows loaded, and stopping when they differ
      (c) Removing duplicate rows from each file before it is loaded, so no case counts twice
      (d) Tying the day's loaded total to the sum of the counts the labs themselves reported
      (e) Building a pivot of the loaded cases by lab and by day, for the team that runs the dashboard
    why: >-
      Both correct checks compare what arrived with what was loaded, so a truncation shows the day it
      happens: a per-file count of records against rows loaded, and a control total from the source
      against the loaded total. That is Tuesday's habit, rows in against rows out, and Week 1's revenue
      bridge, input equals clean plus rejected. The facts are from the GOV.UK statement of 4 October
      2020 (15,841 cases between 25 September and 2 October; files that exceeded the maximum size)
      and The Register of 5 October 2020 (lab files in CSV converted to the .xls format, 65,536 rows a
      sheet, records past the cut-off left off), both checked on 30 September 2026.
    wrong:
      a: >-
        Raises the ceiling from 65,536 rows to about a million and checks nothing: a file past the new
        limit would be cut just as quietly. It removes this cause, and leaves the kind of failure.
      c: >-
        De-duplication removes rows; it cannot find rows that were never loaded.
      e: >-
        A pivot sums what was loaded, so it cannot see what never arrived: the missing cases are
        missing from the pivot too.
    answer: >-
      Any step that can drop rows without a warning needs a count on both sides of it, and the load
      stops when they differ; raising a limit only moves the cliff.
  # ---------------------------------------------------------------- Part 3, Wednesday
  - id: rows-shipped
    label: "Count what each rule ships"
    type: Scenario set
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: a
    anchor: >-
      RANK, DENSE_RANK and ROW_NUMBER on a tie.
    text: |-
      SET 5. SITUATION: Retail-Plus had 76 members who ordered in Q2. Sorted by Q2 revenue from the highest, the top 45 each spent a different amount, all above Rs 3,600, and rows 46 to 53 are in the table. The protect list keeps the members numbered 50 or better.
      The analyst computes RANK(), DENSE_RANK() and ROW_NUMBER() over Q2 revenue, highest first, and keeps the members numbered 50 or better under each. How many members does each keep?
      (a) 51, 52 and 50
      (b) 51, 51 and 50
      (c) 50, 51 and 50
      (d) 52, 51 and 50
    why: >-
      RANK gives C-0185 and C-0242 the shared rank 50 and C-0259 rank 52, so 51 members hold a rank
      of 50 or better. DENSE_RANK leaves no gaps, so the tie at 48 (C-0189 and C-0206) makes C-0185
      and C-0242 dense rank 49 and C-0259 dense rank 50: 52 members. ROW_NUMBER numbers every row
      once: 50. Run on PostgreSQL 16.13 on the week's warehouse on 30 September 2026.
    wrong:
      b: >-
        Sees one tie at the line and reads DENSE_RANK as RANK without the gap; the second tie, at 48,
        compresses the dense numbers so that C-0259 reaches 50. That is Wednesday's trap, where "ties
        rank the same" quietly shipped 52.
      c: >-
        Reads RANK as capping the list at fifty; RANK gives both tied members 50 and keeps both.
      d: >-
        Swaps the two functions: RANK leaves a gap after each tie, and DENSE_RANK does not.
    answer: >-
      ROW_NUMBER gives every row its own number and breaks ties arbitrarily, RANK shares a rank and
      skips the next, and DENSE_RANK shares without a gap; on a top-N list, RANK can ship more than N
      and DENSE_RANK more still, so I count what each rule ships before choosing.
  - id: tie-rule
    label: "Make the head's call"
    type: Scenario set
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS
    day: Wed
    key: d
    anchor: >-
      The business says 'ties rank the same'; which function, and how many rows might the top-N report
      ship?
    text: |-
      SET 5, continued.
      Which list meets the head of Retail-Plus's ask, and what does the note to Marketing say?
      (a) DENSE_RANK, since it ranks tied members the same and leaves no gaps in the list
      (b) ROW_NUMBER by member id, dropping C-0242 because its id sorts after C-0185
      (c) Whole ties only, leaving both members tied at the line off the list
      (d) RANK, with a note naming C-0185 and C-0242 as tied at fiftieth on Rs 3,350
    why: >-
      He asked for tied members to share a rank and for the count to include a tie at the line. RANK
      does both: 51 members, and the note says why the list is one over fifty. DENSE_RANK also ranks
      ties the same but ships 52, because an earlier tie compressed its numbers, so the list gains
      C-0259 on Rs 3,200, a member below both tied members.
    wrong:
      a: >-
        Meets the first half of the ask and breaks the second: its 52 includes C-0259, who spent less
        than both members tied at the line, so the length no longer means the top fifty with ties.
      b: >-
        Exactly fifty and the same every Monday, at the cost of dropping a member who spent exactly
        what the fiftieth did, by an id nobody chose on purpose; if the budget demands exactly fifty,
        the tiebreaker becomes a decision the head of Retail-Plus owns.
      c: >-
        The "forty-nine because of a tie" he ruled out, in his own words.
    answer: >-
      When the business says ties rank the same, I use RANK and state the count and its reason in the
      same line, because the list can ship more than N; if the budget demands exactly N, the
      tiebreaker becomes a decision someone owns.
  - id: lag-gap
    label: "Run the falling flag"
    type: One correct option
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Wed
    key: c
    anchor: >-
      How would you find customers whose spend fell two months in a row?
    exhibit:
      caption: >-
        Four Retail-Plus members' monthly spend in rupees; a blank month had no order, so the
        member_month table has no row for it.
      table:
        head:
          - Member
          - Apr
          - May
          - Jun
          - Jul
          - Aug
          - Sep
        rows:
          - [C-0161, "3,520", "", "", "4,200", "3,100", "1,900"]
          - [C-0171, "", "2,210", "4,130", "3,800", "2,600", "1,400"]
          - [C-0185, "3,880", "6,990", "2,690", "1,900", "", "1,450"]
          - [C-0216, "", "6,440", "", "4,300", "", "2,540"]
    text: |-
      The falling flag reads member_month, one row per member per month with an order. It takes prev1 = LAG(spend, 1) and prev2 = LAG(spend, 2), each partitioned by member and ordered by month, and flags a member whose September spend is below prev1 while prev1 is below prev2. Which members does it flag, and which of them should Marketing call falling two months running?
      (a) C-0161 and C-0171 only, since LAG steps back to the previous calendar month
      (b) All four, and all four go to Marketing as falling two months running
      (c) All four; only C-0161 and C-0171 fell in two calendar months running
      (d) C-0161, C-0171 and C-0185; C-0216 has too few months for LAG(spend, 2)
    why: >-
      LAG reads the previous row in the partition, never the previous calendar month. C-0185's
      September is compared with July (1,450 below 1,900) and July with June (1,900 below 2,690), and
      C-0216's September with July and July with May (2,540 below 4,300, below 6,440), so both are
      flagged although neither ordered in August: a gap has been read as a fall. A calendar check,
      that the two rows LAG reads are August and July, keeps C-0161 and C-0171, the two genuine
      falls. C-0185 is one of the pair tied at fiftieth in Set 5. Run on PostgreSQL 16.13 on the
      week's warehouse on 30 September 2026.
    wrong:
      a: >-
        LAG knows nothing of the calendar; it returns whatever row came before in the window's order,
        which is why the two members with a missing August pass.
      b: >-
        Reads the query's output as the business answer; a member with no August order has no August
        reading, and this is the member who says he was on holiday.
      d: >-
        C-0216 has three rows (May, July, September), so LAG(spend, 2) on its September row returns
        May's 6,440. LAG returns NULL only when the partition has no row that far back, as on a
        member's first two rows, and a comparison with that NULL flags nobody.
    answer: >-
      One row per customer per month, LAG 1 and LAG 2 partitioned by customer and ordered by month, a
      check that the lagged rows really are the previous two calendar months, and a flag where each
      month is below the one before; a month with no order is no reading.
  - id: run-rate
    label: "Read the run rate"
    type: One correct option
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, FDE
    day: Wed
    key: a
    anchor: >-
      How do you present one number so it is not misread?
    exhibit:
      caption: >-
        Q2's last seven full weeks: the bars are booked revenue and the line is the plan's Rs 75.69
        lakh a week.
      mermaid: |-
        xychart-beta
          title "Weekly booked revenue against the weekly plan, Rs lakh"
          x-axis "Week starting" ["10 Aug", "17 Aug", "24 Aug", "31 Aug", "7 Sep", "14 Sep", "21 Sep"]
          y-axis "Rs lakh" 0 --> 100
          bar [37.7, 54.5, 32.2, 34.4, 65.3, 93.0, 66.8]
          line [75.7, 75.7, 75.7, 75.7, 75.7, 75.7, 75.7]
    text: |-
      Q2 closed at Rs 9,84,00,000 against a plan of Rs 9,83,99,990 for the quarter. At mid-quarter the running total had been Rs 1.58 crore ahead of plan, almost all of it from one week in July. Meera's chief of staff wants one line about the plan for Monday's front page. Which do you send?
      (a) Q2 closed on plan, but six of its last seven full weeks booked below the weekly plan
      (b) Q2 closed on plan, and its run rate is on plan, since the total matched it to the rupee
      (c) Q2 fell below plan in six of its last seven weeks, so the quarter closed below plan
      (d) Q2 beat plan by Rs 1.58 crore, the lead the running total showed at mid-quarter
    why: >-
      Both readings are true and the line needs both: the total closed on plan, Rs 10 ahead, and six
      of the seven full weeks from 10 August sit below the weekly Rs 75.69 lakh (only the week of 14
      September, Rs 93.0 lakh, cleared it). A front-page line carries its period and its comparison,
      so a director does not read one July week as the trend. The weekly figures are the week's own
      running total against plan_line, recomputed on PostgreSQL 16.13 on 30 September 2026.
    wrong:
      b: >-
        A total that lands on plan says nothing about the weekly rate; the chart shows the rate below
        plan in six weeks of seven.
      c: >-
        Reads the weekly shortfall as the quarter's result; the quarter closed Rs 10 above plan
        because of the week in July.
      d: >-
        Quotes a mid-quarter running figure as the close; the lead had shrunk to Rs 10 by the end of
        the quarter.
    answer: >-
      One number goes out with its period, its base and its comparison, here the quarter against plan
      and the weekly rate against the weekly plan, so it is read the way it was meant.
  # ---------------------------------------------------------------- Part 4, Thursday
  - id: merge-rows
    label: "Size the merge"
    type: Scenario set
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS
    day: Thu
    key: "346"
    anchor: >-
      merge against join: what is the same and what differs?
    text: |-
      SET 6. SITUATION: The customer table has 340 rows, one per customer, and its spend column adds up to the book's Rs 19,84,00,000. The monsoon sale's exposure feed, which lists the customers the sale reached, holds 136 rows for 130 customers, because six customers were sent a second time on 11 August. The analyst merges the feed onto the table with how='left' and sends the result to Excel, where a pivot sums spend.
      How many rows does the merged table hold?
    why: >-
      A left merge keeps every customer and writes one row per matching feed row: 334 customers match
      once or not at all, and the 6 sent twice match two rows each, so 334 + 12 = 346. Run on pandas
      3.0.5 on the week's files on 30 September 2026.
    answer: >-
      A merge grows the left table only when a key repeats on the right, and each repeat adds a row.
  - id: pivot-total
    label: "Judge the claim"
    type: Scenario set
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS, FDE
    day: Thu
    key: d
    anchor: >-
      A pivot's total disagrees with the warehouse; where do you look first?
    text: |-
      SET 6, continued.
      The analyst tells Marketing: "The pivot's grand total will equal the book's Rs 19,84,00,000." True or false, and why?
      (a) True, because a left merge keeps the 340 customers and adds no spend
      (b) True, because the pivot sums spend by customer_id, so each counts once
      (c) False, because the 210 customers the sale never reached drop out
      (d) False, because the six customers sent twice sit on two rows each
    why: >-
      Each of the six repeated customers sits on two rows carrying the same spend, so the pivot adds
      their spend twice: Rs 19,84,45,800, Rs 45,800 above the book. Run on pandas 3.0.5 on 30
      September 2026.
    wrong:
      a: >-
        A left merge keeps each left row once only when the right key is unique; the six repeated keys
        add six rows, each carrying spend.
      b: >-
        A pivot sums rows, and grouping by customer_id adds the repeated rows into one larger cell; it
        does not de-duplicate them.
      c: >-
        A left merge keeps the customers the sale never reached, with NaN in the feed's columns; they
        stay, with their spend.
    answer: >-
      A pivot is only as honest as the table under it: a merge that repeated rows makes a larger total
      out of rows that each look right.
  - id: stop-line
    label: "Place the guards"
    type: Scenario set
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS, FDE
    day: Thu
    key: a, e
    anchor: >-
      Which merge argument raises on duplicate keys, and which error?
    text: |-
      SET 6, continued.
      Which of these, added to Monday's refresh, would have stopped the run before the pivot was built? Mark every correct option.
      (a) validate='one_to_one' on the merge itself, so a repeated key stops it
      (b) drop_duplicates() on the merged table, before it goes to Excel
      (c) indicator=True on the merge, with the rows then counted by _merge
      (d) how='inner' in place of how='left', so only reached customers remain
      (e) an assert that the merged table has as many rows as the customer table
    why: >-
      validate='one_to_one' checks that the key is unique on both sides and raises pandas'
      MergeError ("Merge keys are not unique in right dataset; not a one-to-one merge") before a
      merged table exists; the row-count assert stops the run because 346 is not 340. Checked on
      pandas 3.0.5 on 30 September 2026.
    wrong:
      b: >-
        The six repeated rows differ in exposed_date (3 and 11 August), so no row is an exact
        duplicate and all 346 stay; this is Friday's Remove Duplicates trap in pandas.
      c: >-
        indicator labels each row both, left_only or right_only; the repeated customers are labelled
        both, twice, and nothing stops.
      d: >-
        An inner merge keeps 136 rows, still with the six customers twice, and drops the 210 the sale
