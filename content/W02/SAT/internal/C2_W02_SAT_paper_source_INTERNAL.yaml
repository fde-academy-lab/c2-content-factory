    text: |-
      The team scores a model that sorts support tickets into refund, late and other, against labels from an annotation vendor. The vendor re-sent a batch, so two tickets carry their label twice. What does the code above print, and what is the model's accuracy on the five tickets?
      (a) 5 0.6; the merge keeps one row per ticket, and 0.6 is the accuracy
      (b) 7 0.6; the re-sent labels match their tickets, so the score holds
      (c) 7 0.43; the model's two misses now count twice, against a true 0.6
      (d) 7 0.71; the re-sent rows add correct answers, against a true 0.6
    why: >-
      A merge writes one row per matching label, so T3 and T5 appear twice: 7 rows. Both are tickets
      the model got wrong, so the mean counts 3 correct rows of 7, 0.43, against 3 correct tickets of
      5, 0.6. It is the fan-out of Tuesday's payments and Thursday's exposure feed, and the checks are
      the same: rows before and after, or validate='one_to_one'. Run on pandas 3.0.5 on 30 September
      2026.
    wrong:
      a: >-
        A merge repeats a left row once per matching right row; it keeps one row per ticket only when
        the labels are unique.
      b: >-
        The repeated labels match their tickets, but the rows they repeat are misses, so the extra rows
        move the mean.
      d: >-
        A repeat inflates a score only when it repeats correct rows; here it repeats the two misses.
    answer: >-
      An evaluation metric is a mean over one row per test case, so I size the join before scoring and
      validate that the labels are unique per case.
