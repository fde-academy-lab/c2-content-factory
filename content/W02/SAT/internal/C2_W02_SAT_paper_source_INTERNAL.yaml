                                "pred": ["refund", "late", "refund", "late", "other"]})
          labels = pd.DataFrame({"ticket": ["T1", "T2", "T3", "T4", "T5", "T3", "T5"],
                                 "label": ["refund", "late", "late", "late", "refund",
                                           "late", "refund"]})
          m = preds.merge(labels, on="ticket")
          print(len(m), round((m["pred"] == m["label"]).mean(), 2))
    text: |-
      The team scores a model that sorts support tickets into refund, late and other against labels from an annotation vendor, and ships a model only if it scores 0.5 or better. The vendor re-sent a batch, so two tickets carry their label twice. What does the code above print?
      (a) 5 0.6
      (b) 7 0.6
      (c) 7 0.43
      (d) 7 0.71
    why: >-
      A merge writes one row per matching label, so T3 and T5 appear twice: 7 rows. Both are tickets
      the model got wrong, so the mean counts 3 correct rows of 7, 0.43, against 3 correct tickets of
      5, 0.6: the model fails the 0.5 bar on a score that counts its two misses twice. It is the
      fan-out of Tuesday's payments and Thursday's exposure feed, and the checks are the same: rows
      before and after, or validate='one_to_one'. Run on pandas 3.0.5 on 30 September 2026.
    wrong:
      a: >-
        A merge repeats a left row once per matching right row; it keeps one row per ticket only when
        the labels are unique.
      b: >-
        The repeated labels match their tickets, but the rows they repeat are misses, so the extra rows
        move the mean.
      d: >-
        A repeat raises a score only when it repeats correct rows; here it repeats the two misses.
    answer: >-
      An evaluation metric is a mean over one row per test case, so I size the join before scoring and
      validate that the labels are unique per case.
