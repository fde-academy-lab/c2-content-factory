    text: |-
      In 2013 Herndon, Ash and Pollin tried to reproduce an influential 2010 paper by Reinhart and Rogoff from its own spreadsheet, and found an average whose range stopped short of the data, leaving Australia, Austria, Belgium, Canada and Denmark out of one group (PERI working paper 322, 2013). The chief of staff's workbook carries the same risk: next Monday's export holds 311 customers where Friday's held 300, and the Protect tab's formulas end at row 301. Which check, run on every refresh, catches both?
      (a) Protect the sheet, so that nobody can edit or extend any formula once it is checked
      (b) Refresh every pivot and recalculate the workbook before it is shared
      (c) Recompute each average by hand on its first five rows and compare the two
      (d) Tie each total to the source's control total, and count the rows each range covers
    why: >-
      Both failures are ranges that stop before the data does, so a control total from the source,
      here the warehouse's Rs 19,84,00,000, and a count of the rows each range covers against the rows
      in the table fail the day it happens: 311 customers, 300 covered. That is the drift check in
      Friday's operating rule. The case is from Herndon, Ash and Pollin, PERI working paper 322 (April
      2013), and Retraction Watch (18 April 2013); the replicators' corrected average for the group,
      2.2 percent against the published -0.1, also corrects two other choices, so the range alone is
      not the whole gap. Checked on 30 September 2026.
    wrong:
      a: >-
        Protection stops edits, and the formula that ends at row 301 was never edited, which is the
        problem.
      b: >-
        Recalculating a formula whose range stops short recalculates the same wrong total; a refresh
        reaches pivots, and a typed range is no pivot.
      c: >-
        A second calculation on the first rows agrees with the formula wherever both cover the same
        rows; the rows left out sit at the end.
    answer: >-
