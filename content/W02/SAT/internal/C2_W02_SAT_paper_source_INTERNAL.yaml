  - id: range-check
    label: "Reproduce the average"
    type: Applied maths
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS, FDE
    day: Fri
    key: >-
      B8 returns -0.5; the six rows average 1.0; the formula understates growth by 1.5 points and
      turns growth into a fall.
    anchor: >-
      Your pivot shows a different total from the warehouse; where do you look first?
    exhibit:
      caption: >-
        An illustrative sheet with the same kind of error; column B is each country's average growth,
        in percent, in one debt group.
      table:
        head:
          - Row
          - "A: Country"
          - "B: Growth, percent"
        rows:
          - ["2", Country 1, "-1.0"]
          - ["3", Country 2, "1.0"]
          - ["4", Country 3, "-3.0"]
          - ["5", Country 4, "1.0"]
          - ["6", Country 5, "5.0"]
          - ["7", Country 6, "3.0"]
          - ["8", Average, "=AVERAGE(B2:B5)"]
    text: |-
      In 2013 Herndon, Ash and Pollin rebuilt an influential 2010 paper by Reinhart and Rogoff from the authors' own working spreadsheet. They reported that a coding error "entirely excludes five countries, Australia, Austria, Belgium, Canada, and Denmark, from the analysis", because the averages covered lines 30 to 44 of the sheet instead of lines 30 to 49 (PERI working paper 322, 2013). The sheet above makes the same kind of error. What does B8 return, what should it return, and what does the error do to the reading of growth? Show the working.
    why: >-
      B8 averages rows 2 to 5 alone: (-1.0 + 1.0 - 3.0 + 1.0) / 4 = -0.5. The six countries average
      (-1.0 + 1.0 - 3.0 + 1.0 + 5.0 + 3.0) / 6 = 1.0, so the formula understates the average by 1.5
      percentage points and reports a fall where the group grew. In the paper, the coding error,
      compounded with other errors, took 0.3 percentage points off the published average for the
      highest debt group, overstated the lowest group by 0.1 and understated the second by 0.2; the
      replicators' corrected average for the highest group, 2.2 percent against the published -0.1,
      also corrects two other choices, so the range alone is not the whole gap (PERI working paper
      322, April 2013, page 7, checked on 30 September 2026). The check that catches a range such as
      B2:B5 is a count of the rows each range covers against the rows in the table, run on every
      refresh; a Protect tab whose formulas stop at row 301 would miss every customer an export adds
      past the first 300.
    answer: >-
      Every total in a workbook ties to a control total from the source on each refresh, and every
      range is checked against the rows it should cover, because a range that stops short fails
      without a sound.
  - id: var-formula
    label: "Check the formula"
    type: One correct option
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS, FDE
    day: Fri
    key: b
    anchor: >-
      Same question, three tools: how do you choose, and defend one choice?
    exhibit:
      caption: >-
        Illustrative rates; the formula's mistake is the one JPMorgan's task force reported
        (JPMorgan Chase, 2013).
      table:
        head:
          - Row
          - Old rate, column B
          - New rate, column C
          - The sheet's change, column D
        rows:
          - ["2", "2.00", "2.60", "=(C2-B2)/(B2+C2)"]
          - ["3", "3.00", "2.40", "=(C3-B3)/(B3+C3)"]
          - ["4", "1.50", "1.80", "=(C4-B4)/(B4+C4)"]
    text: |-
      JPMorgan's task force on the 2012 losses in its Chief Investment Office reported that a value-at-risk model, an estimate of how much a trading book can lose on a bad day, ran through Excel spreadsheets filled by copying and pasting, and that one step divided a change in rates by the sum of the old and new rates where the modeller meant their average (JPMorgan Chase, 2013). Work out column D for the three rows and the change the modeller meant. What does the sheet do to the model's picture of risk?
      (a) Every change comes out twice its size, so the model braces for moves that never come
      (b) Every change comes out at half its size, so the model understates how far rates move
      (c) Only the falling rate in row 3 comes out wrong, because the formula assumes a rise
      (d) No change comes out wrong, because dividing by the sum is an accepted way to scale
    why: >-
      Column D reads 0.60 / 4.60 = 0.130, -0.60 / 5.40 = -0.111 and 0.30 / 3.30 = 0.091; divided by
      the average instead, the changes are 0.261, -0.222 and 0.182. The sum is twice the average, so
      every change, rising or falling, comes out at half its size, and a model fed half-size moves
      reports less risk than the book carries: the report describes the effect as "muting volatility
      by a factor of two". A second way to the same number, by hand on one row or in a second tool,
      catches it: Kavya's review and Thursday's three-tool check. Quoted from the Report of JPMorgan
      Chase and Co. Management Task Force Regarding 2012 CIO Losses, 16 January 2013, pages 123 and
      128, checked on 30 September 2026.
    wrong:
      a: >-
        Dividing by the sum, which is twice the average, makes each change smaller; a change twice as
        large would need a divisor of half the average.
      c: >-
        The falling rate comes out at half its size like the others, -0.111 against -0.222; the error
        does not depend on the direction of the move.
      d: >-
        Dividing by the sum departs from the relative change the modeller meant, and on these rows it
        halves every change the model reads.
    answer: >-
      A number that decides risk gets a second, independent calculation before it is trusted, because a
      formula can be wrong in every row at once.
