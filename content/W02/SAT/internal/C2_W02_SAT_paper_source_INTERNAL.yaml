      range is checked against the rows it should cover, because a range that stops short fails
      without a sound.
  - id: var-formula
    label: "Check the formula"
    type: One correct option
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS, FDE
    day: Fri
    key: a
    anchor: >-
      Same question, three tools: how do you choose, and defend one choice?
    exhibit:
      caption: >-
        Illustrative rates; the formula's mistake is the one JPMorgan's task force reported
        (JPMorgan Chase, 2013).
      table:
        head:
          - Row
          - Old rate, column B
          - New rate, column C
          - The sheet's change, column D
        rows:
          - ["2", "2.00", "2.60", "=(C2-B2)/(B2+C2)"]
    text: |-
      JPMorgan's task force on the 2012 losses in its Chief Investment Office reported that a value-at-risk model, an estimate of how much a trading book can lose on a bad day, ran through Excel spreadsheets filled by copying and pasting, and that one step divided a change in rates by the sum of the old and new rates where the modeller meant their average (JPMorgan Chase, 2013). What does the sheet return for the row above, and which check catches the error?
      (a) 0.130, half the intended 0.261; recompute one row a second way
      (b) 0.261, as intended; only the copying between the sheets needs a check
      (c) 0.130, the right relative change; the formula needs no second calculation
      (d) 0.300, the change over the old rate; a pivot of the changes would show it
    why: >-
      (2.60 - 2.00) / (2.00 + 2.60) = 0.60 / 4.60 = 0.130; divided by the average, 2.30, the change is
      0.261, so the sheet halves every change, which the report describes as "muting volatility by a
      factor of two". A second way to the same number, by hand on one row or in a second tool, catches
      it: Kavya's review and Thursday's three-tool check. Quoted from the Report of JPMorgan Chase and
      Co. Management Task Force Regarding 2012 CIO Losses, 16 January 2013, pages 123 and 128, checked
      on 30 September 2026.
    wrong:
      b: >-
        The formula divides by B2 + C2, the sum, which is twice the average; the copying is a further
        risk the report names, and a check on copying alone misses this.
      c: >-
        Dividing by the sum is not the relative change the modeller meant, and only a second
        calculation shows the gap.
      d: >-
        Divides by the old rate, a third convention; and a pivot of the sheet's outputs repeats the
        formula's error in every row.
    answer: >-
      A number that decides risk gets a second, independent calculation before it is trusted, because a
      formula can be wrong in every row at once.
