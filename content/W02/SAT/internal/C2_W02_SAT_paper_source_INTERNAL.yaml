# Week 2 Saturday: the week's source file, laid on the tracker's bank by
# scripts/build_saturday_paper.py. Block style throughout, so a comma never splits a reason.
#
# The bank sets the topics and this file sets the bar (the requester's plan of 30 September 2026,
# raised twice the same day after two blind sittings). Three bank items print: two answered from a
# word bank and one with a reworded stem and options. Fifty-five fold into deeper items that test
# their concepts, each with its reason under `folded`. Thirty new items carry the rest. Every Kalpa
# number was computed on the week's warehouse and files, and every public-case fact was checked
# against its source on 30 September 2026; the provenance record lists both, and
# internal/C2_W02_SAT_key_proofs_INTERNAL.py asserts every key.

# The Word paper's first page: "What this paper is for", and the Company row of its Rules table.
purpose: >-
  This week you computed Anand's Monday numbers in the warehouse, set booked revenue against the
  cash actually collected, drew up Marketing's protect list, built the customer table in pandas and
  carried it to the leadership deck in Excel. This paper finds which of those decisions you can make
  cold, with no notes and no assistant, on the week's own tables, on public cases from well-known
  organisations and on the tables an AI team keeps. The room's scores by part, set beside the
  ratings you give in step one, tell Monday's session where to start.
company: >-
  Parts 1 to 4 and the workbook in Part 5 are set inside Kalpa Retail, the fictional company of
  Weeks 1 and 2: Anand Iyer is its finance controller, Kavya Nair its senior analyst and Meera
  Raghavan its CEO, and the head of Retail-Plus, the data platform lead and Meera's chief of staff
  are named by role. Six items draw on public cases at Facebook, Public Health England, genomics
  journals, an economics paper, JPMorgan and Uber, each with its source beside it. Part 6 imagines
  the AI team of a food-delivery company, and its tables and numbers are illustrative. Every number
  an item needs is on the page.

# Shared lettered lists, printed once above the first item that answers from them.
banks:
  mon-words:
    style: words
    options:
      - sort
      - CTE
      - view
      - guarantee
      - subquery
  fri-fix:
    style: match
    instruction: >-
      Each numbered row is a job the chief of staff's workbook must do. Write the letter of the
      technique that does it. Each letter is used once at most, and two are not used.
    options:
      - SUBTOTAL with function number 109
      - VLOOKUP with its fourth argument left out
      - a labelled input cell feeding a scenario line
      - XLOOKUP with its if_not_found argument set
      - Remove Duplicates across every column
      - a first-row flag per order, then SUMIFS

# The printed order. Bank items by number, the additions by id.
parts:
  - title: Anand's Monday numbers
    shows: how you work with the numbers Anand's Monday sheet reports
    intro: >-
      Anand Iyer, Kalpa Retail's finance controller, keeps the books every revenue figure has to match.
      Every Monday he wants revenue, orders and customers for each segment, the groups Kalpa sells to
      (Business, Retail-Core, Retail-Plus, which is the paid-membership tier, and Student), and for
      each channel (app, web and store). His words: "Compute them from the warehouse itself. No
      notebooks, no exports, nothing a person can mistype." The warehouse is the company's central
      Postgres database, and his analyst audits every query line by line. It stores Kalpa's first
      quarter, April to June, as quarter 'Q1' and its second, July to September, as 'Q2'.
    items: ["new:int-div", 2, 3, "new:avg-spend", "new:tool-choice", "new:facebook"]
  - title: Booked against collected
    shows: how you set the cash collected against the revenue booked
    intro: >-
      Booked revenue is the value of the orders customers placed; collected revenue is the cash that
      actually arrived for them. Anand asks: "Show me, order by order, what we actually collected
      against what we booked from July to September. If there is a gap, I want to know which orders
      and which channel." A reconciliation is the written account of every rupee between the two
      figures.
    items: ["new:join-counts", "new:report-steps", "new:where-on-payments", "new:reporting-day", "new:phe-checks"]
  - title: The protect list and the plan line
    shows: how you build Marketing's protect list and read the quarter against its plan
    intro: >-
      Retail-Plus is Kalpa's paid-membership tier, and Marketing will offer a retention benefit to the
      members it most wants to keep: "Give us the top fifty customers in each segment by revenue for
      July to September, and flag anyone whose monthly spend has fallen for two months running." That
      list is the protect list. Meera also wants to see the quarter's revenue build up week by week
      against the plan line, the revenue the growth plan expects by the end of each week.
    items: ["new:rows-shipped", 27, "new:share-window", "new:lag-gap", "new:run-rate"]
  - title: One row per customer
    shows: how you build Marketing's customer table in pandas
    intro: >-
      Marketing chooses who gets which offer from one table with one row per customer: recency (days
      since the last order), frequency (orders placed) and monetary value (rupees spent), with the
      customer's segment and whether the monsoon sale reached them. The data platform lead: "The
      warehouse queries are fine for Finance, but Marketing's analysts live in Python. Build them the
      table in pandas, from the warehouse, and make it refreshable in one run." It is rebuilt every
      Monday, and Kavya Nair, the senior analyst, reviews it before it leaves the team.
    items: ["new:merge-guard", "new:first-touch", "new:months-view", "new:genes"]
  - title: The last mile, and spreadsheets in public
    shows: how you build the workbook for Monday's review, and read spreadsheets from public cases
    intro: >-
      Meera's chief of staff builds the deck for Monday's growth review and works only in Excel: "The
      revenue tree by segment for both quarters, the top-fifty protect list with a lookup so I can
      find any member by member code, and one number on the front page with its trend. If a director
      changes an assumption in the room, the sheet must recalculate in front of them." Excel is where
      the week's analysis meets its audience.
    exhibits:
      - mermaid: |-
          flowchart LR
            E["Friday's export:<br/>one row per payment"] --> T["Tree tab:<br/>revenue by segment"]
            C["Customer table:<br/>one row per customer"] --> P["Protect tab:<br/>top fifty, a lookup"]
            T --> F["Front page:<br/>one number, its trend"]
            D["A director's<br/>what-if"] --> F
        table:
          head:
            - order_id
            - segment
            - order_amount
            - paid_amount
          rows:
            - [KR-00028, Business, "6,35,000", "3,81,000"]
            - [KR-00028, Business, "6,35,000", "2,54,000"]
        caption: >-
          The chief of staff's workbook for Monday's review, and two rows of Friday's export: one row
          per payment, with the order's booked amount, order_amount, repeated on each.
    items: ["new:fix-lookup", "new:fix-foot", "new:fix-tree", "new:fix-whatif", "new:range-check", "new:var-formula", "new:gross-fare"]
  - title: "Read the code, read the data: an AI team's tables"
    shows: how you read the tables an AI team keeps, and the numbers it acts on
    intro: >-
      Suppose a food-delivery company runs a support assistant, a chatbot that answers customers and
      hands hard cases to a person. Its AI team scores each model version on a fixed set of test
      tickets, which is an evaluation run; it collects customers' ratings of the replies; and it logs
      every conversation, every handoff to a person, every call to the model and every visit. The
      tables and every number below are illustrative.
    exhibits:
      - table:
          head:
            - Table
            - One row per
            - Columns
          rows:
            - [predictions, test ticket, "ticket, pred"]
            - [labels, label from the annotation vendor, "ticket, label"]
            - [eval_runs, evaluation run, "model, run_id, finished_on, accuracy"]
            - [replies, reply to a customer, "reply_id, model, rating"]
            - [conversations, conversation, conversation_id]
            - [handoffs, handoff to a person, conversation_id]
            - [calls, call to the model, "call_id, day, tokens"]
            - [visits, a user's use of the assistant on a day, "day, user_id"]
        caption: >-
          The assistant team's tables, as this part imagines them.
    items: ["new:eval-fanout", "new:latest-run", "new:low-ratings", "new:not-in", "new:token-peers", "new:weekly-users"]

