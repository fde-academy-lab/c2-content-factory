# Untimed and unmarked, for anyone who finishes early; each is the kind of follow-up an interviewer
# asks after a first answer, and the mock-interview round draws on them.
stretch:
  - text: |-
      Anand now wants collected revenue week by week instead of for the whole quarter. Which date decides the week a rupee is collected in, and what happens to an order paid in two instalments?
    answer: >-
      The payment's date decides collected's week, where the order's date decides booked's, so an
      order paid in two instalments adds to collected in two different weeks. A weekly gap between
      booked and collected is then timing as well as unpaid orders, and the report says so beside the
      weekly figures.
  - text: |-
      The head of Retail-Plus asks whether members who ordered in both quarters spent more in the second. How would you build that comparison, and what would you say about members who ordered in only one quarter?
    answer: >-
      One row per member with each quarter's spend, kept only where both quarters have an order, then
      the change member by member and in total, with the count of such members beside it. Members who
      ordered in one quarter only answer a different question, about who lapsed and who arrived, so
      they go in their own line and never into the average change.
  - text: |-
      In 2020 the body that names human genes renamed every gene whose symbol Excel turned into a date. Explain to a product manager in two sentences why the fix went into the gene names, and what you would still check in every file you receive.
    answer: >-
      Excel changed gene symbols in about a fifth of papers with Excel gene lists, and no reader could
      protect every copy, so the naming body renamed the genes and fixed the error at the source every
      reader shares. I would still count, after every merge, the rows against the left table and the
      keys that found a match, because a key changed on its way in never raises an error.
  - text: |-
      A director says the front page should read Rs 19.84 crore because "that is the real number". Answer in two sentences.
    answer: >-
      Rs 19.84 crore is real and covers two quarters, so a director reads it as a quarter that
      doubled. The page reads: July to September, Rs 9.84 crore, down 1.6 percent on April to June's
      Rs 10.00 crore.
