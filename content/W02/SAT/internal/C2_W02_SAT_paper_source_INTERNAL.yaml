# Week 2 Saturday: the week's source file, laid on the tracker's bank by
# scripts/build_saturday_paper.py. Block style throughout, so a comma never splits a reason.
# With six recall items moved to the stretch page, the bank's timed items fill 113.5 of the
# paper's 120 minutes, so this file adds three timed items to Part 6, 6.5 minutes at the
# blueprint's pace: two of one correct option at 2 minutes and one scenario item at 2.5.

# The Word paper's first page: "What this paper is for", and the Company row of its Rules table.
purpose: >-
  This week you computed Anand's Monday numbers in the warehouse, set booked revenue against what was
  actually collected, drew up Marketing's protect list of its best members, and built the customer
  table in pandas and carried it to the leadership deck. This paper finds which of those decisions you can
  make cold, with no notes and no assistant, and whether you can read a query, a join, a window or a
  merge and say what it returns before anyone acts on the number. The room's scores by part, set
  beside the ratings you give in step one, tell Monday's session where to start.
company: >-
  The items are set inside Kalpa Retail, the fictional company of Weeks 1 and 2. Anand Iyer answers
  for Finance's books, Kavya Nair is its senior analyst, Meera Raghavan's office reads the growth
  review deck, and the head of Retail-Plus, the marketing lead and the data platform lead are named
  by role alone. Nothing about the company needs to be known in advance.

# The printed order. Bank items by number, the additions by id; every bank item is printed in a
# part or moved to the stretch page, and a scenario set stays whole.
parts:
  - title: The week's rules, cold
    shows: whether the week's definitions and rules are there without a notebook open
    intro: >-
      Anand ends the week asking what he always asks: "Do your numbers match my books, and can my
      analyst audit how you got them?" Each item below is one of the rules your answer rests on.
    items: [5, 6, 8, 10, 11, 12, 13, 14, 15, 16, 17]
  - title: Asking the warehouse
    shows: whether you can write a grouped query in the order the database runs it
    intro: >-
      The data platform lead grants read access to the warehouse with one warning: "Query it; do not
      export it." These items ask how a query filters, groups and orders what it reads.
    items: [18, 20, 33, 52, 57]
  - title: Joins that keep their rows
    shows: whether you read the row count before and after a join and catch a join that inflates a sum
    intro: >-
      Anand asks: "Show me, order by order, what we actually collected against what we booked in
      Q2. If there is a gap, I want to know which orders and which channel."
    items: [21, 22, 23, 24, 34, 35, 40, 41, 42, 43, 53]
  - title: "Windows: rank, lag and running totals"
    shows: whether you can rank within a segment, compare a month with the one before it and keep a running total
    intro: >-
      Marketing wants to protect the best members before they drift: "Give us the top fifty
      customers by Q2 revenue in each segment, and flag anyone whose monthly spend has fallen for
      two months running." Meera wants to see revenue accumulate week by week against the plan line.
    items: [25, 26, 27, 28, 36, 37, 44, 45, 46, 47, 54, 55]
  - title: pandas and the last mile to Excel
    shows: whether you can merge, group and reshape without losing or doubling rows, and choose the tool for each job
    intro: >-
      Marketing's analysts live in Python and Meera's office runs on Excel. Kavya Nair puts it to
      the team: "Tell me honestly which tool you would pick for which job."
    items: [29, 30, 31, 32, 38, 39, 48, 49, 50, 51, 56, 58]
  - title: Read the code, read the data
    shows: whether you catch a wrong number in a query or a few lines of pandas before it reaches a decision
    intro: >-
      Kavya Nair reads the code behind a number before it leaves the team: "Show me the evidence."
      Read each item the way the database or pandas would before you answer.
    items: ["new:avg-per-member", "new:where-on-payments", "new:reach-by-segment", 19]

