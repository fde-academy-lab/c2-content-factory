  - id: rows-shipped
    label: "Apply the head's rule"
    type: One correct option
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS
    day: Wed
    key: d
    anchor: >-
      The business says 'ties rank the same'; which function, and how many rows might the top-N report
      ship?
    exhibit:
      caption: >-
        Retail-Plus members at places 46 to 53 when sorted by revenue for July to September, highest
        first, with tied members in order of their ids.
      table:
        head:
          - Place, highest revenue first
          - Member
          - Revenue, July to September, Rs
        rows:
          - ["46", C-0162, "3,600"]
          - ["47", C-0264, "3,540"]
          - ["48", C-0189, "3,480"]
          - ["49", C-0206, "3,480"]
          - ["50", C-0185, "3,350"]
          - ["51", C-0242, "3,350"]
          - ["52", C-0259, "3,200"]
          - ["53", C-0252, "3,150"]
    text: |-
      Retail-Plus had 76 members who ordered from July to September. Sorted by their revenue for the quarter, highest first, the top 45 each spent a different amount, all above Rs 3,600, and places 46 to 53 are in the table. The head of Retail-Plus set the rule for the protect list: "Ties matter. If two members spent the same, I want them ranked the same, and I want to know how many made the top fifty, not forty-nine because of a tie." The list keeps every member who spent at least as much as the fiftieth member in the table's order, and nobody who spent less. Which ranking gives that list, and how many members does it keep?
      (a) DENSE_RANK, keeping every member ranked 50 or better: 52 members
      (b) ROW_NUMBER with member id as tiebreaker, keeping places 1 to 50: 50 members
      (c) Whole ties only, cutting before any tie that crosses the fiftieth place: 49 members
      (d) RANK, keeping every member ranked 50 or better: 51 members
    why: >-
      RANK gives C-0185 and C-0242 the shared rank 50 and C-0259 rank 52, so 51 members hold a rank
      of 50 or better, and they are exactly the members who spent at least Rs 3,350, the fiftieth
      member's spend. DENSE_RANK leaves no gaps, so the tie at 48 (C-0189 and C-0206) lifts C-0185
      and C-0242 to dense rank 49 and C-0259, on Rs 3,200, to 50: 52 members, one of whom spent less
      than the fiftieth. ROW_NUMBER numbers every row once and drops C-0242, who spent as much as
      the fiftieth. RANK's 51 is the count each learner ran for the head's list in Wednesday's
      chapter 3, and the note to Marketing gives the rule, the count and the members at the line,
      the last place the list keeps, in one sentence. Run on PostgreSQL 16.14 on the week's
      warehouse on 1 October 2026.
    wrong:
      a: >-
        DENSE_RANK shares ranks and then keeps C-0259, who spent Rs 3,200, less than both members at
        the fiftieth place. It is the trap of Wednesday's chapter 3, where DENSE_RANK sent 52
        Retail-Core members as the top fifty, two of whom tied with nobody.
      b: >-
        ROW_NUMBER keeps exactly fifty by dropping C-0242, who spent what the fiftieth did, on an id
        nobody chose on purpose; if the budget demands fifty, the tiebreaker is a decision the head
        of Retail-Plus owns and states in advance.
      c: >-
        Whole ties only leaves out C-0185 and C-0242, who both spent as much as the fiftieth, and
        ships the forty-nine the head refused.
    answer: >-
      When the business says ties rank the same, I use RANK and state the list's length and its
      reason in the same sentence, because the list can ship more than N; if the budget demands
      exactly N, the tiebreaker becomes a decision someone owns.
  - id: share-window
    label: "Choose the share query"
    type: One correct option
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: BA, DS
    day: Wed
    key: a
    anchor: >-
      Top-3 per group: GROUP BY or a window, and why?
    text: |-
      Marketing wants each Retail-Plus member's spend beside the member's share of the tier's spend for July to September. The table member_step holds one row per member who ordered, with the columns customer_id and spend. Which query gives each member's share?
      (a) SELECT customer_id, spend, spend / sum(spend) OVER () FROM member_step
      (b) SELECT customer_id, spend, spend / sum(spend) FROM member_step GROUP BY customer_id, spend
      (c) SELECT customer_id, spend, spend / sum(spend) OVER (ORDER BY spend DESC) FROM member_step
      (d) SELECT customer_id, spend, spend / sum(spend) OVER (PARTITION BY customer_id) FROM member_step
    why: >-
      OVER () puts the tier's total on every row without collapsing the rows, so each member's spend
      divides by Rs 4,13,380 and the shares add to 1. Grouping by member makes each sum the member's
      own spend, and so does a partition by member, so both return a share of 1 for everyone. An
      ORDER BY inside the window turns the sum into a running total, the shape Wednesday's chapter 5
      used against the plan line, so the top spender's share reads 1 and each later share divides by
      a larger part of the total. Run on PostgreSQL 16.14 on the week's warehouse on 1 October 2026.
    wrong:
      b: >-
        GROUP BY customer_id makes sum(spend) each member's own spend, so every share reads 1.
      c: >-
        An ORDER BY inside the window makes the sum a running total, so the top spender divides by
        their own spend and every share after it by a different part of the total.
      d: >-
        A partition by member sums each member's own row, so every share reads 1.
    answer: >-
      A share of the total is the row's value over sum() OVER (), a window with no partition and no
      order, which keeps every row and puts the total beside it.
  - id: lag-gap
    label: "Run the falling flag"
    type: One correct option
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Wed
    key: b
    anchor: >-
      How would you find customers whose spend fell two months in a row?
    exhibit:
      caption: >-
        Four Retail-Plus members' monthly spend in rupees, from the warehouse's orders.
      table:
        head:
          - Member
          - Apr
          - May
          - Jun
          - Jul
          - Aug
          - Sep
        rows:
          - [C-0161, "3,520", "", "", "4,200", "3,100", "1,900"]
          - [C-0171, "", "2,210", "4,130", "3,800", "2,600", "1,400"]
          - [C-0185, "3,880", "6,990", "2,690", "1,900", "", "1,450"]
          - [C-0216, "", "6,440", "", "4,300", "", "2,540"]
    text: |-
      The falling flag reads member_month, which sums each member's orders by calendar month. It takes prev1 = LAG(spend, 1) and prev2 = LAG(spend, 2), each partitioned by member and ordered by month, and flags a member whose September spend is below prev1 while prev1 is below prev2. Marketing will call every member the flag names and say that their spend fell in both August and September. How many calls does Marketing make, and how many of them say something untrue?
      (a) 2 calls, none of them untrue
      (b) 4 calls, two of them untrue
      (c) 3 calls, one of them untrue
      (d) 1 call, and it is true
    why: >-
      member_month has a row only for a month with an order, and LAG reads the previous row in the
      partition, never the previous calendar month. C-0161 and C-0171 fell from July to August and
      again from August to September, so both are flagged, and rightly. C-0185's September is
      compared with July (1,450 below 1,900) and July with June (1,900 below 2,690), and C-0216's
      September with July and July with May (2,540 below 4,300, below 6,440), so both are flagged
      too, although neither ordered in August: two of the four calls tell a member their spend fell
      in August and September when there was no August reading at all. A calendar check, that the
      two rows LAG reads are August and July, keeps the two genuine falls; it is Wednesday's chapter
      6 fix, which cut sixteen calls to nine after C-0216 rang to say they had been travelling in
      August. Run on PostgreSQL 16.14 on the week's warehouse on 1 October 2026.
    wrong:
      a: >-
        Reading LAG as a step back of one calendar month gives 2 calls, since C-0185 and C-0216
        would meet an empty August and drop out; LAG returns whatever row came before in the
        window's order, and both are flagged.
      c: >-
        3 calls assume LAG(spend, 2) returns NULL for C-0216, but its rows are May, July and
        September, so on its September row LAG(spend, 2) returns May's 6,440. LAG returns NULL only
        on a member's first rows, and a comparison with that NULL flags nobody.
      d: >-
        A member with a month missing before September stays in the flag, which the answer of 1 call
        forgets: LAG reads rows, so C-0161's empty May and June do not matter, and nor do the
        others' gaps.
    answer: >-
      One row per customer per month, LAG 1 and LAG 2 partitioned by customer and ordered by month, a
      check that the lagged rows really are the previous two calendar months, and a flag where each
      month is below the one before; a month with no order is no reading.
