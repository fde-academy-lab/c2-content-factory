  - id: eval-fanout
    label: "Predict the accuracy"
    type: One correct option
    level: Hard
    min: 4
    tag: "[F]"
    roles: DS
    day: Thu
    key: c
    anchor: >-
      Your LEFT join grew the row count and revenue doubled; name the cause and the check.
    exhibit:
      caption: >-
        The team's scoring code, on five illustrative test tickets.
      code:
        lang: python
        text: |-
          import pandas as pd
          preds = pd.DataFrame({"ticket": ["T1", "T2", "T3", "T4", "T5"],
                                "pred": ["refund", "late", "refund", "late", "other"]})
          labels = pd.DataFrame({"ticket": ["T1", "T2", "T3", "T4", "T5", "T3", "T5"],
                                 "label": ["refund", "late", "late", "late", "refund",
                                           "late", "refund"]})
          m = preds.merge(labels, on="ticket")
          print(round((m["pred"] == m["label"]).mean(), 2))
    text: |-
      The team scores a model that sorts support tickets into refund, late and other against labels from an annotation vendor, and ships a model only if it scores 0.5 or better. What does the code above print, and what happens to the model?
      (a) 0.6, so the model clears the 0.5 bar and ships this week
      (b) 0.71, so the model clears the bar with room to spare and ships
      (c) 0.43, so the model falls short of the bar and is held back
      (d) A MergeError, since two tickets repeat in the labels, so the model waits
    why: >-
      The labels hold T3 and T5 twice, so the merge writes one row per matching label and returns 7
      rows. T3 and T5 are both tickets the model got wrong, so the mean counts 3 correct rows of 7,
      0.43, against 3 correct tickets of 5, 0.6: the model fails the 0.5 bar on a score that counts
      its two misses twice. It is the fan-out of Tuesday's payments and Thursday's exposure feed,
      and the checks are the same: rows before and after, or validate='one_to_one'. Run on pandas
      3.0.6 on 1 October 2026.
    wrong:
      a: >-
        0.6 is the accuracy on the five tickets, which the code prints only if the labels hold one
        row per ticket; a merge repeats a left row once for each matching right row.
      b: >-
        0.71 counts the repeated rows as correct, but they repeat T3 and T5, which the model got
        wrong, so they pull the mean down.
      d: >-
        A MergeError would need a merge that refuses repeated keys; pandas raises it only when
        validate is set, and without it writes one row per matching label and prints a number.
    answer: >-
      An evaluation metric is a mean over one row per test case, so I size the join before scoring and
      validate that the labels are unique per case.
  - id: latest-run
    label: "Choose the query"
    type: One correct option
    level: Hard
    min: 4
    tag: "[S]"
    roles: DS
    day: Wed
    key: a
    anchor: >-
      RANK, DENSE_RANK and ROW_NUMBER on a tie.
    exhibit:
      caption: >-
        The table eval_runs: the team's evaluation runs, illustrative.
      table:
        head:
          - model
          - run_id
          - finished_on
          - accuracy
        rows:
          - [bot-a, "7", 1 September, "0.81"]
          - [bot-b, "8", 2 September, "0.84"]
          - [bot-a, "9", 8 September, "0.78"]
          - [bot-b, "10", 9 September, "0.86"]
          - [bot-b, "11", 9 September, "0.74"]
    text: |-
      The team promotes bot-b over bot-a if bot-b's latest run scores higher than bot-a's latest. Runs are numbered in the order they start, and of two runs that finish on the same day, the one that started later counts as the latest. Which query gives the team the right call, and what is the call?
      (a) ROW_NUMBER partitioned by model, by finished_on descending, then run_id descending, keeping row 1: bot-b's latest scores 0.74, so bot-a stays
      (b) ROW_NUMBER partitioned by model, by finished_on descending, then run_id ascending, keeping row 1: bot-b's latest scores 0.86, so bot-b is promoted
      (c) GROUP BY model with max(finished_on) and max(accuracy): bot-b's latest reads 0.86, so bot-b is promoted
      (d) RANK partitioned by model, by finished_on descending, keeping rank 1: bot-b's latest scores 0.86, so bot-b is promoted
    why: >-
      Partitioned by model and ordered by finished_on descending, then run_id descending, ROW_NUMBER
      puts run 11 first for bot-b, the later of its two runs of 9 September, at 0.74, and run 9
      first for bot-a, at 0.78, so bot-a stays, every time the query runs. ROW_NUMBER breaks a tie
      by whatever else its ORDER BY names, as Wednesday's chapter 3 put it, so the tiebreaker has to
      follow the business's own definition of latest. run_id is a number, so 11 sorts above 10;
      stored as text, '11' would sort below '9'. Run on PostgreSQL 16.14 on 1 October 2026.
    wrong:
      b: >-
        Ascending run_id picks run 10, the earlier of the two runs of 9 September, and promotes bot-b on
        a run the rule says is not its latest.
      c: >-
        Each max() is taken on its own, so bot-b shows its best score beside its latest date, a pairing
        no single run produced.
      d: >-
        RANK gives runs 10 and 11 the same rank 1, so bot-b comes back as two rows and the query names
        no latest run; reading 0.86 off the first of them promotes bot-b on a run the rule says is not
        its latest.
    answer: >-
      The latest row per key is ROW_NUMBER partitioned by the key, ordered newest first with a
      tiebreaker that makes the order unique and follows the business's own definition of latest, kept
      at 1 in an outer query.
  - id: low-ratings
    label: "Predict the rows"
    type: One correct option
    level: Hard
    min: 4
    tag: "[S]"
    roles: DS
    day: Mon
    key: d
    anchor: >-
      WHERE against HAVING, one sentence each.
    exhibit:
      caption: >-
        Nine replies, the ratings customers gave them and the analyst's query, illustrative.
      code:
        lang: sql
        text: |-
          WITH replies (reply_id, model, rating) AS (VALUES
              (1, 'bot-a', 1), (2, 'bot-a', 4), (3, 'bot-a', 2), (4, 'bot-a', 2),
              (5, 'bot-b', 2), (6, 'bot-b', 5), (7, 'bot-b', 4),
              (8, 'bot-c', 5), (9, 'bot-c', 1))
          SELECT model, count(*) AS low_rated
          FROM replies
          WHERE rating <= 2
          GROUP BY model
          HAVING count(*) >= 3;
    text: |-
      Customers rate each reply from 1 to 5. The team lead asks for every model with at least three replies this week, beside how many of its replies were rated 2 or below, and will retrain every model on the list. What does the query above return, and which models are retrained?
      (a) bot-a and bot-b, each beside its count of low ratings, so the lead retrains both
      (b) bot-a and bot-b, each beside its count of all its replies, so the lead retrains both
      (c) bot-a, bot-b and bot-c, each beside its low ratings, so the lead retrains all three
      (d) bot-a alone, beside its count of 3 low ratings, so the lead retrains bot-a
    why: >-
      Monday's run order is FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, then LIMIT, and because
      SELECT runs after GROUP BY it can name only the grouping column and aggregates, here model and
      count(*). WHERE runs first and keeps the five low ratings: three for bot-a, one for bot-b and
      one for bot-c. GROUP BY forms its groups from those rows alone, so count(*) counts low
      ratings, and HAVING count(*) >= 3 keeps bot-a with 3. The lead asked for the models with at
      least three replies in all, bot-a with 4 and bot-b with 3, so bot-b goes unretrained because
      the HAVING tests the wrong count. With no WHERE, counting every reply in HAVING and the low
      ones with count(*) FILTER (WHERE rating <= 2) returns bot-a 3 and bot-b 1. Run on PostgreSQL
      16.14 on 1 October 2026.
    wrong:
      a: >-
        bot-a and bot-b would need HAVING to judge all of each model's replies, but HAVING runs
        after WHERE, so it sees only the low ratings, and bot-b's one fails the test.
      b: >-
        Counting all of each model's replies treats WHERE as if it had never run; count(*) counts
        the rows that survive WHERE.
      c: >-
        Listing all three models ignores HAVING: bot-b and bot-c each have one low rating, and
        HAVING keeps only groups of three or more.
    answer: >-
      WHERE keeps or drops single rows before any group exists; HAVING keeps or drops whole groups
      after the aggregate is computed, so a HAVING that follows a WHERE counts only the rows WHERE
      kept.
  - id: not-in
    label: "Predict the count"
    type: One correct option
    level: Hard
    min: 4
    tag: "[F]"
    roles: DS, FDE
    day: Tue
    key: b
    anchor: >-
      How do you find orders with no payment?
    exhibit:
      caption: >-
        Four conversations and the handoff log, illustrative.
      code:
        lang: sql
        text: |-
          WITH conversations (conversation_id) AS (VALUES ('c1'), ('c2'), ('c3'), ('c4')),
          handoffs (conversation_id) AS (VALUES ('c2'), ('c4'), (NULL))
          SELECT count(*) AS resolved_by_bot
          FROM conversations
          WHERE conversation_id NOT IN (SELECT conversation_id FROM handoffs);
    text: |-
      The weekly review reads how many of the four conversations the assistant resolved without a person, and the product lead cuts the assistant's budget if that is under 40 percent. What does the query above return, and what happens to the budget?
      (a) 2, half the conversations, so the budget stays
      (b) 0, none of the conversations, so the budget is cut
      (c) 3, three of the four, so the budget stays
      (d) An error, so no figure reaches the review and the budget waits
    why: >-
      The handoff log holds a row whose conversation_id is NULL. For c1, NOT IN asks c1 <> 'c2' AND
      c1 <> 'c4' AND c1 <> NULL; the last comparison is unknown, so the whole condition is unknown
      and WHERE drops the row. Every conversation fails the same way, so the count is 0, and the
      lead cuts the budget of an assistant that resolved two of four, half. NOT EXISTS, or a LEFT
      JOIN kept where the handoff key IS NULL, returns 2; Tuesday's chapter 4 named NOT IN as the
      anti-join to avoid for this reason. Run on PostgreSQL 16.14 on 1 October 2026.
    wrong:
      a: >-
        2 is the count NOT EXISTS returns; NOT IN against a list that holds a NULL can never be
        true, so it returns none.
      c: >-
        The NULL sits in the subquery's list, never in the outer table, so it cannot add a
        conversation.
      d: >-
        Postgres raises nothing: the comparison with NULL is unknown and the rows drop without a
        warning, so the review gets a wrong figure.
    answer: >-
      Rows with no match are an anti-join, which I write as NOT EXISTS or as a LEFT JOIN kept where
      the right key IS NULL, never as NOT IN against a column that can hold a NULL.
  - id: token-peers
    label: "Find the first routed call"
    type: One correct option
    level: Hard
    min: 4
    tag: "[F]"
    roles: DS
    day: Wed
    key: a
    anchor: >-
      RANK, DENSE_RANK and ROW_NUMBER on a tie.
    exhibit:
      caption: >-
        Four model calls and the tokens each used, illustrative.
      code:
        lang: sql
        text: |-
          WITH calls (call_id, day, tokens) AS (VALUES
              (1, DATE '2026-09-21', 400), (2, DATE '2026-09-22', 300),
              (3, DATE '2026-09-22', 500), (4, DATE '2026-09-23', 200))
          SELECT call_id, sum(tokens) OVER (ORDER BY day) AS tokens_so_far
          FROM calls
          ORDER BY call_id;
    text: |-
      The model's bill is charged per token, so the finance partner routes every call to a cheaper model once tokens_so_far, read from the query above, passes 1,000. Which call is the first one routed to the cheaper model?
      (a) Call 2
      (b) Call 3
      (c) Call 4
      (d) None of them
    why: >-
      With an ORDER BY and no frame, the window runs from the first row to the current row and its
      peers, the rows that tie on the ORDER BY. Calls 2 and 3 share 22 September, so both read the
      day's closing figure, 1200, and call 2 is routed although the total stood at 700 after it, as
      the twelve orders of 22 July all read the day's close in Wednesday's chapter 5. Adding call_id
      to the window's ORDER BY gives each call its own step and routes call 3. Run on PostgreSQL
      16.14 on 1 October 2026.
    wrong:
      b: >-
        Call 3 is the one-step-per-row reading, 400, 700, 1,200, which needs a unique ORDER BY such
        as day then call_id; with the date alone calls 2 and 3 are peers and share one figure.
      c: >-
        Adding up only the days before each row's own gives 0, 400, 400, 1,200 and routes call 4;
        the default frame includes the current row and its peers, and a frame that stopped earlier
        would be written out.
      d: >-
        No call would be routed only if the window were partitioned by day; with ORDER BY day and no
        PARTITION BY, the total runs across the days and reaches 1,200 on 22 September.
    answer: >-
      A running total is deterministic only when its ORDER BY is unique; rows that tie are peers and
      share one cumulative figure, so I add a tiebreaker such as the id before anyone acts on it.
  - id: weekly-users
    label: "Count the week's users"
    type: One correct option
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS
