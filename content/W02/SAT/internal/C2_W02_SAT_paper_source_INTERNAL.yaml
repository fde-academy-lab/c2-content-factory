      The leaderboard must show one row per model, its latest run and that run's accuracy, and must show the same row every morning. Two of bot-b's runs finished on 9 September. Which query does that?
      (a) GROUP BY model, keeping max(finished_on) beside max(accuracy), each taken over all of that model's runs
      (b) ROW_NUMBER partitioned by model and ordered by finished_on descending, keeping row 1 for each model
      (c) RANK partitioned by model and ordered by finished_on descending, keeping every row that ranks 1 for its model
      (d) ROW_NUMBER partitioned by model, ordered by finished_on descending, then run_id descending, keeping row 1
    why: >-
      ROW_NUMBER partitioned by model and ordered by finished_on descending, then run_id descending,
      filtered to row 1 outside the window, returns bot-a's r2 (0.78) and bot-b's r5 (0.79) every time,
      and r5 is the later run because run ids follow the order runs start. With the date alone, bot-b's
      two runs of 9 September tie and the database picks one, so the leaderboard can show 0.86 one
      morning and 0.79 the next. Run on PostgreSQL 16.13 on 30 September 2026.
    wrong:
      a: >-
        Each max() is taken on its own, so bot-a shows 8 September beside 0.81, a pairing no run
        produced: its latest date with its best score.
      b: >-
        The right shape, but the tie on 9 September leaves the pick to the database; Wednesday's lesson
        on ties in a window's order.
      c: >-
        RANK gives r4 and r5 the same rank 1, so bot-b shows two rows, the same two every morning, where
        the leaderboard wants one.
    answer: >-
      The latest row per key is ROW_NUMBER partitioned by the key, ordered newest first with a
      tiebreaker that makes the order unique, kept at 1 in an outer query.
  - id: low-ratings
    label: "Predict the rows"
    type: One correct option
    level: Hard
    min: 4
    tag: "[S]"
    roles: DS
    day: Mon
    key: a
    anchor: >-
      WHERE against HAVING, one sentence each.
    exhibit:
      caption: >-
        Nine replies, the ratings customers gave them and the analyst's query, illustrative.
      code:
        lang: sql
        text: |-
          WITH replies (reply_id, model, rating) AS (VALUES
              (1, 'bot-a', 1), (2, 'bot-a', 4), (3, 'bot-a', 2), (4, 'bot-a', 2),
              (5, 'bot-b', 2), (6, 'bot-b', 5), (7, 'bot-b', 4),
              (8, 'bot-c', 5), (9, 'bot-c', 1))
          SELECT model, count(*) AS low_rated
          FROM replies
          WHERE rating <= 2
          GROUP BY model
          HAVING count(*) >= 3;
    text: |-
      Customers rate each reply from 1 to 5. The team lead asks for every model with at least three replies this week, beside how many of its replies were rated 2 or below. What does the query above return?
      (a) bot-a 3 alone, which misses bot-b and its three replies
      (b) bot-a 3 and bot-b 1, the two models the lead asked about
      (c) bot-a 4 and bot-b 3, the replies each model had in total
      (d) bot-a 3, bot-b 1 and bot-c 1, a row for every model
    why: >-
      WHERE runs first and keeps the five low ratings: three for bot-a, one for bot-b and one for
      bot-c. GROUP BY forms its groups from those rows alone, so count(*) counts low ratings, and
      HAVING count(*) >= 3 keeps bot-a with 3. The lead asked for the models with at least three
      replies in all, bot-a with 4 and bot-b with 3, so the query drops bot-b: its HAVING tests the
      wrong count. With no WHERE, counting every reply in HAVING and the low ones with count(*) FILTER
      (WHERE rating <= 2) returns bot-a 3 and bot-b 1. Run on PostgreSQL 16.13 on 30 September 2026.
    wrong:
      b: >-
        Reads HAVING as judging all of each model's replies; it runs after WHERE, so it sees only the
        low ratings, and bot-b's one fails the test.
      c: >-
        Counts every reply, as if WHERE had never run; count(*) counts the rows that survive WHERE.
      d: >-
        Ignores HAVING; bot-b and bot-c each have one low rating, and HAVING keeps only groups of three
        or more.
    answer: >-
      WHERE keeps or drops single rows before any group exists; HAVING keeps or drops whole groups
      after the aggregate is computed, so a HAVING that follows a WHERE counts only the rows WHERE
      kept.
  - id: not-in
    label: "Predict the count"
    type: One correct option
    level: Hard
    min: 4
    tag: "[F]"
    roles: DS, FDE
    day: Tue
    key: c
    anchor: >-
      How do you find orders with no payment?
    exhibit:
      caption: >-
        Four conversations and the handoff log, illustrative.
      code:
        lang: sql
        text: |-
          WITH conversations (conversation_id) AS (VALUES ('c1'), ('c2'), ('c3'), ('c4')),
          handoffs (conversation_id) AS (VALUES ('c2'), ('c4'), (NULL))
          SELECT count(*) AS resolved_by_bot
          FROM conversations
          WHERE conversation_id NOT IN (SELECT conversation_id FROM handoffs);
    text: |-
      The weekly review reads how many conversations the assistant resolved without a person. This week the handoff log gained a row whose conversation_id is NULL. What does the query above return, and what will the review conclude?
      (a) 2, counting c1 and c3, so the review sees half the conversations resolved
      (b) 3, counting the NULL row as one more, so the review sees three of four resolved
      (c) 0, so the review concludes the assistant resolved nothing on its own
      (d) An error, so the review gets no figure until someone removes the NULL row
    why: >-
      For c1, NOT IN asks c1 <> 'c2' AND c1 <> 'c4' AND c1 <> NULL; the last comparison is unknown, so
      the whole condition is unknown and WHERE drops the row. Every conversation fails the same way,
      so the count is 0 and the review reads a working assistant as useless. NOT EXISTS, or a LEFT
      JOIN kept where the handoff key IS NULL, returns 2. Run on PostgreSQL 16.13 on 30 September
      2026.
    wrong:
      a: >-
        The answer NOT EXISTS gives; NOT IN against a list that holds a NULL can never be true.
      b: >-
        The NULL sits in the subquery's list, never in the outer table, so it cannot add a
        conversation.
      d: >-
        Postgres raises nothing; the comparison with NULL is unknown and the rows are dropped without a
        word, so the review gets a figure, and the wrong one.
    answer: >-
      Rows with no match are an anti-join, which I write as NOT EXISTS or as a LEFT JOIN kept where
      the right key IS NULL, never as NOT IN against a column that can hold a NULL.
  - id: token-peers
    label: "Predict the running total"
    type: One correct option
    level: Hard
    min: 4
    tag: "[F]"
    roles: DS
    day: Wed
    key: a
    anchor: >-
      RANK, DENSE_RANK and ROW_NUMBER on a tie.
    exhibit:
      caption: >-
        Four model calls and the tokens each used, illustrative.
      code:
        lang: sql
        text: |-
          WITH calls (call_id, day, tokens) AS (VALUES
              (1, DATE '2026-09-21', 400), (2, DATE '2026-09-22', 300),
              (3, DATE '2026-09-22', 500), (4, DATE '2026-09-23', 200))
          SELECT call_id, sum(tokens) OVER (ORDER BY day) AS tokens_so_far
          FROM calls
          ORDER BY call_id;
    text: |-
      The model's bill is charged per token, so the finance partner wants tokens used so far, call by call, to watch the bill build up. What does tokens_so_far read for calls 1 to 4?
      (a) 400, 1200, 1200 and 1400
      (b) 400, 700, 1200 and 1400
      (c) 1400, 1400, 1400 and 1400
      (d) 400, 900, 1200 and 1400
    why: >-
      With an ORDER BY and no frame, the window runs from the first row to the current row and its
      peers, the rows that tie on the ORDER BY. Calls 2 and 3 share 22 September, so both read the
      day's closing figure, 1200, and neither shows its own step. Adding call_id to the window's ORDER
      BY gives each call its own step. Run on PostgreSQL 16.13 on 30 September 2026.
    wrong:
      b: >-
        The one-step-per-row reading, which needs a unique ORDER BY such as day then call_id; with the
        date alone the two calls are peers.
      c: >-
        The whole-table total on every row, which is what sum(tokens) OVER () gives with no ORDER BY;
        with an ORDER BY, the frame stops at the current row and its peers.
      d: >-
        Assumes the database breaks the tie with call 3 first; peers are never split, they share one
        figure.
    answer: >-
      A running total is deterministic only when its ORDER BY is unique; rows that tie are peers and
      share one cumulative figure, so I add a tiebreaker such as the id.
  - id: weekly-users
    label: "Count the week's users"
    type: One correct option
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS
    day: Mon
    key: d
    anchor: >-
      How do you present one number so it is not misread?
    exhibit:
      caption: >-
        One week of the visits log, illustrative: the users who opened the assistant on each day.
      table:
        head:
          - Day
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        rows:
          - [Users, "U1, U2, U3", "U1, U4", "U2, U3, U5", "U1, U2", "U3, U4, U6", U1, "U2, U6"]
    text: |-
      The product manager wants the week's active users for the deck. Which number goes on the slide?
      (a) 16
      (b) 2.3
      (c) 3
      (d) 6
    why: >-
      A distinct count does not add across days: U1 used the assistant on four days, so U1 is in four
      daily counts and once in the week's. The week's figure is its own COUNT(DISTINCT user_id) over
      the week's rows, 6, never the sum of the days, 16. On Kalpa's book, 244 buyers in April to June
      and 227 in July to September are 301 customers across both quarters, never 471.
    wrong:
      a: >-
        The seven daily counts added up; each day is distinct within the day, and across days the same
        users repeat, so the sum counts them again.
      b: >-
        The average of the daily counts answers how many on a typical day, a different question from
        the week's reach.
      c: >-
        The busiest day's count answers how much the assistant must handle at once; the ask was the
        week's active users.
    answer: >-
      COUNT(DISTINCT ...) does not add across groups; a period's total needs its own distinct count
      over the whole period.

