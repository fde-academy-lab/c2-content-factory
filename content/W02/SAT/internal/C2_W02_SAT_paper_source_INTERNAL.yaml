  - id: facebook
    label: "Size the overstatement"
    type: One correct option
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS
    day: Mon
    key: d
    anchor: >-
      How do you present one number so it is not misread?
    exhibit:
      caption: >-
        Five illustrative people who played a video and the seconds each watched, with the average
        Facebook defined and the one it calculated (TechCrunch, 2016).
      code:
        lang: sql
        text: |-
          WITH viewers (viewer_id, seconds) AS (VALUES
              (1, 2.0), (2, 14.0), (3, 1.0), (4, 9.0), (5, 4.0))
          SELECT round(sum(seconds) / count(CASE WHEN seconds >= 3 THEN 1 END), 1) AS calculated,
                 round(sum(seconds) / count(*), 1)                                AS defined
          FROM viewers;
    text: |-
      In 2016 Facebook told advertisers that it had defined the average duration of video viewed as the total time spent watching a video divided by the number of people who played it, and had calculated it by dividing by only the people who watched for three seconds or more (TechCrunch, 2016). The query above rebuilds both on five illustrative viewers. By how much does the calculated average overstate the defined one?
      (a) About 40 percent
      (b) 50 percent
      (c) Not at all; the two agree
      (d) About 67 percent
    why: >-
      The CASE has no ELSE, so it returns NULL for the two viewers under three seconds, and count
      skips NULLs: the calculated average divides all 30 seconds by 3 people, 10.0, where the
      defined one divides by all 5 who played, 6.0. Against the defined figure, 10.0 overstates 6.0
      by 4.0 over 6.0, about 67 percent. TechCrunch (Devin Coldewey, 22 September 2016) quoted
      Facebook's definition and its calculation, put the inflation at 60 to 80 percent over two
      years and reported that billing was not affected; checked on 30 September 2026. Run on
      PostgreSQL 16.14 on 1 October 2026.
    wrong:
      a: >-
        40 percent divides the gap by the wrong base, 4.0 over the calculated 10.0, and an
        overstatement is measured against the true figure, the defined 6.0.
      b: >-
        Averaging the three long viewers alone gives (14 + 9 + 4) / 3 = 9.0 against 6.0, 50 percent,
        but the query's numerator keeps all the time watched, the short viewers' 3 seconds included.
      c: >-
        count(CASE WHEN ... THEN 1 END) counts only the results that are not NULL, and a CASE with
        no ELSE returns NULL for the viewers it does not match, the same skip Monday's chapter 4 met
        inside avg.
    answer: >-
      An average is defined by its denominator, and a filter or a CASE that shrinks the denominator
      raises the average with no change in the data and no error, so I print the numerator and the
      denominator beside the ratio.
  # ---------------------------------------------------------------- Part 2, Tuesday
  - id: join-counts
    label: "Size the join first"
    type: Scenario set
    level: Hard
    min: 4
    tag: "[F]"
    roles: BA, DS
    day: Tue
    key: a
    anchor: >-
      Your LEFT join grew the row count and revenue doubled; name the cause and the check.
    exhibit:
      caption: >-
        The first query in Anand's report, run before any rupee is summed.
      code:
        lang: sql
        text: |-
          SELECT count(*)            AS rows_out,
                 count(p.payment_id) AS payment_rows
          FROM   orders o
          LEFT   JOIN payments p ON p.order_id = o.order_id
          WHERE  o.quarter = 'Q2';
    text: |-
      SET 4. SITUATION: The quarter from July to September, stored as quarter 'Q2', holds 462 orders booked at Rs 9,84,00,000. In the payments feed, 216 of them have one payment row; 188 have two rows, instalments 1 and 2 of one invoice; 28 have two rows that differ only in payment_id, because the gateway retried and posted instalment 1 twice; and 30 delivered orders have no payment row at all. Eight further payment rows carry an order_id that no order has.
      Before the report goes to Anand, the analyst sizes the join by hand. What will the query above return?
      (a) 678 and 648
      (b) 462 and 432
      (c) 650 and 620
      (d) 686 and 656
    why: >-
      A LEFT JOIN writes one row per matching payment row and keeps an order with none as one row of
      NULLs: 216 + 2 times 188 + 2 times 28 + 30 = 678 rows. count(p.payment_id) skips the 30 unpaid
      orders' NULLs where count(*) counts them, so it reads 678 minus 30 = 648, which is also what
      an INNER JOIN would return. The gateway's retried rows join twice like any other rows, and the
      eight payments with no order never meet an order. On Tuesday the same 678 rows, each carrying
      its order's booked amount, summed to Rs 19,29,04,410 of collected against Rs 9,84,00,000
      booked, chapter 2's fan-out. Run on PostgreSQL 16.14 on the week's warehouse on 1 October
      2026.
    wrong:
      b: >-
        462 and 432 read the join as one row per order and one payment row per paid order, but a
        join repeats an order once for each matching row, the fan-out of Tuesday's chapter 2.
      c: >-
        Keeping each retry's two rows once gives 650 and 620, but a join matches rows by key and
        ignores what else they carry, so both rows repeat the order.
      d: >-
        The eight payments with no order are counted in 686 and 656 as if they had joined, but a
        LEFT JOIN from orders keeps only rows that start from an order, and only a FULL OUTER JOIN
        brings in the payments whose order is missing.
    answer: >-
      INNER keeps only matched rows and LEFT keeps every order with NULLs where nothing matched; both
      repeat an order once per matching payment row, so I size the join, rows out against orders in,
      before any rupee is summed.
  - id: report-steps
    label: "Order the report's steps"
    type: Order the steps
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS, FDE
    day: Tue
    key: e, f, b, c, a
    anchor: >-
      Design the validation you run before a joined number reaches Finance, and say what you do when
      it fails at the end of reporting day.
    text: |-
      SET 4, continued.
      Five of these six steps make Anand's collected-revenue report, and one would spoil it. Leave that step out, and write the other five in the order they must run.
      (a) Send booked, collected and the gap to Anand, channel by channel
      (b) LEFT JOIN the quarter's 462 orders to each order's collected figure
      (c) Check that the result has one row for each of the 462 orders, and that each channel's gap equals its unpaid orders' booked value
      (d) Drop every order that has two payment rows, since those are the gateway's double posts
      (e) Keep one payment row for each order and instalment number
      (f) Sum the payment rows to one collected figure for each order
    why: >-
      The step to leave out is d: 188 of the orders with two payment rows are instalments 1 and 2 of
      one invoice, and dropping them throws away real cash along with the 28 retries. On the same
      book, HAVING count(*) > 1 by order lists 216 orders, Tuesday's chapter 4 trap, and grouping by
      order and instalment lists the 28 retries. The retries go first (e), because a sum taken
      before them keeps the Rs 20,750 the gateway posted twice, which is posted and never collected.
      The payment rows then go to one collected figure per order (f), which is what the join (b)
      reads, so the result keeps one row per order. The checks (c) come before anything is sent (a),
      and on Kalpa's book they read 462 rows and a gap of Rs 17,54,930, the unpaid orders' booked
      value exactly. Run on PostgreSQL 16.14 on the week's warehouse on 1 October 2026.
    answer: >-
      De-duplicate at the grain that defines a repeat, aggregate to the join's grain, join, prove the
      row count and the gap, then send.
  - id: where-on-payments
    label: "Run the query by hand"
    type: One correct option
    level: Hard
    min: 4
    tag: "[S]"
    roles: BA, DS, FDE
    day: Tue
    key: b
    anchor: >-
      INNER against LEFT join: what does each drop or keep?
    exhibit:
      caption: >-
        The analyst's query, with three of the quarter's orders and their payment rows written into it.
      code:
        lang: sql
        text: |-
          WITH orders (order_id, amount) AS (VALUES
              ('O-1', 1200), ('O-2', 800), ('O-3', 500)),
          payments (order_id, paid_date, paid) AS (VALUES
              ('O-1', DATE '2026-07-04', 600), ('O-1', DATE '2026-08-04', 600),
              ('O-2', DATE '2026-10-01', 800))
          SELECT count(*) AS rows_out, sum(o.amount) AS booked
          FROM orders o
          LEFT JOIN payments p ON p.order_id = o.order_id
          WHERE p.paid_date BETWEEN DATE '2026-07-01' AND DATE '2026-09-30';
    text: |-
      Anand wants every order of the quarter beside what was collected on it within the quarter, so the analyst adds a date filter on the payments. Before the report goes to him, the analyst runs the query above to count its rows and their booked value. What does it return?
      (a) 1 row, booked Rs 1,200
      (b) 2 rows, booked Rs 2,400
      (c) 3 rows, booked Rs 2,900
      (d) 4 rows, booked Rs 3,700
    why: >-
      O-1's two instalments both fall inside the quarter, so the join gives O-1 two rows and
      sum(o.amount) counts its Rs 1,200 twice. O-2's only payment is dated 1 October, so its joined
      row fails the WHERE. O-3 has no payment, so its paid_date is NULL, BETWEEN on a NULL is
      unknown, and WHERE drops that row too. Two rows remain, booked Rs 2,400, against three orders
      worth Rs 2,500: the report lost two orders and doubled the one it kept. Run on PostgreSQL
      16.14 on 1 October 2026.
    wrong:
      a: >-
        1 row assumes one row per order, which holds only once payments are brought to one row per
        order; O-1 has two payment rows inside the quarter, so the join repeats it.
      c: >-
        O-3 stays in 3 rows only if its NULL date passed the filter, but a comparison with NULL is
        unknown and WHERE keeps only rows where it is true, which is how the quarter's dates in
        WHERE emptied the unpaid list in Tuesday's chapter 4.
      d: >-
        Read as if it sat in the ON clause, the date filter would keep every order, with NULL
        payments on O-2 and O-3, for 4 rows; in WHERE it runs after the join and turns the LEFT JOIN
        into an INNER one, Tuesday's chapter 4 trap.
    answer: >-
      A filter on the right-hand table of a LEFT JOIN belongs in ON, because WHERE runs after the join,
      drops the NULL rows and turns the LEFT JOIN back into an INNER one; and the payments go to one
      row per order before the join.
  - id: reporting-day
    label: "Decide what leaves tonight"
    type: One correct option
    level: Medium
    min: 3.5
    tag: "[D]"
    roles: BA, FDE
    day: Tue
    key: c
    anchor: >-
      Design the validation you run before a joined number reaches Finance, and say what you do when
      it fails at the end of reporting day.
    exhibit:
      caption: >-
        Suppose these are the report's figures by channel at the end of a later reporting day; the
        figures are illustrative. The report's row count and its booked total both match their
        sources.
      table:
        head:
          - Channel
          - Booked, Rs
          - Collected, Rs
          - Unpaid orders' booked value, Rs
        rows:
          - [App, "4,25,90,270", "4,25,82,150", "8,120"]
          - [Store, "3,21,48,730", "3,11,90,920", "9,57,810"]
          - [Web, "2,36,61,000", "2,28,50,250", "7,89,000"]
    text: |-
      It is the end of the reporting day, and Anand expects the report tonight. His rule for a check that fails this late: booked always leaves, because it ties to the orders table alone; a collected figure that does not reconcile never leaves, and an open line goes with the report, naming the failed check, what it means and when it will close. On this report a channel's collected reconciles when its gap, booked less collected, equals its unpaid orders' booked value. What do you send?
      (a) Booked and collected for every channel, with any unexplained gap added to that channel's unpaid list
      (b) Booked for every channel, collected for app and web, and store's collected held back
      (c) Booked for every channel, collected for app and store, and web's collected held back
      (d) Booked for every channel, with all collected held back until every bridge closes
    why: >-
      The gaps are app Rs 8,120 and store Rs 9,57,810, each equal to its unpaid list to the rupee,
      and web Rs 8,10,750, which exceeds its list's Rs 7,89,000 by Rs 21,750 that nobody has
      explained. Booked matches its source, so it goes for every channel; app's and store's
      collected reconcile, so they go; web's collected waits, and the open line names the failed
      check, the Rs 21,750 it leaves unexplained and when it will close. That is Tuesday's chapter 6
      rule for a late failure, applied to each channel's figure on the page. The figures are
      illustrative: on Kalpa's own book, web's gap equals its unpaid list at Rs 7,89,000.
    wrong:
      a: >-
        Adding the unexplained Rs 21,750 to web's unpaid list forces the bridge closed and puts on the
        list an amount that no unpaid order carries.
      b: >-
        Store has the largest gap, and its gap equals its unpaid list to the rupee; the channel whose
        bridge fails is web, by Rs 21,750.
      d: >-
        Holding all collected back keeps two figures that reconcile to the rupee, which the rule
        sends, so Anand loses app's and store's collected over a doubt that concerns web alone.
    answer: >-
      Before a joined number reaches Finance I tie every figure back to one table alone: orders and
      booked against the orders table, the gap against booked less collected and against the unpaid
      list, and collected plus what was posted twice against what the feed posted. When one fails at
      the end of reporting day, booked leaves, a collected figure that does not reconcile is held,
      and the open line names the failed check, what it means and when it will close.
  - id: phe-checks
    label: "Choose the checks"
    type: More than one correct
    level: Hard
    min: 4
    tag: "[D]"
    roles: BA, DS, FDE
    day: Tue
    key: c, e
    anchor: >-
      Design the validation you run before a joined number reaches Finance, and say what you do when
      it fails at the end of reporting day.
    exhibit:
      caption: >-
        Suppose one day's files from three labs looked like this; the counts are illustrative. An
        .xls sheet holds 65,536 rows, one of them the header.
      table:
        head:
          - Lab file
          - Rows in the lab's CSV
          - Data rows in the .xls sheet
          - Rows loaded
          - Rows loaded the day before
        rows:
          - [Lab A, "41,200", "41,200", "41,200", "39,850"]
          - [Lab B, "70,900", "65,535", "65,535", "61,020"]
          - [Lab C, "12,480", "12,480", "12,480", "13,110"]
    text: |-
      In October 2020 Public Health England found that 15,841 positive COVID-19 cases from 25 September to 2 October had been left out of the daily figures, because some files had exceeded the maximum size the load could take (GOV.UK, 2020). The labs' CSV files had been converted to the older .xls format, and records past its limit were "simply left off and not counted when imported" (The Register, 2020). Which of these checks, run on every file, would have stopped Lab B's file on the day in the table? Mark every correct option.
      (a) Compare rows loaded with data rows in the .xls sheet, and stop the file when they differ
      (b) Remove duplicate rows from each file before it is loaded, so that no case counts twice
      (c) Compare rows loaded with rows in the lab's CSV, and stop the file when they differ
      (d) Stop any file whose rows loaded fall below that lab's rows loaded the day before
      (e) Stop any file whose sheet holds exactly 65,535 data rows, the most the format allows
    why: >-
      Lab B's file lost 5,365 rows in the conversion, 70,900 in the CSV against 65,535 in the sheet.
      Comparing rows loaded with the rows in the lab's own CSV sees the loss, and a sheet at exactly
      65,535 data rows sits at the format's limit, which a check can treat as a stop. Rows loaded
      and rows in the sheet were both counted after the cut, so they agree, and Lab B loaded more
      rows than the day before, 65,535 against 61,020, so neither of those checks fires. Tuesday's
      chapter 3 met the same case: the loss sat in rows that never loaded, which only a count of
      rows sent against rows loaded, taken back to the first count in the chain, measures. The facts
      are from the GOV.UK statement of 4 October 2020 (15,841 cases between 25 September and 2
      October; files that exceeded the maximum file size) and The Register of 5 October 2020 (lab
      CSV files stored in the older .xls format, 65,536 rows a sheet, records past the limit left
      off and not counted), both checked on 30 September 2026; the three labs' counts are
      illustrative.
    wrong:
      a: >-
        Rows loaded and data rows in the sheet were both counted after the conversion cut the file, so
        they agree at 65,535 and the check passes.
      b: >-
        De-duplication removes rows; it cannot find rows that were never loaded.
      d: >-
        Lab B loaded 65,535 rows against 61,020 the day before, so a check for a fall stays quiet
        while 5,365 rows go missing; a day-on-day check sees only a loss larger than the day's
        growth.
    answer: >-
      Any step that can drop rows without a warning needs a count on both sides of it, taken back to
      the first count in the chain, and the load stops when they differ, since a larger limit only
      moves the point where rows are lost.
