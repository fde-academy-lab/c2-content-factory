# Untimed and unmarked, for anyone who finishes early; each is the kind of follow-up an interviewer
# asks after a first answer, and the mock-interview round draws on them.
stretch:
  - text: |-
      Your report drops the gateway's repeats by order and instalment. Anand's analyst asks what you would do if a repeat ever arrived a day after the payment it copies. What makes a row a repeat, and what would you add to the check?
    answer: >-
      A repeat is the same order and the same instalment posted twice for the same amount; the date
      is not part of that identity, so the rule keys on order and instalment and keeps the first
      posting. I would add a check that no instalment is paid more than once and list any that is,
      with its dates, for Anand's analyst to confirm, rather than dropping it silently.
  - text: |-
      Next Monday three Retail-Plus members tie on the same Q2 revenue in rows 49, 50 and 51. What does RANK ship, and what does the note to the head of Retail-Plus say?
    answer: >-
      All three take rank 49, so every one of them holds a rank of 50 or better and the list ships 51
      members. The note says so in one line: 51 members, because three tie at forty-ninth, and names
      the three.
  - text: |-
      Explain the gene-name case to a product manager in two sentences: why did the fix go into the gene names, and what would you still check in every file you receive?
    answer: >-
      Excel turned some gene symbols into dates in about a fifth of papers with Excel gene lists, so
      the naming body renamed the genes it could not protect any other way, fixing the error at the
      source every reader shares. I would still count, after every merge, how many keys found a match,
      because a key changed on its way in never raises an error.
  - text: |-
      A director says the front page should read Rs 19.84 crore because "that is the real number". Answer in two sentences.
    answer: >-
      Rs 19.84 crore is real and covers two quarters, so a director reads it as a quarter that
      doubled. The page reads: Q2, July to September, Rs 9.84 crore, down 1.6 percent on Q1's Rs 10.00
      crore.
