notes:
  1:
    why: >-
      HAVING runs after GROUP BY, so it is the only clause that can judge a group. The common wrong
      answer is GROUP BY itself, which forms the groups and filters nothing.
    answer: >-
      WHERE keeps or drops one row before any group exists, and HAVING keeps or drops a whole group
      after the aggregate is computed.
  2:
    why: >-
      A table has no stored order, so without ORDER BY the database returns whichever rows its
      plan reaches first, and two runs can differ. The common wrong answer is "sort", which
      fails because a plan that reads an index does return sorted rows on some runs; what the
      database withholds is the promise, so the word is guarantee.
    answer: >-
      LIMIT without ORDER BY returns some rows, never defined ones, so two analysts can get two
      different top fives from the same data.
  3:
    why: >-
      WITH names a common table expression, a query step the rest of the query reads like a table.
      "Subquery" is the near miss: a subquery is inline and unnamed.
    answer: >-
      A CTE names each step of the logic so an auditor reads the query top to bottom, one decision
      per block.
  4:
    why: >-
      A LEFT JOIN preserves every row of the table named before the join. "Right" and "both"
      describe RIGHT and FULL OUTER joins.
    answer: >-
      A LEFT join keeps every row on the left and fills the missing side with NULL, which is how an
      order with no payment stays visible.
  5:
    label: "Complete the filter"
    why: >-
      After a LEFT JOIN an order with no payment carries NULL in every payment column, so the filter
      is IS NULL. Writing "= NULL" or "0" fails: nothing equals NULL, and a zero amount is a payment
      row.
    answer: >-
      Left join orders to payments and keep the rows where the payment's key IS NULL; those are the
      orders nobody paid for.
  6:
    label: "Name what LAG returns"
    why: >-
      The first month of a partition has no previous row, so LAG returns NULL unless a default is
      given. Answering 0 is the trap: a zero would read as a fall from zero to this month's spend.
    answer: >-
      LAG gives NULL on each customer's first month, so the fall flag must treat NULL as "no
      comparison" and never as a fall.
  7:
    why: >-
      PARTITION BY restarts the window for each value of the column, so each segment is ranked on its
      own. GROUP BY is the common wrong answer, and it collapses the rows the window needs.
    answer: >-
      PARTITION BY segment restarts the ranking inside each segment while every row stays in the
      result.
  8:
    label: "Name the error"
    why: >-
      pandas raises MergeError with the text "Merge keys are not unique in right dataset; not a
      one-to-one merge", checked on pandas 3.0.6. KeyError and ValueError are the usual wrong
      guesses.
    answer: >-
      validate='one_to_one' makes pandas raise MergeError on a repeated key, so the fan-out stops at
      the merge before any total is computed.
  9:
    why: >-
      melt turns columns into rows, which lengthens the table; pivot_table does the reverse. The
      common wrong answer is unstack, which fails because unstack moves an index level into the
      columns and so widens the table, the same direction as pivot_table.
    answer: >-
      pivot_table widens by turning values into columns, and melt lengthens by turning columns back
      into rows.
  10:
    label: "Check the run order"
    why: >-
      The logical order is FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, so WHERE runs first and
      SELECT comes late. That is why a SELECT alias cannot be used in WHERE.
    answer: >-
      SELECT is evaluated after WHERE, GROUP BY and HAVING, which is why its aliases work in ORDER BY
      and fail in WHERE.
  11:
    label: "Test a group filter"
    why: >-
      WHERE runs before any group exists, so an aggregate has nothing to count there, and Postgres
      rejects it. The group filter belongs in HAVING.
    answer: >-
      An aggregate cannot sit in WHERE because the groups do not exist yet; the filter moves to
      HAVING.
  12:
    label: "What INNER keeps"
    why: >-
      An INNER JOIN keeps only the orders that find a payment row, so the unpaid orders disappear
      without any warning or error.
    answer: >-
      An inner join drops every order with no payment and says nothing, which is exactly the list
      Finance most needs.
  13:
    label: "Read a joined SUM"
    why: >-
      When a key repeats on one side, each match becomes its own row. Every row is a real order paired
      with a real payment, so row-level checks pass while the SUM counts one order more than once.
    answer: >-
      A one-to-many join multiplies rows that each look correct, so the check is on the counts and
      the total, never on the rows.
  14:
    label: "Two rank functions"
    why: >-
      Without ties all three rank functions give 1, 2, 3 and so on. RANK and DENSE_RANK part only
      when two values tie, where RANK skips the next rank and DENSE_RANK does not.
    answer: >-
      RANK and DENSE_RANK agree until a tie; then RANK leaves a gap and DENSE_RANK does not.
  15:
    label: "A window in WHERE"
    why: >-
      Window functions are computed after WHERE in the logical order, so WHERE cannot see them.
      The fix is to compute the rank in a CTE or subquery and filter it outside.
    answer: >-
      A window runs after WHERE, so you compute it in a CTE and filter the rank in the outer query.
  16:
    label: "What groupby returns"
    why: >-
      groupby with agg splits the rows by key, reduces each group, and combines one row per group.
      transform is the variant that keeps every original row.
    answer: >-
      groupby then agg gives one row per group; transform gives the group's value on every original
      row.
  17:
    label: "A pivot on raw rows"
    why: >-
      A pivot sums whatever rows it is handed, so a duplicated row is summed twice. The pivot works
      correctly and the total is still wrong.
    answer: >-
      A pivot is only as honest as its source; duplicated rows in the export become a higher total.
  18:
    label: "Which clause"
    why: >-
      FROM runs first because every later clause needs the rows it produces.
    wrong:
      a: >-
        SELECT is written first, which is why people guess it; it is evaluated near the end.
      c: >-
        WHERE filters rows, so it needs FROM to have produced them already.
      d: >-
        ORDER BY is the last clause evaluated, after SELECT.
    answer: >-
      FROM runs first, then WHERE, GROUP BY, HAVING, SELECT and ORDER BY.
  19:
    label: "Fix the query"
    why: >-
      Every column in SELECT must either be grouped or aggregated, so segment either joins GROUP BY
      or sits inside an aggregate.
    wrong:
      b: >-
        HAVING filters groups; the error is about a column that is neither grouped nor aggregated.
      c: >-
        LIMIT trims rows after the query runs and never reaches the grouping error.
      d: >-
        ORDER BY sorts the output and cannot make an ungrouped column legal.
    answer: >-
      Every SELECT column is either in GROUP BY or inside an aggregate; the error names the one that
      is neither.
  20:
    label: "Why the warehouse"
    why: >-
      The warehouse query runs the same way against the source every Monday, and an auditor can read
      every line of it.
    wrong:
      a: >-
        Hiding the data from Finance breaks the audit this choice exists for.
      b: >-
        A notebook holds a quarter of orders easily; size is the wrong reason.
      c: >-
        Speed on every task is false and beside the point; repeatability and audit decide it.
    answer: >-
      A KPI Finance checks lives in the warehouse, because it reruns unchanged on the source and
      anyone can audit the query.
  21:
    label: "Name the join"
    why: >-
      INNER JOIN keeps only the rows that find a partner, so an order with no payment drops out.
    wrong:
      a: >-
        LEFT JOIN also keeps the unpaid orders, with NULL payment columns.
      b: >-
        FULL OUTER JOIN keeps unmatched rows from both sides, orders and payments.
      d: >-
        CROSS JOIN pairs every order with every payment and has no matching condition.
    answer: >-
      An inner join returns only matched orders; a left join returns every order.
  22:
    label: "Explain the extra rows"
    why: >-
      A LEFT JOIN can only grow the row count when a left row matches more than one right row, so
      some orders have two or more payment rows.
    wrong:
      a: >-
        An empty payments table would leave exactly 1,000 rows, each with NULLs.
      b: >-
        Unpaid orders stay as one row each under a LEFT JOIN, so they cannot add rows.
      c: >-
        This is the fan-out read in reverse: an unpaid order keeps its one row and adds none.
    answer: >-
      A row count that rises after a join means a key repeats on the right side; count rows per key
      to find which.
  23:
    label: "Read four queries"
    why: >-
      GROUP BY order_id with HAVING COUNT(*) > 1 returns every order with more than one payment row.
    wrong:
      b: >-
        DISTINCT lists every paid order once, and the ORDER BY only sorts that list, so the
        duplicates it was meant to find are hidden.
      c: >-
        Sorting puts the duplicates next to each other and still returns every order.
      d: >-
        An aggregate in WHERE is an error, because WHERE runs before any group exists.
    answer: >-
      GROUP BY the order key and keep HAVING COUNT(*) > 1; that is the double-paid list.
  24:
    label: "The first check"
    why: >-
      Revenue that doubles while every row looks right is the fan-out signature, so the first check
      is the row count before and after the join, then payment rows per order.
    wrong:
      a: >-
        A partial result would lower the total; this total went up.
      b: >-
        Rounding moves a total by rupees, never by a factor of two.
      c: >-
        An INNER JOIN fans out exactly as much and also drops the unpaid orders.
    answer: >-
      Count rows before and after the join, then count payments per order; the doubling lives in
      the join.
  25:
    label: "Predict the ranks"
    why: >-
      RANK gives the two 850s rank 2 and skips 3, so 700 gets rank 4. Checked in Postgres 16.13.
    wrong:
      a: >-
        1, 2, 3, 4 is ROW_NUMBER, which ignores the tie.
      b: >-
        1, 2, 2, 3 is DENSE_RANK, which leaves no gap.
      d: >-
        1, 1, 2, 3 ties the wrong pair: 900 and 850 are different values.
    answer: >-
      RANK ties equal values and skips the ranks they used, so 1, 2, 2, 4.
  26:
    label: "Same values, DENSE_RANK"
    why: >-
      DENSE_RANK gives the tied 850s rank 2 and continues at 3 without a gap.
    wrong:
      a: >-
        1, 2, 3, 4 is ROW_NUMBER.
      c: >-
        1, 2, 2, 4 is RANK, with the gap after the tie.
      d: >-
        1, 1, 2, 3 ties 900 with 850, which are unequal.
    answer: >-
      DENSE_RANK ties equal values and carries on with the next integer, so 1, 2, 2, 3.
  27:
    label: "Top three per segment"
    why: >-
      A rank computed within PARTITION BY segment keeps every member, and the outer query keeps the
      rows with rank three or less.
    wrong:
      a: >-
        LIMIT applies once to the whole result, never per group, and GROUP BY has collapsed the
        members anyway.
      c: >-
        One ORDER BY with LIMIT 3 returns the top three overall, which may all sit in one segment.
      d: >-
        HAVING filters whole groups by an aggregate and cannot pick rows inside a group.
    answer: >-
      Rank within PARTITION BY segment in a CTE, then keep rank three or less outside, with the tie
      rule named.
  28:
    label: "Find the cause"
    why: >-
      The claim needs a ROWS frame, such as ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW:
      tied rows are then added one at a time in an undefined order, so the running total at
      those rows can differ from run to run. Postgres's default frame with an ORDER BY is RANGE,
      which treats tied rows as peers and gives them one shared running total, so on the default
      the ties change only the order the rows print in. Checked in Postgres 16.13. Option a
      stays the only defensible cause, because b, c and d are false on any frame, and a
      tiebreaker column in the window's ORDER BY fixes it on both.
    wrong:
      b: >-
        Postgres does not sample rows inside a window.
      c: >-
        A cached result would repeat the same answer, never change it.
      d: >-
        SUM over exact numeric values is exact; it does not drift.
    answer: >-
      A running total that moves between runs has ties in its ORDER BY under a ROWS frame, since
      the default RANGE frame gives tied rows one shared total; add a tiebreaker so the order is
      defined.
  29:
    label: "Define groupby"
    why: >-
      groupby splits rows by key, applies a computation to each group, and combines the results.
    wrong:
      a: >-
        Returning the first row per key describes groupby().first(), one possible apply step, never
        groupby itself.
      b: >-
        Joining two tables on a key is merge.
      d: >-
        Removing duplicate keys is drop_duplicates.
    answer: >-
      groupby is split by key, apply a computation to each group, combine one result per group.
  30:
    label: "Explain the row count"
    why: >-
      A left merge grows only when a left key matches more than one right row, so some customer keys
      repeat in the exposure table.
    wrong:
      a: >-
        A customer with no exposure keeps its one row with NaN; it adds nothing.
      c: >-
        how='left' never appends the index as rows.
      d: >-
        With different key names pandas raises an error; it never matches on position.
    answer: >-
      Extra rows after a merge mean duplicate keys on the right; validate= would have raised before
      the count grew.
  31:
    label: "Find the wrong setting"
    why: >-
      XLOOKUP's match_mode 0 is exact and is the default; -1 and 1 return the next smaller or larger
      item when there is no exact match, which is how a missing id returns a neighbour. Verified on
      Microsoft Support on 29 September 2026.
    wrong:
      a: >-
        Arrays of different sizes make XLOOKUP return an error, which is visible.
      b: >-
        Sorting the lookup array leaves an exact match exact; it returns no neighbour on its own.
      c: >-
        Protection stops edits; it does not freeze formulas on an old result.
    answer: >-
      Set match_mode to exact and give if_not_found a visible message, so a missing id says so.
  32:
    label: "Excel's job"
    why: >-
      Excel owns the last mile: presenting a clean table and letting a director slice it live.
    wrong:
      b: >-
        Joining payments to orders is warehouse work, where the join can be audited.
      c: >-
        The source-of-truth figure belongs in the warehouse, where nobody can type over it.
      d: >-
        De-duplication is cleaning, which runs upstream in SQL or pandas before any total.
    answer: >-
      Excel presents and lets people explore; it never cleans, joins or computes the number of
      record.
  33:
    label: "Four statements"
    why: >-
      WHERE filters rows before grouping, HAVING filters groups after aggregation, and HAVING can
      compare COUNT(*) with a number, as in HAVING COUNT(*) > 1.
    wrong:
      d: >-
        WHERE cannot compare COUNT(*) with anything: an aggregate in WHERE is an error, because
        WHERE runs before the groups exist.
    answer: >-
      WHERE filters rows before the aggregate, HAVING filters groups after it, and only HAVING can
      use COUNT.
  34:
    label: "Build the validation"
    why: >-
      The row count before and after, payments per order, and booked revenue before and after are
      the three checks that catch a fan-out.
    wrong:
      d: >-
        Every order stays in a LEFT JOIN, so the channels match before and after it whether or not
        the join fanned out. A check that cannot fail proves nothing, which is how the doubled total
        passed a row-by-row reading on Tuesday.
    answer: >-
      Before a joined number leaves, compare the row count and the total before and after the join,
      and count rows per key.
  35:
    label: "Compare two joins"
    why: >-
      A FULL OUTER JOIN adds the rows with no partner on either side: orders with no payment and
      payments with no order.
    wrong:
      c: >-
        An order with one payment matches, so an INNER JOIN returns it too.
      d: >-
        An order with two payments matches twice and appears twice in an INNER JOIN as well.
    answer: >-
      A full outer join keeps the unmatched rows from both sides, which is how orphan payments show
      up.
  36:
    label: "Window or GROUP BY"
    why: >-
      A rank within a segment, a previous month beside this one, and a running total with every row
      kept all need a value computed across rows while each row stays.
    wrong:
      b: >-
        A segment's total for the quarter is one aggregate per group, which GROUP BY answers alone.
    answer: >-
      Use a window when the answer needs other rows while every row stays; use GROUP BY when one row
      per group is the answer.
  37:
    label: "Four claims on ties"
    why: >-
      ROW_NUMBER breaks ties arbitrarily, RANK gives tied members one rank, and a tie at fifty under
      RANK ships fifty-one rows.
    wrong:
      d: >-
        ROW_NUMBER numbers every row once, so rank fifty or less returns exactly fifty rows.
    answer: >-
      Ties ranked the same means RANK or DENSE_RANK, and the report must say it can ship more than
      fifty names.
  38:
    label: "Four merge claims"
    why: >-
      merge is the pandas join, validate= makes a fan-out fail loudly, and the row count check is
      still worth running.
    wrong:
      c: >-
        A left merge keeps the left count only when the right keys are unique, which is the trap
        itself.
    answer: >-
      merge is a SQL join in pandas; validate= states the relationship and the row count confirms
      it.
  39:
    label: "What a number needs"
    why: >-
      A single number is read correctly only with its denominator, its period and its comparison.
    wrong:
      d: >-
        An exact figure changes no reading: Rs 19,84,00,000 to the rupee reads as a doubled quarter
        exactly as Friday's card of Rs 19.84 crore did, because what was missing was the period.
    answer: >-
      One number needs its denominator, its period and a comparison, or the room fills them in
      wrongly.
  40:
    label: "Trace the LEFT join"
    why: >-
      920 orders give one row each, 50 orders give two rows each and 30 unpaid orders keep one
      row with NULLs: 920 + 100 + 30 = 1,050. Checked in Postgres 16.13. The common wrong answer
      is 1,000, which fails because a left join keeps every order but writes one row per
      matching payment, so the 50 retried orders appear twice.
    answer: >-
      A left join returns one row per match plus one per unmatched left row, so 1,050 here.
  41:
    label: "Trace the INNER join"
    why: >-
      The INNER JOIN drops the 30 unpaid orders: 920 + 100 = 1,020. The common wrong answer is
      970, the count of orders with a payment, which fails because a join returns one row per
      matching pair and the 50 retried orders match two payment rows each.
    answer: >-
      An inner join returns only the matches, 1,020, and the 30 unpaid orders vanish without a word.
  42:
    label: "Find the unpaid orders"
    why: >-
      A LEFT JOIN keeps unpaid orders with NULL payment columns, and IS NULL on the payment key keeps
      exactly those.
    wrong:
      b: >-
        An INNER JOIN has already dropped the unpaid orders, so there is nothing left to find.
      c: >-
        This lists the double-paid orders, a different list.
      d: >-
        A RIGHT JOIN with IS NULL on the orders side is the anti-join from the other side: it lists
        the payments whose order is missing, as step A7 of Tuesday's round 3 did, and never an
        unpaid order.
    answer: >-
      Left join, then keep the rows whose payment key IS NULL.
  43:
    label: "Judge the payments SUM"
    why: >-
      Each retry recorded the same payment a second time, so a plain SUM counts those 50 payments
      twice.
    answer: >-
      Collected revenue is summed after the payments are de-duplicated on a stated rule; a raw SUM
      counts every retry.
  44:
    label: "Rank member D"
    why: >-
      A 900, B and C tie at rank 2, so the next rank is 4 for D and E. Checked in Postgres
      16.13. The common wrong answer is 3, which is D's rank under DENSE_RANK(); RANK() skips
      the ranks the tie used up.
    answer: >-
      Under RANK the pair tied at second pushes the next member to fourth.
  45:
    label: "Dense-rank member F"
    why: >-
      Dense ranks run A 1, B and C 2, D and E 3, F 4. The common wrong answer is 6, which fails
      because 6 is F's rank under RANK() and its row number; DENSE_RANK() never skips a rank
      after a tie.
    answer: >-
      DENSE_RANK never skips, so F is fourth.
  46:
    label: "Count what the filter keeps"
    why: >-
      Dense rank three or less is A, B, C, D and E, which is five members. Checked in Postgres 16.13.
    wrong:
      a: >-
        Three assumes one member per rank, which ignores both ties.
      b: >-
        Four counts one tie and forgets the other.
      d: >-
        Six includes F, whose dense rank is 4.
    answer: >-
      A top-three by DENSE_RANK returns every member at the top three values, five here.
  47:
    label: "Exactly four members"
    why: >-
      Only ROW_NUMBER guarantees exactly four rows, and it splits the D and E tie arbitrarily unless a
      tiebreaker is named.
    wrong:
      a: >-
        RANK four or less returns A, B, C, D and E, which is five.
      b: >-
        DENSE_RANK returns five at three or less and six at four or less, never four.
      d: >-
        LAG reads the previous row; it ranks nothing.
    answer: >-
      Exactly N rows means ROW_NUMBER with a named tiebreaker, so the cut is a decision someone
      owns.
  48:
    label: "Count the merged rows"
    why: >-
      940 customers match once and 60 match twice: 940 + 120 = 1,060. The common wrong answer is
      1,000, which fails because a left merge keeps the left table's row count only when the
      right key is unique, and each of the 60 repeated customer_ids adds a row.
    answer: >-
      Each repeated key adds a row, so 60 duplicates turn 1,000 customers into 1,060 rows.
  49:
    label: "Predict what validate does"
    why: >-
      validate='one_to_one' checks the keys on both sides and raises MergeError before a row is
      produced.
    wrong:
      a: >-
        validate never removes rows; it only checks and raises.
      b: >-
        validate applies to every merge type, including how='left'.
      c: >-
        validate does not sort; sorting would leave the duplicates in place.
    answer: >-
      validate= turns a silent fan-out into a MergeError at the merge.
  50:
    label: "Compare the totals"
    why: >-
      The 60 duplicated customers have their revenue summed twice, so the pivot total is higher than
      the warehouse's.
    answer: >-
      A pivot above the warehouse total points at duplicated rows upstream.
  51:
    label: "Place the fix"
    why: >-
      The error was made at the merge, so the fix belongs there: de-duplicate the exposure table on a
      stated rule and validate the keys.
    wrong:
      a: >-
        Typing over the pivot's total hides the error and leaves no audit trail.
      c: >-
        Revenue per customer is still wrong for the 60 duplicated customers.
      d: >-
        A gap from double-counted customers is an error, never rounding.
    answer: >-
      Fix where the error was made, at the merge, so every number downstream is right without
      editing.
  52:
    label: "Predict the row count"
    why: >-
      Four segments times two quarters, with every combination present, gives eight groups. The
      common wrong answer is 6, which adds the segments to the quarters and fails because GROUP
      BY on two columns returns one row per pair of values, so the counts multiply.
    answer: >-
      GROUP BY returns one row per combination that exists, so 4 by 2 gives 8.
  53:
    label: "Reason with numbers"
    why: >-
      Fifty payments of Rs 2,000 counted twice add Rs 1 lakh: Rs 20 lakh plus Rs 1 lakh is Rs 21
      lakh. The common wrong answer is Rs 20 lakh, which fails because SUM adds rows, and each
      retried payment is a second row carrying the same amount.
    answer: >-
      A plain SUM reports Rs 21 lakh, overstating collections by exactly the retried amount.
  54:
    label: "Count both lists"
    why: >-
      Under RANK both tied members hold rank fifty, so 51 rows return; ROW_NUMBER numbers every
      row once and returns 50. The common wrong answer is 50 under both, which fails because
      RANK() gives both tied members rank fifty and the filter keeps both.
    answer: >-
      RANK ships 51 on a tie at fifty, ROW_NUMBER ships 50 and drops one tied member by an arbitrary
      rule.
  55:
    label: "Run the falling flag"
    why: >-
      LAG gives 4,200 minus 5,000, a fall of Rs 800, and 3,900 minus 4,200, a fall of Rs 300.
      Two consecutive falls fire the flag. The common wrong answer takes last month minus this
      month, reads two rises of Rs 800 and Rs 300 and says the flag does not fire; LAG returns
      last month's value, and the change is this month minus that value, so both changes are
      falls.
    answer: >-
      LAG puts last month beside this month, and two negative changes in a row fire the flag.
  56:
    label: "Size the customer table"
    why: >-
      One row per customer gives 400 rows, and 1,000 orders over 400 customers is 2.5. Integer
      division in Postgres would return 2, the week's trap.
    answer: >-
      groupby customer gives 400 rows at 2.5 orders each, computed in decimals.
  57:
    label: "Order the clauses"
    why: >-
      The logical order is FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY. The common wrong answer
      is the order the clauses are typed, a, c, b, e, f, d, which puts SELECT first; the database
      cannot pick columns from rows it has not yet read, filtered and grouped.
    answer: >-
      FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, which is why aliases work only in ORDER BY.
  58:
    label: "Order the tools"
    why: >-
      The warehouse computes the source of truth, pandas carries the analyst's iteration, and Excel
      presents it to the room. Any order that starts in pandas or Excel makes a copy the source of
      truth, which Friday's operating rule forbids: the number of record lives in the warehouse.
    answer: >-
      The number flows from the warehouse through pandas to Excel, and never back the other way.

stretch:
  - text: |-
      COUNT(*) / COUNT(DISTINCT customer_id) over 1,000 orders and 400 customers puts 2 orders per customer in the Monday report. What went wrong, what is the right number, and how do you write it?
    answer: >-
      Both counts are integers, so Postgres divides integers and drops the fraction: 1,000 / 400
      returns 2. The right number is 2.5. Cast one side to numeric, as COUNT(*)::numeric /
      COUNT(DISTINCT customer_id), and check the result against a hand calculation on a small
      sample before the query runs every Monday.
  - text: |-
      Orders LEFT JOIN payments with WHERE payments.amount_paid > 0 loses the 30 unpaid orders out of 1,000. Why, where does the condition belong, and what else do you check before Finance sees the total?
    answer: >-
      WHERE runs after the join, and an unpaid order carries NULL in amount_paid, so the comparison
      is unknown and the row is dropped: the LEFT join now behaves like an INNER one. Move the
      condition into the ON clause so the unpaid orders stay. Then compare the row count before and
      after the join and count payment rows per order, because a retried payment recorded twice
      fans the join out and doubles those orders' amounts.
  - text: |-
      A top-fifty list built with RANK returns 51 names on a tie at fifty. The segment head says ties rank the same; Finance says the list is fifty. What do you ship, and what do you say?
    answer: >-
      Name the conflict, since each rule is reasonable and they cannot both hold. Either ship 51
      under RANK with the tie flagged, or ship 50 under ROW_NUMBER with a tiebreaker the business
      chooses and the report states, such as the earlier first order. Never let ROW_NUMBER break the
      tie on its own, because two runs can then hand two different lists.
  - text: |-
      A pandas pivot_table of revenue by segment sits far below the warehouse, and an Excel lookup shows details for an id that is in no table. Name the setting behind each, and the fix.
    answer: >-
      pivot_table averages by default, so each cell is a mean order value where a total was meant;
      set aggfunc='sum' and reconcile the grand total with the warehouse. The lookup used a match
      mode of -1 or 1, which returns the next smaller or larger id when there is no exact match; set
      match_mode to 0 for an exact match and give if_not_found a visible message, so a missing id
      says so.
