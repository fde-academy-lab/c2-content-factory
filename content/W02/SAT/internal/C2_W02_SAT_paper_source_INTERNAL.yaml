# Three timed items for Part 6, each on a short exhibit of the week's own code with invented,
# self-contained data. Every wrong option is a trap the week staged, named with its day in the
# option's reason. The keys were run on PostgreSQL 16.13 and pandas 3.0.5 on 30 September 2026;
# the provenance record carries each command and its output.
additions:
  - id: avg-per-member
    label: "Predict the result"
    type: One correct option
    level: Hard
    tag: "[D]"
    roles: BA, DS
    day: Mon
    min: 2
    key: c
    anchor: >-
      A stakeholder's analyst must audit your query; what changes in how you write it, and what
      would you refuse to compute in a notebook?
    exhibit:
      caption: >-
        The analyst's query, with four members' orders written into it.
      code:
        lang: sql
        text: |-
          WITH orders (customer_id, quarter, amount) AS (VALUES
              ('C1', 'Q1', 2000), ('C1', 'Q2', 1200), ('C1', 'Q2', 600),
              ('C2', 'Q1', 1600), ('C2', 'Q2', 1200),
              ('C3', 'Q1', 1400), ('C4', 'Q1', 1000)),
          member AS (
              SELECT customer_id,
                     sum(CASE WHEN quarter = 'Q1' THEN amount END) AS q1_spend,
                     sum(CASE WHEN quarter = 'Q2' THEN amount END) AS q2_spend
              FROM orders GROUP BY customer_id)
          SELECT round(avg(q1_spend)) AS avg_q1, round(avg(q2_spend)) AS avg_q2 FROM member;
    text: |-
      The head of Retail-Plus asks whether spend per member fell from Q1 to Q2, and the analyst answers with the query above. What does the query return, and how will she read it?
      (a) 1,500 and 750, which reads as spend per member halved
      (b) 1,500 and 1,000, which reads as spend per member down by a third
      (c) 1,500 and 1,500, which reads as flat spend per member
      (d) 1,500 and NULL, which reads as no Q2 figure at all
    why: >-
      The CASE has no ELSE, so C3 and C4, who bought nothing in Q2, carry a NULL q2_spend where a
      zero was meant. AVG divides by the values it can see: avg_q1 is Rs 6,000 over four members and
      avg_q2 is C1's Rs 1,800 and C2's Rs 1,200 over two, so both come to 1,500 and the query
      reports spend per member as flat. Half the members stopped buying, and with COALESCE(..., 0)
      the honest Q2 figure is Rs 750, half of Q1. The check that catches it is count(*) beside
      count(q2_spend), 4 against 2. Run on PostgreSQL 16.13 on 30 September 2026, the query returns
      1500 and 1500.
    wrong:
      a: >-
        The figure the head of Retail-Plus needed, and one this query never computes: it would need
        COALESCE(..., 0) to count the two members with no Q2 order as zero. Reading AVG as dividing
        by every member is Monday's round 3 trap, the member average that quietly left out the
        members who bought nothing in the quarter.
      b: >-
        Averages the three Q2 order rows, Rs 3,000 over three, at the order's grain, where the CTE
        first sums C1's two Q2 orders into one member. Rows read as customers is Monday's round 1
        trap.
      d: >-
        Reads NULL as spreading through the aggregate. AVG skips NULLs, as Monday's round 3 showed
        on the invented values 100, NULL and 200, where AVG returned 150; only arithmetic such as
        q2_spend - q1_spend turns NULL.
    answer: >-
      AVG divides by the values it can see, so a CASE with no ELSE turns a member who bought nothing
      into a NULL that drops out of the denominator; I write the zero on purpose with COALESCE and
      put count(*) beside count(q2_spend), so the analyst auditing the query sees both
      denominators.
  - id: where-on-payments
    label: "Run the query by hand"
    type: Scenario set
    level: Hard
    tag: "[S]"
    roles: BA, DS, FDE
    day: Tue
    min: 2.5
    key: b
    anchor: >-
      INNER against LEFT join: what does each drop or keep?
    exhibit:
      caption: >-
        The analyst's query, with three Q2 orders and their payment rows written into it.
      code:
        lang: sql
        text: |-
          WITH orders (order_id, amount) AS (VALUES
              ('O-1', 1200), ('O-2', 800), ('O-3', 500)),
          payments (order_id, paid_date, paid) AS (VALUES
              ('O-1', DATE '2026-07-04', 600), ('O-1', DATE '2026-08-04', 600),
              ('O-2', DATE '2026-10-01', 800))
          SELECT count(*) AS rows_out, sum(o.amount) AS booked
          FROM orders o
          LEFT JOIN payments p ON p.order_id = o.order_id
          WHERE p.paid_date BETWEEN DATE '2026-07-01' AND DATE '2026-09-30';
    text: |-
      Anand wants every Q2 order beside what was collected on it within the quarter. Before the report goes to him, the analyst runs the query above to count its rows and their booked value. What does it return?
      (a) 1 row, booked Rs 1,200
      (b) 2 rows, booked Rs 2,400
      (c) 3 rows, booked Rs 2,900
      (d) 4 rows, booked Rs 3,700
    why: >-
      O-1's two instalments both fall inside the quarter, so the join gives O-1 two rows and
      SUM(o.amount) counts its Rs 1,200 twice. O-2's only payment is dated 1 October, so its joined
      row fails the WHERE. O-3 has no payment, so its paid_date is NULL, BETWEEN on a NULL is
      unknown, and WHERE drops that row too. Two rows remain, booked Rs 2,400, against three orders
      worth Rs 2,500: the report lost two orders and doubled the one it kept. Run on PostgreSQL
      16.13 on 30 September 2026, the query returns 2 and 2400.
    wrong:
      a: >-
        Assumes one row per order, which holds only once payments are brought to one row per order;
        O-1 has two payment rows inside the quarter, so the join repeats it. The fan-out is
        Tuesday's round 1 trap.
      c: >-
        Keeps O-3 as if its NULL date passed the filter. A comparison with NULL is unknown and
        WHERE keeps only rows where it is true, which is how the LEFT JOIN with a date filter in
        Tuesday's round 3 emptied the unpaid list.
      d: >-
        Reads the WHERE as if it sat in the ON clause, where it would keep every order and leave
        NULL payments on O-2 and O-3. In WHERE it runs after the join and turns the LEFT JOIN into
        an INNER one, which is Tuesday's round 3 trap.
    answer: >-
      INNER keeps only the matched rows and LEFT keeps every left row with NULLs where nothing
      matched; both repeat a left row once per matching right row, and a WHERE on the right-hand
      table drops the NULL rows and turns the LEFT back into an INNER, so a filter on payments goes
      in ON and the payments go to one row per order before the join.
  - id: reach-by-segment
    label: "Predict the output"
    type: One correct option
    level: Hard
    tag: "[S]"
    roles: BA, DS
    day: Thu
    min: 2
    key: d
    anchor: >-
      groupby in the split-apply-combine sentence.
    exhibit:
      caption: >-
        The analyst's code, with four buyers and the five customers the sale reached written into
        it.
      code:
        lang: python
        text: |-
          import pandas as pd
          buyers = pd.DataFrame({
              "customer_id": ["C1", "C2", "C3", "C4"],
              "segment": ["Retail-Plus", "Retail-Core", "Retail-Plus", "Retail-Core"],
              "orders": [3, 1, 2, 5]})
          reached = pd.DataFrame({"customer_id": ["C1", "C2", "C5", "C6", "C7"]})
          t = buyers.merge(reached, on="customer_id", how="right", validate="one_to_one")
          by_seg = t.groupby("segment").agg(reached=("customer_id", "count"),
                                            bought=("orders", "count"))
          print(len(t), by_seg["reached"].sum(), by_seg["bought"].sum())
    text: |-
      The marketing lead asks how many customers the monsoon sale reached and how many of them bought, and the analyst runs the code above. What does it print?
      (a) 2 2 2
      (b) 4 4 4
      (c) 5 5 2
      (d) 5 2 2
    why: >-
      how='right' keeps every customer in reached, so t holds 5 rows, and validate passes because
      no key repeats. C5, C6 and C7 never ordered, so the merge gives them NaN for segment and for
      orders. groupby drops a missing key by default, so those three rows never reach a group:
      reached sums to 2 and bought to 2, and the slide reads 2 of 2 reached customers bought, 100
      percent, where 2 of the 5 reached bought, 40 percent. Run on pandas 3.0.5 on 30 September
      2026, the code prints 5 2 2.
    wrong:
      a: >-
        Reads the merge as an inner one, which would keep only C1 and C2. An inner merge is the
        default, and how='right' here keeps all five reached customers; Thursday's round 2 showed
        the default dropping every customer the sale did not reach.
      b: >-
        Reads how='right' as if it kept the left frame, the four buyers built from order rows. A
        frame built from order rows holds only the customers who ordered, which is why Thursday's
        round 1 built the table on the customer list; a right merge keeps every row of the
        right-hand frame, here the five reached.
      c: >-
        Counts the three customers with no segment as a group of their own, which is what
        groupby does only with dropna=False. The default drops a missing key: Thursday's round 2
        trap, where reach read 100 percent conversion until dropna=False showed the missing group.
    answer: >-
      groupby splits the rows by a key, applies a computation to each group and combines one row
      per group, and a row whose key is missing belongs to no group, so the default drops it; after
      a merge that can leave a key empty I group from the full list or pass dropna=False, and check
      that the groups add back to the rows.

