# Untimed and unmarked, for anyone who finishes early; each is the kind of follow-up an interviewer
# asks after a first answer, and the mock-interview round draws on them.
stretch:
  - text: |-
      Anand now wants collected revenue week by week instead of for the whole quarter. Which date decides the week a rupee is collected in, and what happens to an order paid in two instalments?
    answer: >-
      The payment's date decides collected's week, where the order's date decides booked's, so an
      order paid in two instalments adds to collected in two different weeks. A weekly gap between
      booked and collected is then timing as well as unpaid orders, and the report says so beside the
      weekly figures.
  - text: |-
      Marketing wants each Retail-Plus member's share of the tier's revenue beside the member's own revenue, in one query and without a join. What would you write, and how would you check it?
    answer: >-
      The member's revenue divided by sum(revenue) OVER (), the tier's total on every row, taken in
      numeric and rounded on purpose; the check is that the shares add to 1, and that the total on
      every row equals the tier's revenue from the Monday suite.
  - text: |-
      Explain the gene-name case to a product manager in two sentences: why did the fix go into the gene names, and what would you still check in every file you receive?
    answer: >-
      Excel turned some gene symbols into dates in about a fifth of papers with Excel gene lists, so
      the naming body renamed the genes it could not protect any other way, fixing the error at the
      source every reader shares. I would still count, after every merge, how many keys found a match,
      because a key changed on its way in never raises an error.
  - text: |-
      A director says the front page should read Rs 19.84 crore because "that is the real number". Answer in two sentences.
    answer: >-
      Rs 19.84 crore is real and covers two quarters, so a director reads it as a quarter that
      doubled. The page reads: July to September, Rs 9.84 crore, down 1.6 percent on April to June's
      Rs 10.00 crore.
