    text: |-
      Meera's chief of staff wants one line about the plan for Monday's front page, and the figures above are all there is. Which line do they support?
      (a) Level with plan at the close, having given back the lead it built in July
      (b) Well ahead of plan at the close, keeping most of the lead it built in July
      (c) Behind plan from mid-August on, after a strong start in the first weeks of July
      (d) Within a few lakh of plan all quarter, with no lead or shortfall worth a line
    why: >-
      Booked less plan at the seven points reads -0.25, +1.95, +2.17, +1.57, +0.73, +0.79 and 0.00
      crore: behind after the first week, well ahead once the week of 13 July booked Rs 2.66 crore,
      furthest ahead at the start of August, and level at the close, Rs 9,84,00,000 against a plan of
      Rs 9,83,99,990. The weekly rate did the giving back: six of the seven full weeks from 10 August
      booked below the plan's Rs 75.69 lakh a week. A front-page line carries its period and its
      comparison, so a director reads the close and the trend together. The figures are the week's own
      running total against plan_line, recomputed on PostgreSQL 16.13 on 30 September 2026.
    wrong:
      b: >-
        The lead peaked at Rs 2.17 crore at the start of August and was gone by the close, where booked
        and plan both read Rs 9.84 crore.
      c: >-
        Booked stayed above plan at every point after the first week; the quarter gave back its lead
        and never fell behind.
      d: >-
        At its widest the lead was Rs 2.17 crore, more than a fifth of the quarter's plan, which is a
        lead worth a line.
    answer: >-
      One number goes out with its period, its base and its comparison, here the quarter's close
      against plan and the trend that brought it there, so it is read the way it was meant.
  # ---------------------------------------------------------------- Part 4, Thursday
  - id: merge-rows
    label: "Size the merge"
    type: Scenario set
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS
    day: Thu
    key: "346"
    anchor: >-
      merge against join: what is the same and what differs?
    text: |-
      SET 6. SITUATION: The customer table has 340 rows, one per customer, and its spend column adds up to the book's Rs 19,84,00,000 for both quarters. The monsoon sale's exposure feed, which lists the customers the sale reached, holds 136 rows for 130 customers, because six customers were sent a second time on 11 August. The analyst merges the feed onto the table with how='left' and sends the result to Excel, where a pivot sums spend.
      How many rows does the merged table hold?
    why: >-
      A left merge keeps every customer and writes one row per matching feed row: 334 customers match
      once or not at all, and the 6 sent twice match two rows each, so 334 + 12 = 346. Run on pandas
      3.0.5 on the week's files on 30 September 2026.
    answer: >-
      A merge grows the left table only when a key repeats on the right, and each repeat adds a row.
  - id: pivot-total
    label: "Judge the claim"
    type: Scenario set
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS, FDE
    day: Thu
    key: d
    anchor: >-
      A pivot's total disagrees with the warehouse; where do you look first?
    text: |-
      SET 6, continued.
      The analyst tells Marketing: "The pivot's grand total will equal the book's Rs 19,84,00,000." True or false, and why?
      (a) True, because a left merge keeps the 340 customers and adds no spend
      (b) True, because the pivot sums spend by customer_id, so each counts once
      (c) False, because the 210 customers the sale never reached drop out
      (d) False, because the six customers sent twice sit on two rows each
    why: >-
      Each of the six repeated customers sits on two rows carrying the same spend, so the pivot adds
      their spend twice: Rs 19,84,45,800, Rs 45,800 above the book. Run on pandas 3.0.5 on 30
      September 2026.
    wrong:
      a: >-
        A left merge keeps each left row once only when the right key is unique; the six repeated keys
        add six rows, each carrying spend.
      b: >-
        A pivot sums rows, and grouping by customer_id adds the repeated rows into one larger cell; it
        does not de-duplicate them.
      c: >-
        A left merge keeps the customers the sale never reached, with NaN in the feed's columns; they
        stay, with their spend.
    answer: >-
      A pivot is only as honest as the table under it: a merge that repeated rows makes a larger total
      out of rows that each look right.
  - id: stop-line
    label: "Place the guards"
    type: Scenario set
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: BA, DS, FDE
    day: Thu
    key: a, e
    anchor: >-
      Which merge argument raises on duplicate keys, and which error?
    text: |-
      SET 6, continued.
      Which of these, added to Monday's refresh, would have stopped the run before the pivot was built? Mark every correct option.
      (a) validate='one_to_one' on the merge itself, so a repeated key stops it
      (b) drop_duplicates() on the merged table, before it goes to Excel
      (c) indicator=True on the merge, with the rows then counted by _merge
      (d) how='inner' in place of how='left', so only reached customers remain
      (e) an assert that the merged table has as many rows as the customer table
    why: >-
      validate='one_to_one' checks that the key is unique on both sides and raises pandas'
      MergeError ("Merge keys are not unique in right dataset; not a one-to-one merge") before a
      merged table exists; the row-count assert stops the run because 346 is not 340. Checked on
      pandas 3.0.5 on 30 September 2026.
    wrong:
      b: >-
        The six repeated rows differ in exposed_date (3 and 11 August), so no row is an exact
        duplicate and all 346 stay; this is Friday's Remove Duplicates trap in pandas.
      c: >-
        indicator labels each row both, left_only or right_only; the repeated customers are labelled
        both, twice, and nothing stops.
      d: >-
        An inner merge keeps 136 rows, still with the six customers twice, and drops the 210 the sale
        never reached.
    answer: >-
      validate= states the relationship a merge must have and raises MergeError the moment the keys
      break it, and a row-count check says the same thing in numbers; both belong in the refresh.
