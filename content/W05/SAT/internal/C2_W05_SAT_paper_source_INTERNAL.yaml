additions:
  # ---------------------------------------------------------------- Part 1, Monday
  - id: peek
    label: "Predict the fresh score"
    type: One correct option
    level: Hard
    min: 2.5
    tag: "[S]"
    roles: DS, FDE
    day: Mon
    key: c
    anchor: >-
      Train, validation, test: which is spent once?
    text: |-
      On Monday a junior tried 60 versions of the model, each on a different list of the customer table's columns, scored all 60 on the same 2,000 held-out clients and kept the best: accuracy 0.9055 there, where calling nobody scores 0.8875. On 6,238 fresh clients, where calling nobody scores 0.8873, what does the chosen version score, and what have the 2,000 clients become?
      (a) About 0.906 again, since the version never trained on the 2,000; they remain a fair test of it.
      (b) About 0.887, since the loop found only luck and its edge vanishes; the 2,000 have become training.
      (c) About 0.897: part of the 1.8-point edge was luck the loop picked; the 2,000 are now validation.
      (d) About 0.902: a peek doubles an edge, so half of the 1.8 points was luck; the 2,000 are now validation.
    why: >-
      Choosing the best of 60 on one slice picks the version whose score on that slice was
      luckiest, so the chosen score flatters. On fresh rows the luck does not repeat and the score
      falls back toward what an ordinary model of the week scores: the room's notebook measured
      0.8971, the customer-table model's 0.897 on Exhibit 1A, an honest edge of 0.98 points against
      the 1.80 reported. No version was fitted to the 2,000, so the score does not collapse; the
      2,000 were spent on a choice, which makes them validation. A test slice is scored once, at the
      end, on a model already chosen.
      Monday's peek chapter ran this loop, and the sealed envelope stayed shut until Friday.
    wrong:
      a: >-
        Never training on a slice is not enough: choosing among 60 versions by their score on it
        carries the slice's luck into the choice.
      b: >-
        The versions are ordinary models of the week, each near Exhibit 1A's 0.897, so the edge
        shrinks without vanishing; and a slice that chose a version is validation, never training.
      d: >-
        No rule halves an edge: the fall is the luck that 60 tries picked, and the chosen version is an
        ordinary customer-table model, which Exhibit 1A puts at 0.897.
    answer: >-
      A slice used to choose is validation, so I expect its best score to fall back on fresh rows
      by the luck the choice picked, and I score the test once, at the end.
  - id: random-or-time
    label: "Judge the split"
    type: True or false
    level: Hard
    min: 2.5
    tag: "[D]"
    roles: DS
    day: Mon
    key: a
    anchor: >-
      Train, validation, test: how should the rows be split for the question being asked?
    text: |-
      The calls run in date order. On the week's run the earliest 70 percent of rows say yes 5.6 percent of the time and the latest 30 percent say yes 24.6 percent of the time. Statement: for the question "whom do we call in the next campaign", a split by date estimates the model's score more honestly than a random split of all the rows. True or false, and why?
      (a) True: a random split trains on later months than it validates on; train early and score late, like the ask.
      (b) True: a split by date keeps more yes rows in validation, so its score is less noisy than a random split's.
      (c) False: a stratified random split keeps 11.27 percent yes in every slice, so each is a fair sample of clients.
      (d) False: the model never reads a date column, so the order in which the calls were made cannot move its score.
    why: >-
      The ask is about a campaign that has not happened yet, so the honest test trains on the
      earlier calls and scores the later ones. A random split puts calls from the same months in
      training and validation, and the month and the economic indicators mark the period, so the
      model partly learns when a call happened. On the week's run the yes rate moved from 5.6 to
      24.6 percent across the file, and Friday's split by date cut the AUC from 0.795 to 0.657.
      Monday raised the split by time; Friday ran it.
    wrong:
      b: >-
        The split by date wins on timing, not on the count of yes rows; validation already holds 928
        yes rows under the random split.
      c: >-
        Stratifying keeps the yes share equal, and it says nothing about mixing months, which is
        what lets the random split flatter the model.
      d: >-
        The month and the five economic indicators each mark the period a call was made in, so the
        model reads time without a date column.
    answer: >-
      I split the way the model will be used: train on the past, score on the later period, and
      expect that score to be lower than the random split's.
  - id: logit-071
    label: "Read one score"
    type: One correct option
    level: Hard
    min: 2.5
    tag: "[F]"
    roles: DS, BA
    day: Mon
    key: d
    anchor: >-
      What does a logistic output of 0.71 mean?
    text: |-
      The logistic model on the customer table gives one client a score of 0.71, and its validation AUC is 0.761 (Exhibit 1A). What does the 0.71 say, and what would let the memo read it that way?
      (a) A 71 percent chance of a yes, and the AUC of 0.761 already shows the scores can be read as chances.
      (b) The model is right on about 71 percent of the clients it scores, if the validation slice confirms it.
      (c) The client will say yes, since a score above 0.5 is a yes once the model beats calling nobody.
      (d) About 71 in 100 such clients say yes, if about 71 in 100 validation clients scored near 0.71 did.
    why: >-
      A logistic model outputs an estimated chance for one client, so 0.71 says that clients scored
      like this one say yes about 71 times in 100. The memo may read it that way only once the
      scores are checked against what happened: among validation clients scored near 0.71, about 71
      in 100 should have said yes. That check is calibration. AUC measures the ranking alone, so it
      is unchanged when every score is halved and cannot vouch for one chance; Friday's split by
      date kept a usable ranking while its scores ran far below the yes rate. The threshold that
      turns a chance into a call comes from the costs.
      Monday bent the line into the S on the bank's data; Friday showed the scores drifting while the ranking held.
    wrong:
      a: >-
        AUC is the chance that a buyer outranks a non-buyer, so it stays the same when every score
        is halved; it vouches for the order, never for a chance.
      b: >-
        Accuracy across many clients is a property of the model on a slice, while 0.71 belongs to
        one client.
      c: >-
        0.5 is a default, never part of the score; the threshold is set from the costs, and beating
        the baseline does not turn a chance into a verdict.
    answer: >-
      0.71 is an estimated chance for this one client, and I read it as a chance only after checking
      that clients scored near 0.71 said yes about 71 times in 100; the AUC checks the ranking.
  - id: is-it-ml
    label: "Sort the asks"
    type: More than one correct
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: DS, BA
    day: Mon
    key: a, d
    anchor: >-
      When is a business problem a machine learning problem?
    text: |-
      The bank's marketing head brings four asks. Which need a model that predicts? Circle every correct letter.
      (a) the clients to call first next month, ranked by their chance of saying yes
      (b) each month's chance of a yes in 2009, counted from the calls for the annual report
      (c) the clients whose previous campaign ended in success, listed by branch
      (d) each new client's own chance of a yes on a first call, before anyone calls
    why: >-
      A prediction problem asks about an outcome that has not happened yet, from what is known now,
      and has past examples to learn from. Ranking next month's clients and scoring a client never
      called before both ask about a future yes. Counting 2009's yes answers and listing past
      successes are queries on rows that already exist.
      Monday's first chapter sorted Kalpa's asks into prediction, rule and query.
    wrong:
      b: >-
        A past month's chance of a yes is a rate already in the file, so a count answers it and no
        model is needed.
      c: >-
        poutcome already records each past result, so a filter lists them; nothing is predicted.
    answer: >-
      If the answer is already in a table, it is a query; if it is about a future outcome I have
      past examples of, it is a model.
  # ---------------------------------------------------------------- Part 2, Tuesday
  - id: acc-trap
    label: "Judge the accuracy claim"
    type: True or false
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: DS, BA
    day: Tue
    key: d
    anchor: >-
      Accuracy is 96 percent on a 96 to 4 split; good model?
    text: |-
      Statement: an accuracy of 0.897 against 0.887 for calling nobody shows that the model at 0.5 is good enough to run the campaign. True or false, and why?
      (a) True: it beats its baseline on the same 8,238 clients, and a model that beats its baseline is ready to run.
      (b) True: it gets 848 clients wrong against the baseline's 928, so it makes 80 fewer mistakes in the campaign.
      (c) False: accuracy is fair only on the sealed test slice, so 0.897 means nothing until Friday's envelope is opened.
      (d) False: calling nobody already scores 0.887, so accuracy says little; at 0.5 the model finds 174 of 928 buyers.
    why: >-
      On an outcome where 89 clients in 100 say no, saying no to everyone scores 0.887, so a point
      of accuracy above it says almost nothing about the campaign. The model at 0.5 calls 268 people
      and finds 174 of the 928 buyers, a recall of 0.19, and leaves 754 buyers uncalled. Beating the
      majority baseline is the floor, and the case for shipping is made on recall, precision and
      the bill.
      Tuesday's case opened on this matrix: the 89 percent model that called nobody.
    wrong:
      a: >-
        Beating the baseline is necessary, and on accuracy it is nearly free here, since the
        baseline itself is 0.887.
      b: >-
        The count is right, 94 plus 754 against 928, but it weighs a wasted call and a missed buyer
        the same, while one costs Rs 40 and the other Rs 1,200.
      c: >-
        Validation is where models and thresholds are compared, so 0.897 is a fair validation
        number; the trouble is what accuracy measures, not where it was read.
    answer: >-
      On a lopsided outcome I quote the base rate first, then recall and precision, and accuracy
      last if at all.
  - id: prf
    label: "Work the matrix"
    type: Applied maths
    level: Medium
    min: 4
    tag: "[S]"
    roles: DS
    day: Tue
    key: >-
      Precision 174 / 268 = 0.65; recall 174 / 928 = 0.19; F1 = 2 x 174 / (2 x 174 + 94 + 754) = 348 / 1,196 = 0.29.
    anchor: >-
      Precision, recall and F1 from a confusion matrix.
    text: |-
      From the model's row of Exhibit 2A, compute its precision, recall and F1 at the threshold of 0.5, each to two decimal places. Show the working.
    why: >-
      Precision divides the caught buyers by everyone called, 174 over 174 plus 94, 0.649. Recall
      divides them by every buyer, 174 over 174 plus 754, 0.1875. F1 is the harmonic mean, 2PR over
      P plus R, which on counts is 2TP over 2TP plus FP plus FN: 348 over 1,196, 0.291. The
      harmonic mean sits near the smaller of the two, which is why a low recall drags F1 down.
      Tuesday's deck taught precision and recall on this matrix and named F1 last.
    answer: >-
      Precision is of those I called, recall is of those out there, and F1 is their harmonic mean,
      2TP over 2TP plus FP plus FN.
  - id: cost-line
    label: "Draw the line"
    type: Applied maths
    level: Medium
    min: 3
    tag: "[S]"
    roles: DS, FDE
    day: Tue
    key: >-
      Call when p x 1,200 > (1 - p) x 40, so p > 40 / 1,240 = 1 / 31, about 0.032 (1 in 30, 0.033, from one buyer paying for 30 calls, is accepted); the line moves down from 0.5 and recall leads.
    anchor: >-
      How do you set a threshold when the two errors cost differently?
    text: |-
      A call to a client who says no wastes Rs 40, and a buyer left off the list loses about Rs 1,200. Above what chance of a yes is a call worth making, and which way does that move the threshold from 0.5? Show the working.
    why: >-
      Call when the expected loss of not calling, p times Rs 1,200, is above the expected loss of
      calling, (1 minus p) times Rs 40. That gives p above 40 over 1,240, 1 in 31, about 0.032. In
      plain words, one caught buyer pays for 30 wasted calls, so a call is worth it above about a
      1-in-31 chance. The line moves far below 0.5, so recall leads, because a miss costs thirty
      times a wasted call. The rule assumes calibrated scores.
      Tuesday's chapter on what each mistake costs taught the 1-in-N test as coins.
    answer: >-
      The line sits at the cost of a false alarm over the sum of both costs, so when a miss costs
      thirty times a false alarm I act on about a 1-in-31 chance.
  - id: bill
    label: "Choose by F1 or by the bill"
    type: Applied maths
    level: Hard
    min: 3.5
    tag: "[S]"
    roles: DS, FDE, BA
    day: Tue
    key: >-
      F1 chooses 0.20: 2 x 376 / (752 + 488 + 552) = 752 / 1,792 = 0.42, against 1,232 / (1,232 + 2,138 + 312) = 1,232 / 3,682 = 0.33 at 0.10. The bill chooses 0.10: 2,138 x 40 + 312 x 1,200 = Rs 459,920, against 488 x 40 + 552 x 1,200 = Rs 681,920 at 0.20, Rs 222,000 less. They differ because F1 counts a wasted call and a missed buyer alike, while a missed buyer costs 30 times a wasted call.
    anchor: >-
      How do you set a threshold when the two errors cost differently?
    exhibit:
      caption: >-
        The customer-table model at four thresholds on the 8,238 validation clients.
      table:
        head:
          - Threshold or cut
          - Called
          - Caught buyers
          - Wasted calls
          - Missed buyers
        rows:
          - ["0.5", "268", "174", "94", "754"]
          - ["0.20", "864", "376", "488", "552"]
          - ["0.10", "2,754", "616", "2,138", "312"]
          - ["The cost line", "7,438", "913", "6,525", "15"]
    text: |-
      Two teammates choose between the thresholds of 0.20 and 0.10 in Exhibit 2B: one by F1, the other by the error bill at Rs 40 a wasted call and Rs 1,200 a missed buyer. Which threshold does each choose, with the figures that decide it, and why do the two choices differ? Show the working.
    why: >-
      F1 on counts is 2TP over 2TP plus FP plus FN. At 0.20 that is 752 over 1,792, 0.42; at 0.10
      it is 1,232 over 3,682, 0.33, so F1 prefers 0.20. The bill prices each box: at 0.20, 488
      wasted calls cost Rs 19,520 and 552 missed buyers Rs 662,400, Rs 681,920 in all; at 0.10,
      2,138 wasted calls cost Rs 85,520 and 312 missed buyers Rs 374,400, Rs 459,920. F1 weighs a
      wasted call and a missed buyer the same, so it stops lowering the line once wasted calls pile
      up, while the bill keeps lowering it, because each missed buyer costs as much as 30 wasted
      calls. The business runs on the bill. The usual slips are swapping the two prices, pricing
      one box only, and taking F1 as the plain average of precision and recall.
      Tuesday's slider drew this bill against the threshold.
    answer: >-
      F1 is a summary for when nobody has priced the errors; once they are priced I choose the
      threshold on the bill, and I can say why the two disagree.
  - id: budget-k
    label: "Spend 1,000 calls"
    type: One correct option
    level: Hard
    min: 2.5
    tag: "[D]"
    roles: DS, FDE, BA
    day: Tue
    key: c
    anchor: >-
      The cost rule says call nearly everyone, and the budget says 1,000 calls: which wins, and what do you report?
    text: |-
      The call centre can make 1,000 calls in the next campaign, and the cost line would call 7,438 of these 8,238 clients (Exhibit 2B). Which plan goes to the marketing head?
      (a) Call the 864 clients above 0.20, at a precision of 0.435, and hold the other 136 calls in reserve.
      (b) Call the 268 clients above 0.5, where precision is at its highest, and save the rest of the budget.
      (c) Rank every client by score and call the top 1,000, wherever that cut happens to fall on the scores.
      (d) Draw 1,000 clients at random from the 7,438 above the cost line, since every one of them clears it.
    why: >-
      When the budget binds before the cost line does, the ranking carries the decision. The top
      1,000 by score are the 864 clients above 0.20 and the next 136, so they hold every buyer of
      plan (a), 376, and of plan (b), 174, and the 136 extra calls go to clients scored just under
      0.20, far above the cost line, so each is worth more than its Rs 40. On validation the top
      1,000 held 404 buyers, a precision at 1,000 of 0.404 against the base rate of 0.113, about
      3.6 times. This is the flip condition of the cost rule: at Rs 40 against Rs 1,200 the line
      calls nearly everyone, and the binding constraint is the budget.
      Tuesday's budget cut, precision at k, set Kalpa's 5,000 nudges the same way.
    wrong:
      a: >-
        The top 1,000 contains these 864 and adds 136 clients still far above the cost line, so it
        finds at least the same 376 buyers and more, and no call is left unused.
      b: >-
        268 calls leave 732 of the budget unused, and the next 732 by score still convert far above
        the base rate.
      d: >-
        A random draw throws the ranking away and converts near 913 in 7,438, about 0.123, against
        0.404 for the top 1,000.
    answer: >-
      When the budget binds, I rank and cut at the budget and report precision at that cut against
      the base rate, since a smaller cut only leaves paid-for calls unused.
  # ---------------------------------------------------------------- Part 3, Wednesday
  - id: duration-call
    label: "Answer the junior"
    type: One correct option
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: DS, FDE
    day: Wed
    key: c
    anchor: >-
      What is data leakage, and how do you catch it before it ships?
    text: |-
      The junior's message reads: "Adding duration lifts AUC from 0.795 to 0.932. Shipping tonight." What is the reply?
      (a) Ship it: the dataset's authors put duration in the file, so it is a fair column for the model.
      (b) Hold it: accuracy only rose from 0.899 to 0.907, so the AUC jump must be noise in validation.
      (c) Drop it: a call's length exists only once the call ends, so no list can use it; report 0.795.
      (d) Keep it but scale it first, since a column measured in raw seconds is what inflates the AUC.
    why: >-
      On the morning the list is built no call has happened, so its duration does not exist; a
      model that uses it learns from the answer, which is data leakage. The dataset's own notes say so
      and ask for it to be
      discarded for a realistic model. The honest score is the one without it, 0.795. A jump this
      large from one column is the alarm, and the prediction-time question is the check.
      Wednesday read the notes aloud; Kalpa's settlement_status was the same leak.
    wrong:
      a: >-
        The authors include it for benchmarks and say to discard it for a realistic model, which is
        what a call list is.
      b: >-
        Accuracy barely moves on an 89 percent no outcome even when the leak is large; the recall
        nearly doubles, 174 to 390 buyers found, and that is the leak showing.
      d: >-
        Scaling changes a column's units, never what it knows; the leak is the timing.
    answer: >-
      A score that jumps on one column is a question about that column's timing, so I ask when it
      exists and drop it if it is after the prediction moment.
  - id: which-pass
    label: "Test each column"
    type: More than one correct
    level: Hard
    min: 2.5
    tag: "[S]"
    roles: DS, FDE
    day: Wed
    key: b, c
    anchor: >-
      What is data leakage, and how do you catch it before it ships?
    text: |-
      The list for next month's campaign is built on the morning before the first call. Which columns pass the prediction-time question? Circle every correct letter.
      (a) duration, the length in seconds of this campaign's last call to the client
      (b) poutcome, the last campaign's result; 65 percent of its successes say yes
      (c) age, job and housing, as they stand in the customer table that morning
      (d) a callback flag an agent sets when a client asks to be called again in this campaign
    why: >-
      A column passes when its value exists at the prediction moment. Age, job and housing and the
      previous campaign's result exist before any call. The previous result is strongly predictive,
      65 percent yes among past successes, and still legitimate, because it was recorded before this
      campaign began, so it passes the timing test however strong it is. Duration exists only after
      this campaign's call, and so does a callback flag an agent sets during it, however much it reads
      like a fact about the client: a column written by this campaign's own calls is from the future
      on the morning the list is built.
      Wednesday's chapter interrogated every column with this one question.
    wrong:
      a: >-
        This campaign's last call has not happened on the morning the list is built, so its length
        is from the future.
      d: >-
        An agent sets it on a call in this campaign, which has not happened on the morning the list
        is built, so it is from the future however much it reads like a profile column.
    answer: >-
      I test a column by when it exists: a strong column from the past is a feature, and a
      respectable column from a period that has not ended is a leak.
  - id: shortcut
    label: "Diagnose the drop"
    type: One correct option
    level: Hard
    min: 2.5
    tag: "[S]"
    roles: DS, FDE
    day: Wed
    key: a
    anchor: >-
      What is data leakage, and how do you catch it before it ships?
    exhibit:
      caption: >-
        A pneumonia model trained on chest X-rays from two hospital systems, as Zech and others
        report it (PLOS Medicine, 2018).
      table:
        head:
          - What the paper reports
          - Value
        rows:
          - ["The model's AUC on held-out X-rays from its own two hospital systems", "0.931"]
          - ["The same model's AUC at a third hospital system", "0.815"]
          - ["AUC from sorting X-rays from the two training systems by hospital alone", "0.861"]
          - ["Pneumonia rate in the two training systems", "34.2 percent and 1.2 percent"]
    text: |-
      Exhibit 3B reports a pneumonia model that scored well on held-out X-rays and worse at a new hospital. Which reading holds, and which check would have caught it before launch?
      (a) It learned which hospital took each X-ray, a shortcut its held-out set shared; test it on a new site.
      (b) It memorised its training X-rays, so a stronger penalty or a smaller network would have closed the gap.
      (c) The new hospital's X-rays were poorer, so the drop says nothing about the model and needs no check.
      (d) 0.815 is still a strong AUC, so the model carries over, and the drop is the noise of one test set.
    why: >-
      The held-out X-rays came from the same two hospital systems as the training X-rays, so
      whatever marked the hospital marked them too. Sorting them by hospital alone scored 0.861,
      because one system's pneumonia rate was 34.2 percent and the other's 1.2 percent, and a
      network named the hospital of 22,050 of 22,062 X-rays from one system, so much of the 0.931
      was the hospital. At a third hospital the shortcut no longer carried the label, and the AUC
      fell to 0.815. That is leakage through a proxy, which a held-out slice from the same source
      cannot catch; a score on data from a new site, or for the bank a later period, catches it.
      Overfitting shows as training far above held-out, and this model's held-out score was high.
      Wednesday told this case beside duration.
    wrong:
      b: >-
        Memorising shows as high training against low held-out scores; here the held-out score was
        0.931, so the trouble is what the held-out X-rays shared with training.
      c: >-
        Sorting by hospital alone scored 0.861, so the model leaned on where an X-ray came from,
        which a new hospital cannot supply; the model needs the check.
      d: >-
        The paper reports the fall as significant, P = 0.001, and a model sold at 0.931 that
        delivers 0.815 has a problem to name, never noise to wave off.
    answer: >-
      A held-out slice from the same source shares the source's shortcuts, so before launch I score
      the model on a new site or a later period and ask what else marks the label.
  - id: two-readings
    label: "Check two conclusions"
    type: One correct option
    level: Hard
    min: 3
    tag: "[F]"
    roles: DS, BA
    day: Wed
    key: d
    anchor: >-
      What does a feature importance chart prove, and what does it not?
    exhibit:
      caption: >-
        Two readings of Wednesday's models on the week's run: the importance chart of the model
        with every column, and the logistic model's weight on euribor3m, the three-month interest
        rate, on the standardised scale.
      table:
        head:
          - What the week's run shows
          - Value
        rows:
          - ["duration's place on the importance chart of the model with every column", "first"]
          - ["Mean call length: clients who said yes; clients who said no", "553 seconds; 221 seconds"]
          - ["euribor3m's weight with no other column in the model", "-0.92"]
          - ["euribor3m's weight beside the customer table and the other four indicators", "+0.39"]
    text: |-
      The marketing head reads Exhibit 3C and draws two conclusions. One: longer calls make deposits, so agents should be coached to keep clients on the line. Two: higher rates bring deposits, since euribor3m's weight is +0.39 once the other columns are held fixed. Which reply holds?
      (a) Both hold: the chart and the weight come from models that scored well on the validation slice.
      (b) One fails, since a yes makes the call long; two holds, since the full model holds the other columns fixed.
      (c) One holds, since 332 seconds is far beyond chance; two fails, since the weight flips as columns join.
      (d) Both fail: a yes lengthens the call, and the rate moves with the other indicators; neither is an effect.
    why: >-
      Importance says how much the model leans on a column to predict, never what causes the
      outcome, and here the arrow plausibly runs backwards: a client who has decided to buy stays on
      to open the deposit, so a yes makes a call long. A weight is the same kind of number. euribor3m
      rises and falls with the employment variation rate (correlation 0.97 across the file) and the
      number employed (0.95), so the model cannot hold it fixed while they move, and its weight swings
      from -0.92 alone to +0.39 beside them. The memo answers the marketing head with the indicators
      read as one economic signal, and proposes a test for the coaching idea, such as a random half
      of agents coached.
      Wednesday's last chapters were what the importance chart cannot tell you and the sign that flipped.
    wrong:
      a: >-
        Scoring well on validation says the model predicts; it says nothing about which way a cause
        runs or whether one weight can be read alone.
      b: >-
        Holding the other indicators fixed is a world the file never shows, since the rate moves with
        them at 0.97 and 0.95; the +0.39 is what the rate adds after them, never its effect.
      c: >-
        A gap that is not chance can still run from the outcome to the column, so its size proves a
        link and never its direction.
    answer: >-
      Importance and weights describe prediction, so before I claim a cause I ask which way the
      arrow runs and whether the column moves with others, and I propose the experiment that would
      test it.
  # ---------------------------------------------------------------- Part 4, Thursday
  - id: tree-read
    label: "Read the depth curve"
    type: One correct option
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: DS
    day: Thu
    key: a
    anchor: >-
      Overfitting: what it is, how you detect it, how you fix it.
    text: |-
      The unlimited tree scores 0.996 on training and 0.837 on validation, below calling nobody. Which reading and which next step are right?
      (a) It memorised the training clients; cap the depth near the validation peak, confirmed by CV.
      (b) It needs more columns to learn from; join the call log so validation catches up with training.
      (c) It has not trained long enough; grow it further until validation rises to meet training.
      (d) Validation has drifted from training; refit the unlimited tree on validation and report it.
    why: >-
      Training near 1.0 with validation below the do-nothing baseline is memorising: grown without
      a limit, the tree carves leaves so small they fit individual clients. The fix is a brake chosen
      on data the tree did not fit: validation accuracy is flat near 0.90 from depth 3 to 8, and
      validation AUC peaks at depth 5, 0.783, so depth 5 is the cap to confirm by cross-validation.
      Thursday drew the unlimited tree as one leaf per customer.
    wrong:
      b: >-
        The call log is duration, Wednesday's leak, and more columns give a tree more to memorise.
      c: >-
        An unlimited tree is fully grown already; growing it further is impossible, and it is the
        growth that overfits.
      d: >-
        A fit on validation spends validation, and the gap is the tree's, as the depth-capped trees
        on the same rows show.
    answer: >-
      High training with low validation is memorising, so I add a brake and choose its strength on
      validation, then confirm it by cross-validation.
  - id: brakes
    label: "Pick the brakes"
    type: More than one correct
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: DS
    day: Thu
    key: a, b, d
    anchor: >-
      Overfitting: what it is, how you detect it, how you fix it.
    text: |-
      Which of these put a brake on overfitting? Circle every correct letter.
      (a) capping the tree's depth, or asking for more clients in every leaf
      (b) a stronger penalty on the logistic weights, a smaller C in scikit-learn
      (c) refitting until the training rows score 1.0 at every new setting
      (d) a simpler depth or penalty, chosen by five-fold cross-validation
    why: >-
      A depth cap and a minimum leaf size limit how finely a tree can carve the rows; a stronger
      penalty, which in scikit-learn's logistic regression is a smaller C, shrinks the weights and
      loosens the fit to the training rows; and cross-validation chooses either brake's strength on
      rows the model did not fit. Refitting until training scores 1.0 is the overfitting itself.
      Thursday's chapter put the brakes on the model.
    wrong:
      c: >-
        Training at 1.0 is the symptom on Exhibit 4A, the unlimited tree's 0.996, never a brake.
    answer: >-
      Brakes limit what the model can memorise, and cross-validation chooses how hard to press
      them.
  - id: cv-why
    label: "Count the folds"
    type: One correct option
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: DS
    day: Thu
    key: b
    anchor: >-
      Why cross-validation instead of one split?
    exhibit:
      caption: >-
        Five-fold cross-validation of the logistic model on the 24,712 training clients, honest
        columns, and three model families scored on the 8,238 validation clients.
      table:
        head:
          - Run
          - AUC
        rows:
          - ["Logistic, fold 1", "0.771"]
          - ["Logistic, fold 2", "0.769"]
          - ["Logistic, fold 3", "0.797"]
          - ["Logistic, fold 4", "0.796"]
          - ["Logistic, fold 5", "0.798"]
          - ["Logistic, mean of the five folds", "0.786"]
          - ["Logistic regression, on validation", "0.795"]
          - ["Random forest, on validation", "0.799"]
          - ["Gradient boosting, on validation", "0.806"]
    text: |-
      Five-fold cross-validation of the logistic model gave the five fold scores in Exhibit 4B. How many models were fitted, on about how many clients each, and what does the spread tell the committee?
      (a) One model, scored five times on 4,942 clients each; the spread is that one model's error.
      (b) Five models on about 19,770 clients each; one split could have read 0.77 or 0.80.
      (c) Five models on about 4,942 clients each; the spread says the model needs more rows.
      (d) Five models on all 24,712 clients each; the spread is noise and says nothing of a split.
    why: >-
      Five-fold cross-validation fits five models, each on four of the five folds, about 19,770
      of the 24,712 training clients, and scores each on the fifth, about 4,942. The five scores ran
      from 0.769 to 0.798, so a single split could have reported anything in that band; the mean,
      0.786, with its spread is the honest estimate, and the spread is the size of the luck one split
      carries.
      Thursday's chapter set five exams instead of one.
    wrong:
      a: >-
        Each fold trains its own model on the other four folds; one model scored five times would
        have seen the rows it is scored on.
      c: >-
        4,942 is each fold's validation share; each model trains on the other four-fifths.
      d: >-
        A model fitted on all the rows is scored on rows it saw, and the spread is exactly what one
        split's luck looks like.
    answer: >-
      k folds fit k models on (k minus 1) over k of the rows; I report the mean and the spread, and
      a gap smaller than the spread is a tie.
  - id: near-tie
    label: "Judge the winner"
    type: True or false
    level: Hard
    min: 2.5
    tag: "[D]"
    roles: DS, FDE
    day: Thu
    key: b
    anchor: >-
      Your tuned model beats a simpler one by a hair: which ships, and why?
    text: |-
      Statement: the logistic model should go into the memo, although gradient boosting scores the highest validation AUC of the three families in Exhibit 4B. True or false, and why?
      (a) True: a logistic model cannot overfit its rows, so its validation score is the safer one to quote.
      (b) True: a gap of 0.011 can flip on another split, as the folds' spread shows; the plainer model ships.
      (c) False: 0.806 is above 0.799 and 0.795 on the same validation rows, and the memo reports the best found.
      (d) False: AUC cannot compare models of different families, so the committee needs each accuracy at 0.5.
    why: >-
      The three families sit within 0.011 AUC of each other on one validation slice, while the five
      folds of one model moved by about 0.03, so another split could reorder them. The test that would
      settle it scores both models on the same five folds; until boosting leads on every fold by a
      margin worth its cost, the simpler model is the recommendation: it is explained to a committee
      in one line per weight, monitored easily, and moved to lending with less to re-check. The flip
      is a gap that holds across the folds and is worth more in rupees, at the same budget of calls,
      than the cost of explaining and running the complex model.
      Thursday closed on why the boring model often ships.
    wrong:
      a: >-
        A logistic model overfits too when it has many columns and no penalty; its case here is the
        tie and its plainness.
      c: >-
        The best number found on one validation slice carries that slice's luck, which Exhibit 4B
        sizes at about 0.03.
      d: >-
        AUC compares the ranking of any two models scored on the same rows, whatever their family.
    answer: >-
      Inside the noise the simpler model ships, and I name the gap, in AUC and in rupees, held across
      folds, at which the complex one would.
  # ---------------------------------------------------------------- Part 5, Friday
  - id: stale-rule
    label: "Set the alarm"
    type: One correct option
    level: Hard
    min: 2.5
    tag: "[F]"
    roles: DS, FDE
    day: Fri
    key: a
    anchor: >-
      How would you know your model has gone stale?
    exhibit:
      caption: >-
        Two public cases. Instacart: Fortune, 9 June 2020, and Instacart's engineering blog, 10
        July 2023. Booking.com: Bernardi, Mavridis and Estevez, KDD 2019, section 3.
      table:
        head:
          - Case
          - What the source reports
        rows:
          - ["Instacart's item-availability model, March 2020", "A metric used to evaluate the model that predicts whether an item is in stock fell from 93 percent to 61 percent, which told the engineers to retrain; by June it read about 85 percent"]
          - ["Instacart, looking back", "Models respond slowly to a shock because they need enough new observations; thresholds on top of the model were changed without training new models"]
          - ["Booking.com, 23 comparisons of a new model against a proven one", "Offline gain (ROC AUC or mean reciprocal rank) against the gain in a business metric when the two models were compared live: Pearson correlation -0.1, 90 percent interval -0.45 to 0.27"]
    text: |-
      On the latest 30 percent of calls the model's mean score was 0.152 while 24.6 percent said yes (Exhibit 5A). Which monitoring rule catches this first, and what happens to the cut on these scores that the cost line sets?
      (a) Set each month's called yes rate against the mean score, with a stated gap; the cut moves down, as scores run low.
      (b) Set each month's called yes rate against the mean score, with a stated gap; the cut moves up, as more clients now say yes.
      (c) Retrain every night on the newest calls; the scores then stay current, so the cut on them needs no second look.
      (d) Compare training accuracy month by month; a fall there flags the drift, and the cut stays where Tuesday drew it.
    why: >-
      Staleness shows on fresh outcomes, so the rule compares what the model predicted with what
      happened, every month, against a gap stated in advance. On the bank's late rows the mean score
      was 0.152 while 24.6 percent said yes, so the scores run below the clients' true chances. The
      cost line asks for a true chance above about 1 in 31, and on scores that understate the chance
      the same true chance shows up as a lower score, so the cut on the scores moves down until they
      are recalibrated on recent outcomes. More clients saying yes is the reason the cut falls, never
      a reason to be choosier. The ranking still held at an AUC of 0.657, which is why the alarm
      watches the probabilities. Instacart's alarm was the same kind: a monitored metric falling from
      93 to 61 percent, and its first fix was a threshold change while retraining caught up.
      Friday's chapter was when the model goes stale.
    wrong:
      b: >-
        A higher yes rate raises the clients' true chances, so more of them clear the cost line;
        raising the cut would drop clients the line says to call.
      c: >-
        Retraining with no measurement can neither tell whether the old model failed nor whether the
        new one is better, and the outcomes it needs arrive weeks late.
      d: >-
        Training accuracy is measured on rows the model already saw, so it stays high while the world
        moves, and a cut set on scores that run low is wrong whatever training says.
    answer: >-
      I monitor predicted against actual on fresh outcomes with the gap written into the memo, and
      when the scores run low I recalibrate them before the cut means what it meant.
