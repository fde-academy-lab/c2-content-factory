# Week 5 Saturday: the week's source file, laid on the tracker's bank by
# scripts/build_saturday_paper.py. Block style throughout, so a comma never splits a reason.
#
# The bank sets what is tested and this file sets the bar (decisions saturday-interview-grade,
# saturday-real-cases and plants-once-found in data/programme/facts.yaml). The paper runs 60
# minutes, the row's slot and the tracker's: saturday_papers.paper_minutes in facts.yaml names no
# W05 length, so the builder takes the tracker's 60, which matches the Saturday row of
# docs/curriculum/W5_ML_core_ME1.md. Five parts, one per teaching day, each opening on the UCI Bank
# Marketing campaign as the week's pipeline ran it (docs/detailing/W05_research/W05_week_pipeline.md),
# with every number re-run in this session on 28 October 2026 and matching that file. Five bank
# items print, the five blanks, each from a word bank; twenty-four fold into deeper items, each with
# its reason under `folded`, because the bank's twenty-nine items at the bank's pace fill the 60
# minutes with no room for the reasoned formats the interview grade asks for, and nine of its
# thirteen option sets fail the distractor audit as the tracker prints them. Twenty-one additions
# carry the folded concepts on the week's real numbers, so no item is moved to the stretch page and
# every concept in the bank is tested inside the timed 60 minutes.
#
# Every bank-campaign number is in the week pipeline file or in the provenance's re-run table
# (internal/C2_W05_SAT_provenance_INTERNAL.md); every public fact is in
# internal/C2_W05_SAT_sources_INTERNAL.md with its URL and the date it was fetched; and
# internal/C2_W05_SAT_key_proofs_INTERNAL.py asserts every key that rests on arithmetic. The
# rupee costs are Kalpa's, from the rows: a wasted nudge Rs 40, a missed repeat buyer about
# Rs 1,200, a defaulter Rs 60,000 and a wrongful rejection Rs 3,000.

# The Word paper's first page: "What this paper is for", and the Company row of its Rules table.
purpose: >-
  This week one real file carried every decision: 41,188 calls a Portuguese bank made to sell a
  term deposit, scored by the pipeline the room ran from Monday to Friday. The same questions ran
  on Kalpa in the lab, priced in Kalpa's rupees. This paper puts the week's calls back to you:
  whether a question needs a model and how the rows are split, which number tells the truth on a
  lopsided outcome and where the threshold goes, which columns the model was allowed to know,
  whether a model is learning or memorising, and what the committee needs before it signs and
  what moves to lending. The room's score in each part, set beside the rating you give that part
  in step one, tells the next session where to start.
company: >-
  Every part opens on the UCI Bank Marketing dataset (Moro, Rita and Cortez, CC BY 4.0), a real
  bank's real calls, and on the numbers the week's pipeline printed on it; the rupee costs are
  Kalpa's, from the labs. Kalpa Retail's people are Meera Raghavan, the CEO, and Anand Iyer, the
  finance controller, with the marketing lead named by role; Kalpa Financial Services is Rohan
  Desai's payments and lending business, where he is head of risk. Items that use a public case
  (Instacart, Booking.com) give the source beside the fact, and every number an item needs is on
  the page.

# Shared lettered lists, printed once above the first item that answers from them.
banks:
  mon-words:
    style: words
    options:
      - training
      - validation
      - test
      - baseline
      - threshold
  tue-words:
    style: words
    options:
      - positives
      - negatives
      - calls
      - thresholds
  wed-words:
    style: words
    options:
      - drift
      - imbalance
      - leakage
      - collinearity
      - overfitting
  thu-words:
    style: words
    options:
      - overfitting
      - underfitting
      - threshold
      - split
      - leakage
      - seed

# The printed order. Bank items by number, the additions by id.
parts:
  - title: Should the bank build a model, and what must it beat?
    shows: whether you can frame a prediction problem, split the rows honestly and read what a model's score says
    intro: >-
      From May 2008 to November 2010 a Portuguese retail bank phoned its clients to sell a term
      deposit. The UCI Machine Learning Repository publishes the 41,188 calls, in date order, as
      the Bank Marketing dataset (bank-additional-full.csv, CC BY 4.0), and 4,640 of them, 11.27
      percent, ended in a yes. This week the room ran one pipeline on that file: on Monday 20
      percent of the rows were sealed as the test slice, to be opened once on Friday, and the rest
      split three to one into training and validation. Exhibit 1A shows the week's picture, the
      slices and the first two scores on the 8,238 validation clients. The bank's marketing head
      asks whom to call in the next campaign. In the lab the same question ran at Kalpa Retail,
      where the marketing lead asked which members to nudge and Anand Iyer priced a wasted nudge
      at Rs 40 and a missed repeat buyer at about Rs 1,200.
    exhibits:
      - caption: >-
          The week's picture and the week's split: UCI Bank Marketing, bank-additional-full.csv,
          as the week's pipeline split and scored it (random seed 42, the outcome kept at the same
          share in every slice).
        mermaid: |-
          flowchart LR
            P["Past calls:<br/>the rows we learn from"] --> C["The cut"]
            C --> M["Prediction moment:<br/>the call list is built"]
            M --> O["Outcome window:<br/>yes or no to the deposit"]
        table:
          head:
            - Line
            - On the week's run
          rows:
            - ["Training slice", "24,712 clients, 11.27 percent yes"]
            - ["Validation slice", "8,238 clients, 928 of them yes (11.26 percent)"]
            - ["Test slice, sealed on Monday", "8,238 clients, opened once on Friday"]
            - ["Call nobody, on validation", "accuracy 0.887; finds 0 of the 928 buyers"]
            - ["Logistic regression on the customer table, threshold 0.5", "accuracy 0.897; AUC 0.761; finds 174 of the 928"]
    items: ["new:peek", "new:random-or-time", "new:logit-071", "new:is-it-ml", 1]
  - title: Which number tells the truth, and where does the line go?
    shows: whether you can read a confusion matrix, price each error and set the line the business can afford
    intro: >-
      On Tuesday the room scored the customer-table model the way the business will judge it.
      Exhibit 2A gives two matrices on the same 8,238 validation clients: calling nobody, and the
      model at the default threshold of 0.5. Each outcome is priced at Kalpa's costs, as Tuesday
      priced them: a call to a client who says no wastes Rs 40, and a buyer the list leaves out
      loses about Rs 1,200 of margin. The marketing head's question is the bank's version of the
      marketing lead's at Kalpa: whom to call, and how many.
    exhibits:
      - caption: >-
          Two confusion matrices on the 8,238 validation clients, and what each box costs at
          Kalpa's prices.
        mermaid: |-
          flowchart LR
            S["8,238 validation clients"] --> Q{"Score at or above<br/>the threshold?"}
            Q -->|"yes: called"| Y["Said yes:<br/>a caught buyer<br/>Said no:<br/>a wasted call, Rs 40"]
            Q -->|"no: not called"| N["Said yes:<br/>a missed buyer, Rs 1,200<br/>Said no:<br/>rightly left alone"]
        table:
          head:
            - Matrix
            - Called, said yes
            - Called, said no
            - Not called, said yes
            - Not called, said no
          rows:
            - [Call nobody, "0", "0", "928", "7,310"]
            - ["Model at 0.5", "174", "94", "754", "7,216"]
    items: ["new:acc-trap", "new:prf", "new:cost-line", "new:bill", "new:budget-k", 2]
  - title: What was the model allowed to know?
    shows: whether you can test each column against the moment of prediction and say what a coefficient does and does not prove
    intro: >-
      On Wednesday two more feeds were joined to the customer table: five economic indicators,
      each published for its month or quarter, and this campaign's call log. Exhibit 3A gives the validation
      scores as each feed joins. A junior analyst wants to ship the last line tonight, and the
      marketing head asks which line to trust for next month's call list.
    exhibits:
      - caption: >-
          The three feeds joined on Wednesday, and the logistic model's validation scores as each
          feed joins, threshold 0.5, the 928 validation buyers.
        mermaid: |-
          flowchart LR
            A["Customer table:<br/>profile and campaign history"] --> J["The model's<br/>training table"]
            B["Economic indicators:<br/>monthly and quarterly"] --> J
            C["This campaign's call log:<br/>one row per call"] --> J
        table:
          head:
            - Columns in the model
            - Validation AUC
            - Accuracy at 0.5
            - Buyers found at 0.5
          rows:
            - ["The customer table: profile and campaign history", "0.761", "0.897", "174"]
            - ["The customer table and the five economic indicators", "0.795", "0.899", "211"]
            - ["All of those and duration, the call's length in seconds", "0.932", "0.907", "390"]
    items: ["new:duration-call", "new:which-pass", "new:importance", "new:sign-flip", 3]
  - title: Is the model learning, or memorising?
    shows: whether you can read training against validation, choose complexity by cross-validation and say when the simpler model ships
    intro: >-
      On Thursday the room grew a decision tree on the honest columns, the customer table and the
      economic indicators, first with no limit on its depth and then reined in. Exhibit 4A gives
      the tree's training and validation scores by depth; calling nobody scores 0.887 accuracy on
      the same validation clients. The committee's question for Friday is which model goes into the
      memo, and why that one.
    exhibits:
      - caption: >-
          A decision tree on the honest columns: accuracy on training and on validation by
          maximum depth, with validation AUC, the week's split.
        mermaid: |-
          xychart-beta
            title "Upper line: training. Lower line: validation."
            x-axis ["depth 3", "depth 5", "depth 8", "no limit"]
            y-axis "Accuracy" 0.80 --> 1.00
            line [0.899, 0.901, 0.911, 0.996]
            line [0.899, 0.897, 0.897, 0.837]
        table:
          head:
            - Maximum depth
            - Training accuracy
            - Validation accuracy
            - Validation AUC
          rows:
            - ["3", "0.899", "0.899", "0.751"]
            - ["5", "0.901", "0.897", "0.783"]
            - ["8", "0.911", "0.897", "0.777"]
            - ["No limit", "0.996", "0.837", "0.619"]
    items: ["new:tree-read", "new:brakes", "new:cv-why", "new:near-tie", 4, 5]
  - title: Would the committee sign, and what moves to lending?
    shows: whether you can say what a memo must prove, how a model is caught going stale and why the same model draws an opposite line in lending
    intro: >-
      On Friday the room wrote the memo for Meera Raghavan's committee: Anand Iyer, the marketing
      lead and Rohan Desai of Kalpa Financial Services, who is watching for his own business. The
      bank's file showed what time does to a model. Trained on the earliest 70 percent of the calls
      and scored on the latest 30 percent, the logistic model on the honest columns met a world
      where far more clients said yes than it had learned (Exhibit 5A). Exhibit 5B, with the first
      item, sets two public cases beside it.
    exhibits:
      - caption: >-
          The four lines of the committee memo, and the bank's file split by date instead of at
          random: the logistic model on the honest columns.
        mermaid: |-
          flowchart LR
            C["Claim:<br/>the model and its job"] --> E["Evidence:<br/>its score against the baseline"]
            E --> B["Error bill:<br/>the cost of its mistakes in Rs"]
            B --> V["Caveat:<br/>where it is weak, when it goes stale"]
        table:
          head:
            - Line
            - On the week's run
          rows:
            - ["Earliest 70 percent of calls, 28,831 clients", "5.6 percent said yes"]
            - ["Latest 30 percent of calls, 12,357 clients", "24.6 percent said yes"]
            - ["Mean predicted chance of a yes on the latest 30 percent", "0.152"]
    items: ["new:stale-rule", "new:caveat", "new:booking", "new:lend-flip"]

