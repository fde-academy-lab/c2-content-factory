  - id: booking
    label: "Choose the evidence"
    type: One correct option
    level: Medium
    min: 2.5
    tag: "[D]"
    roles: DS, FDE, BA
    day: Fri
    key: a
    anchor: >-
      Your tuned model beats a simpler one by a hair: which ships, and why?
    text: |-
      Anand Iyer asks what evidence would make him sign. Across 23 comparisons, Booking.com found offline gains and business gains almost uncorrelated (Exhibit 5B). What does the memo propose?
      (a) a random trial: half the next calls by the model's list, half by today's rule, scored on deposits
      (b) a bigger validation slice, so that the AUC of 0.795 can be quoted to three decimal places
      (c) a switch to gradient boosting, whose 0.806 gives the committee the strongest offline case
      (d) the sealed test score on its own, since a slice opened once is all the evidence a committee needs
    why: >-
      An offline score says the model ranks well on past rows; it does not say the campaign will
      sell more deposits. Booking.com's 23 comparisons put the correlation between the two near zero,
      -0.1 with an interval from -0.45 to 0.27, and the paper calls offline performance a health
      check. So the memo asks for a randomised trial that sets the model's list against the current
      rule on the business number, deposits sold per call, with the size fixed before it starts.
      Friday's memo turned the score into a decision the committee could test.
    wrong:
      b: >-
        More decimals on the offline score sharpen the health check, and the gap to the business
        number stays where it was.
      c: >-
        A larger offline gain is the very thing Booking.com found did not predict business gain.
      d: >-
        The test score is the honest offline number, and it is still offline.
    answer: >-
      Offline metrics earn a model its trial; the trial on the business number earns it the
      rollout.
  - id: lend-flip
    label: "Move the line to lending"
    type: One correct option
    level: Hard
    min: 2.5
    tag: "[D]"
    roles: DS, FDE, BA
    day: Fri
    key: d
    anchor: >-
      The same model in retail and lending: why are the thresholds opposite?
    text: |-
      Rohan Desai's lending book: approving a borrower who defaults costs Rs 60,000, and rejecting a good borrower costs Rs 3,000 of lost interest. Where does Rohan's approval line go?
      (a) Approve on the nudge's own cost line, read as a chance of repaying, since the method is the same.
      (b) Approve at the neutral 0.5, since a loan is a yes or no decision with no budget in the way.
      (c) Approve while the chance of default is under 60,000 in 63,000, about 0.95, since defaults cost more.
      (d) Approve only while the chance of default is under 3,000 in 63,000, about 0.05: repay above 0.95.
    why: >-
      The same cost rule runs in both businesses. Approve when the expected cost of approving, p
      times Rs 60,000, is below the expected cost of rejecting, (1 minus p) times Rs 3,000, where p
      is the chance of default: p below 3,000 over 63,000, about 0.048. So Rohan lends only above
      about a 95 percent chance of repayment, while the nudge acts on a 3 percent chance of a yes.
      The asymmetry flips, so the line flips. Both rules assume calibrated probabilities.
      Friday's transfer chapter and Tuesday's hand count on Rohan's costs drew this line.
    wrong:
      a: >-
        The method moves and the costs do not: the nudge's cheap error is a wasted call, while the
        loan's expensive error is a default.
      b: >-
        0.5 treats the two errors as equal, while a default costs twenty times a wrongful rejection.
      c: >-
        This puts the expensive error's cost on top, which would lend to a borrower with a 95 percent
        chance of default.
    answer: >-
      The line is the cheap error's cost over both costs, so the same model calls on a 3 percent
      chance and lends only at 95 percent sure.

stretch:
  - text: |-
      German Credit, the take-home's dataset (OpenML credit-g), documents its own cost matrix: classing a bad borrower as good costs 5, and classing a good borrower as bad costs 1. Above what chance of repaying should that lender approve, and how does it sit beside Rohan Desai's line?
    answer: >-
      Approve when (1 minus q) times 5 is below q times 1, where q is the chance of repaying, so q
      above 5 over 6, about 0.83. Rohan's costs run twenty to one, so his line sits higher, at about
      0.95; the ratio of the two error costs sets the line in every business.
  - text: |-
      Gradient boosting beats the logistic model by 0.011 AUC on validation. Name the gap at which you would ship boosting instead, and say how you would size it in rupees at the budget of 1,000 calls.
    answer: >-
      First the gap must clear the spread of the folds, about 0.03 here. Then count the buyers each
      model puts in its top 1,000 on the same rows: each extra buyer is worth about Rs 1,200 a
      campaign, so the extra buyers times Rs 1,200 must beat the yearly cost of explaining,
      monitoring and re-validating the complex model. Below both bars the logistic model ships, and
      the memo states the gap that would change the call.
