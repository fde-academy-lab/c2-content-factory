  - id: booking
    label: "Choose the evidence"
    type: One correct option
    level: Hard
    min: 2.5
    tag: "[D]"
    roles: DS, FDE, BA
    day: Fri
    key: d
    anchor: >-
      Your tuned model beats a simpler one by a hair: which ships, and why?
    text: |-
      Anand Iyer asks what evidence would make him sign. Across 23 comparisons, Booking.com found offline gains and business gains almost uncorrelated (Exhibit 5B). Which test does the memo propose for next month?
      (a) Call every client by the list next month, then compare its deposits per call with this month's, before the switch.
      (b) Assign next month's clients at random, half to the list and half to today's rule; compare the list half's AUC with 0.795.
      (c) Score the list once on the sealed test slice, and sign if its AUC holds near the 0.795 it scored on validation.
      (d) Assign next month's clients at random, half to the list and half to today's rule; compare deposits per call.
    why: >-
      An offline score says the model ranks past rows well; it does not say the campaign will sell
      more deposits, and Booking.com's 23 comparisons put the correlation between the two near zero,
      -0.1 with an interval from -0.45 to 0.27, which is why the paper calls offline performance a
      health check. So the evidence is a randomised trial on the business number: next month's
      clients assigned at random between the list and today's rule, run in the same weeks, scored on
      deposits per call, with the size fixed before it starts. A before-and-after comparison mixes
      the list with the month, and on this file the yes rate climbed from 5.6 to 24.6 percent across
      the calls (Exhibit 5A), so a month can beat the last without the list. A random trial scored on
      AUC randomises the right thing and measures the wrong one.
      Friday's memo turned the score into a decision the committee could test.
    wrong:
      a: >-
        The yes rate moved from 5.6 to 24.6 percent across the file (Exhibit 5A), so this month
        against last month measures the calendar as much as the list.
      b: >-
        Randomising is right, and the AUC is still the offline health check Booking.com found did not
        predict business gains; the trial is scored on deposits.
      c: >-
        The test score is the honest offline number, and it is still offline: Booking.com found that
        such gains did not predict business gains.
    answer: >-
      Offline metrics earn a model its trial; a randomised trial on the business number, run in the
      same weeks, earns it the rollout.
  - id: lend-flip
    label: "Move the line to lending"
    type: One correct option
    level: Hard
    min: 2.5
    tag: "[D]"
    roles: DS, FDE, BA
    day: Fri
    key: b
    anchor: >-
      The same model in retail and lending: why are the thresholds opposite?
    text: |-
      Rohan Desai's lending book: approving a borrower who defaults costs Rs 60,000, and rejecting a good borrower costs Rs 3,000 of lost interest. His model, calibrated on recent loans, gives applicant P a 4 percent chance of default and applicant Q an 8 percent chance. Whom does Rohan approve?
      (a) Both: each is far below a 50 percent chance of default, the neutral line for a yes or no decision.
      (b) P only: the line sits near a 5 percent chance of default, so Q at 8 percent costs more than it pays.
      (c) Both: an 8 percent chance of default means 92 in 100 such borrowers repay, a strong book for any lender.
      (d) Q only: the line sits near a 5 percent chance of default, and Q at 8 percent clears it while P does not.
    why: >-
      Approve when the expected cost of approving, p times Rs 60,000, is below the expected cost of
      rejecting, (1 minus p) times Rs 3,000, where p is the chance of default: p below 3,000 over
      63,000, about 0.048. P at 0.04 is approved and Q at 0.08 is rejected. So Rohan lends only above
      about a 95 percent chance of repayment, while the nudge acts on a 3 percent chance of a yes: the
      asymmetry flips, so the line flips. Both rules assume calibrated probabilities.
      Friday's transfer chapter and Tuesday's hand count on Rohan's costs drew this line.
    wrong:
      a: >-
        0.5 treats the two errors as equal, while a default costs twenty times a wrongful rejection.
      c: >-
        92 in 100 repaying sounds strong, but each default costs Rs 60,000 against Rs 3,000 lost on a
        rejection, so the bar sits near 95 in 100 repaying, and Q falls below it.
      d: >-
        Clearing the line is how the nudge acts, on a chance of a yes; here the chance is of a
        default, so an applicant must sit below the line, and Q at 8 percent sits above it.
    answer: >-
      The line is the cheap error's cost over both costs, so the same model calls on a 3 percent
      chance and lends only below about a 5 percent chance of default.
  - id: fraud-ask
    label: "Answer Rohan's question"
    type: One correct option
    level: Hard
    min: 2.5
    tag: "[F]"
    roles: DS, FDE, BA
    day: Tue
    key: c
    anchor: >-
      Precision or recall for fraud, and why?
    exhibit:
      caption: >-
        Two public fraud cases. Stripe: its primer on machine learning for fraud protection.
        Flipkart with Carnegie Mellon: Hooi and others, BIRDNEST, arXiv 1511.06030.
      table:
        head:
          - Case
          - What the source reports
        rows:
          - ["Stripe's worked example", "A sale earns a profit of 2.08 dollars and a fraudulent sale loses 38.92 dollars, so one fraud costs the profit of 18.71 good sales and the break-even precision of a block is 5.07 percent"]
          - ["Stripe, on false declines", "In a survey Stripe cites, 33 percent of consumers said they would not shop again at a business after a false decline"]
          - ["Flipkart's ratings-fraud model", "The trust team investigated the 250 accounts the model ranked most suspicious, and 211 of them were involved in fraud"]
    text: |-
      Rohan Desai asks one question about a fraud model for Kalpa Financial Services' payments app: "Do we tune it for precision or for recall?" Exhibit 5C sets two public cases beside his question. Which reply holds?
      (a) Recall: Stripe's arithmetic blocks above a 5 percent break-even, so a missed fraud is the cost; catch all of it.
      (b) Ask first how rare fraud is: below 1 in 100 payments, false alarms swamp any team, so precision leads.
      (c) Ask first what a flag does, block the payment or send it to review, and how many the team can review a day.
      (d) Precision: a third of customers leave after a false decline, so flag only the payments the model is sure of.
    why: >-
      Rohan's question leaves out the two facts that decide it: what a flag does, and how many flags
      the team can work. If a flag blocks the payment, a false alarm stops a genuine customer, and the
      survey Stripe cites says a third of them may not come back, so precision gains weight and the
      line rises. If a flag sends the payment to a reviewer, a false alarm costs an analyst's minutes
      while a missed fraud costs the payment, so recall leads, up to what the team can review; with a
      fixed team the number to report is precision at its capacity, as Flipkart's trust team read the
      top 250 and found 211 frauds. Each one-word answer is right in one of those worlds and wrong in
      the other, and how rare fraud is settles neither, since it says how many false alarms come with
      each catch and never which costs more. So the reply opens on the question that decides it, then
      draws the line from the two costs.
      Tuesday met Stripe and Flipkart; Friday carried the cost line to Rohan's business.
    wrong:
      a: >-
        Stripe's break-even prices a block at a sale's margin; if a false block also loses the
        customer the line rises, so recall cannot be chosen before knowing what a flag does.
      b: >-
        How rare fraud is sets how many false alarms come with each catch and leaves open which error
        costs more; that turns on what a flag does, so this question cannot settle the answer.
      d: >-
        A false decline costs a customer only when a flag declines the payment; if it queues a review,
        missed fraud is the larger cost, so precision cannot be chosen before knowing what a flag does.
    answer: >-
      Precision or recall is a question about costs, so I first ask what a flag does and how many the
      team can review, then set the line from the two costs and report precision at the team's
      capacity.
stretch:
  - text: |-
      German Credit, the take-home's dataset (OpenML credit-g), documents its own cost matrix: classing a bad borrower as good costs 5, and classing a good borrower as bad costs 1. Above what chance of repaying should that lender approve, and how does it sit beside Rohan Desai's line?
    answer: >-
      Approve when (1 minus q) times 5 is below q times 1, where q is the chance of repaying, so q
      above 5 over 6, about 0.83. Rohan's costs run twenty to one, so his line sits higher, at about
      0.95; the ratio of the two error costs sets the line in every business.
  - text: |-
      Two models score within a hair of each other on validation, and one is far harder to explain. Name the evidence that would make you ship the harder one, and say how you would size the gap in rupees at the budget of 1,000 calls.
    answer: >-
      First the gap must hold on every fold, since one validation slice moves by about 0.03 here. Then count the buyers each
      model puts in its top 1,000 on the same rows: each extra buyer is worth about Rs 1,200 a
      campaign, so the extra buyers times Rs 1,200 must beat the yearly cost of explaining,
      monitoring and re-validating the complex model. Below both bars the logistic model ships, and
      the memo states the gap that would change the call.
