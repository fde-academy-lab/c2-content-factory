notes:
  1:
    label: "Name the sealed slice"
    bank: mon-words
    why: >-
      The test slice is scored once, at the end, so its number is an honest estimate of how the
      chosen model does on clients it never influenced. Training fits the model and validation
      chooses among models and thresholds, so both are read many times. The week sealed the test
      slice on Monday in an envelope on the wall and opened it once on Friday.
    answer: >-
      Training fits, validation chooses, and the test is spent once, at the end; once I peek and
      change anything, it is validation.
  2:
    label: "Complete the formula"
    bank: tue-words
    why: >-
      Recall is true positives over every actual positive, and the actual positives the model
      missed are the false negatives: on Tuesday's matrix, 174 over 174 plus 754. Precision is the
      ratio that takes false positives below the line.
    answer: >-
      Recall asks, of the buyers out there, how many I found, so its denominator is every real
      buyer, caught or missed.
  3:
    label: "Name the trap"
    bank: wed-words
    why: >-
      A column the model could not have at the moment of prediction leaks the answer into
      training, which is data leakage; duration is the week's example, known only once the call
      ends. Drift is the world changing after training, and collinearity is columns moving
      together, Wednesday's sign flip.
    answer: >-
      Leakage is a column from the future, so I ask of every column when it would exist on the
      morning the list is built.
  4:
    label: "Name the failure"
    bank: thu-words
    why: >-
      Perfect on training and far lower on validation is a model that memorised its training rows,
      which is overfitting; the room's unlimited tree scored 0.996 against 0.837. Underfitting
      scores low on both.
    answer: >-
      A big gap between training and validation is memorising, so I add a brake and choose its
      strength on validation or by cross-validation.
  5:
    label: "Name what averages out"
    bank: thu-words
    why: >-
      One split can be lucky or unlucky in which clients land in validation; cross-validation
      gives every row a turn in validation and averages the scores, so the luck of one split
      averages away. The week's five folds ran from 0.769 to 0.798.
    answer: >-
      One split is one draw; five folds are five draws, so I quote the mean and the spread.

additions:
  # ---------------------------------------------------------------- Part 1, Monday
  - id: peek
    label: "Catch the peek"
    type: One correct option
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: DS, FDE
    day: Mon
    key: b
    anchor: >-
      Train, validation, test: which is spent once?
    text: |-
      On Thursday an analyst opens the sealed test slice, sees 0.79, moves the threshold until the test score improves and reports the new test score to the committee. What is wrong, and what should the committee be told?
      (a) Nothing is wrong: the test rows were never used to fit the weights, so any score read from them stays honest.
      (b) The test helped choose the threshold, so its score flatters; say it was spent and score once on new calls.
      (c) The threshold belongs on the training rows, so move it there and the test score can be reported as it stands.
      (d) The slice is too small at 8,238 clients, so merge it with validation and report the pooled score as the test.
    why: >-
      The test slice is honest only while nothing about the model was chosen by looking at it.
      Moving the threshold until the test score improves makes the test a second validation slice,
      so the reported number now carries the analyst's selection and flatters the model. The
      committee is told the test was spent, and the honest check is one score on calls the model has
      not touched, such as the next month's.
      Monday sealed the slice in the envelope; Friday opened it once.
    wrong:
      a: >-
        Fitting the weights is one way to use the rows; choosing a threshold on them is another, and
        either one spends the slice.
      c: >-
        A threshold set on training rows sits on rows the model has memorised, so validation is the
        place to set it, and the test score is still spent.
      d: >-
        8,238 clients is plenty for one honest score, and pooling the spent slice with validation
        hides the peek inside a bigger number.
    answer: >-
      The test is spent the moment it changes a decision, so I tell the committee it was spent and
      get one clean score on data nobody has looked at.
  - id: random-or-time
    label: "Judge the split"
    type: True or false
    level: Hard
    min: 2.5
    tag: "[D]"
    roles: DS
    day: Mon
    key: c
    anchor: >-
      Train, validation, test: how should the rows be split for the question being asked?
    text: |-
      The calls run in date order. On the week's run the earliest 70 percent of rows say yes 5.6 percent of the time and the latest 30 percent say yes 24.6 percent of the time. Statement: for the question "whom do we call in the next campaign", a random split of all the rows estimates the model's score as honestly as a split by date. True or false, and why?
      (a) True: the split keeps 11.27 percent yes in every slice, so each slice is a fair sample of the bank's clients.
      (b) True: the model never reads a date column, so the order in which the calls were made cannot move its score.
      (c) False: a random split trains on later months than it validates on; train early and score late, like the ask.
      (d) False: a random split leaves too few yes rows in validation, so its score is noisy; a split by date adds them.
    why: >-
      The ask is about a campaign that has not happened yet, so the honest test trains on the
      earlier calls and scores the later ones. A random split puts calls from the same months in
      training and validation, and the month and the economic indicators mark the period, so the
      model partly learns when a call happened. On the week's run the yes rate moved from 5.6 to
      24.6 percent across the file, and Friday's split by date cut the AUC from 0.795 to 0.657.
      Monday raised the split by time; Friday ran it.
    wrong:
      a: >-
        Stratifying keeps the yes share equal, and it says nothing about mixing months, which is
        what lets the random split flatter the model.
      b: >-
        The month and the five economic indicators each mark the period a call was made in, so the
        model reads time without a date column.
      d: >-
        Validation holds 928 yes rows under the random split; the problem is which months they come
        from, never how many there are.
    answer: >-
      I split the way the model will be used: train on the past, score on the later period, and
      expect that score to be lower than the random split's.
  - id: logit-071
    label: "Read one score"
    type: One correct option
    level: Medium
    min: 2
    tag: "[F]"
    roles: DS, BA
    day: Mon
    key: d
    anchor: >-
      What does a logistic output of 0.71 mean?
    text: |-
      The logistic model gives one client a score of 0.71. What does the 0.71 say?
      (a) The client will say yes, because any score above 0.5 is read by the model as a yes.
      (b) The model is right about 71 percent of the clients it scores on the validation slice.
      (c) The client is 71 percent more likely to say yes than the average client in the file is.
      (d) Of clients scored like this one, about 71 in 100 say yes, if the scores are calibrated.
    why: >-
      A logistic model outputs an estimated probability for one client, so 0.71 says that clients
      with this profile say yes about 71 times in 100, as long as the scores are calibrated against
      what actually happens. The threshold that turns it into a call is a business choice made
      afterwards: at Kalpa's costs it sits near 0.03, far below 0.5.
      Monday bent the line into the S on the bank's data.
    wrong:
      a: >-
        0.5 is a default, not part of the score; the threshold is set from the costs, and 0.71 is a
        chance, never a verdict.
      b: >-
        Accuracy across many clients is a property of the model on a slice, while 0.71 belongs to
        one client.
      c: >-
        0.71 is a probability, not a ratio against the average; against a base rate of 11 percent it
        is about six times the average chance.
    answer: >-
      0.71 is an estimated chance for this one client, trustworthy only if calibrated, and the
      decision to call comes from the threshold, which the costs set.
  - id: is-it-ml
    label: "Sort the asks"
    type: More than one correct
    level: Medium
    min: 2.5
    tag: "[S]"
    roles: DS, BA
    day: Mon
    key: a, d
    anchor: >-
      When is a business problem a machine learning problem?
    text: |-
      The bank's marketing head brings four asks. Which need a model that predicts? Circle every correct letter.
      (a) the clients to call first next month, ranked by their chance of saying yes
      (b) the count of yes answers in each month of 2009, for the annual report
      (c) the clients whose previous campaign ended in success, listed by branch
      (d) the chance that a client never called before says yes on the first call
    why: >-
      A prediction problem asks about an outcome that has not happened yet, from what is known now,
      and has past examples to learn from. Ranking next month's clients and scoring a client never
      called before both ask about a future yes. Counting 2009's yes answers and listing past
      successes are queries on rows that already exist.
      Monday's first chapter sorted Kalpa's asks into prediction, rule and query.
    wrong:
      b: >-
        Every 2009 answer is already in the file, so a count answers it and no model is needed.
      c: >-
        poutcome already records each past result, so a filter lists them; nothing is predicted.
    answer: >-
      If the answer is already in a table, it is a query; if it is about a future outcome I have
      past examples of, it is a model.
  # ---------------------------------------------------------------- Part 2, Tuesday
  - id: acc-trap
    label: "Judge the accuracy claim"
    type: True or false
    level: Hard
    min: 2.5
    tag: "[F]"
    roles: DS, BA
    day: Tue
    key: d
    anchor: >-
      Accuracy is 96 percent on a 96 to 4 split; good model?
    text: |-
      Statement: an accuracy of 0.897 against 0.887 for calling nobody shows that the model at 0.5 is good enough to run the campaign. True or false, and why?
      (a) True: it beats its baseline on the same 8,238 clients, and a model that beats its baseline is ready to run.
      (b) True: it gets 848 clients wrong against the baseline's 928, so it makes 80 fewer mistakes in the campaign.
      (c) False: accuracy is fair only on the sealed test slice, so 0.897 means nothing until Friday's envelope is opened.
      (d) False: calling nobody already scores 0.887, so accuracy says little; at 0.5 the model finds 174 of 928 buyers.
    why: >-
      On an outcome where 89 clients in 100 say no, saying no to everyone scores 0.887, so a point
      of accuracy above it says almost nothing about the campaign. The model at 0.5 calls 268 people
      and finds 174 of the 928 buyers, a recall of 0.19, and leaves 754 buyers uncalled. Beating the
      majority baseline is the floor, and the case for shipping is made on recall, precision and
      the bill.
      Tuesday's case opened on this matrix: the 89 percent model that called nobody.
    wrong:
      a: >-
        Beating the baseline is necessary, and on accuracy it is nearly free here, since the
        baseline itself is 0.887.
      b: >-
        The count is right, 94 plus 754 against 928, but it weighs a wasted call and a missed buyer
        the same, while one costs Rs 40 and the other Rs 1,200.
      c: >-
        Validation is where models and thresholds are compared, so 0.897 is a fair validation
        number; the trouble is what accuracy measures, not where it was read.
    answer: >-
      On a lopsided outcome I quote the base rate first, then recall and precision, and accuracy
      last if at all.
  - id: prf
    label: "Work the matrix"
    type: Applied maths
    level: Hard
    min: 4
    tag: "[S]"
    roles: DS
    day: Tue
    key: >-
      Precision 174 / 268 = 0.65; recall 174 / 928 = 0.19; F1 = 2 x 174 / (2 x 174 + 94 + 754) = 348 / 1,196 = 0.29.
    anchor: >-
      Precision, recall and F1 from a confusion matrix.
    text: |-
      From the model's row of Exhibit 2A, compute its precision, recall and F1 at the threshold of 0.5, each to two decimal places. Show the working.
    why: >-
      Precision divides the caught buyers by everyone called, 174 over 174 plus 94, 0.649. Recall
      divides them by every buyer, 174 over 174 plus 754, 0.1875. F1 is the harmonic mean, 2PR over
      P plus R, which on counts is 2TP over 2TP plus FP plus FN: 348 over 1,196, 0.291. The
      harmonic mean sits near the smaller of the two, which is why a low recall drags F1 down.
      Tuesday's deck taught precision and recall on this matrix and named F1 last.
    answer: >-
      Precision is of those I called, recall is of those out there, and F1 is their harmonic mean,
      2TP over 2TP plus FP plus FN.
  - id: cost-line
    label: "Draw the line"
    type: Applied maths
    level: Medium
    min: 3
    tag: "[S]"
    roles: DS, FDE
    day: Tue
    key: >-
      Call when p x 1,200 > (1 - p) x 40, so p > 40 / 1,240 = 1 / 31, about 0.032; the line moves down from 0.5 and recall leads.
    anchor: >-
      How do you set a threshold when the two errors cost differently?
    text: |-
      A call to a client who says no wastes Rs 40, and a buyer left off the list loses about Rs 1,200. Above what chance of a yes is a call worth making, and which way does that move the threshold from 0.5? Show the working.
    why: >-
      Call when the expected loss of not calling, p times Rs 1,200, is above the expected loss of
      calling, (1 minus p) times Rs 40. That gives p above 40 over 1,240, 1 in 31, about 0.032. In
      plain words, one caught buyer pays for 30 wasted calls, so a call is worth it above about a
      1-in-31 chance. The line moves far below 0.5, so recall leads, because a miss costs thirty
      times a wasted call. The rule assumes calibrated scores.
      Tuesday's chapter on what each mistake costs taught the 1-in-N test as coins.
    answer: >-
      The line sits at the cost of a false alarm over the sum of both costs, so when a miss costs
      thirty times a false alarm I act on about a 1-in-31 chance.
  - id: bill
    label: "Price two thresholds"
    type: One correct option
    level: Hard
    min: 2.5
    tag: "[S]"
    roles: DS, FDE, BA
    day: Tue
    key: b
    anchor: >-
      How do you set a threshold when the two errors cost differently?
    exhibit:
      caption: >-
        The customer-table model at four thresholds on the 8,238 validation clients, and the
        week's budget cut: everyone ranked by score.
      table:
        head:
          - Threshold or cut
          - Called
          - Caught buyers
          - Wasted calls
          - Missed buyers
        rows:
          - ["0.5", "268", "174", "94", "754"]
          - ["0.20", "864", "376", "488", "552"]
          - ["0.10", "2,754", "616", "2,138", "312"]
          - ["The cost line", "7,438", "913", "6,525", "15"]
          - ["Top 1,000 by score", "1,000", "404", "596", "524"]
    text: |-
      At Rs 40 a wasted call and Rs 1,200 a missed buyer, what is the error bill at the thresholds of 0.5 and 0.10 in Exhibit 2B, and which costs less?
      (a) Rs 142,960 at 0.5 and Rs 2,578,080 at 0.10, so 0.5 is cheaper by Rs 2,435,120.
      (b) Rs 908,560 at 0.5 and Rs 459,920 at 0.10, so 0.10 is cheaper by Rs 448,640.
      (c) Rs 3,760 at 0.5 and Rs 85,520 at 0.10, so 0.5 is cheaper by Rs 81,760 in all.
      (d) Rs 904,800 at 0.5 and Rs 374,400 at 0.10, so 0.10 is cheaper by Rs 530,400.
    why: >-
      The bill adds each wasted call at Rs 40 and each missed buyer at Rs 1,200. At 0.5 that is 94
      times 40 plus 754 times 1,200, Rs 3,760 plus Rs 904,800, Rs 908,560. At 0.10 it is 2,138
      times 40 plus 312 times 1,200, Rs 85,520 plus Rs 374,400, Rs 459,920. Lowering the line
      wastes 2,044 more calls and catches 442 more buyers, and the bill falls by Rs 448,640.
      Tuesday's slider drew this bill against the threshold.
    wrong:
      a: >-
        This swaps the two prices, charging Rs 1,200 for each wasted call and Rs 40 for each miss.
      c: >-
        This counts only the wasted calls and forgets the missed buyers, the larger cost by far.
      d: >-
        This counts only the missed buyers and forgets the 94 and 2,138 wasted calls.
    answer: >-
      I price both boxes of errors at each threshold and add them, because the threshold that
      looks wasteful on calls can be the cheaper one once misses are priced.
  - id: budget-k
    label: "Spend 1,000 calls"
    type: One correct option
    level: Hard
    min: 2.5
    tag: "[D]"
    roles: DS, FDE, BA
    day: Tue
    key: c
    anchor: >-
      The cost rule says call nearly everyone, and the budget says 1,000 calls: which wins, and what do you report?
    text: |-
      The call centre can make 1,000 calls in the next campaign, and the cost line would call 7,438 of these 8,238 clients (Exhibit 2B). Which plan goes to the marketing head?
      (a) Keep the cost line and call the first 1,000 clients above it in the order the file lists them.
      (b) Raise the threshold to 0.5 and call its 268 clients, since precision is the highest there, at 0.65.
      (c) Rank every client by score and call the top 1,000; 404 of them said yes, 3.6 times the base rate.
      (d) Call 1,000 clients drawn at random, since a ranking on an outcome this rare is mostly noise.
    why: >-
      When the budget binds before the cost line does, the ranking carries the decision: call the
      1,000 highest scores. On validation they hold 404 buyers, a precision at 1,000 of 0.404,
      against the base rate of 0.113, about 3.6 times. This is the flip condition of the cost rule:
      at Rs 40 against Rs 1,200 the line says call nearly everyone, and the binding constraint is the
      budget.
      Tuesday's budget cut, precision at k, set Kalpa's 5,000 nudges the same way.
    wrong:
      a: >-
        The file's order is not the score's order, so the first 1,000 above the line convert at
        about the base rate and waste the ranking.
      b: >-
        268 calls leave 732 of the budget unused, and the next 732 by score still convert far above
        the base rate.
      d: >-
        A random 1,000 converts at about the base rate, 0.113, while the top 1,000 convert at 0.404,
        so the ranking is far from noise.
    answer: >-
      When the budget binds, I rank and cut at the budget and report precision at that cut against
      the base rate, which is what the money buys.
  # ---------------------------------------------------------------- Part 3, Wednesday
  - id: duration-call
    label: "Answer the junior"
    type: One correct option
    level: Hard
    min: 2.5
    tag: "[S]"
    roles: DS, FDE
    day: Wed
    key: c
    anchor: >-
      What is data leakage, and how do you catch it before it ships?
    text: |-
      The junior's message reads: "Adding duration lifts AUC from 0.795 to 0.932. Shipping tonight." What is the reply?
      (a) Ship it: the dataset's authors put duration in the file, so it is a fair column for the model.
      (b) Hold it: accuracy only rose from 0.899 to 0.907, so the AUC jump must be noise in validation.
      (c) Drop it: a call's length exists only once the call ends, so no list can use it; report 0.795.
      (d) Keep it but scale it first, since a column measured in raw seconds is what inflates the AUC.
    why: >-
      On the morning the list is built no call has happened, so its duration does not exist; a
      model that uses it learns from the answer. The dataset's own notes say so and ask for it to be
      discarded for a realistic model. The honest score is the one without it, 0.795. A jump this
      large from one column is the alarm, and the prediction-time question is the check.
      Wednesday read the notes aloud; Kalpa's settlement_status was the same leak.
    wrong:
      a: >-
        The authors include it for benchmarks and say to discard it for a realistic model, which is
        what a call list is.
      b: >-
        Accuracy barely moves on an 89 percent no outcome even when the leak is large; the recall
        nearly doubles, 174 to 390 buyers found, and that is the leak showing.
      d: >-
        Scaling changes a column's units, never what it knows; the leak is the timing.
    answer: >-
      A score that jumps on one column is a question about that column's timing, so I ask when it
      exists and drop it if it is after the prediction moment.
  - id: which-pass
    label: "Test each column"
    type: More than one correct
    level: Hard
    min: 2.5
    tag: "[S]"
    roles: DS, FDE
    day: Wed
    key: b, c, d
    anchor: >-
      What is data leakage, and how do you catch it before it ships?
    text: |-
      The list for next month's campaign is built on the morning before the first call. Which columns pass the prediction-time question? Circle every correct letter.
      (a) duration, the length in seconds of this campaign's last call to the client
      (b) poutcome, the last campaign's result; 65 percent of its successes say yes
      (c) age, job and housing, as they stand in the customer table that morning
      (d) euribor3m, the three-month rate as published on the morning of the list
    why: >-
      A column passes when its value exists at the prediction moment. Age, job and housing, the
      previous campaign's result and the rate published that morning all exist before any call.
      The previous result is strongly predictive, 65 percent yes among past successes, and still
      legitimate, because it was recorded before this campaign began, so it passes the timing test
      however strong it is. Duration exists only after this campaign's call.
      Wednesday's chapter interrogated every column with this one question.
    wrong:
      a: >-
        This campaign's last call has not happened on the morning the list is built, so its length
        is from the future.
    answer: >-
      I test a column by when it exists: a strong column from the past is a feature, and a weak one
      from the future is a leak.
  - id: importance
    label: "Judge the chart"
    type: True or false
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: DS, BA
    day: Wed
    key: a
    anchor: >-
      What does a feature importance chart prove, and what does it not?
    text: |-
      In the model with duration, duration tops the importance chart, and clients who said yes talked 553 seconds on average against 221 for those who said no. Statement: longer calls cause deposits, so agents should be coached to keep clients on the line. True or false, and why?
      (a) False: a client who means to buy stays on to arrange it, so the yes drives the length as much as the reverse.
      (b) False: an importance chart is valid for tree models only, so the logistic weights say nothing about duration.
      (c) True: duration carries the largest weight in the model, and the largest weight points to the cause of the yes.
      (d) True: a gap of 332 seconds is too large to be chance across 41,188 calls, so the effect has to be causal.
    why: >-
      Importance says how much the model leans on a column to predict, never what causes the
      outcome. Here the arrow plausibly runs backwards: a client who has decided to buy stays on to
      open the deposit, so a yes makes a call long. Coaching agents to keep people talking would
      lengthen calls without creating buyers. Testing it would need an experiment, such as a random
      half of agents coached.
      Wednesday's last chapter was what the importance chart cannot tell you.
    wrong:
      b: >-
        Importance charts are drawn for linear and tree models alike; the limit is causal, not the
        model family.
      c: >-
        A large weight says the model leans on the column to predict; a column can predict because
        the outcome causes it.
      d: >-
        A gap that is not chance can still run from the outcome to the column, so size proves the
        link, never its direction.
    answer: >-
      Importance is about prediction, so before I claim a cause I ask which way the arrow runs and
      what experiment would test it.
  - id: sign-flip
    label: "Explain the flip"
    type: One correct option
    level: Hard
    min: 2.5
    tag: "[F]"
    roles: DS
    day: Wed
    key: d
    anchor: >-
      What does a feature importance chart prove, and what does it not?
    text: |-
      On its own, euribor3m takes a coefficient of -0.92 on the standardised scale; beside the four other economic indicators it takes +0.39. The marketing head asks whether higher rates help the campaign. What is the likeliest cause of the flip, and what does the memo say?
      (a) A solver bug once a model passes ten columns; refit with another solver and report the sign it gives.
      (b) Since 2009 the rate's effect has reversed; report the +0.39 as the effect on this year's campaign.
      (c) The 11 percent yes rate shrinks rare-outcome weights; report -0.92 from the model fitted on its own.
      (d) The indicators move together and share one signal; read them as a group and quote no one sign.
    why: >-
      euribor3m rises and falls with the employment variation rate (correlation 0.97 across the
      file) and the number employed (0.95), so once they sit in one model, the weight on any one of
      them is what it adds after the others, and its sign can reverse; consumer confidence, at 0.28,
      is the one indicator that moves on its own. The prediction can be just as good while no single coefficient reads as an effect.
      So the memo answers the marketing head with the group: alone, higher rates go with fewer
      yeses, and the correlated indicators carry that one economic signal together, so no single
      coefficient is quoted as the effect of rates. Reading the group, keeping one representative or
      regularising are the fixes.
      Wednesday's case showed euribor3m flip with the economic trio.
    wrong:
      a: >-
        The flip appears with every solver, because it comes from the data; refitting moves nothing.
      b: >-
        +0.39 is the rate's weight once the other four indicators are held fixed, which says nothing
        about this year's campaign on its own.
      c: >-
        Imbalance moves the intercept and the calibration and never flips one column's sign as others
        join; the -0.92 alone carries the other four indicators' signal inside it.
    answer: >-
      When a sign flips as a column joins, I check the correlations first and read correlated
      columns as a group.
  # ---------------------------------------------------------------- Part 4, Thursday
  - id: tree-read
    label: "Read the depth curve"
    type: One correct option
    level: Hard
    min: 2.5
    tag: "[S]"
    roles: DS
    day: Thu
    key: a
    anchor: >-
      Overfitting: what it is, how you detect it, how you fix it.
    text: |-
      The unlimited tree scores 0.996 on training and 0.837 on validation, below calling nobody. Which reading and which next step are right?
      (a) It memorised the training clients; cap the depth where validation AUC peaks, depth 5 here.
      (b) It needs more columns to learn from; join the call log so validation catches up with training.
      (c) It has not trained long enough; grow it further until validation rises to meet training.
      (d) Validation has drifted from training; refit the unlimited tree on validation and report it.
    why: >-
      Training near 1.0 with validation below the do-nothing baseline is memorising: grown without
      a limit, the tree carves leaves so small they fit individual clients. The fix is a brake chosen
      on data the tree did not fit: validation accuracy is flat near 0.90 from depth 3 to 8, and
      validation AUC peaks at depth 5, 0.783, so depth 5 is the cap to confirm by cross-validation.
      Thursday drew the unlimited tree as one leaf per customer.
    wrong:
      b: >-
        The call log is duration, Wednesday's leak, and more columns give a tree more to memorise.
      c: >-
        An unlimited tree is fully grown already; growing it further is impossible, and it is the
        growth that overfits.
      d: >-
        A fit on validation spends validation, and the gap is the tree's, as the depth-capped trees
        on the same rows show.
    answer: >-
      High training with low validation is memorising, so I add a brake and choose its strength on
      validation, then confirm it by cross-validation.
  - id: brakes
    label: "Pick the brakes"
    type: More than one correct
    level: Medium
    min: 2.5
    tag: "[F]"
    roles: DS
    day: Thu
    key: a, b, d
    anchor: >-
      Overfitting: what it is, how you detect it, how you fix it.
    text: |-
      Which of these put a brake on overfitting? Circle every correct letter.
      (a) capping the tree's depth, or asking for more clients in every leaf
      (b) a stronger penalty on the logistic weights, a smaller C in scikit-learn
      (c) refitting until the training rows score 1.0 at every new setting
      (d) choosing the depth or the penalty by five-fold cross-validation
    why: >-
      A depth cap and a minimum leaf size limit how finely a tree can carve the rows; a stronger
      penalty, which in scikit-learn's logistic regression is a smaller C, shrinks the weights and
      loosens the fit to the training rows; and cross-validation chooses either brake's strength on
      rows the model did not fit. Refitting until training scores 1.0 is the overfitting itself.
      Thursday's chapter put the brakes on the model.
    wrong:
      c: >-
        Training at 1.0 is the symptom on Exhibit 4A, the unlimited tree's 0.996, never a brake.
    answer: >-
      Brakes limit what the model can memorise, and cross-validation chooses how hard to press
      them.
  - id: cv-why
    label: "Count the folds"
    type: One correct option
    level: Hard
    min: 2.5
    tag: "[F]"
    roles: DS
    day: Thu
    key: b
    anchor: >-
      Why cross-validation instead of one split?
    exhibit:
      caption: >-
        Five-fold cross-validation of the logistic model on the 24,712 training clients, honest
        columns, and three model families scored on the 8,238 validation clients.
      table:
        head:
          - Run
          - AUC
        rows:
          - ["Logistic, fold 1", "0.771"]
          - ["Logistic, fold 2", "0.769"]
          - ["Logistic, fold 3", "0.797"]
          - ["Logistic, fold 4", "0.796"]
          - ["Logistic, fold 5", "0.798"]
          - ["Logistic, mean of the five folds", "0.786"]
          - ["Logistic regression, on validation", "0.795"]
          - ["Random forest, on validation", "0.799"]
          - ["Gradient boosting, on validation", "0.806"]
    text: |-
      Five-fold cross-validation of the logistic model gave the five fold scores in Exhibit 4B. How many models were fitted, on about how many clients each, and what does the spread tell the committee?
      (a) One model, scored five times on 4,942 clients each; the spread is that one model's error.
      (b) Five models on about 19,770 clients each; one split could have read 0.77 or 0.80.
      (c) Five models on about 4,942 clients each; the spread says the model needs more rows.
      (d) Five models on all 24,712 clients each; the spread is noise and says nothing of a split.
    why: >-
      Five-fold cross-validation fits five models, each on four of the five folds, about 19,770
      of the 24,712 training clients, and scores each on the fifth, about 4,942. The five scores ran
      from 0.769 to 0.798, so a single split could have reported anything in that band; the mean,
      0.786, with its spread is the honest estimate, and the spread is the size of the luck one split
      carries.
      Thursday's chapter set five exams instead of one.
    wrong:
      a: >-
        Each fold trains its own model on the other four folds; one model scored five times would
        have seen the rows it is scored on.
      c: >-
        4,942 is each fold's validation share; each model trains on the other four-fifths.
      d: >-
        A model fitted on all the rows is scored on rows it saw, and the spread is exactly what one
        split's luck looks like.
    answer: >-
      k folds fit k models on (k minus 1) over k of the rows; I report the mean and the spread, and
      a gap smaller than the spread is a tie.
  - id: near-tie
    label: "Judge the winner"
    type: True or false
    level: Hard
    min: 2.5
    tag: "[D]"
    roles: DS, FDE
    day: Thu
    key: c
    anchor: >-
      Your tuned model beats a simpler one by a hair: which ships, and why?
    text: |-
      Statement: gradient boosting should go into the memo, since it scores the highest validation AUC of the three families in Exhibit 4B. True or false, and why?
      (a) True: 0.806 is above 0.799 and 0.795 on the same validation rows, and the memo reports the best found.
      (b) True: boosting fits each round to the errors of the rounds before, so it generalises best of the three.
      (c) False: 0.011 is inside the 0.03 one split moves by, so it is a tie, and the explainable logistic ships.
      (d) False: AUC cannot compare different model families, so the committee needs each accuracy at 0.5.
    why: >-
      The three families sit within 0.011 AUC of each other, while the five folds of one model moved
      by about 0.03, so the ranking is inside the noise. On a tie the simpler model is the better
      recommendation: it is explained to a committee in one line per weight, monitored easily, and
      moved to lending with less to re-check. The flip is a gap that clears the folds' spread and is
      worth more in rupees, at the same budget of calls, than the cost of explaining and running the
      complex model.
      Thursday closed on why the boring model often ships.
    wrong:
      a: >-
        The best number found on one validation slice carries that slice's luck, which Exhibit 4B
        sizes at about 0.03.
      b: >-
        Boosting can generalise well, and it can also overfit; how it fits says nothing about whether
        it beats the others here.
      d: >-
        AUC compares the ranking of any two models scored on the same rows, whatever their family.
    answer: >-
      Inside the noise the simpler model ships, and I name the gap, in AUC and in rupees, at which
      the complex one would.
  # ---------------------------------------------------------------- Part 5, Friday
  - id: stale-rule
    label: "Set the alarm"
    type: One correct option
    level: Hard
    min: 2.5
    tag: "[F]"
    roles: DS, FDE
    day: Fri
    key: a
    anchor: >-
      How would you know your model has gone stale?
    exhibit:
      caption: >-
        Two public cases. Instacart: Fortune, 9 June 2020, and Instacart's engineering blog, 10
        July 2023. Booking.com: Bernardi, Mavridis and Estevez, KDD 2019, section 3.
      table:
        head:
          - Case
          - What the source reports
        rows:
          - ["Instacart's item-availability model, March 2020", "The accuracy of the metric used to judge how many items are found fell from 93 percent to 61 percent, which told the engineers to retrain; by June it read about 85 percent"]
          - ["Instacart, looking back", "Models respond slowly to a shock because they need enough new observations; thresholds on top of the model were changed without training new models"]
          - ["Booking.com, 23 comparisons of a new model against a proven one", "Offline gain (ROC AUC or mean reciprocal rank) against the gain in a business metric when the two models were compared live: Pearson correlation -0.1, 90 percent interval -0.45 to 0.27"]
    text: |-
      On the latest 30 percent of calls the model's mean score was 0.152 while 24.6 percent said yes (Exhibit 5A). Which monitoring rule catches this first, and what does it mean for the cost line drawn on these scores?
      (a) Set each month's called yes rate against the mean score, with a stated gap; the cost line moves too, as the scores run low.
      (b) Retrain every night on the newest calls; the scores then stay current, so the cost line drawn on them needs no second look.
      (c) Compare training accuracy month by month; a fall there flags the drift, and the cost line stays where Tuesday drew it.
      (d) Wait for the marketing head's report; a score that still ranks buyers first keeps the cost line drawn on it valid.
    why: >-
      Staleness shows on fresh outcomes, so the rule compares what the model predicted with what
      happened, every month, against a gap stated in advance. On the bank's late rows the mean score
      was 0.152 while 24.6 percent said yes: the probabilities fell out of step even though the
      ranking still held at an AUC of 0.657, and the cost line, which reads the scores as
      probabilities, was drawn on numbers that understate every client's chance. Instacart's alarm was the same kind: a monitored metric falling from
      93 to 61 percent, and its first fix was a threshold change while retraining caught up.
      Friday's chapter was when the model goes stale.
    wrong:
      b: >-
        Retraining with no measurement can neither tell whether the old model failed nor whether the
        new one is better, and the outcomes it needs arrive weeks late.
      c: >-
        Training accuracy is measured on rows the model already saw, so it stays high while the world
        moves, and a line drawn on scores that run low is wrong whatever training says.
      d: >-
        A ranking can hold while the probabilities drift, as the late rows' AUC of 0.657 did, and the
        cost line reads probabilities, so the ranking cannot vouch for it.
    answer: >-
      I monitor the decision's metric on fresh outcomes, predicted against actual, with the floor
      written into the memo before launch.
  - id: caveat
    label: "Fill the caveat"
